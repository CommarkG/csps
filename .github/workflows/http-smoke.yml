# B_PAGE_COMPLETE + CS6 RENDERS-IN-PRODUCTION (S088-A3)
#
# CS6 upgrade: extends HTTP-200 check with:
#   - DOM anchor check: HTML responses must contain <main> (not hollow 200s)
#   - Provenance check: /api/journey-spine, /api/core-spine-registry must NOT return "fallback"
#     (confirms CS3 src/data/ copies are being served, not static fallbacks)
#
# Run: on push to main + weekly cron (Sunday 03:00 UTC)
# Duration: ~3-4 minutes (next dev startup ~60s + route checks + provenance checks)
#
# Ref: B_PAGE_COMPLETE §5, PROTO-S087-PAGE-COMPLETE, PROTO-S088-A3-CS6

name: HTTP Smoke — CS6 Renders-In-Production

on:
  push:
    branches: [main]
    paths:
      - 'apps/csps-playground/src/app/**'
      - 'apps/csps-playground/src/components/**'
      - 'apps/csps-playground/src/config/**'
      - 'apps/csps-playground/src/data/**'
      - 'docs/plan/pillar-0-governance/JOURNEY-CORE-SPINE.md'
      - 'tools/config/core-spine-registry.yaml'
      - 'tools/scripts/http-smoke-check.mjs'
  schedule:
    # Weekly smoke — Sunday 03:00 UTC (low-traffic window)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      routes:
        description: 'Comma-separated routes to test (blank = all static routes)'
        required: false
        default: ''
      skip_dom:
        description: 'Skip DOM anchor check (set to 1 to skip)'
        required: false
        default: '0'
      skip_provenance:
        description: 'Skip provenance check (set to 1 to skip)'
        required: false
        default: '0'

jobs:
  http-smoke:
    name: CS6 HTTP-200 + DOM anchor + provenance
    runs-on: ubuntu-latest
    timeout-minutes: 12

    defaults:
      run:
        working-directory: apps/csps-playground

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/csps-playground/package-lock.json

      - name: Install dependencies
        run: npm install --frozen-lockfile 2>/dev/null || npm install

      - name: Run prebuild (copy-registry.mjs — CS3 src/data/ copies)
        run: node scripts/copy-registry.mjs
        continue-on-error: false

      - name: Start dev server (background)
        run: |
          npm run dev &
          echo "DEV_PID=$!" >> $GITHUB_ENV
        env:
          PORT: 3002
          NODE_ENV: development

      - name: Wait for server to be ready
        run: |
          echo "Waiting for dev server on port 3002..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:3002/ > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Server did not start within 60s"
              exit 1
            fi
            sleep 1
          done

      - name: CS6 smoke check (HTTP-200 + DOM anchor + provenance)
        working-directory: .
        run: node tools/scripts/http-smoke-check.mjs
        env:
          SMOKE_BASE_URL: http://localhost:3002
          SMOKE_ROUTES_OVERRIDE: ${{ github.event.inputs.routes }}
          SMOKE_SKIP_DOM: ${{ github.event.inputs.skip_dom || '0' }}
          SMOKE_SKIP_PROVENANCE: ${{ github.event.inputs.skip_provenance || '0' }}

      - name: Stop dev server
        if: always()
        run: kill $DEV_PID 2>/dev/null || true
