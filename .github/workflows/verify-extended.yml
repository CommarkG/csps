name: CSPS Verify Extended (Weekly Structural Invariants)

# S076 FINDING-S076-DIM4-EXT-01 durable fix:
# Runs verify --extended weekly to execute EXTENDED-tier validators.
# EXTENDED validators = structural invariants that change rarely but still need periodic verification:
#   - layer_split, agent_deletion_test, executor_contract, register_connectivity, connection_pool_contract
#   - rls_perf_budget, uuid_column_types, boundary_crossing_protocol
# These run on Monday 08:00 UTC (distinct from session-progress.yml at 07:23)

on:
  schedule:
    - cron: '0 8 * * 1'  # Monday 08:00 UTC — weekly EXTENDED structural invariant check

  workflow_dispatch:     # allow manual trigger by Governor
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'manual check'

jobs:
  verify-extended:
    name: Extended Structural Validators
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9.15.1

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Run EXTENDED structural validators
        run: |
          echo "=== EXTENDED tier validators (S076+S077 — layer_split, agent_deletion_test, executor_contract,"
          echo "    register_connectivity, connection_pool_contract, rls_perf_budget, uuid_column_types,"
          echo "    boundary_crossing_protocol, tenant_quota_policy) ==="
          echo "Running: node tools/verify.mjs --skip-install --extended"
          node tools/verify.mjs --skip-install --extended
          EXIT_CODE=$?
          echo "=== exit_code=$EXIT_CODE ==="
          exit $EXIT_CODE

      - name: Summary
        if: always()
        run: |
          echo "## CSPS Extended Verify" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ran EXTENDED-tier structural invariant validators." >> $GITHUB_STEP_SUMMARY
          echo "These run weekly, not per-session." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validators included:" >> $GITHUB_STEP_SUMMARY
          echo "- layer_split (dim-3 layer classification)" >> $GITHUB_STEP_SUMMARY
          echo "- agent_deletion_test (dim-3 deletion simulation)" >> $GITHUB_STEP_SUMMARY
          echo "- executor_contract (executor clause T1+T2)" >> $GITHUB_STEP_SUMMARY
          echo "- register_connectivity (CIE+PE wiring)" >> $GITHUB_STEP_SUMMARY
          echo "- connection_pool_contract (DATABASE_URL compliance)" >> $GITHUB_STEP_SUMMARY
          echo "- rls_perf_budget (RLS index discipline)" >> $GITHUB_STEP_SUMMARY
          echo "- uuid_column_types (UUID migration status)" >> $GITHUB_STEP_SUMMARY
          echo "- boundary_crossing_protocol (crossing artifacts)" >> $GITHUB_STEP_SUMMARY
          echo "- tenant_quota_policy (dim-4 S2 quota + noisy-neighbor + libs/platform-quota)" >> $GITHUB_STEP_SUMMARY
