  - type: structural_gap
    id: SG-002
    description: "Bad relative import in @csps/integrations: ../../config/subscription.config breaks in node_modules symlink context"
    fix: "Changed to @csps/config/subscription.config (proper workspace import)"
    commit: e07504d

  - type: deferred_wiring
