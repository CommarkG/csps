- **Scope:** 134 validators in verify.mjs — all advisory-tier
- **Status:** K=1 (first formal measurement); will become K=2 when Part 3 confirms same gap
- **Action:** File to improvement-register as imp_BEHAVIORAL_TEST_GAP_ADVISORY; Part 3 will
  determine which advisory validators warrant tests

### FINDING-PAP1-S2: 14 hooks in .claude/hooks/ not registered in settings.json
- **Impact:** These hooks exist on disk but NEVER FIRE — AP-001 violation (EXISTS ≠ ACTIVE)
- **Status:** New finding, K=1
- **Action:** See part-1B-hooks-audit.yaml for specific hook list; many may be deprecated/unused

### FINDING-PAP1-S3: 20 hooks not in verify-hooks-functional DECLARED_HOOKS
- **Impact:** Cannot be verified as present/executable by the functional check
- **Status:** New finding, K=1
- **Action:** Part 3 (Mechanical Enforcement) will determine which need registration vs deprecation

### FINDING-PAP1-S4: B_CATCH_TO_ENGRAVING.md T2 path declared active but file missing
- **Specific:** tools/validators/validate-catch-engraving-coverage.mjs not on disk
- **Status:** Already surfaced by validate-five-surface.mjs (advisory) — now confirmed by Part 1.C
- **Action:** Either build the validator OR change T2 status to none/planned in enforcement_trio

### FINDING-PAP1-S5: gap-recurrence-register has no automated write pipeline
- **Impact:** Gaps not discovered during session are never filed; register depends on manual action
- **Status:** K=1; will be tracked in Part 2 (Wiring audit)
- **Action:** Part 2 will design the trigger → hook → register path for gap discovery

