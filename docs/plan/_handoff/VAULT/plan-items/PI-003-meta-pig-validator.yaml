# Plan summary
plan_summary: |
  The Implementation Gate (PIG) is the enforcement arm of the PI system.
  Without it, commits can touch libs/ or apps/ without referencing any ratified PI item —
  making implementation governance aspirational rather than mechanical.

  ADVISORY tier (not BLOCKING): transition period per Opus Turn 62.
  The check reads the last git commit via git log -1 --name-only.
  Fires when: libs/ or apps/ file touched AND commit message lacks PI-NNN AND
  commit message does not start with fix:/chore:/docs:

  DONE criterion: pnpm verify shows implementation_gate entry; manual test commit
  touching libs/ without PI-NNN produces advisory warning.

