# Pre-implementation questions
questions:
  - id: Q1
    question: "Should the registry include local files (C:\\Users\\finky\\.claude\\) or only repo files?"
    status: answered
    answer: "Both — mark local files with scope: local. Repo files with scope: repo. Bundle engine handles path resolution."
  - id: Q2
    question: "What happens when a DNA component file is updated — does the registry auto-update?"
    status: answered
    answer: "Registry is manual-maintained by default. OPEN-027 (master-plan auto-update) is the broader pattern — same solution applies."
  - id: Q3
    question: "Who can extend the registry?"
    status: answered
    answer: "Governor only (ratification required). AI can propose new entries as OPEN-NNN. Append-only."

