# Inner defaults override
inner_defaults_override:
  risk: "Claude will declare DONE when script runs without error but output is incomplete or missing key components"
  override: "DONE only when output for --target=new-ai-tab contains: vocabulary, current mandate, open blockers, active B_* contracts, ZF discipline — and fits in one paste"

# Pre-implementation questions
questions:
  - id: Q1
    question: "What is the max output length? Needs to be pasteable without truncation."
    status: answered
    answer: "Target: ≤2000 tokens. Use summaries from dna-registry.yaml, not full file content. Deep content on demand via --context=full flag."
  - id: Q2
    question: "How does the bundle include current state (mandate, open items)?"
    status: answered
    answer: "Session state pulled dynamically from tools/session-state.json + tools/council/multi-session-plan-S040.md at bundle-time."
  - id: Q3
    question: "Does the output format differ between targets?"
    status: answered
    answer: "Yes. new-ai-tab: starts with YOU ARE / I AM block. developer: starts with schema summary. external-ai: starts with vocabulary exclusion list."

# Plan summary
plan_summary: |
  Create tools/scripts/generate-dna-bundle.mjs

  CLI flags:
    --target=[new-ai-tab|external-ai|developer|automation|research]
    --context=[minimal|standard|full]  (default: standard)
    --output=[stdout|file:path]        (default: stdout)
    --domain=[governance|architecture|all]  (default: all)

  Algorithm:
    1. Load tools/config/dna-registry.yaml (PI-031)
    2. Filter components by target + domain + always_include
    3. For each component: read summary (not full content unless --context=full)
    4. Read current state from tools/session-state.json + multi-session-plan-S040.md
    5. Inject Rule 10 context block at the top
    6. Output complete, pasteable document

  Primary output for new-ai-tab (standard):
    YOU ARE: Sonnet, the builder in Claude Code VS Code tab
    I AM: [Governor name], the Governor
    THIS IS THE SITUATION: CSPS [session]. Mandate: [mandate]. Open blockers: [blockers].
    YOUR TASK: Read the context below and confirm alignment before acting.

    --- CSPS DNA CONTEXT ---
    [vocabulary highlights]
    [active behavioral contracts]
    [current open items]
    [FSE checklist]
    [done criteria]

  Add to root package.json scripts:
    "dna:bundle": "node tools/scripts/generate-dna-bundle.mjs"

  DONE criterion: pnpm dna:bundle --target=new-ai-tab outputs a complete pasteable context
                  in ≤2000 tokens, including YOU ARE / I AM block + governance summary.

