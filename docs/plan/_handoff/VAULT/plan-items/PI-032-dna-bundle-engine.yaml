# Wiring checklist
wiring_checklist:
  - "tools/scripts/generate-dna-bundle.mjs exists and is executable"
  - "pnpm dna:bundle --target=new-ai-tab outputs a valid context block with YOU ARE / I AM structure"
  - "pnpm dna:bundle --target=developer outputs schema + integrations summary"
  - "pnpm dna:bundle --target=external-ai outputs vocabulary exclusion + cooperation plan"
