# Pre-implementation questions
questions:
  - id: Q1
    question: "Should the wizard support non-interactive mode (for automation)?"
    status: answered
    answer: "No — dna:bundle handles non-interactive. Wizard is for human use only."

# Plan summary
plan_summary: |
  Create tools/scripts/dna-wizard.mjs

  4 questions (no more):
    Q1: Who is this bundle for?
        1. New AI tab (Sonnet/Claude starting fresh)
        2. External co-worker AI
        3. Developer building on CSPS
        4. Automation system

    Q2: How much context do they need?
        1. Minimal (protocol rules + vocabulary only)
        2. Standard (vocabulary + rules + current state) [default]
        3. Full (everything including history)

    Q3: Which domain?
        1. All domains [default]
        2. Governance only
        3. Architecture only

    Q4: Output to:
        1. Screen (paste-ready) [default]
        2. File (specify path)

  After answers: calls generate-dna-bundle.mjs with the correct --target --context --domain --output flags.

  Add to root package.json scripts:
    "dna:wizard": "node tools/scripts/dna-wizard.mjs"

  DONE criterion: pnpm dna:wizard runs, completes 4 questions, outputs a bundle.

