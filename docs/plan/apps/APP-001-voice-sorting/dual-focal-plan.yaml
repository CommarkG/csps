## PMI — Plan Maturity Index

pmi:
  intent_depth: medium
    # Section 1 (THE JOB) is 85% crystallized. Primary persona choice pending.
    # Reaches HIGH when: Q1.1 persona chosen + Q1.5 day-30 success confirmed by Governor.
  cross_ref_density: medium
    # Build architecture ratified S049 — Section 4 gate unblocked.
    # Reaches HIGH when: invariants_addressed fully confirmed + Section 4 completed.
  consensus_width: medium
    # Governor + Opus reviewed. Sonnet has not validated feasibility.
    # Reaches HIGH after Sections 1+2 reviewed by Opus in formal SROF.
  reversibility: medium
    # Phase 1 scope defined. Kill condition not yet stated.
    # Reaches HIGH when: Section 3 kill condition locked by Governor.
  dependency_clarity: medium
    # Build framework ratified S049 (csps-template). CSPS code inheritance confirmed.
    # Reaches HIGH when: STT provider chosen + Section 3 kill condition locked.

pmi_score: 2
  # 2/5 HIGH fields (S049 ratification advanced cross_ref + dependency_clarity to medium).
  # Sections 1+4 gates resolved. PMI advances to 3/5 when Section 2+3 close.
  # validate-plan-readiness.mjs BLOCKS app fork until PMI reaches 4/5.

