## PMI — Plan Maturity Index

pmi:
  intent_depth: medium
    # Section 1 (THE JOB) is 85% crystallized. Primary persona choice pending.
    # Reaches HIGH when: Q1.1 persona chosen + Q1.5 day-30 success confirmed by Governor.
  cross_ref_density: low
    # Section 4 (CONNECTION MAP) not yet started.
    # Reaches HIGH when: CSPS vs vibe-coding split formally ratified +
    # invariants_addressed confirmed + dependency_clarity confirmed.
  consensus_width: medium
    # Governor + Opus reviewed. Sonnet has not validated feasibility.
    # Reaches HIGH after Sections 1+2 reviewed by Opus in formal SROF.
  reversibility: medium
    # Phase 1 scope defined. Kill condition not yet stated.
    # Reaches HIGH when: Section 3 kill condition locked by Governor.
  dependency_clarity: low
    # CRITICAL: build framework (vibe-coding) implies NO CSPS code inheritance.
    # This changes what "done" means for CSPS. Must be explicitly ratified.
    # Reaches HIGH when: vibe-coding architecture formally ratified + STT provider chosen.

pmi_score: 2
  # 2/5 HIGH fields. Plan is NOT READY FOR IMPLEMENTATION.
  # validate-plan-readiness.mjs will BLOCK any Lovable session until PMI reaches 4/5.

