## 7-SECTION WIZARD STATUS

section_1_the_job:
  status: 95_pct
  gate_blocking: none
  gate_resolved: "primary_persona_choice — cognitive-offload-professional ratified S049"
  note: "Job clear. Persona ratified. Remaining: Governor confirms day-30 success definition."

section_2_the_challenge:
  status: 100_pct
  gate_blocking: none
  gate_resolved: "S049 — kill condition + 3 assumptions force-ranked"
  kill_condition: |
    KILL if after 14 days of real use by 5 users:
      (a) average reliability_score < 0.70 across all clips, AND
      (b) users report > 3 "I didn't mean that" corrections per session
    — OR —
      (c) Voice capture fails in moving vehicles (wind/road noise breaks recognition
          in > 40% of real-car test clips)
    Primary kill trigger: (c) — validate this FIRST, before any development begins.
    Kill decision authority: Governor only.
  assumptions_force_ranked:
    1_highest_risk: "Voice input works reliably in a moving vehicle (wind, road noise, radio, AC).
      If this fails → the entire concept fails. Validate with a 5-minute real-car test
      BEFORE any development. This is the cheapest possible kill gate."
    2_medium_risk: "Cognitive-offload professionals (Alex) will actually speak thoughts out loud
      rather than just thinking they will. Many people find talking to devices alone in a car
      unnatural or embarrassing. Validate with 3 user interviews before building."
    3_lower_risk: "Users will return to the clarification interface within 4 hours of capturing.
      If the vault accumulates unreviewed items, the app fails silently — users stop trusting it
      without knowing why. Validate via day-7 cohort: did they open the vault?"

section_3_scope_boundary:
  status: 100_pct
  gate_blocking: none
  gate_resolved: "S049 — EPOCH model + appetite defined"
  epoch_e1:
    name: "Does the core loop work?"
    duration: "6 weeks"
    appetite: small
    stack_choices:
      stt: "Web Speech API (browser-native, free, no server needed)"
      storage: "Supabase — 3-state vault: crystal_clear / needs_clarification / archived"
      ai: "None in E1 — human reviews and classifies, no AI structuring yet"
      ui: "Simple Next.js form. No native app."
    success_gate: "Alex records 10 voice clips, reviews and resolves 8/10 within 4 hours,
      reports 'this actually saves me time.' If not → kill."
    do_not_build_in_e1: "Deepgram, AI structuring, native mobile, multi-tenant billing,
      sharing features, analytics — none of this until E1 gate passes."
  epoch_e2:
    name: "Is it good enough to pay for?"
    prerequisite: "E1 gate passed by Governor"
    upgrades: "Deepgram Nova-2 (real-time STT) + Claude Haiku (structuring) + freemium billing"
    appetite: medium

section_4_connection_map:
  status: 100_pct
  gate_blocking: none
  gate_resolved: "S049 — build architecture + STT provider + invariants all ratified"
  stt_decision:
    e1_prototype: "Web Speech API — browser-native, free, zero setup, good for controlled testing"
    e2_production: "Deepgram Nova-2 — real-time streaming, accent support, $0.0059/min, 200hr/mo free tier"
    rejected: "Whisper (500ms+ latency breaks real-time UX), Google STT (cost + complexity)"
  invariants_confirmed:
    INV_001: "Raw voice is immutable — never delete original audio, always reparse on model improvement"
    INV_002: "AI never guesses — reliability_score < 0.85 → needs_clarification, never auto-structures"
    INV_003: "Tenant isolation — all entities carry tenant_id, ZenStack RLS enforced (inherited from csps-template, non-negotiable)"
    INV_004: "Confidence-first UX — reliability_score always visible alongside AI output. Never hide uncertainty."

section_5_user_journey:
