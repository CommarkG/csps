# APP-001 — Dual-Focal Plan

> **Name:** Pending market validation and customer interviews.
> **Placeholder:** "Temp Sorting App" / "Voice Sorting App"
> **CSPS Role:** CSPS governs AND builds. apps/template/ fork. Full platform inheritance.
> **Ratified S049:** Build = csps-template (Next.js/Clerk/ZenStack/Supabase).
>   Primary persona = cognitive-offload-professional. Contractor saved for future app.

---

## OUTWARD FOCUS — What users need

target_users:
  primary: "Alex — High-earning cognitive-offload professional (founder/executive/consultant).
    Cognitively overloaded, meetings back-to-back, thoughts surface at the worst moments.
    Has tried every productivity app and abandoned them all. Needs a zero-friction capture
    that works in real time — speaking the thought IS the action."
  secondary: "Mike — US construction subcontractor (saved for future contractor app).
    Drives 2-4 hours/day between job sites. Heavy accent, construction jargon. Manages
    3-8 active projects. Runs on WhatsApp, phone calls, gut memory."
  primary_persona_decision: cognitive-offload-professional
    # Governor ratified S049. Section 1 gate: RESOLVED.

core_jtbd: "When I'm driving between job sites (or meetings), I want to voice-dump
  everything in my head so I can trust that nothing falls through the cracks,
  without having to slow down, type, or rely on memory."

user_value: "Dead driving time becomes structured cognitive offload. Zero mental
  load by the time they arrive. No confirmation calls because everything is
  already organized."

success_metrics:
  - metric: "Confirmation call reduction"
    target: "50% fewer repetitive 'did that arrive?' calls within 30 days"
    measurement: "User-reported call log comparison before/after"
  - metric: "Evening cognitive load"
    target: "User reports thinking about work after 7pm < 3x/week (was daily)"
    measurement: "Weekly in-app check-in survey"
  - metric: "Activation"
    target: "User captures ≥1 voice note on day 1, ≥5 on day 7"
    measurement: "Usage event tracking"
  - metric: "Clarification resolution"
    target: "Needs-Clarification items resolved within 4 hours of capture"
    measurement: "Timestamp delta in Vault"

current_alternative: |
  Users currently combine: voice messages to self on WhatsApp, phone calls to
  their own number, mental note-keeping, sporadic text messages to foreman/family.
  None of these produce structured, searchable, actionable output. The "23%
  time leakage" comes from re-explaining the same context repeatedly.

