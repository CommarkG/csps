csps_gap: "Voice input pipeline, STT integration, reliability scoring,
  event-sourced audio vault. None of these exist in CSPS today — APP-001 creates them."

csps_surplus: "Multi-tenancy, auth (Clerk), ZenStack RLS, Supabase — ALL inherited
  from apps/template/. The template provides the full foundation; APP-001 adds
  the voice-capture domain layer on top."

