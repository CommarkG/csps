  - id: P-META-007
    name: five-surface-engraving
    aliases: [FSE, five-element-pattern, discipline-propagation, catch-pipeline]
    category: meta
    severity: critical
    statement: |
      When AI detects any catch (gap / trap / anti-pattern / failure-mode / missing-execution),
      engraving must hit ALL 5 surfaces — schema + validator + hook + memory + contract — atomically
      in the same response/commit. Below 2 surfaces = single-surface-engraving anti-pattern;
      5/5 = full mechanical engraving. The mechanism IS the platform's compounding-returns moat:
      every session inherits prior engravings; re-discovery cost approaches zero.
    industry_lineage:
      - CSP S333 AI_BEHAVIOR_AUTONOMY_AUDIT (treasure #1 EXT-20260502-002) — original 5-element pattern; 330+ sessions of evolution
      - User S002 turn 16 — formalization request + mechanical-trigger requirement + strategic-value framing (stability / scalability / uniqueness)
      - B_CATCH_TO_ENGRAVING (S002 turn 15) — the contract this principle operationalizes
    config:
      surfaces:
        - schema             # frontmatter / ZModel / closed-enum / state-machine / template-required-header
        - validator          # audit-runner / linter / Postgres-trigger
        - hook               # .claude/hooks/* (PreToolUse / PostToolUse / Stop / PostStop / UserPromptSubmit)
        - memory             # ~/.claude/.../memory/feedback_*.md + MEMORY.md index
        - contract           # behavioral-contracts.md § B_* + AGENTS.md hard NO + canonical leaf doc + spine row
      completeness_levels:
        single-surface: 1     # ANTI-PATTERN — never acceptable
        minimal: 2            # memory + AGENTS.md NO; acceptable only when other 3 are planned-week-4
        partial: 3-4
        full: 5
        augmented: 5+ audit-of-audits
      atomic_application_required: true   # all surfaces in same response/commit
      meta_rzf_verification_required: true # cycle on the engraving itself
      below_2_surfaces_severity: error    # PR-blocking
      below_5_surfaces_severity: warn     # explicit deferral note required
    enforcers:
      - { layer: instruction-file,     location: "AGENTS.md",                                                          description: "Hard NO: catch-language patterns trigger immediate 5-surface engraving in same response" }
      - { layer: frontmatter-contract, location: "_handoff/VAULT/closing-summary-template.md",                          description: "§10.13b mandatory header — every catch enumerates 5-surface delta" }
      - { layer: ci-check,             location: "libs/audits/checks/zero-findings/catch-engraving-completeness.ts",     description: "PR-blocking warn — flags surfaces_count < 2" }
      - { layer: ci-check,             location: "libs/audits/checks/zero-findings/single-surface-engraving-anti-pattern.ts", description: "PR-blocking error — flags new disciplines at 1/5" }
      - { layer: ci-check,             location: "libs/audits/checks/zero-findings/audit-of-audits.ts",                  description: "Meta-RZF on the engraving registry itself; verifies 5-surface registry health" }
      - { layer: hook,                 location: ".claude/hooks/post-stop-five-surface-engraving.sh",                    description: "PostStop scans session log for catch-language; verifies 5-surface artifacts created" }
      - { layer: memory,               location: "~/.claude/projects/.../memory/feedback_five_surface_engraving.md",     description: "Cognitive layer; loaded at session-start" }
      - { layer: skill,                location: "packages/skills/five-surface-engraving/SKILL.md",                      description: "Slash command /engrave <catch> orchestrates the 7-stage cycle (planned)" }
      - { layer: mcp-resource,         location: "packages/principles-mcp/src/resources.ts",                             description: "Exposed as principles://five-surface-engraving with full 7-stage pipeline + evidence-block format" }
    enforcer_count: 9
    cross_references: [P-META-001, P-META-006, P-OP-001]
    anti_patterns:
      - single-surface-engraving (memory only OR contract only — fails per CSP)
      - sequential-engraving (memory now, contract later — must be atomic)
      - engraving-without-completeness-verification (no FSE evidence block emitted)
      - silent-below-2-surfaces (without explicit deferral note)
      - "I'll engrave if it comes up again" (N=2 already costs re-discovery)
      - catches-noted-not-engraved (B_CATCH_TO_ENGRAVING violation; this principle prevents)

# ============================================================================
# AUDIT META-CHECK ALGORITHM
# ============================================================================
# This is the audit-the-audits check. Run via `pnpm nx run audit-runner:meta-check`.
audit_meta_check:
  description: |
    Verifies every principle has the required number of enforcers per its severity class,
    every enforcer location resolves to a real file, and every // @enforces: annotation
    in source references a real principle.
  algorithm: |
    1. Parse principles.yaml.
    2. For each principle:
       - Look up min_enforcers per severity from severity_enforcer_minimums.
       - Count enforcers in the principle's enforcers list.
       - Verify count >= min.
       - For each enforcer, verify the location file exists OR is in the codegen output set.
       - For critical principles, verify >= 2 non-AI enforcers.
       - Fail if any check fails.
    3. Inverse check (orphan-enforcer audit):
       - Grep all source for `// @enforces: P-` annotations.
       - For each annotation, verify the principle ID exists in principles.yaml.
       - Fail if any annotation references a missing principle.
    4. Codegen-fresh check:
       - Re-run `pnpm principles:codegen` in a clean tree.
       - Fail if git diff produces any output (drift between source and generated).
    5. Output: report per-principle coverage; flag under-enforced; non-zero exit on any failure.

# ============================================================================
# CHANGE PROTOCOL
# ============================================================================
change_protocol: |
  1. Edit principles.yaml.
  2. If adding/removing/modifying a principle: write or update an ADR in docs/adr/
     (the principle's ADR field references the ADR id).
  3. Run `pnpm principles:codegen` — this updates AGENTS.md + skills + hooks + MCP resources + audit checks.
  4. Run `pnpm nx run audit-runner:meta-check` locally — verify no orphans.
  5. Commit principles.yaml + all generated files together.
  6. CI re-runs codegen + meta-check; rejects if drift.
  7. Merge → all downstream consumers (Claude Code, Cursor, Mastra agents, CI gates) pick up the change.

