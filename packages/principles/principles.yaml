    title: Closure Obligation — Every Non-Terminal Artifact Has a Tracked Path to Terminal
    description: >
      Every artifact created in a non-terminal state (draft, proposed, pending-review, awaiting-*) MUST carry frontmatter: closure_owner
      (who decides) · closure_decision (the exact decision that closes it) · closure_by (a session number deadline OR a named trigger
      event). Absent that = a floater = forbidden. This is the GENERAL case of CIP (CIP closes changes; this closes all artifacts). Sibling
      of EXISTS≠ACTIVE: written≠enforced; here, created≠closed. Prevention class: FLOATING-ARTIFACT-NEVER-REACHES-TERMINAL. Inaugural
      instance: docs/SIA/UX-PATTERNS-RESEARCH.md (S059→S072 floater, now SUPERSEDED).
    spine: GVRN
    layer: L1
    category: meta-governance
    severity: critical
    governing_intent: >
      No artifact floats forever. Every non-terminal state has an owner + a decision path + a deadline. The escalation ladder
      (escalation-ladder.md) enforces this mechanically: overdue → decision queue → forced terminal. Accountability = conversion, not
      activity.
