  - id: P-META-013
    name: handoff-pre-flight-audit
    aliases:
      - HPFA
      - pre-handoff-audit
      - session-completeness-gate
    category: meta
    severity: critical
    statement: |
      Every handoff creation MUST be preceded by a Handoff Pre-Flight Audit (HPFA) — a
      whole-session walk that identifies what should have been engraved but was not, what
      should be schema-audited but is not registered, what governor-prompts are missing
      entries, and what cycles should have run but didn't. Findings either (a) addressed
      in-session before handoff, or (b) carried-forward with explicit reason. No silent
      gaps allowed. Composes with B_PROTOCOL_LITERAL_EXECUTION (closing-summary template
      mandatory headers) + B_CATCH_TO_ENGRAVING (catches engraved before close) +
      B_PRE_CLOSE_VERIFICATION (verify orchestrator before close).
    counterweight: |
      For sessions explicitly designated NO-NEW-WORK (verification-only / read-only browsing /
      retro-investigation), HPFA is reduced scope — only verifies governor-prompts coverage
      + schema integrity. The full HPFA fires on substantive sessions where engraving / cycle /
      audit work happened.
    industry_lineage:
      - Aviation pre-flight checklist (every flight; no exceptions; mechanical)
      - Surgical timeout / WHO surgical safety checklist (Atul Gawande)
      - Toyota TPS andon-cord (stop-the-line before defects propagate downstream)
      - >-
        User S005 turn 27 directive — "on each handoff creation enforce going over the whole session and see what should be enforced and was
        not + what should be part of schema-aligned auditing and is not — complete them all"
    config:
      mandatory_check_set:
        - governor_prompts_coverage
        - engraving_completeness
        - audit_registration_completeness
        - cycle_evidence_presence
        - schema_dynamic_connections
        - distribution_targets_populated
        - carry_forward_explicit
      hpfa_runs_after: pre_close_verification
      hpfa_blocks_handoff_write: true
    enforcers:
