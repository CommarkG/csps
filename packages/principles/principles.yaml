  - id: P-META-008
    name: cycle-mandatory-in-plan
    aliases:
      - CMP
      - mechanical-cycles-in-plans
      - no-context-dependent-discipline
    category: meta
    severity: critical
    statement: |
      Every plan, protocol, build-step, engraving cycle, and session boundary MUST enumerate
      its mandatory verification cycles WITHIN THE PLAN ITSELF — not in context-dependent
      AI memory or "the AI should know to run X". Plans that depend on AI cooperation to
      trigger cycles produce nominal-not-actual claims (DONE blocks emitted without the
      validators ever running). Plans that enumerate cycles per-step + require evidence
      per-step are mechanically robust.
    counterweight: |
      Trivial in-flight microsteps (single-line edit / typo fix / linting auto-fix) don't
      require enumerated cycles in their step description; the cycle is the next batch
      boundary's responsibility. The discipline targets BATCH/STEP/SESSION boundaries
      where DONE/RATIFIED claims are emitted.
    industry_lineage:
      - John Boyd OODA loop — observe-orient-decide-act with mandatory iteration; the cycle is the loop
      - Toyota Production System — andon-cord stops the line; cycle is mechanical, not procedural
      - Continuous Integration (Fowler 2006) — the build script IS the discipline; runs every commit; can't skip
      - GitOps (Weaveworks 2017) — desired state in git + reconciliation loop; cycle is the artifact, not memory
      - User S005 turn 19 directive — "make recurring mandatory things specifically written in the plans, not context dependent"
    config:
      cycle_enumeration_required: true
      evidence_per_step_required: true
      context_dependent_cycles_forbidden: true
      cycle_types:
        - rzf
        - cec
        - fse
        - pre_close_verification
        - per_step_validation
        - per_engraving_atomic_5_surface
      anti_patterns:
        - nominal-not-actual (RZF block emitted but the cited validator was never run this session)
        - context-dependent-cycle (plan says AI should run X; AI forgets; debt accumulates)
        - latent-bug-because-validator-never-ran (CSPS S002 to S005 example — YAML quote bug + missing enforcer_layers latent 2+ sessions)
        - cycle-enumerated-but-not-evidence-required (plan says run X; doesn't say exit 1 if X fails or evidence required in close-summary)
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: Hard NO — never claim DONE/RATIFIED without paired pre-close verification cycle evidence
      - layer: frontmatter-contract
        location: docs/plan/_handoff/VAULT/closing-summary-template.md#§10.0
        description: >-
          Mandatory §10.0 'Pre-close verification cycle results' header — every close summary lists each cycle that ran + its exit-code +
          evidence path
      - layer: contract
        location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_PRE_CLOSE_VERIFICATION
        description: B_PRE_CLOSE_VERIFICATION canonical contract — strengthens RZF + CEC + FSE with mandatory pre-close gate
      - layer: ci-check
        location: libs/audits/checks/pre-close-cycle-coverage.ts
        description: >-
          Scans every closing-summary-S<NNN>.md for §10.0; fails if missing OR if any cycle marked DEFERRED-without-reason; PR-blocking
          error (planned week-4)
      - layer: ci-check
        location: libs/audits/checks/nominal-rzf-detection.ts
        description: Detects RZF claims without paired tool-call evidence in same session log; PR-blocking warn (planned week-4)
      - layer: hook
        location: .claude/hooks/post-stop-zf-cycle.sh
        description: PostStop hook runs `pnpm verify` automatically at session-close; fails close if exit code non-zero (planned week-4)
      - layer: memory
        location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_pre_close_verification.md
        description: Cognitive layer; loaded session-start
      - layer: generator
        location: tools/verify.mjs
        description: >-
          Build orchestrator: runs pnpm install --frozen-lockfile + typecheck + frontmatter validate + principles validate + (week-4)
          audit-runner; emits structured ZF evidence block to stdout; exit 1 on any cycle failure
      - layer: ai-behavior-spine
        location: docs/plan/pillar-0-governance/ai-behavior-spine.md
        description: >-
          Discipline matrix row — composes with B_RZF + B_CEC + B_PROTOCOL_LITERAL_EXECUTION (the trio that makes actual-not-nominal claims
          mechanical)
    enforcer_count: 9
    cross_references:
      - P-META-006
      - P-META-007
      - P-META-005
      - P-META-001
    anti_patterns:
      - nominal-not-actual-rzf (the meta-pattern this principle exists to cure)
      - cycles-in-memory-not-in-plans (every plan must enumerate; AI memory is augmenting not load-bearing)
      - per-step-validators-undocumented (plans say do X step; don't say evidence required Y; exit code Z)
      - close-summary-skips-cycle-evidence-section (closing-summary-template §10.0 is mandatory)
      - latent-bug-because-validator-never-ran (S002 to S005 evidence)
