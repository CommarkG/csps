    category: meta-governance
    severity: critical
    is_cornerstone: true
    governing_intent: >
      Numbers stay tunable. Definitions stay expandable. Instructions carry context. A rule without its 'why' is a command that invites
      wrong execution. Rigid communication is the primary failure mode of governance drift.
