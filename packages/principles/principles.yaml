  - id: P-META-009
    name: cognitive-context-architecture
    aliases:
      - CCA
      - quality-first-context-discipline
      - context-purity
    category: meta
    severity: critical
    statement: |
      Every CSPS AI session uses the 5-layer Cognitive Context Architecture: Layer 1 Permanent
      Constitution (cached 1h) + Layer 2 Session Contract (cached 1h) + Layer 3 Active Work
      Context (5min/no-cache; mid-session edits force re-read) + Layer 4 On-Demand Structural
      Queries (MCP) + Layer 5 Subagent-Delegated (isolated; never enters main). Tokens are an
      INVESTMENT in reasoning quality, not a budget to minimize. Four immutable Quality Gates
      protect against optimization-induced regression: QG1 hard reasoning never downgrades
      (Opus mandatory for ratification/engraving/ZF synthesis); QG2 synthesis stays in main
      context (subagents do focused work only); QG3 mid-session edited files re-read mandatorily;
      QG4 cache invalidates on content change.
    counterweight: |
      Trivial verifications (file-existence checks; "did this string change?") may use Haiku
      tier; mechanical edits (find-replace; lifecycle bumps) may use Sonnet tier. The discipline
      targets HARD-REASONING tasks (ratification / engraving / ZF synthesis / architectural
      decisions / honest-self-audit) — these never downgrade.
    industry_lineage:
      - Anthropic Prompt Caching (90% savings on cached input via 5min/1h TTL; min Opus 4.7 4096 tokens)
      - Anthropic Sub-Agents (Claude Code) — context isolation pattern; subagent summary returns to parent
      - Model Context Protocol (Linux Foundation 2025) — structural-query layer
      - Claude Sonnet 4.6 / Opus 4.7 / Haiku 4.5 model tier pricing (May 2026)
      - codebase-memory-mcp 120x token reduction measurement (DEV.to 2026)
      - User S005 turn 24 directive — quality + holistic + long-run over immediate savings
    config:
      layers:
        layer_1_permanent_constitution:
          ttl: 1-hour
          content:
            - AGENTS.md
            - principles.yaml summary
            - behavioral-contracts.md TOC
            - ai-behavior-spine.md index
          invalidation: source-content-change
          breakpoint: 1
        layer_2_session_contract:
          ttl: 1-hour
          content:
            - HANDOFF §0
            - active §3 scope
            - open BLK-* registry
            - user-intents
          invalidation: session-end OR explicit ratification
          breakpoint: 2
        layer_3_active_work:
          ttl: 5-min OR no-cache
          content:
            - currently-edited files
            - recent tool outputs
            - current reasoning thread
          invalidation: file-edit OR turn-rollover
          breakpoint: 3
        layer_4_mcp_queries:
          ttl: server-side
          content:
            - principles-mcp resources
            - catalog-mcp resources
            - codebase-memory-mcp
          invalidation: per-query (always fresh from data store)
          breakpoint: n/a
        layer_5_subagent:
          ttl: inherits-parent-cache (fork pattern)
          content:
            - search/grep walks
            - log processing
            - web research
            - parallel-independent reads
          invalidation: per-subagent-invocation
          breakpoint: n/a
      quality_gates:
        QG1_hard_reasoning_never_downgraded:
          enforced_for:
            - engraving
            - PCR-rendering
            - ZF-synthesis
            - architectural-decisions
            - honest-self-audit
          required_model: Opus-4.7
          downgrade_allowed: false
        QG2_synthesis_stays_in_main:
          subagent_scope:
            - search
            - grep
            - log-processing
            - fetch
            - parallel-independent-reads
          subagent_forbidden_scope:
            - PCR-rendering
            - ratification
            - engraving
            - ZF-synthesis
        QG3_mid_session_edited_files_reread:
          trigger: any Edit or Write tool call
          required_action: re-read (Read or Grep) before reasoning about edited content
          anti_pattern: assume-content-from-memory-of-last-write
        QG4_cache_invalidates_on_content_change:
          mechanism: content-hash-based (Anthropic side)
          csps_audit: cache-content-hash-fresh (planned week-4)
          anti_pattern: nominal-cache-where-snapshot-drifts-from-disk
      model_routing:
        opus_4_7_required:
          - engraving
          - PCR-non-trivial
          - ZF-synthesis
          - ADR-authoring
          - cross-pillar-synthesis
          - honest-self-audit
        sonnet_4_6_acceptable:
          - mechanical-edits
          - drafting-from-template
          - routine-validation-analysis
          - subagent-default
        haiku_4_5_acceptable:
          - file-existence-checks
          - simple-grep
          - did-this-change-verifications
      token_budget_operating_rules:
        ratified_at_session: S007
        ratified_at_turn: 4
        ratified_signature: S007-AI-b-token-budget-engraving-2026-05-04T18:55:00Z
        absorbs_from: CSP_STANDARD_TOKEN_BUDGET_GOVERNANCE (4-council synthesis Perplexity + GPT + Gemini + Claude AI)
        rules:
          R1_default_depth_l1_only:
            statement: 'Default depth: L1 (quick) only. L2 / L3 require explicit trigger.'
            l2_escalation_triggers:
              - validator-failure-cites-L2
              - implementation-needs-exact-section
              - ambiguity-unresolved-at-L1
            l3_escalation_triggers:
              - ratification-dispute
              - ZF-semantic-failure
              - constitutional-wording-required
          R2_default_model_tiering:
            statement: >-
              Default model tiering: Sonnet for build/edit/standard; Haiku for subagents (read-only ops via Task tool); Opus for engraving +
              PCR + ZF synthesis + architectural decisions.
            opus_immutable_scope:
              - engraving
              - PCR-non-trivial
              - ZF-synthesis
              - ADR-authoring
              - cross-pillar-synthesis
              - honest-self-audit
            sonnet_default_scope:
              - build-edit
              - mechanical-edits
              - drafting-from-template
              - routine-validation-analysis
              - standard-work
            haiku_default_scope:
              - subagent-read-only-ops
              - file-existence-checks
              - simple-grep
              - did-this-change-verifications
            no_mid_task_switching: true
            composes_with: P-META-009.config.quality_gates.QG1
          R3_compact_at_impl_batch_boundary:
            statement: >-
              Default at IMPL_BATCH boundary: /compact <focus>. Strategic compaction with focus instructions replaces auto-compact's
              content-loss pattern.
            csps_analog: at-L<N>-to-L<N+1>-topic-plan-transitions OR commit-worthy-boundaries
            anti_pattern: silent-auto-compact-mid-session (loses governance context)
          R4_clear_between_unrelated_tasks:
            statement: 'Default between unrelated tasks: /clear + new session. Stale context from unrelated tasks does not pay rent.'
            csps_analog: chat-vs-session-distinction (P-META-014 + memory-feedback_chat_vs_session_distinction.md)
            trigger: domain-change OR completed-topic-plan-arc
          R5_tool_output_summary_first:
            statement: 'Default for tool output: summary first; full log path-linked. Validator + command + file-read returns structured summary.'
            required_summary_fields:
              - status
              - findings_count
              - top_5
              - evidence_paths
              - full_log_path
            anti_pattern: 5K-10K-tool-output-blob-accumulating-as-context (unstructured spew)
            mechanical_target: validator-output-tooling-conforms (Phase 10 of token-optimization topic-plan)
        engraving_status:
          schema: this subsection (active)
          validator: 5 audit slugs registered atomic in audit-runner.md (impl week-4)
          hook: .claude/hooks/verify-hooks-functional.sh (SessionStart self-test stub; S007 turn 4)
          memory: feedback_token_budget.md (S007 turn 4)
          contract: behavioral-contracts.md § B_TOKEN_BUDGET + AGENTS.md hard NO + ai-behavior-spine.md row (S007 turn 4)
        composes_with: >-
          P-META-009 (extends; no new principle) + B_COGNITIVE_CONTEXT_DISCIPLINE (extends) + B_GRADUAL_BUILD_BY_FOUNDATIONS
          (foundation-stability discipline applied to optimization phasing)
