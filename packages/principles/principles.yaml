  - id: P-META-004
    name: stored-content-lifecycle
    aliases:
      - stewardship-protocol
      - content-lifecycle
      - no-orphan-saves
    category: meta
    severity: critical
    statement: |
      Every saved artifact (handoff, vault entry, legacy archive, open question, ADR proposal,
      draft doc, intake item, third-party skill, rule, audit finding) must declare a
      lifecycle_state and have a recurring trigger that advances it. Saved-without-trigger =
      orphan-in-waiting. The default state for newly-saved-without-process is `pending-protocol`,
      which itself triggers a protocol-creation flow.
    industry_lineage:
      - Scrum / Kanban — backlog grooming as recurring stewardship of saved items
      - Linear / Jira / Shortcut — issue triage loop with state-machine + SLA per state
      - Eric Evans, Domain-Driven Design (2003) — Stewardship as ownership of bounded-context artifacts
      - Atlassian "Inbox Zero" + David Allen GTD — every captured input must have a next-action or be archived
      - Tiago Forte, Building a Second Brain — PARA method (Project / Area / Resource / Archive)
      - SharePoint Managed Metadata — quarterly review of open-tag values for promotion/retirement
      - Backstage Catalog lifecycle (experimental → production → deprecated) — recurring lifecycle reviews
    config:
      lifecycle_states:
        - active
        - pending-review
        - pending-protocol
        - promoted
        - resolved
        - deprecated
      default_state_for_unprocessed: pending-protocol
      review_cadence_pending: per-session
      review_cadence_active_stale_days: 90
      sla_pending_review_days: 14
      sla_pending_protocol_days: 30
      sla_legacy_archive_review_days: 90
    state_transitions:
      pending-protocol:
        - active
        - deprecated
      pending-review:
        - active
        - deprecated
        - promoted
      active:
        - pending-review
        - promoted
        - resolved
        - deprecated
      promoted:
        - active
        - deprecated
      resolved:
        - deprecated
      deprecated: []
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: Stated as cardinal meta-principle; references /stewardship-review skill
      - layer: frontmatter-contract
        location: tools/validators/validate-frontmatter.mjs
        description: Every artifact has `lifecycle_state` (closed enum); `next_review_at` required when state != active
      - layer: ci-check
        location: libs/audits/checks/stewardship/orphan-without-lifecycle-state.ts
        description: PR check — every artifact has lifecycle_state declared (or inherited via variants)
      - layer: ci-check
        location: libs/audits/checks/stewardship/stale-pending-review.ts
        description: PR + nightly — items in pending-review past SLA flagged
      - layer: ci-check
        location: libs/audits/checks/stewardship/stale-pending-protocol.ts
        description: Nightly — items in pending-protocol past SLA flagged for protocol creation
      - layer: ci-check
        location: libs/audits/checks/stewardship/legacy-archive-review-due.ts
        description: Weekly — _legacy/ items past their next_review_at flagged for review or retirement
      - layer: skill
        location: packages/skills/stewardship-review/SKILL.md
        description: Slash command surfaces all pending-* + active-stale items for current-session triage
      - layer: mcp-resource
        location: packages/principles-mcp/src/resources.ts
        description: Exposed as principles://stewardship-protocol with state machine + cadences
    enforcer_count: 8
    cross_references:
      - P-META-001
      - P-META-005
      - P-OP-002
      - P-ARCH-001
    anti_patterns:
      - silent-save (artifact persisted without lifecycle_state — the orphan-in-waiting)
      - perpetual-pending (state stuck in pending-* indefinitely; SLA audit catches)
      - orphan-archive (_legacy items never re-reviewed)
      - knowledge-graveyard (Confluence-rot equivalent — saved-but-unread, no recurring trigger)
      - state-without-transition (lifecycle_state declared but no trigger advances it; treated as bug)
      - stewardship-theater (running the review without actually advancing or retiring items)
    enforcement_tier:
      tier1_hook: pre-tool-use-frontmatter-enum-check.sh (BLOCKING — validates closed-enum lifecycle_state and closed fields before write)
      tier2_validator: tools/validators/validate-frontmatter.mjs (BLOCKING — full frontmatter contract enforcement)
      tier3_session: AGENTS.md hard-NO + session-open.sh principle injection
  - id: P-META-005
    name: learning-loop
    aliases:
      - closed-loop-learning
      - observe-orient-decide-act
      - OODA
      - no-write-only-graveyard
    category: meta
    severity: critical
    statement: |
      Every input stream into CSPS — chat conversations, error logs, audit failures, user feedback,
      AI-extracted insights, near-misses — is routed through a single intake → triage → routing →
      permanent-fix → validation pipeline. Inputs that escape the loop trigger a self-healing audit
      that identifies the gap, applies a permanent control, and validates the gap is closed.
      Saving is not the goal; permanent system improvement is.
    industry_lineage:
      - John Boyd, OODA Loop (1976) — Observe → Orient → Decide → Act; tempo as competitive advantage
      - >-
        Google SRE Book + Workbook — blameless postmortem culture + action-item SLOs + FixIt weeks (industry close-rate ~30% without forcing
        functions; Google targets 80%+ within 30d)
      - >-
        Toyota Kata + Five Whys (Mike Rother, "Toyota Kata", 2009) — daily improvement cadence + Five-Whys → A3 escalation when problem
        cross-functional or recurring (the documented K=2 → ADR pattern)
      - Lean / Kaizen — continuous improvement as built-in process, not project
      - DORA / DevOps Research and Assessment — change failure rate, MTTR, lead time as the four meta-metrics
      - Linear Triage + Triage Intelligence (2025) — auto-routing, SLA-as-trigger, two-tier confidence gate (~90% routing accuracy)
      - OpenTelemetry GenAI semantic conventions — gen_ai.evaluation.result event for AI-extracted insight provenance
      - >-
        RLHF / Active Learning literature — three-band confidence gate (auto-accept ≥0.90, review 0.75–0.90, discard <0.75); target 1–5% in
        human review band
      - Knowledge management failure literature (Nick Milton 7 failure modes; Mark Burgess "Failure of KM"; Confluence-rot case studies) — the antidote: capture-in-flow + pull-based discovery + visible feedback loops + forcing-function closure
    config:
      pipeline_states:
        - observed
        - triaged
        - routed
        - fixing
        - validated
        - closed
      sla_observed_to_triaged_hours:
        P0: 1
        P1: 4
        P2: 24
        P3: 72
      sla_triaged_to_routed_hours: 48
      sla_fixing_days:
        P1: 30
        P2: 90
        P3: 180
      ai_confidence_thresholds:
        auto_accept: 0.9
        human_review_band_lo: 0.75
        human_review_band_hi: 0.9
        discard_below: 0.75
      target_human_review_rate_pct:
        - 1
        - 5
      recurrence_check_days_default: 90
      recurrence_check_days_critical: 30
      repeat_issue_auto_adr_threshold_K: 2
      repeat_issue_window_days: 90
      repeat_issue_lifetime_threshold_K: 3
      meta_loop_trend_window_days: 90
      meta_loop_eval_cadence: weekly
      meta_loop_degradation_pct_trigger_adr: 20
      otel_evaluation_event: gen_ai.evaluation.result
    pipeline_transitions:
      observed:
        - triaged
        - closed
      triaged:
        - routed
        - closed
      routed:
        - fixing
        - closed
      fixing:
        - validated
        - closed
      validated:
        - closed
        - fixing
      closed:
        - observed
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: >-
          Stated as cardinal meta-principle; references /learning-loop-extract skill; includes hard NO 'Never close a chat without running
          learning-loop:extract or marking no insights with reason'
      - layer: skill
        location: packages/skills/learning-loop-extract/SKILL.md
        description: Mastra skill — scans session log for insights/errors/gaps/decisions; routes to LearningLoopItem inbox with confidence-gated bands
      - layer: hook
        location: .claude/hooks/post-stop-learning-loop.sh
        description: PostStop hook — auto-triggers extractor at session end
      - layer: ci-check
        location: libs/audits/checks/learning-loop/coverage.ts
        description: Per-session — every session produced ≥1 extracted item OR explicit no-insights with reason
      - layer: ci-check
        location: libs/audits/checks/learning-loop/repeat-issue-detection.ts
        description: Weekly — same gap in ≥K=2 sessions within 90d auto-creates ADR; the killer enforcer
      - layer: ci-check
        location: libs/audits/checks/learning-loop/unresolved-observation-stale.ts
        description: Nightly — items in `observed` past their priority-tier SLA escalate
      - layer: ci-check
        location: libs/audits/checks/learning-loop/fix-without-validation.ts
        description: Nightly — items in `fixing` >SLA without `validated` flagged (prevents closure-theater)
      - layer: ci-check
        location: libs/audits/checks/learning-loop/validation-without-recurrence-check.ts
        description: Weekly — `closed` items get a 30/90-day recurrence check based on tier; reopen if recurs
      - layer: ci-check
        location: libs/audits/checks/learning-loop/meta-loop-audit.ts
        description: Monthly — resolution-cycle-time trend over 90-day rolling window; degradation >20% files ADR
      - layer: zenstack-policy
        location: libs/policies/slices/public/learning-loop-item.zmodel
        description: LearningLoopItem Foundation slice — schema for the pipeline state machine; @@deny on bypass
      - layer: mcp-resource
        location: packages/principles-mcp/src/resources.ts
        description: Exposed as principles://learning-loop with state machine + cadences + thresholds
    enforcer_count: 11
    cross_references:
      - P-META-001
      - P-META-002
      - P-META-004
      - P-META-006
      - P-OP-001
      - P-ARCH-014
    anti_patterns:
      - knowledge-graveyard (write-only insight capture; what KM systems fail at; antidote = closure-as-forcing-function)
      - confidence-cliff (binary auto-accept threshold without review band — loses RLHF signal)
      - closure-theater (items marked closed without validation; fix-without-validation audit catches)
      - silent-escape (insight observed but no one noticed; weekly rescan + per-session coverage audit catches)
      - loop-fatigue (too many low-confidence items reach review queue — confidence gate calibration; target 1-5% review rate)
      - meta-loop-rot (resolution-cycle-time degrades silently; meta-loop-audit catches at >20% over 90d)
      - false-positive-flood (extraction precision degrades; weekly extraction-precision audit catches)
      - insight-without-owner (no one accountable; SLA escalation routes; orphans are routing failures)
    enforcement_tier:
      tier1_hook: pre-tool-use-vault-write-gate.sh (BLOCKING — learning-loop intake required before closing session)
      tier2_validator: pnpm verify full-pass (indirect coverage via contract validators)
      tier3_session: 'AGENTS.md hard-NO + session-open.sh: learning-loop injection'
  - id: P-META-006
    name: zero-findings-discipline
    aliases:
      - RZF
      - CEC
      - complete-extraction-cycle
      - real-zero-findings
      - evidence-based-completion
    category: meta
    severity: critical
    statement: |
      Every artifact reaching DONE / COMPLETE / RATIFIED status must emit an evidence block
      proving (1) RZF — re-run validators returned ZERO findings across all check types
      (mechanical / semantic / propagation / user-visible-outcome-when-applicable), AND
      (2) CEC — Complete Extraction Cycle walked the platform until ZERO new application
      opportunities. Cycle count is MEASUREMENT not TARGET; re-run IS the proof; partial-extraction
      normalized as "good enough" is the universal AI failure pattern this principle catches.
    industry_lineage:
      - CSP S333 Real Zero Findings discipline (330+ sessions of evolution; treasure
      - Toyota Kata + Five Whys → A3 escalation (cycle-as-measurement)
      - Google SRE postmortem culture (action-items-with-evidence not feeling)
      - Backstage Tech Insights (Facts/Checks/Scorecards mechanical layer)
      - User S002 turn 10 — explicit extension to Complete Extraction (positive branch addressing AI's negative-only-validation default)
    config:
      rzf_check_types:
        - mechanical
        - semantic
        - propagation
        - user-visible-outcome
      rzf_required_check_types:
        - mechanical
        - semantic
        - propagation
      rzf_cycle_count_is_target: false
      rzf_evidence_block_required: true
      cec_walk_scope:
        - principles.yaml
        - pillar-0/*.md
        - pillar-1/*.md
        - pillar-2/*.md
        - pillar-3/*.md
        - pillar-4/*.md (when migrated)
        - pillar-5/*.md (when migrated)
        - pillar-6/*.md (when migrated)
        - _handoff/VAULT/*.md
        - _intake/*.md
        - behavioral-contracts.md
        - ai-behavior-spine.md
        - memory/*.md
        - AGENTS.md
      cec_walk_trail_required: true
      cec_termination_condition: same-cycle-zero-new-opportunities
      cec_essence_must_be_distilled_in_one_sentence: true
      compressed_zero_findings_under_context_pressure: forbidden
      mandatory_at:
        - every principle ratification
        - every leaf migration
        - every batch close
        - every chat boundary (close + open)
        - every ADR landing
        - every external input ratified into platform
        - every behavioral contract addition
        - every audit-runner check addition (RZF only; CEC not applicable to audit infrastructure itself per CSP precedent)
        - every significant insight surfaced by AI or user (even informal — not just ratified principles)
        - every improvement landed (bug fix / feature ship / discipline strengthening)
        - every user directive integrated (walk platform for all places it should apply)
        - every EXT-ID processed (positive value extraction beyond just routing)
        - every bug-fix integrated (search for similar patterns elsewhere)
        - every AI self-correction (walk session for similar errors already made)
        - every generator/wizard output batch (cycle on the produced artifacts)
        - every meta-finding surfaced (e.g., FSE produces dangling refs by default — walk for all instances)
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: 3 new hard NOs binding both RZF + CEC; bind to closing-protocol + ratification triggers
      - layer: ci-check
        location: libs/audits/checks/zero-findings/rzf-coverage.ts
        description: 'PR-blocking: every artifact reaching DONE has RZF evidence block; missing = fail (planned week 4)'
      - layer: ci-check
        location: libs/audits/checks/zero-findings/cec-walk-trail-completeness.ts
        description: 'PR-blocking warn: every ratified principle/leaf has CEC walk-trail; missing = warn (planned week 4)'
      - layer: ci-check
        location: libs/audits/checks/zero-findings/audit-of-audits.ts
        description: 'Per CSP precedent: verify audit registry itself is healthy; result files exist; no ABANDONED state (planned week 4)'
      - layer: ci-check
        location: libs/audits/checks/zero-findings/cycle-count-as-target-detection.ts
        description: Detect language pattern 'run N cycles' or 'predetermined cycles'; fail with anti-pattern flag (planned week 4)
      - layer: hook
        location: .claude/hooks/post-stop-zero-findings.sh
        description: 'PostStop: auto-fire CEC walk on session-close for any new principle/leaf ratified this session (planned week 4)'
      - layer: hook
        location: .claude/hooks/user-prompt-submit-zero-findings.sh
        description: 'UserPromptSubmit: surface RZF + CEC state at session-open (banner — open ZF-pending / open CEC-walks)'
      - layer: skill
        location: packages/skills/rzf-cycle-runner/SKILL.md
        description: 'Slash command /rzf-cycle <scope> orchestrates full cycle: run validators → collect → fix → re-run → emit evidence block'
      - layer: skill
        location: packages/skills/cec-walk/SKILL.md
        description: Slash command /cec-walk <ratified-artifact> walks platform per scope; emits walk-trail
      - layer: frontmatter-contract
        location: tools/validators/validate-frontmatter.mjs
        description: 'Artifacts at lifecycle_state: validated|closed require evidence-block reference'
      - layer: mcp-resource
        location: packages/principles-mcp/src/resources.ts
        description: Exposed as principles://zero-findings-discipline with full state-machine + evidence-block format + walk-trail format
    enforcer_count: 11
    cross_references:
      - P-META-001
      - P-META-004
      - P-META-005
      - P-OP-001
      - P-OP-003
      - P-ARCH-006
    anti_patterns:
      - validator-pass-cited-without-rerun (S132 / S184 / S227 incidents)
      - mechanical-only-declared-as-rzf (S332 — skipping semantic + propagation)
      - total-zero-hides-sub-findings (S184 — TOTAL=0 in summary; 11 hidden)
      - baseline-not-zero-counted-as-clean (S278 — drift normalized)
      - rerun-skipped-after-fix (S132 — fixing is necessary not sufficient)
      - cycle-count-as-target (S227 — process-driven not result-driven)
      - compressed-rzf-under-context-pressure (defer not compress)
      - negative-only-validation (the universal AI failure pattern this principle exists to cure)
      - run-forward-bias (moving to next priority without walking platform for essence-applications)
      - partial-extraction-normalized-as-complete (applying to 2 obvious + skipping 5 non-obvious)
      - walk-without-iteration (one walk → apply → declare CEC-0 without re-walking on EXTENDED state)
      - premature-cec-zero (declaring "no further opportunities" without explicit walk-trail evidence)
      - essence-extraction-unstated (applying without distilling 1-sentence core; subsequent walks miss applications)
      - ai-default-moving-on (the dominant failure mode; counteracted only by mechanical CEC-trigger at every ratification)
    enforcement_tier:
      tier1_hook: >-
        pre-tool-use-rzf-evidence-gate.sh + post-stop-rzf-reminder.sh (BLOCKING — ZF evidence required before any
        DONE/RATIFIED/VALIDATED/CLOSED claim)
      tier2_validator: pnpm verify full-pass (indirect ZF coverage via contract validators)
      tier3_session: 'AGENTS.md hard-NO + session-open.sh: zero-findings discipline injection'
  - id: P-META-007
    name: five-surface-engraving
    aliases:
