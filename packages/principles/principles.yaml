audit_meta_check:
  description: |
    Verifies every principle has the required number of enforcers per its severity class,
    every enforcer location resolves to a real file, and every // @enforces: annotation
    in source references a real principle.
  algorithm: |
    1. Parse principles.yaml.
    2. For each principle:
       - Look up min_enforcers per severity from severity_enforcer_minimums.
       - Count enforcers in the principle's enforcers list.
       - Verify count >= min.
       - For each enforcer, verify the location file exists OR is in the codegen output set.
       - For critical principles, verify >= 2 non-AI enforcers.
       - Fail if any check fails.
    3. Inverse check (orphan-enforcer audit):
       - Grep all source for `// @enforces: P-` annotations.
       - For each annotation, verify the principle ID exists in principles.yaml.
       - Fail if any annotation references a missing principle.
    4. Codegen-fresh check:
       - Re-run `pnpm principles:codegen` in a clean tree.
       - Fail if git diff produces any output (drift between source and generated).
    5. Output: report per-principle coverage; flag under-enforced; non-zero exit on any failure.
change_protocol: |
  1. Edit principles.yaml.
  2. If adding/removing/modifying a principle: write or update an ADR in docs/adr/
     (the principle's ADR field references the ADR id).
  3. Run `pnpm principles:codegen` — this updates AGENTS.md + skills + hooks + MCP resources + audit checks.
  4. Run `pnpm nx run audit-runner:meta-check` locally — verify no orphans.
  5. Commit principles.yaml + all generated files together.
  6. CI re-runs codegen + meta-check; rejects if drift.
  7. Merge → all downstream consumers (Claude Code, Cursor, Mastra agents, CI gates) pick up the change.
open_questions:
  - Should principles.yaml be split into per-category files (operating.yaml, architecture.yaml, meta.yaml) once it grows past ~500 lines?
  - How do we version individual principles (semver on the principle level vs the registry level)?
  - When a principle is deprecated, do its enforcers get a grace period or are they removed atomically?
  - >-
    Should AI-proposed principles (drafted by Claude) require human review before merge? Recommend yes — add proposed_by: ai|human field on
    next iteration.
