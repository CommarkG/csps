  - id: P-META-028
    name: context-refined-communication
    aliases:
      - context-refined-communication-principle
      - cornerstone-communication
      - communication-is-prevention
      - crcp
    title: Context-Refined Communication is the Primary Prevention Tool
    description: >
      However deep an insight, if communicated rigidly or without context, the intent never delivers the exact result aimed for. Every
      instruction/number/rule/definition is wrapped in interpretable context; samples are marked as samples; thresholds marked tunable;
      definitions written to allow expansion, never silent caps. Sits above the comms-schema (the *why*) and IS a prevention class.
      Cross-referenced FROM comms-schema + prevention-class register (bidirectional). The cornerstone of the Facet pack (Facets A-F in
      PLAN-S069 ADDENDUM).
