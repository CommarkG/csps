  - id: P-ARCH-029
    name: naming-policy
    aliases:
      - naming-discipline
      - simple-clear-industry-standard-names
    category: architecture
    severity: error
    statement: |
      CSPS artifacts MUST be named per the 4-rule naming policy: always-current (no
      session/version/level suffix in filename; version in frontmatter); per-session
      (S<NNN> suffix for immutable historical record); per-topic (topic-id only;
      multi-session arc); layer-prefixed (L1_CORE / L2_DOMAIN / L3_INSTANCES preserve
      load-bearing layer identity). English words preferred over abbreviations except
      engraved canonical terms (P-META / B_ / FSE / RZF / CEC / HPFA / MUV / AAP /
      CCA / ZModel / BaseAgent / RLS preserved). Industry-standard vocabulary
      (slice / template / audit / validator / registry / manifest / schema / pillar)
      preferred over invented synonyms. Renaming requires git mv + frontmatter update
      + grep-and-update inbound references in same commit.
    counterweight: |
      Engraved canonical terms (the closed enum above) MUST be preserved — renaming
      them = constitutional change requiring ADR. Names are infrastructure; bad names
      compound; but legacy artifacts authored before this engraving are grandfathered
      until next opportunistic-touch backfill (per P-META-006 Layer 1 grandfather
      protocol).
    industry_lineage:
      - POSIX filesystem conventions — kebab-case files; UPPER for entry points (README / LICENSE)
      - Tech docs convention — README / OVERVIEW / STATUS / CONTRIBUTING are universal
      - Domain-driven design — glossary-pinned terms prevent synonym drift
      - Software engineering naming research (Knuth + Beck + Fowler) — names are 80% of code readability
      - User S006 turn 24 directive — names are simple and clear for human users while using industry standard vocabulary
    config:
      always_current_forbidden_suffixes:
        - '-S<NNN>'
        - '-v<N>'
        - '-L<N>'
        - '-final'
        - '-latest'
        - '-current'
        - '-new'
        - '-old'
      per_session_required_suffix: S<NNN>
      per_topic_pattern: <topic-id>.md (no session suffix)
      layer_prefix_load_bearing:
        - L1_CORE_<SPINE>
        - L2_DOMAIN_<SPINE>_<DOMAIN>
        - L3_INSTANCES_<SPINE>
      case_conventions:
        markdown_yaml_filenames: kebab-case
        sealed_doctrine_prefix: UPPER_SNAKE
        readme_class_entrypoints: UPPER
        code_types: PascalCase
        code_identifiers: camelCase
        audit_slugs: kebab-case
        engraved_canonical_terms: as-engraved-preserved
      preserved_canonical_terms:
        - P-META-NNN
        - P-ARCH-NNN
        - P-OP-NNN
        - P-OPER-NNN
        - B_*
        - FSE
        - RZF
        - CEC
        - HPFA
        - MUV
        - AAP
        - CCA
        - ZModel
        - BaseAgent
        - RLS
        - PCR
      vocabulary_preference: english-words-over-abbreviations
      industry_terms_preferred:
        - slice
        - template
        - audit
        - validator
        - registry
        - manifest
        - schema
        - pillar
      synonym_drift_forbidden: true
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: Hard NO — never create/rename artifact violating naming-policy 4 rules
      - layer: contract
        location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_NAMING_POLICY
        description: B_NAMING_POLICY canonical contract
      - layer: memory
        location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_naming_policy.md
        description: Cognitive layer; loaded session-start
      - layer: frontmatter-contract
        location: docs/plan/pillar-0-governance/naming-policy.md
        description: Canonical specification — 4 rules + case conventions + vocabulary preferences
      - layer: ci-check
        location: libs/audits/checks/naming-policy-compliance.ts
        description: Validator — every modified filename + frontmatter name passes 4-rule classifier (registered atomic; impl week-4)
      - layer: hook
        location: .claude/hooks/pre-tool-use-naming-policy.sh
        description: PreToolUse — refuses Write/Edit on filenames violating policy (planned week-4)
      - layer: ai-behavior-spine
        location: docs/plan/pillar-0-governance/ai-behavior-spine.md
        description: Discipline matrix row
    enforcer_count: 7
    cross_references:
