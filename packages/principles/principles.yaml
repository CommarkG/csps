  - id: P-META-021
    name: triad-governance
    aliases:
      - coverage-by-combination
      - context-principle-mechanical
      - three-layer-correctness
      - no-single-mechanism-is-sufficient
    category: meta
    severity: critical
    statement: |
      No single governance layer covers all situations. Specific cases are infinite;
      rule enumeration is finite; context degrades across sessions. The only approach
      that scales to infinite situations is the triad:
        (1) CONTEXT    — load the conceptual frame that makes the right action obvious.
                         Without context, the AI pattern-matches against named rules only.
                         New situations not yet named fall through.
        (2) PRINCIPLE  — name the specific P-* rule that applies to this situation class.
                         Without a named principle, "correct behavior" is undefined even
                         when context is active. Context navigates; principles define destination.
        (3) MECHANICAL — enforce the principle independently of whether the AI remembers it.
                         Without mechanical enforcement, every session starts fresh. Context
                         degrades. Principles are forgotten. Only the hook fires reliably.
      Any governance system using fewer than three layers fails on the long tail of
      uncovered situations. The triad is the minimum viable governance stack for a platform
      that expects to operate across infinite session boundaries and situation types.
      The triad creates a closed feedback loop: mechanical findings feed back into context
      (via drift-log and reasoning-patterns), which improves future navigation — compounding
      governance quality rather than accumulating governance debt.
    counterweight: |
      Not every micro-decision requires the full triad. Trivial-reversible decisions
      (file naming, variable choice, formatting) are navigated by context alone without
      invoking the full stack — the overhead would dwarf the value. The triad is for
      CONSEQUENTIAL decisions: those that are hard to reverse, affect multiple artifacts,
      represent a new situation class, or block future phases. Judgment on when a decision
      is consequential is itself governed by P-META-020 (Concept-First) — load the
      conceptual frame first, then assess whether the triad is needed.
    industry_lineage:
      - >-
        Toyota Production System — andon cord (mechanical) + standard work (principle) + kaizen knowledge (context). No single element
        produces quality; all three together do.
      - >-
        Aviation safety — checklist (mechanical) + CRM training (principle) + crew briefing (context). Crashes happen when any one element
        is missing.
      - >-
        Clean Architecture — dependency inversion (principle) + architectural tests (mechanical) + domain knowledge (context). A rule
        without tests without understanding = paper architecture.
      - >-
        Governor S014 directive (verbatim) — "there is an endless number of situations and engineering can not cover them completely no
        matter how much we try. only a combination of context with well defined principles relevant to the situation along with mechanical
        elements enforcing guardrails will cover all bases"
    config:
      triad_layers:
        context: load_relevant_l2_spine_domain_before_decision
        principle: identify_applicable_p_star_rule_for_situation_class
        mechanical: hook_or_validator_fires_independently_of_ai_memory
      consequential_decision_indicators:
        - hard_to_reverse
        - affects_multiple_artifacts
        - new_situation_class_not_yet_named
        - blocks_future_phases
        - requires_governor_ratification
      feedback_loop:
        findings_route_to: continuous_drift_log + reasoning_patterns_md
        learning_compounds_into: improved_context_at_session_open
        cycle: mechanical_fires → finding_named → context_enriched → better_navigation
      samples:
        - situation: advance-to-next-phase reflex
          what_failed: AI proposes Phase 5 while Phase 4 VLTs are open — finish-fast default overrides PE
          context_needed: ZF iteration is not complete; open items are obligations not options
          principle: B_CONSENSUS_BEFORE_PROCEEDING — VLTs must be ratified before advancing
          mechanical: validate-open-plan-levels.mjs surfaces open exit criteria at every stop
          triad_verdict: context says 'still finding things' + B_CONSENSUS fires + validator shows items → BLOCK advance
          status: must-be-ratified-by-governor ★
        - situation: validator-proliferation trap
          what_failed: Each new gap adds a new validator — 34 validators growing without bound
          context_needed: Validators are reference SAMPLES of a concept, not the complete ruleset
          principle: P-META-020 — context is compass; validators confirm alignment, not define it
          mechanical: validate-instruction-context.mjs checks WHY is present in new validators
          triad_verdict: >-
            context says 'the concept covers this' + P-META-020 reframes role + instruction-context audits WHY → stop adding rules, deepen
            concept
          status: must-be-ratified-by-governor ★
        - situation: plan-promise-abandonment
          what_failed: L1 promises L3 validator; AI advances sessions; promise forgotten for 3 sessions
          context_needed: A promise made while authoring L1 is an obligation that carries to L3
          principle: P-META-006 RZF — promises are obligations requiring THIS-SESSION evidence
          mechanical: validate-open-plan-levels.mjs surfaces unchecked exit criteria at every verify
          triad_verdict: context active at level-close + P-META-006 applies + validator shows item → obligation surfaces
          status: must-be-ratified-by-governor ★
        - situation: wild-implementation impulse
          what_failed: AI builds interesting feature without ratified plan
          context_needed: Implementation without plan = governance bypass = structural debt
          principle: B_GRADUAL_BUILD_BY_FOUNDATIONS + B_CONSENSUS_BEFORE_PROCEEDING
          mechanical: pre-tool-use-plan-coverage-gate.sh blocks writes to libs/apps without covered plan
          triad_verdict: context says 'this is implementation' + B_GRADUAL fires + gate blocks → cannot write without plan
          status: must-be-ratified-by-governor ★
        - situation: nominal-ZF acceptance
          what_failed: Timestamps touched, checks bypassed, DONE claimed with false confidence
          context_needed: Nominal ZF gives false confidence at exactly the moment someone builds on top of it
          principle: P-META-006 RZF — re-run IS the proof; memory of earlier run is NOT evidence
          mechanical: post-stop-pnpm-verify.sh runs actual verify and blocks on failure; injects reasoning
          triad_verdict: context explains danger + P-META-006 defines evidence standard + stop hook blocks claiming → real ZF only
          status: must-be-ratified-by-governor ★
    enforcers:
      - layer: instruction-file
        location: docs/plan/pillar-0-governance/concept-first-governance.md#triad
        description: §Triad section — canonical methodology extension
      - layer: hook
        location: .claude/hooks/session-open.sh
        description: CONCEPT_LOAD injects triad framing at session activation
      - layer: hook
        location: .claude/hooks/user-prompt-submit-next-step-reminder.sh
        description: Per-turn triad reminder with ZF awareness
      - layer: instruction-file
        location: docs/plan/_handoff/VAULT/csps-master-roadmap-s014-plus.md#§0
        description: Governing methodology §0 references triad
    enforcer_count: 4
    cross_references:
      - P-META-020
      - P-META-019
      - P-META-006
      - P-META-009
    anti_patterns:
      - single-layer-reliance (using only context OR only principles OR only mechanical → fails on long tail)
      - triad-without-samples (declaring the triad without concrete examples per situation class → abstract without application)
      - samples-without-ratification (samples authored by AI without Governor ratification → unverified governance)
      - mechanical-as-substitute (adding hooks to avoid understanding the concept → enforcement without navigation)
      - context-without-enforcement (concept understood but no hook fires → reliable only when AI remembers)
    enforcement_tier:
      tier1_hook: pre-tool-use-plan-coverage-gate.sh (BLOCKING — concept-first gate; plan-coverage required before implementation)
      tier2_validator: pnpm verify full-pass (indirect coverage via contract validators)
      tier3_session: AGENTS.md hard-NO + session-open.sh principle injection
  - id: P-META-022
