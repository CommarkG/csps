  - id: P-META-031
    name: reasoned-adoption
    aliases:
      - reasoned-adoption-principle
      - enforce-floor-reason-ceiling
      - SP-citation-for-overrides
    title: Reasoned Adoption — Enforce the Floor, Reason the Ceiling
    description: >
      Every override of a rule, deviation from a default, or claimed exception must cite: (1) REASONING — why the training default fires
      wrongly in this context, (2) REFRAME — FROM the prohibition TO a positive identity-value the AI adopts, (3) ADOPTED VALUE — the
      positive behavior internalized (not just the thing avoided). The floor is ENFORCED (tool-evidence + SP-citation mandatory,
      non-negotiable). The ceiling is REASONED (allowed overrides cite which SP they satisfy; reasoning without SP citation = D11
      rigid-rule-satisfaction). Counter-instruction alone = T3-only = will drift by turn 10. All three layers required.
    spine: AI
    layer: L1
    category: meta-governance
    severity: critical
    governing_intent: >
      Enforcement without reasoning produces D11 (format-satisfaction over intent). Reasoning without enforcement produces D6 (verbal
      cleverness, post-hoc rationalization). The principle requires BOTH: the floor is the SP-citation gate (mechanical, non-negotiable) and
      the ceiling is the reasoning that demonstrates the governing_intent is met. Together they prevent both rigid-rule-satisfaction and
      unverified-override.
    composes_with:
      - P-META-025
      - P-META-006
      - P-META-030
    enforcement_tier:
      tier1_hook: user-prompt-submit-ai-profiler.sh (D14 detection → correction THIS turn)
      tier2_validator: validate-default-shape.mjs (BLOCKING on new D* entries missing reasoning+reframe+adopted_value)
      tier3_session: session-open.sh injection + AGENTS.md COMMENTS-BEFORE-CODE
    satisfaction_point:
      thing: reasoned-adoption-active
      verify_mechanically: node tools/validators/validate-default-shape.mjs 2>&1 | grep -q 'blocking=0'
      block_test: add new D* entry without reasoning → validator exits 1
    ratified_by: OPUS-16 S075 (PROTO-S075-MASTER B1)
    ratified_date: '2026-06-01'
    session: S075
    self_check_q: |
      "Does this D* entry have: reasoning (why wrong here), reframe (from prohibition to identity),
       adopted_value (positive behavior)? Does this override cite the SP it satisfies?
       If I cannot answer yes — enforcement alone will drift."
    note: >-
      P-META-031 ID confirmed S075. Pairs with D14 (unverified-agreement) as the first fully-shaped entry demonstrating the principle.
      D7/D11/D12 retrofitted S075. D1-D6/D8-D10 advisory retrofit by significance.
  - id: P-ARCH-028
    name: csps-core-spines
    aliases:
      - core-spine-discipline
      - 5-spine-architecture
      - outward-layering
    category: architecture
    severity: critical
    statement: |
      CSPS architecture is organized around 5 Core Spines (GVRN/ARCH/AI/OPER/VALD) with
      precedence ordering GVRN > VALD > ARCH > AI > OPER (lower-defers-to-higher).
      Every governed artifact declares a primary spine via `core_spine:` (singular)
      frontmatter + optional cross-cutting list via `core_spines:` (plural). 3-layer
      doctrine model: L0 csps-core-manifest (root) / L1 sealed core (5 files; CC-equivalent
      amendment) / L2 domain decomposition (~16 files) / L3 instance registries (5 files;
      per-session populated). DNA stays consistent from CORE outward to specific instances
      because every layer enforces the layer beneath it.
    counterweight: |
      Cross-cutting concerns may declare multiple spines via `core_spines:` plural; primary
      spine via `core_spine:` singular owns adjudication. Pillars (7 domain-organized) compose
      orthogonally to spines (5 responsibility-organized) — pillar leaves declare both.
    industry_lineage:
      - CSP CC-015 + CC-048-A — 5-spine canonical set (S206; PHIL retired); precedence DO-1
      - CSP S331 Bundle 1 Scope A — 3-layer doctrine model (L1 sealed + L2 domain + L3 instances)
      - OpenAI Model Spec hierarchy — universal-at-trunk + domain-overlays-at-extension
      - User S006 turn 7 directive — "the Core is the universal fundamental undebatable things of each core spine"
    config:
      canonical_spines:
        - GVRN
        - ARCH
        - AI
        - OPER
        - VALD
      precedence_ordering:
        - GVRN
        - VALD
        - ARCH
        - AI
        - OPER
      precedence_rule: lower-defers-to-higher
      layers:
