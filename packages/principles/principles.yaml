  - id: P-ARCH-030
    name: apps-are-ephemeral-trials
    aliases:
      - trial-layer
      - apps-disposable
      - core-is-permanent
      - extraction-cycle
    category: architecture
    severity: critical
    statement: |
      apps/* directories are ephemeral trial artifacts — proofs-of-concept that the platform
      works. They can be deleted and recreated from apps/template/ + platform core at any time
      without losing platform value. The permanent platform core is: libs/*, tools/*,
      .claude/core-spines/*, docs/plan/pillar-0-governance/*, packages/*.
      Every reusable pattern discovered while building an app MUST be extracted to libs/
      before the session closes. The app imports from libs/ (stays thin). The pattern
      becomes permanent. The app remains disposable.
    counterweight: |
      App-specific UI, app-specific domain logic (budget categories, task labels), and
      app-specific configuration (vercel.json per app) BELONG in apps/* — these are
      not extraction candidates. Only patterns that would be duplicated in App #3,
      App #4, etc. require extraction to libs/.
    extraction_cycle:
      step_1: Trial discovers pattern — works in app/ first (prove it works)
      step_2: Extract reusable part to libs/ (make it permanent)
      step_3: App imports from libs/ (now thin and replaceable)
      step_4: Pattern survives even if app is deleted
    deletion_test: |
      At any point, deleting apps/budget-planner/ entirely should not lose platform value.
      If it would, that value is in the wrong place.
    ratified: S029
    governor_directive: |
      "Budget Planner must be treated as an external trial not affecting CSPS core.
      Apps we have now are elements to be deleted and recreated. All pointing inwards
      to enhance universal platform core." — Governor S029
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: Hard NO — B_APPS_ARE_TRIALS
      - layer: contract
        location: docs/plan/pillar-0-governance/behavioral-contracts/B_APPS_ARE_TRIALS.md
        description: B_APPS_ARE_TRIALS canonical contract
      - layer: memory
        location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/project_apps_are_trials.md
        description: Cognitive layer — survives chat moves
      - layer: ci-check
        location: tools/validators/validate-app-scope-isolation.mjs
        description: Detects platform artifacts in wrong location (week-4)
    enforcer_count: 4
    cross_references:
      - P-META-019
      - P-ARCH-028
      - B_APPS_ARE_TRIALS
    enforcement_tier:
      tier1: null
      tier2: tools/validators/validate-app-scope-isolation.mjs
      tier3: 'Apps = ephemeral trials. Delete test: if deleted, does platform lose value? If yes, extract to libs/ first.'
      permanence: medium
  - id: P-ARCH-031
    name: completion-seal
    aliases:
      - done-equals-wired
      - wiring-required-for-done
      - completion-standard
    category: architecture
    severity: critical
    statement: |
      DONE = built + wired + called + output verified.
      Never declare done on commit alone.
      A component committed but not imported anywhere = an orphan.
      A function committed but never called = an orphan.
      An integration committed but not wired into a route = an orphan.
      The done criterion must be specified BEFORE building, not discovered after.
    rationale: |
      S034 incident: OnboardingWizard built, committed, declared done.
      S036 audit: OnboardingWizard was an orphan — never called anywhere.
      The "commit = done" assumption caused 2 sessions of invisible debt.
      validate-wiring-completeness.mjs mechanically blocks this going forward.
    governing_intent: |
      Completion is determined by whether the artifact is alive in the system —
      imported, called, producing visible output — not by whether it exists on disk.
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: 'DONE standard: built + wired + called + output verified'
      - layer: validator
        location: tools/validators/validate-wiring-completeness.mjs
        description: 'LIVE S036: WIRED/DEFERRED/ORPHAN classification per exported symbol'
      - layer: validator
        location: tools/validators/validate-implementation-gate.mjs
        description: 'PIG: commits touching libs/apps reference PI-NNN (advisory S037)'
    enforcer_count: 3
    ratified: S036
    ratified_by: yariv
    cross_references:
      - P-ARCH-030
      - P-META-008
      - P-OPER-002
    enforcement_tier:
      tier1: tools/hooks/post-stop-rzf-reminder.sh
      tier2: tools/validators/validate-wiring-completeness.mjs
      tier3: DONE = built + wired + called + verified. Commit is necessary but not sufficient.
      permanence: high
  - id: P-UX-001
    name: contextual-locality
    aliases:
      - content-at-point-of-use
      - no-navigation-required
      - locality-principle
    category: operating
    severity: warn
    statement: |
      Every piece of content must appear at the point where it is needed.
      Never require navigation to apply an instruction:
      - Paste target appears UNDER the step it belongs to (not "see §X")
      - Fix instruction lives IN the error message (not "see docs")
      - Checklist lives IN the plan (not linked out)
      - Rule rationale is INLINE with the rule (not in a separate file)
      Applied to AI directives: every Opus directive is self-contained.
      Applied to validators: error messages include the fix, not just the problem.
    rationale: Governor directive S036 + communication-protocol-shared.md RULE 4.
    governing_intent: |
      Eliminate the cognitive switching cost of "go look somewhere else."
      The reader's attention is at the point of use — deliver the content there.
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: PROTOCOL Hard Rule includes locality
      - layer: contract
        location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_CONTEXTUAL_LOCALITY
        description: B_CONTEXTUAL_LOCALITY canonical contract
      - layer: validator
        location: tools/validators/validate-communication-protocol.mjs
        description: Checks Sonnet reports follow locality rule
    enforcer_count: 3
    ratified: S036
    cross_references:
