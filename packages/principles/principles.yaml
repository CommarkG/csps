  - id: P-META-010
    name: agent-alignment-protocol
    aliases:
      - AAP
      - no-wildcards
      - agent-alignment
      - mechanical-agent-discipline
    category: meta
    severity: critical
    statement: |
      Every agent (CSPS-built skill / claude-code-builtin subagent / Mastra runtime agent /
      third-party-imported skill) used in CSPS work MUST pass through the Agent Alignment Protocol
      (AAP) before invocation. NO WILDCARDS — no agent enters the system without alignment.
      AAP enforces 9 mandatory checks: identity / schema compliance / B_* contract acknowledgment /
      Quality Gate respect / capability set / trust tier / output contract / eval baseline /
      pre-flight check + alignment preamble. Class A (CSPS-built) declares via frontmatter; Class B
      (claude-code-builtin) wraps via spawn-prompt alignment preamble; Class C (Mastra) enforces
      at construction; Class D (third-party) at Quarantine→Vendored→Platform-owned promotion.
    counterweight: |
      Trivial Class B built-in invocations for one-shot lookup (single grep / single file read)
      may use abbreviated preamble (universal-required B_* subset only). The discipline targets
      INVOCATIONS WITH WORK SCOPE — agents that produce output the main session reasons over.
    industry_lineage:
      - Snyk ToxicSkills (13.4% malicious AI agent skills measured) — empirical default-deny justification
      - Anthropic Agent SDK + Sub-Agents docs — context isolation pattern
      - agents.md cross-vendor spec — preamble convention target
      - agentskills.io Class A frontmatter convention
      - CSP B_AUTONOMY_4_CONDITIONS + B_CHECKPOINT_8_CATEGORIES (CSP carry-forwards) — alignment preamble subset
      - User S005 turn 25 directive — "no agents created out of CSPS allowed... mechanically create alignment protocol"
    config:
      agent_classes:
        A_csps_built:
          source: packages/skills/<name>/SKILL.md or libs/agents/<name>
          alignment_mode: frontmatter-declaration
          preflight: csps_aligned + aap_version + acknowledged_contracts + respects_quality_gates + output_contract + trust_tier fields
        B_claude_code_builtin:
          source: harness-provided (Explore / Plan / general-purpose / claude-code-guide / statusline-setup)
          alignment_mode: spawn-prompt-alignment-preamble
