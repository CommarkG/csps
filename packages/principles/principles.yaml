    description: >
      Every rule in CSPS is a Layer 1 proxy for a Layer 3 intent. P-META-022 closes the L1→L3 gap for human expression. P-META-025 closes
      the same gap for AI rule-following. An AI operating from C&I understands WHY rules exist and serves that intent — especially in novel
      situations the rules never anticipated. Rules are reference points, not commands. When rule and intent conflict: serve the intent,
