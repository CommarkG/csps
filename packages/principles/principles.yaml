principles:
  - id: P-OP-001
    name: reuse-first
    aliases:
      - check-what-exists
    category: operating
    severity: critical
    statement: |
      Check what exists. Enhance the ratified thing. Create new only with a justification.
    counterweight: |
      Enhance the ratified thing — UNLESS the ratified thing is the wrong abstraction.
      Inline-and-redecide is always available.
    industry_lineage:
      - Andy Hunt + Dave Thomas, Pragmatic Programmer (1999) — DRY: Every piece of knowledge must have a single, unambiguous, authoritative representation
      - Sandi Metz, "The Wrong Abstraction" (2016) — "duplication is far cheaper than the wrong abstraction"
      - Kent C. Dodds — AHA: Avoid Hasty Abstractions
      - Don Roberts (via Martin Fowler, Refactoring 1999) — Rule of Three
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: 'Stated as cardinal principle #1; references /reuse-check skill'
      - layer: skill
        location: packages/skills/reuse-check/SKILL.md
        description: Slash command queries catalog, returns top-5 matches with similarity scores
      - layer: ai-prompt-addendum
        location: AGENTS.md
        description: AI MUST query catalog before proposing any artifact creation
      - layer: hook
        location: .claude/hooks/pre-tool-use-write.sh
        description: PreToolUse on Write/Edit greps catalog for similar artifacts; warns or blocks
      - layer: frontmatter-contract
        location: tools/validators/validate-frontmatter.mjs
        description: Every artifact has either `enhances:` or `created-new-because:`; CI fails if neither
      - layer: pr-bot
        location: tools/danger/check-existing-thing-considered.ts
        description: PR template includes 'Existing thing considered' field; Danger fails PR if empty on artifact-creating PRs
      - layer: ci-check
        location: libs/audits/checks/duplicate-detection.ts
        description: jscpd runs in CI with min-tokens 50, threshold 0.5%; fails on regression
      - layer: audit-metric
        location: libs/audits/checks/reuse-rate.ts
        description: Tracks % of new artifacts in last 30d with `enhances:` set vs `created-new-because:` (displayed, not gated; Goodhart)
      - layer: mcp-resource
        location: packages/principles-mcp/src/resources.ts
        description: Exposed as principles://reuse-first; queryable by any agent
      - layer: mcp-tool
        location: packages/principles-mcp/src/tools/check-reuse.ts
        description: 'Tool callable by any agent: returns existing-match candidates for a proposed artifact'
    enforcer_count: 10
    cross_references:
      - P-OP-002
      - P-OP-003
      - P-OP-004
      - P-META-001
    anti_patterns:
      - god-objects (incremental "enhance existing" without splitting)
      - wrong-abstraction lock-in (Metz)
      - frankenstein-components (flags-on-flags)
      - coupling-growth (every reuse couples another caller)
