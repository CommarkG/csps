    counterweight: |
      Single-word or trivial conversational prompts ("ok", "thanks", "yes", "go") may use
      abbreviated GP entries (just timestamp + verbatim + status: confirmation; distribution
      targets may be null). The discipline targets SUBSTANTIVE prompts — directives, decisions,
