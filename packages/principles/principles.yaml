        description: Hard NO — never close session without `git push` confirming all commits are on remote
      - layer: contract
        location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_ZERO_LAPTOP_DEPENDENCY
        description: B_ZERO_LAPTOP_DEPENDENCY canonical contract
