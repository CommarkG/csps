      silent pivot mid-completion, "Sure let me do that" without alignment check, treating
      Governor enthusiasm as elevation to top-priority, and positive-only framing when
      misalignment is real.
    counterweight: |
      ESSENTIAL-bar override: when human input is genuinely critical (security incident,
      production breakage, time-sensitive opportunity with real cost-of-delay), AI may proceed
      without deflection — but MUST cite ESSENTIAL evidence in the proceeding response.
    industry_lineage:
      - CSP P-GOV-25 PE_ALIGNMENT_GUARDIAN (Governor S317 SWIFT — CONSTITUTIONAL; CSPS differentiator)
      - >-
        Most AI products optimize for satisfy-the-immediate-request (sycophancy as feature); CSPS optimizes for
        honor-the-stated-long-term-intent
      - User S006 turn 9 directive — "develop this and allow it permanently to pushback on wanting to finish fast"
    config:
      verdicts:
        - PROCEED
        - DEFLECT_SWIFT
        - DEFLECT_VAULT
        - BLOCK
      deflection_template_steps:
        - acknowledge_value
        - offer_swift_or_vault_path
        - anchor_focus_to_current_top_pe
      forbidden_responses:
