        applies_to: every rule / principle / definition being authored or ratified
        source: ux-ui-doctrine-S072.md §Rigidness Test — R1 verdict PROTO-S073-M1-CLOSE-AND-M3 (OPUS-15 S073)
        note: NOT a new principle — wired UNDER P-META-028 per new-over-active discipline (OPUS-15 S072 ratification verdict R1)
