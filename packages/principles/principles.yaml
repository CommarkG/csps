  - id: P-OP-003
    name: pcr
    aliases:
      - PCR
      - pros-cons-recommendation
    category: operating
    severity: warn
    statement: |
      When presenting decisions, use **P**ros, **C**ons, & **R**ecommendation format.
      Present the option set + trade-offs + recommended path as a chunked decision package.
    scope_note: |
      Apply to decisions with non-trivial trade-space.
      For trivial reversible choices (two-way doors at low cost), just decide.
    industry_lineage:
      - MADR (Markdown Architectural Decision Records) — Considered Options + Pros/Cons + Decision Outcome (the structural ancestor)
      - BLUF (Bottom Line Up Front) — US Army Regulation 25-50 (2001) — recommendation-first communication
      - John Sweller, Cognitive Load Theory (1988) — chunking for decisions; working memory ~4 chunks
      - Amazon 6-pager / PR-FAQ (Bezos 2004) — narrative trade-space document
      - McKinsey Rule of Three — structuring recommendations as exactly three MECE alternatives
    format_spec: >
      A PCR has three blocks in this order:

      1. **Options** — table or bulleted list of N alternatives (typically 2–4)

      2. **Pros / Cons** — per-option trade-offs (table format preferred)

      3. **Recommendation** — chosen option + one-paragraph reasoning naming the load-bearing factor + "what would flip the recommendation"
      clause
    triggers:
      fire_patterns:
        - 'phrase: should we... / should I...'
        - 'phrase: X vs Y / which option / decide between'
        - 'header containing options: / alternatives: / approaches: / paths:'
        - 2+ alternatives with non-trivial trade-space
        - architectural forks (framework / schema / protocol selection)
        - scope choices (this-session vs next / carry-forward vs in-flight / defer vs ship)
        - tool / library selection
        - migration strategies
        - phasing decisions
      skip_patterns:
        - variable naming when both names clear
        - comment phrasing
        - file location when both paths obviously valid
        - color choices in draft
        - single-option presentations (no trade-space)
      skip_requires_explicit_note: true
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: 'Cardinal principle #3; default format for decision-shaped questions'
      - layer: instruction-file
        location: AGENTS.md
        description: Hard NO — never present non-trivial decision without PCR 3-block (S005 turn 5)
      - layer: skill
        location: packages/skills/pcr/SKILL.md
        description: Slash command /pcr <topic> produces canonical 3-block output
      - layer: ai-prompt-addendum
        location: AGENTS.md
        description: Decision-shaped questions trigger PCR by default; trivial reversible choices skip it
      - layer: mcp-resource
        location: packages/principles-mcp/src/resources.ts
        description: Exposed as principles://pcr with format spec for any agent
      - layer: contract
        location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_PCR_FOR_DECISIONS
        description: B_PCR_FOR_DECISIONS canonical contract — strengthens P-OP-003 to mechanical (S005 turn 5)
      - layer: memory
        location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_pcr_for_decisions.md
        description: Cognitive layer; loaded at session-start (S005 turn 5)
      - layer: frontmatter-contract
        location: docs/plan/_handoff/VAULT/closing-summary-template.md#§10.13d
        description: Mandatory header — every non-trivial decision presented this session enumerated with PCR-3-block check (S005 turn 5)
      - layer: ci-check
        location: libs/audits/checks/pcr-completeness-on-decisions.ts
        description: Stop-hook scan for trigger-phrases without paired 3-block; PR-blocking warn (planned week 4)
      - layer: hook
        location: .claude/hooks/post-stop-pcr-check.sh
        description: Stop-hook output scan for decision-presenting language without PCR blocks (planned week 4)
      - layer: hook
        location: .claude/hooks/user-prompt-submit-pcr-reminder.sh
        description: UserPromptSubmit reminder when user message contains decision-asking patterns (planned week 4)
      - layer: ai-behavior-spine
        location: docs/plan/pillar-0-governance/ai-behavior-spine.md
        description: 'Discipline matrix row updated S005 turn 5: 2/5 declared 1/5 mechanical → 5/5 declared 3/5 mechanical'
    enforcer_count: 12
    cross_references:
      - P-OP-004
      - P-META-007
    anti_patterns:
      - recommendation-without-options (no trade-space exposed; reader can't evaluate)
      - options-without-recommendation (analysis paralysis; decision punted back)
      - false-balance (pros/cons rigged to support a predetermined recommendation)
      - recommendation-before-pros-cons (BLUF violation; AGENTS.md hard NO
      - symmetric-pros-cons (lazy framing; "A fast / B slow + B correct / A wrong" signals missing axis)
      - silent-skip (judging "trivial-reversible" without stating the skip + reason; reader can't audit)
      - recommendation-without-load-bearing-factor (opaque decision; future review can't reconstruct rationale)
      - missing-what-would-flip-clause (silent-criteria-shift later is undetectable)
    enforcement_tier:
      tier1_hook: AGENTS.md enforcement + session-open.sh guidance (behavioral level)
      tier2_validator: pnpm verify full-pass (indirect coverage via contract validators)
      tier3_session: AGENTS.md hard-NO + session-open.sh principle injection
  - id: P-OP-004
    name: batched-execution
    aliases:
      - acceptance-criteria-batched-execution
      - mission-command-batching
    category: operating
    severity: warn
    statement: |
      For N similar units of work: agree acceptance criteria upfront, batch the execution,
      deliver a single comprehensive completion summary. No mechanical micro-stops.
    industry_lineage:
      - >-
        Mission Command (Auftragstaktik) — Prussian/German military doctrine; NATO keystone — commander's intent + decentralized execution +
        trust + mutual understanding
      - Scrum — Definition of Done + acceptance criteria; agreement before execution starts
      - Bezos (Amazon) — two-way doors: reversible decisions don't need escalation
      - Lean / Kanban — pull-based work (executor pulls when ready)
      - GitLab handbook — async-first, batched-review pattern
    config:
      threshold_n: 3
      max_batch_size: 25
      escape_hatch_required: true
    escape_hatch: |
      When the executor mid-batch discovers acceptance criteria were wrong, pause + re-confirm with user.
      Do NOT silently adjust scope. Mission Command "disciplined initiative" applies.
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: 'Cardinal principle #4; explicit workflow for N≥3 similar operations'
      - layer: skill
        location: packages/skills/batched-plan/SKILL.md
        description: Slash command /batched-plan structures the upfront-acceptance proposal
      - layer: hook
        location: .claude/hooks/pre-tool-use-batch-detect.sh
        description: Detects N similar pending operations; prompts to consolidate into batched-acceptance flow
      - layer: ai-prompt-addendum
        location: AGENTS.md
        description: 'AI explicitly instructed: detect N>1 → propose criteria once → batch → single summary'
    enforcer_count: 4
    cross_references:
      - P-OP-002
      - P-OP-003
    anti_patterns:
      - micro-approval-drag (per-item approval requests; ~20-40% velocity loss per Code Climate research)
      - silent-scope-creep (mid-batch adjustments without re-confirmation)
      - batch-too-large (N > max_batch_size without intermediate checkpoint)
    enforcement_tier:
      tier1_hook: AGENTS.md enforcement + session-open.sh guidance (behavioral level)
      tier2_validator: pnpm verify full-pass (indirect coverage via contract validators)
      tier3_session: AGENTS.md hard-NO + session-open.sh principle injection
  - id: P-OP-006
    name: completion-priority-dpr
    aliases:
      - demonstration-priority-rating
      - dpr
      - completion-priority-pe-rule
    category: operating
    severity: warn
    statement: |
      New inputs arriving during active implementation receive a Demonstration Priority Rating
      (DPR 1-5) before any response. Only Rating 3-5 justifies interrupting active work.
      Rating 1 (cosmetic) = defer. Rating 2 (20%+ improvement) = defer to next gate.
      Rating 3 (prevents bug in current build) = interrupt at next atomic boundary.
      Rating 4 (security/data loss in current work) = interrupt immediately.
      Rating 5 (wrong foundation) = stop, do not commit, redesign.
      The completion bias (P-OP-002) is the default; DPR overrides it only at Rating 3-5.
    governing_intent: |
      Completion is the highest-PE activity for in-flight work. Every interruption
      costs context and increases the risk of incomplete artifacts. DPR makes the
      interrupt/defer decision explicit rather than leaving it to AI impulse.
    rationale: >-
      Governor directive S030 + Opus Turn 35. P-OP-002 (completion bias) is the default; DPR is the structured override gate. Without DPR,
      new inputs that are cosmetically interesting but not blocking get processed immediately, fragmenting the implementation session.
    dpr_scale:
      rating_1: Cosmetic / stylistic — defer always. Add to raw-thoughts-queue.
      rating_2: Reduces implementation by 20%+ — defer to next milestone gate.
      rating_3: Prevents a bug in current work — interrupt at next atomic boundary.
      rating_4: Security vulnerability or data loss — interrupt immediately.
      rating_5: Wrong foundation — stop, redesign, file SROF.
    dpr_formula: Effective_PE(new_input) = Base_PE × DPR_multiplier (1→0.5, 2→1.0, 3→2.0, 4→∞, 5→∞)
    dpr_test: >-
      If I continue building without this input, what is the worst-case outcome? Embarrassing=defer. Broken=Rating3+.
      Catastrophic=Rating4-5.
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: 'Hard NO — DPR rule: rate 1-5, defer unless 3-5'
      - layer: contract
        location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_PE_ALIGNMENT_GUARDIAN
        description: B_PE_ALIGNMENT_GUARDIAN amendment — DPR scale
    enforcer_count: 2
    ratified: S031
    cross_references:
      - P-OP-002
      - P-OP-003
      - P-OP-004
      - B_PE_ALIGNMENT_GUARDIAN
      - B_COMPLETION_OVER_SHINY
    enforcement_tier:
      tier1_hook: AGENTS.md enforcement + session-open.sh guidance (behavioral level)
      tier2_validator: pnpm verify full-pass (indirect coverage via contract validators)
      tier3_session: AGENTS.md hard-NO + session-open.sh principle injection
  - id: P-OP-007
    name: optimal-path-default
    aliases:
      - no-rush
      - depth-over-velocity
      - long-term-quality
      - quality-over-speed
    category: operating
    severity: warn
    statement: |
      We have time and resources. The default is the OPTIMAL PATH, not the fastest path.
      Long-term consistency and top-level quality are the governing constraints.
      Speed is a secondary optimization — pursued only after quality is secured.
    governing_intent: |
      This principle exists because AI systems (and developers under pressure) default to
      the fastest visible path. In CSPS, we are building a platform for decades, not a demo
      for tomorrow. Rushing produces technical debt, governance gaps, and re-work.
      The optimal path may look slower at turn 10 but is always faster by session 100.
    counterweight: |
      This is NOT "never ship." It is "ship complete, not fast."
      When MVP is explicitly declared, velocity is appropriate.
      The counterweight: do not use this principle to justify analysis paralysis.
      "Complete" means the work passes its ZF gate and serves its stated intent — not "perfect."
    where_this_applies:
      - 'PROTO design: Opus defaults to thorough design over fast design'
      - 'Session planning: no artificial deadline on session close'
      - 'Planning wizard Section 3 (scope boundary): default appetite is SMALL/conservative'
      - 'PE engine: long-term quality items weighted higher than speed items'
      - 'Every HANDOFF: no pressure to compress Zone B; full intent documented'
      - 'Iteration feedback: each cycle adds value; do not skip cycles to save turns'
    where_it_was_missing:
      - session-open.sh had no 'we have time' injection (added S051)
      - PROTO format had no default appetite reminder
      - csps-context.md had no explicit quality-over-velocity statement
      - Planning wizard Section 3 had no default 'small' enforcement
    session_injection: |
      "This session has no artificial deadline. The default posture is: optimal path over
       fastest path. Take the depth-3 option before the depth-1 option. Quality gates are
       not obstacles — they are the evidence that work is actually done."
    industry_lineage:
      - Jeff Bezos — "We are willing to be misunderstood for long periods of time" (long-term thinking)
      - Warren Buffett — "No matter how great the talent or efforts, some things take time"
      - Donald Knuth — "Premature optimization is the root of all evil"
      - Kent Beck — "Make it work, make it right, make it fast" (in that order)
      - CSPS platform-insights.yaml — "exit_code=0 is evidence of validity, not completeness"
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: 'Behavioral mandate: optimal path default — folded into quality section (S051)'
      - layer: session-open
        location: .claude/hooks/session-open.sh
        description: 'T3 injection: ''this session has no artificial deadline'' (S051)'
      - layer: principle-file
        location: tools/council/csps-context.md
        description: 'Pattern #7 in RATIFIED PATTERNS section (S051)'
    enforcer_count: 3
    ratified: S051
    cross_references:
      - P-OP-002
      - P-OP-006
      - B_HUMBLE_EXECUTION_PIPELINE
      - B_COMPLETION_OVER_SHINY
      - B_GRADUAL_BUILD_BY_FOUNDATIONS
  - id: P-OP-008
    name: completion-before-new
    aliases:
      - completion-before-new-principle
      - fwws-mechanical-arm
      - active-plan-first
    title: Completion-Before-New — Active Plan Completes Before New Things Start
    description: >
      The active plan (incomplete milestones) completes (or reaches a clean checkpoint) before a new plan starts. New intent arising
      mid-plan routes through threshold-router.mjs → vault/PI → PE-sized → future plan. Never injected into the active plan. Prevents false
      efficiency: chasing new ideas mid-flight stresses context, leaves partial implementations, and breaks completion metrics. Consolidates
      P-OP-002 FWWS + Long-Run M0.7 + SPI batch-sizing + the Opus-authors-hard-parts / Sonnet-runs-autonomous cadence. Source:
      COMPLETION-DISCIPLINE-PLAN-S073.md + Governor S073 directive.
    spine: GVRN
    layer: L1
    category: operating-principles
    severity: critical
    governing_intent: >
      Completion = conversion, not activity. An unfinished plan is a floater. New ideas earn their place in the NEXT plan, not the current
      one. The threshold is the front door; everything else is disruption.
    composes_with:
      - P-OP-002
      - P-META-030
      - P-META-019
    enforcement_tier:
      tier1_hook: pre-tool-use-completion-before-new.sh (advisory on new-item-into-active-plan-without-threshold)
      tier2_validator: validate-completion-before-new.mjs (STANDARD — scans for open PROTOs + injected items)
      tier3_session: session-open injection of active-plan-first reminder + CADENCE-AUDIT in milestone reports
    ratified_by: Governor S073 (OPUS-15 directed) — COMPLETION-DISCIPLINE-PLAN-S073.md
    ratified_date: '2026-05-31'
    session: S073
    self_check_q: |
      "Is there an OPEN active plan (unchecked milestones)? If yes, does this new intent
       route through the threshold to a future plan — or am I about to disrupt the active plan?
       Did Opus author the hard parts up front? Can I run autonomously without nominal stops?"
    note: >-
      ID confirmed as P-OP-008 (S074 active). Governor may reassign if it becomes P-OP-002 mechanical arm — currently standalone. T3
      session-open injection wired S074.
