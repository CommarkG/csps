      - layer: ci-check
        location: libs/audits/checks/principle-count-staleness.ts
        description: >-
          Greps for hardcoded principle-count text (e.g. 'N meta-principles', 'P-META-001 through P-META-NNN', 'N operating principles',
          'P-OP-001 through P-OP-NNN') in active prose; compares against current `^  - id: P-META-` and `^  - id: P-OP-` row counts in
          principles.yaml; warn on drift; lists offending lines. Exempts snapshot/historical files via audit_exempt_paths (HANDOFF-S*.md,
          qc-audit-results-S*.md, validation-pass-S*.md, chat-jump-prompt-*.md, principles-snapshot.md). Registered S005 turn 8 per ADR-0022
          K=2 auto-ADR; build deferred week-4.
    enforcer_count: 4
    cross_references:
