  - id: P-ARCH-021
    name: ratchet-pattern
    category: architecture
    severity: error
    statement: "Don't try to fix existing files. Block any change that makes a complexity/size metric worse on the diff. New code obeys; old code only gets cleaned when it's touched."
    enforcers:
      - { layer: ci-check, location: ".github/workflows/audit-pr.yml", description: "eslint --max-warnings 0 against changed files only" }
      - { layer: pre-commit, location: ".husky/pre-commit (lint-staged)", description: "Same checks on staged files" }
      - { layer: ci-check, location: "libs/audits/checks/file-size-ratchet.ts", description: "File size cannot regress on diff" }
      - { layer: ci-check, location: "libs/audits/checks/cognitive-complexity.ts", description: "Function complexity cannot regress on diff" }
    enforcer_count: 4
    cross_references: [P-ARCH-022]

