      - communication-protocol-shared.md
    enforcement_tier:
      tier1: null
      tier2: tools/validators/validate-communication-protocol.mjs
      tier3: Content at point of use. No 'see §X'. Paste target inline under the step it belongs to.
      permanence: medium
  - id: P-UX-002
    name: zero-context-assumption
    aliases:
      - ZCA
      - boundary-context-zero
      - who-what-how-now
      - cross-boundary-completeness
    category: operating
    severity: warn
    statement: |
      Every communication crossing a boundary assumes the receiver has zero prior context.
      Provide WHO/WHAT/HOW/NOW inline before any task context.
      WHO: who is the sender, who is the receiver, what roles they play.
      WHAT: what is the project/system, what technology, what purpose.
      HOW: how the collaboration works, communication rules, the pattern.
      NOW: current state, what's active, what's next, the concrete action.
      Test: could someone with no background understand this completely?
      If no → the boundary is not crossed correctly.
      Applies to: tab transfers, SROFs, API responses, EKEP exchanges, any cross-boundary message.
    rationale: |
      Every cross-boundary communication failure in CSPS traced to assumed shared context.
      S036 incident: chat-jump to new Sonnet assumed knowledge of OPUS-2, CSPS, S036, 3-party
      triangle. Governor caught it. ZCA closes the gap at ALL boundary types permanently.
    governing_intent: |
      The receiver is always a stranger until proven otherwise. Eliminate assumed context at
      every boundary — the test is standalone comprehension, not sender's intent.
    enforcers:
      - layer: instruction-file
        location: AGENTS.md
        description: ZCA Hard Rule under Communication boundaries
      - layer: protocol
        location: tools/council/communication-protocol-shared.md
        description: Rule 7 — Zero-Context Assumption
      - layer: inner-default
        location: docs/plan/_handoff/VAULT/inner-ai-defaults/boundary-assumptions.md
        description: 'ZCA override entry: boundary-context-assumption'
      - layer: template
        location: docs/plan/_handoff/VAULT/templates/ai-transfer-template.md
        description: WHO/WHAT/HOW/NOW transfer template
    enforcer_count: 4
    ratified: S036
    ratified_at: '2026-05-16'
    ratified_by: yariv
    cross_references:
      - P-UX-001
      - P-META-014
      - communication-protocol-shared.md
      - boundary-assumptions.md
    enforcement_tier:
      tier1: null
      tier2: tools/validators/validate-boundary-alignment.mjs
      tier3: 'ZCA: every cross-boundary message starts with WHO/WHAT/HOW/NOW. Receiver starts from zero.'
      permanence: medium
  - id: P-OPER-001
    name: zero-laptop-dependency
    aliases:
      - git-canonical
      - multi-machine-parity
      - android-accessible
      - auto-push-at-session-close
    category: operations
    severity: critical
    statement: |
      Every CSPS artifact lives in cloud-canonical (Git remote) before any session closes;
      no work depends on a single physical machine; multi-device + Android workflows are
      first-class supported paths. Hybrid mode (Q-1 ratified S006 turn 8): Git canonical +
      GitHub Codespaces on-demand + Android read-mostly via GitHub mobile + Chromium.
      Auto-push enforced at session-close gate (Q-2 ratified S006 turn 8 — composes with
      HPFA + pre-close verify). Multi-machine parity via devcontainer.json + bootstrap.ps1.
    counterweight: |
      Pre-close auto-push gate (B option) is the discipline; commit-time auto-push (A option)
      was rejected as too aggressive. Local commits OK during session; push must clear before
      handoff write. Secrets stay in 1Password/Bitwarden — NOT in repo.
    industry_lineage:
      - GitOps (Weaveworks 2017) — git as source of truth; reconciliation loop
      - GitHub Codespaces / Gitpod — cloud-dev replacing per-machine setup
      - 12-factor app methodology — config in env, code in repo
      - User S006 turn 8 directive — "0 dependency on my laptop; work from other computers + remote from android"
    config:
      hybrid_mode_components:
        local_dev: laptop with bootstrap.ps1
        cloud_dev: GitHub Codespaces via .devcontainer/devcontainer.json
        android_read: GitHub mobile app + GitHub web
        android_edit: Codespaces in Chromium (small-screen-OK)
      auto_push_mode: session-close-gate (B; not commit-time A)
      multi_machine_parity_required: pnpm + node versions match across devcontainer + bootstrap.ps1
      no_local_only_secrets: true
      secret_storage: 1Password or Bitwarden (NOT in repo)
    enforcers:
