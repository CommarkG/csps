# ============================================================================
# CSPS Principles Registry
# ============================================================================
# THIS FILE IS THE SINGLE SOURCE OF TRUTH FOR ALL PRINCIPLES IN CSPS.
#
# Downstream artifacts are GENERATED from this file via `pnpm principles:codegen`:
#   - AGENTS.md (root)                              — AI instruction surface
#   - .vale/styles/CSPS/principles.txt              — prose lint
#   - eslint-config-csps/principle-rules.js         — code lint
#   - .claude/hooks/*.sh                            — runtime AI blocks
#   - packages/skills/*/SKILL.md                    — invokable AI behaviors
#   - packages/principles-mcp/src/resources.ts      — MCP resource definitions
#   - libs/audits/checks/principle-coverage.ts      — meta-audit (every principle has enforcers)
#   - docs/plan/pillar-0-governance/principles.md   — human reference
#
# Edit this file, regenerate, commit both. CI fails on any drift between source and generated output.
# ============================================================================

apiVersion: csps.dev/v1
kind: PrinciplesRegistry
version: 1.0.0
generated_at: 2026-05-01
owner: group:finky
license: internal-only
lifecycle_state: active                # P-META-004 stewardship state — registry-wide active

# ============================================================================
# CATEGORIES
# ============================================================================
categories:
  - id: meta
    name: Meta-Principles
    description: How we work; principles about principles themselves; enforcement architecture
  - id: operating
    name: Operating Principles
    description: Cognitive-load-aware human-AI collaboration patterns (FWWS, PCR, reuse-first, batched execution)
  - id: architecture
    name: Architecture Principles
    description: How CSPS itself is built (the 27 architectural rules)

# ============================================================================
# SEVERITY → DEFENSE-IN-DEPTH ENFORCER COUNTS
# ============================================================================
# Every principle must have ≥ N independent mechanical enforcers based on severity.
# The AI layer (instruction-file, ai-prompt-addendum) counts but is treated as the LEAST reliable.
# Critical principles need at least one non-AI enforcer.
severity_enforcer_minimums:
  critical: 4   # at least 4 enforcers, at least 2 must be non-AI
  error:    3   # at least 3 enforcers, at least 1 must be non-AI
  warn:     2
  info:     1

# Recognized enforcer layers (closed enum; new layers require principle P-META-001 update + ADR)
enforcer_layers:
  - instruction-file       # AGENTS.md, CLAUDE.md, .cursor/rules/*.mdc
  - skill                  # packages/skills/<name>/SKILL.md (invokable AI behavior)
  - ai-prompt-addendum     # in CLAUDE.md, agent system prompts
  - hook                   # Claude Code PreToolUse/PostToolUse/Stop hooks
  - pre-commit             # husky / lefthook git hooks
  - pr-bot                 # Danger.js
  - ci-check               # GitHub Actions running audit-runner
  - frontmatter-contract   # Zod-validated frontmatter (validate-frontmatter.mjs)
  - eslint-rule            # custom ESLint rule
  - nx-tag-rule            # @nx/enforce-module-boundaries with tag depConstraints
  - opa-policy             # OPA/Rego policy on config files
  - zenstack-policy        # ZenStack @@allow / @@deny in ZModel
  - audit-metric           # libs/audits/checks/* (displayed, not gated)
  - scorecard              # Backstage-style scorecard fact (trend over time)
  - mcp-resource           # exposed via packages/principles-mcp
  - mcp-tool               # callable MCP tool that consults policy before acting
  - generator-prompt       # nx g <generator> catalog-first UX
  - meta-audit             # audit-the-audits check
  - generator              # the artifact IS generated, encoding the principle

# ============================================================================
# PRINCIPLES
# ============================================================================
principles:

  # ==========================================================================
  # OPERATING PRINCIPLES (4 fully-defined)
  # ==========================================================================

  - id: P-OP-001
    name: reuse-first
    aliases: [check-what-exists]
    category: operating
    severity: critical
    statement: |
      Check what exists. Enhance the ratified thing. Create new only with a justification.
    counterweight: |
      Enhance the ratified thing — UNLESS the ratified thing is the wrong abstraction.
      Inline-and-redecide is always available.
    industry_lineage:
      - Andy Hunt + Dave Thomas, Pragmatic Programmer (1999) — DRY: "Every piece of knowledge must have a single, unambiguous, authoritative representation"
      - Sandi Metz, "The Wrong Abstraction" (2016) — "duplication is far cheaper than the wrong abstraction"
      - Kent C. Dodds — AHA: "Avoid Hasty Abstractions"
      - Don Roberts (via Martin Fowler, Refactoring 1999) — Rule of Three
    enforcers:
      - { layer: instruction-file,     location: "AGENTS.md",                                      description: "Stated as cardinal principle #1; references /reuse-check skill" }
      - { layer: skill,                location: "packages/skills/reuse-check/SKILL.md",           description: "Slash command queries catalog, returns top-5 matches with similarity scores" }
      - { layer: ai-prompt-addendum,   location: "AGENTS.md",                                      description: "AI MUST query catalog before proposing any artifact creation" }
      - { layer: hook,                 location: ".claude/hooks/pre-tool-use-write.sh",            description: "PreToolUse on Write/Edit greps catalog for similar artifacts; warns or blocks" }
      - { layer: frontmatter-contract, location: "tools/validators/validate-frontmatter.mjs",      description: "Every artifact has either `enhances:` or `created-new-because:`; CI fails if neither" }
      - { layer: pr-bot,               location: "tools/danger/check-existing-thing-considered.ts", description: "PR template includes 'Existing thing considered' field; Danger fails PR if empty on artifact-creating PRs" }
      - { layer: ci-check,             location: "libs/audits/checks/duplicate-detection.ts",       description: "jscpd runs in CI with min-tokens 50, threshold 0.5%; fails on regression" }
      - { layer: audit-metric,         location: "libs/audits/checks/reuse-rate.ts",                description: "Tracks % of new artifacts in last 30d with `enhances:` set vs `created-new-because:` (displayed, not gated; Goodhart)" }
      - { layer: mcp-resource,         location: "packages/principles-mcp/src/resources.ts",        description: "Exposed as principles://reuse-first; queryable by any agent" }
      - { layer: mcp-tool,             location: "packages/principles-mcp/src/tools/check-reuse.ts", description: "Tool callable by any agent: returns existing-match candidates for a proposed artifact" }
    enforcer_count: 10
    cross_references: [P-OP-002, P-OP-003, P-OP-004, P-META-001]
    anti_patterns:
      - god-objects (incremental "enhance existing" without splitting)
      - wrong-abstraction lock-in (Metz)
      - frankenstein-components (flags-on-flags)
      - coupling-growth (every reuse couples another caller)
      - conway-violating reuse (forcing two services that should be independent to share)
      - premature-graduation-conflict (CSPS apps depending on platform internals)

  - id: P-OP-002
    name: finish-what-we-started
    aliases: [FWWS]
    category: operating
    severity: critical
    statement: |
      Finish What We Started. Resist drift to new work while in-flight work is incomplete.
    counterweight: |
      Unless completing creates more debt than abandoning. Park threads explicitly with stated reason —
      do not leave them silently in-flight.
    industry_lineage:
      - David J. Anderson, Kanban (2010) — "Stop Starting, Start Finishing"; WIP limits as enabling constraint
      - Eliyahu Goldratt, The Goal (1984) — Theory of Constraints; finish bottleneck before adding more
      - Scrum — Definition of Done as completion contract
      - Lean / Toyota — single-piece flow
      - Cal Newport, Deep Work — completion under sustained attention; "shiny object" as the enemy
    config:
      max_in_flight_slices: 3
      max_in_flight_apps: 2
      stale_threshold_days: 14
      park_requires_reason: true
    enforcers:
      - { layer: instruction-file, location: "AGENTS.md",                                          description: "Stated as cardinal principle #2; references /wip-check skill" }
      - { layer: skill,            location: "packages/skills/wip-check/SKILL.md",                  description: "Slash command queries in-flight ledger; reports threshold status" }
      - { layer: hook,             location: ".claude/hooks/pre-tool-use-new-slice.sh",             description: "PreToolUse blocks new slice creation if WIP exceeds threshold; offers /wip-check or explicit park" }
      - { layer: pre-commit,       location: ".husky/pre-commit (lefthook)",                        description: "Blocks commits that add new slices/apps when WIP exceeded" }
      - { layer: pr-bot,           location: "tools/danger/check-wip-limit.ts",                     description: "Comments on PR if violation slipped through" }
      - { layer: ci-check,         location: "libs/audits/checks/wip-limit.ts",                     description: "Hard-fails build if WIP exceeded" }
      - { layer: scorecard,        location: "libs/audits/scorecards/wip-trend.ts",                 description: "WIP count per app, trend over time, displayed in admin dashboard" }
      - { layer: mcp-resource,     location: "packages/principles-mcp/src/resources.ts",            description: "Exposed as principles://fwws; in-flight ledger as principles://wip-ledger" }
    enforcer_count: 8
    cross_references: [P-OP-001, P-OP-004, P-META-001]
    anti_patterns:
      - perpetual-pivot (start everything, finish nothing — Goldratt's bottleneck collapse)
      - silent-park (threads abandoned without explicit park + reason)
      - shiny-object-syndrome (new work always preferred to in-flight closure)

  - id: P-OP-003
    name: pcr
    aliases: [PCR, pros-cons-recommendation]
    category: operating
    severity: warn
    statement: |
      When presenting decisions, use **P**ros, **C**ons, & **R**ecommendation format.
      Present the option set + trade-offs + recommended path as a chunked decision package.
    scope_note: |
      Apply to decisions with non-trivial trade-space.
      For trivial reversible choices (two-way doors at low cost), just decide.
    industry_lineage:
      - MADR (Markdown Architectural Decision Records) — Considered Options + Pros/Cons + Decision Outcome (the structural ancestor)
      - BLUF (Bottom Line Up Front) — US Army Regulation 25-50 (2001) — recommendation-first communication
      - John Sweller, Cognitive Load Theory (1988) — chunking for decisions; working memory ~4 chunks
      - Amazon 6-pager / PR-FAQ (Bezos 2004) — narrative trade-space document
      - McKinsey Rule of Three — structuring recommendations as exactly three MECE alternatives
    format_spec: |
      A PCR has three blocks in this order:
      1. **Options** — table or bulleted list of N alternatives (typically 2–4)
      2. **Pros / Cons** — per-option trade-offs (table format preferred)
      3. **Recommendation** — chosen option + one-paragraph reasoning + open questions
    enforcers:
      - { layer: instruction-file, location: "AGENTS.md", description: "Cardinal principle #3; default format for decision-shaped questions" }
      - { layer: skill,            location: "packages/skills/pcr/SKILL.md", description: "Slash command /pcr <topic> produces canonical 3-block output" }
      - { layer: ai-prompt-addendum, location: "AGENTS.md", description: "Decision-shaped questions trigger PCR by default; trivial reversible choices skip it" }
      - { layer: mcp-resource,     location: "packages/principles-mcp/src/resources.ts", description: "Exposed as principles://pcr with format spec for any agent" }
    enforcer_count: 4
    cross_references: [P-OP-004]
    anti_patterns:
      - recommendation-without-options (no trade-space exposed; reader can't evaluate)
      - options-without-recommendation (analysis paralysis; decision punted back)
      - false-balance (pros/cons rigged to support a predetermined recommendation)

  - id: P-OP-004
    name: batched-execution
    aliases: [acceptance-criteria-batched-execution, mission-command-batching]
    category: operating
    severity: warn
    statement: |
      For N similar units of work: agree acceptance criteria upfront, batch the execution,
      deliver a single comprehensive completion summary. No mechanical micro-stops.
    industry_lineage:
      - Mission Command (Auftragstaktik) — Prussian/German military doctrine; NATO keystone — commander's intent + decentralized execution + trust + mutual understanding
      - Scrum — Definition of Done + acceptance criteria; agreement before execution starts
      - Bezos (Amazon) — two-way doors: reversible decisions don't need escalation
      - Lean / Kanban — pull-based work (executor pulls when ready)
      - GitLab handbook — async-first, batched-review pattern
    config:
      threshold_n: 3                    # 3+ similar operations triggers batched mode
      max_batch_size: 25                # cap before mid-checkpoint suggested
      escape_hatch_required: true
    escape_hatch: |
      When the executor mid-batch discovers acceptance criteria were wrong, pause + re-confirm with user.
      Do NOT silently adjust scope. Mission Command "disciplined initiative" applies.
    enforcers:
      - { layer: instruction-file, location: "AGENTS.md",                                       description: "Cardinal principle #4; explicit workflow for N≥3 similar operations" }
      - { layer: skill,            location: "packages/skills/batched-plan/SKILL.md",            description: "Slash command /batched-plan structures the upfront-acceptance proposal" }
      - { layer: hook,             location: ".claude/hooks/pre-tool-use-batch-detect.sh",       description: "Detects N similar pending operations; prompts to consolidate into batched-acceptance flow" }
      - { layer: ai-prompt-addendum, location: "AGENTS.md",                                     description: "AI explicitly instructed: detect N>1 → propose criteria once → batch → single summary" }
    enforcer_count: 4
    cross_references: [P-OP-002, P-OP-003]
    anti_patterns:
      - micro-approval-drag (per-item approval requests; ~20-40% velocity loss per Code Climate research)
      - silent-scope-creep (mid-batch adjustments without re-confirmation)
      - batch-too-large (N > max_batch_size without intermediate checkpoint)

  # ==========================================================================
  # ARCHITECTURE PRINCIPLES (27 — STUBS; full content + enforcer maps migrated during pillar-1 migration)
  # ==========================================================================

  - id: P-ARCH-001
    name: nothing-stands-alone
    category: architecture
    severity: critical
    statement: "Every artifact lives in exactly one slice. The slice owns DB + admin + customer + tests + audit."
    status: stub
    migration_target: docs/plan/pillar-0-governance/architecture-principles.md (principle 1)

  - id: P-ARCH-002
    name: mechanical-over-procedural
    category: architecture
    severity: critical
    statement: "Every rule that matters is enforced by a linter, CI gate, generator, or runtime check. Rules in a README rot."
    status: stub
    migration_target: docs/plan/pillar-0-governance/architecture-principles.md (principle 2)

  - id: P-ARCH-003
    name: files-are-truth-db-is-index
    category: architecture
    severity: critical
    statement: "Skills/agents/plugins/catalog live in the monorepo as files; Payload + Postgres mirror them for fast querying and admin UX. Files always win on conflict."
    status: stub

  - id: P-ARCH-004
    name: one-source-of-truth-per-concern
    category: architecture
    severity: critical
    statement: "ZModel = schema. Glossary = vocabulary. Stripe = entitlements. Catalog = artifacts. Principles.yaml = principles. No concern has two homes."
    status: stub

  - id: P-ARCH-005
    name: three-layer-composition-only
    category: architecture
    severity: error
    statement: "Tools (leaves) → Skills (use tools + sub-agents) → Agents (use skills, tools, other agents through named supervisor). Skill→skill calls forbidden at registry level."
    enforcers:
      - { layer: eslint-rule, location: "tools/validators/eslint-rules/no-skill-to-skill-import.ts", description: "Skills cannot import other Skills" }
      - { layer: ci-check, location: "tools/validators/validate-skill-capabilities.mjs", description: "allowed_subagents declared per skill; skill→skill not allowed" }
      - { layer: runtime, location: "libs/agents/dispatcher-middleware.ts", description: "Mastra dispatcher runtime check at agent invocation" }
    enforcer_count: 3
    cross_references: [P-ARCH-027]

  # ==========================================================================
  # GROUP B — TRUTH & SOURCES (P-ARCH-006 to P-ARCH-010)
  # ==========================================================================

  - id: P-ARCH-006
    name: slice-contract-90-percent-to-merge
    category: architecture
    severity: critical
    statement: "Every slice scores ≥90% to merge, 100% = gold. Slice contract is 16 checks; total 113 points; ≥102 to merge."
    enforcers:
      - { layer: ci-check, location: "tools/audit-runner/slice-score.ts", description: "nx run-many -t slice-score --check fails build below 90%" }
      - { layer: pre-commit, location: ".husky/pre-commit (lefthook)", description: "Slice-score runs on changed slices; warns locally" }
      - { layer: scorecard, location: "apps/admin/payload/collections/SliceHealth.ts", description: "Read-only computed Payload collection; admin dashboard surface" }
    enforcer_count: 3
    cross_references: [P-ARCH-001, P-ARCH-022]

  - id: P-ARCH-007
    name: soft-delete-by-default
    category: architecture
    severity: error
    statement: "Every entity inherits soft-delete via the Base mixin's deletedAt. Hard delete requires explicit @hardDelete annotation + an explicit @@allow('delete', ...) policy."
    enforcers:
      - { layer: zenstack-policy, location: "libs/policies/base.zmodel", description: "Base mixin's @@deny('delete', true) — ZenStack-level enforcement" }
      - { layer: ci-check, location: "tools/validators/validate-zmodel-naming.mjs", description: "Flags @@allow('delete', ...) without @hardDelete annotation" }
      - { layer: ci-check, location: "tools/validators/validate-migration-safety.ts", description: "Migration linter — partial unique indexes added for soft-delete uniqueness" }
    enforcer_count: 3
    cross_references: [P-ARCH-008]

  - id: P-ARCH-008
    name: audit-by-trigger-not-app-code
    category: architecture
    severity: critical
    statement: "Postgres triggers fire on every write to every entity table. App-level audit middleware is bypassable; triggers are not."
    enforcers:
      - { layer: ci-check, location: "libs/audits/checks/audit-trigger-coverage.ts", description: "Slice contract check #4 — every table has a trigger calling audit.record()" }
      - { layer: ci-check, location: "libs/audits/checks/audit-log-integrity.ts", description: "No >5-min gap per tenant in audit.events" }
      - { layer: ci-check, location: "libs/audits/checks/pg-trigger-introspection.ts", description: "Verifies triggers present at the DB layer via pg_trigger" }
      - { layer: zenstack-policy, location: "libs/policies/slices/public/audit.zmodel", description: "RLS policy on audit.events — append-only, no UPDATE/DELETE" }
    enforcer_count: 4
    cross_references: [P-ARCH-010]

  - id: P-ARCH-009
    name: one-generation-layer-leverage-three-collapse
    category: architecture
    severity: warn
    statement: "Generators that compose, not generators that generate generators. Stop at 2 levels of meta. (Judgment call; not auto-enforceable, but visible at architecture review.)"
    enforcers:
      - { layer: instruction-file, location: "AGENTS.md", description: "Cardinal architecture principle; ADR template requires meta-level justification for any 'generator that generates a generator'" }
      - { layer: pr-bot, location: "tools/danger/check-meta-generator.ts", description: "Architecture review at code-review time (manual; flagged by reviewer)" }
    enforcer_count: 2
    cross_references: [P-ARCH-005]

  - id: P-ARCH-010
    name: defense-in-depth-authz
    category: architecture
    severity: critical
    statement: "ZenStack @@allow is the gate; Postgres RLS is the backstop. Every critical authz check exists at multiple independent layers."
    enforcers:
      - { layer: ci-check, location: "libs/audits/checks/rls-coverage.ts", description: "Every tenant-scoped table has rowsecurity=true at the Postgres layer" }
      - { layer: ci-check, location: "libs/audits/checks/permission-policy-drift.ts", description: "Declared @@allow policies match effective grants in pg_policies" }
      - { layer: ci-check, location: "libs/audits/checks/audit-log-integrity.ts", description: "Trigger-level audit catches what app might bypass" }
      - { layer: meta-audit, location: "libs/audits/checks/principle-coverage.ts", description: "P-META-001 enforcer — every critical principle has ≥2 non-AI enforcers" }
    enforcer_count: 4
    cross_references: [P-META-001, P-ARCH-027]

  # ==========================================================================
  # GROUP C — COMPOSITION & GENERATION (P-ARCH-011 to P-ARCH-015)
  # ==========================================================================

  - id: P-ARCH-011
    name: filter-by-entitlement-before-catalog-load
    category: architecture
    severity: error
    statement: "Token cost + security. The model never wastes context on capabilities the user can't use."
    enforcers:
      - { layer: runtime, location: "packages/catalog/src/load-catalog-for-user.ts", description: "loadCatalogForUser(userId) filters by entitlements before returning" }
      - { layer: meta-audit, location: "libs/audits/checks/audit-of-audit.ts", description: "Verifies catalog-loading endpoints all use the entitlement-filtered loader" }
      - { layer: eslint-rule, location: "tools/validators/eslint-rules/no-unfiltered-catalog-load.ts", description: "Flags direct catalog reads bypassing the helper" }
    enforcer_count: 3
    cross_references: [P-ARCH-025]

  - id: P-ARCH-012
    name: persona-orthogonal-to-agent
    category: architecture
    severity: error
    statement: "One parameterized agent runtime, N personas via composition. Mastra Dynamic Agents pattern."
    enforcers:
      - { layer: ci-check, location: "libs/audits/checks/mastra-agent-count.ts", description: "personaChatAgent is one instance; loadPersona(id) is the parameterization" }
      - { layer: pr-bot, location: "tools/danger/check-new-mastra-agent.ts", description: "Architecture review — adding a new Mastra agent for a 'different persona' is rejected" }
      - { layer: frontmatter-contract, location: "tools/validators/validate-frontmatter.mjs", description: "Persona slices declare agent: personaChatAgent (not their own agent)" }
    enforcer_count: 3
    cross_references: [P-ARCH-013]

  - id: P-ARCH-013
    name: universal-traits-trunk-domain-overlays
    category: architecture
    severity: error
    statement: "Layered system-prompt assembly — PLATFORM_CONSTITUTION → DOMAIN_OVERLAYS → traits → renderPersonaBlock → persona.systemPrompt → GUARDRAIL_BUNDLES → postHistoryInstructions."
    enforcers:
      - { layer: runtime, location: "libs/personas/compose.ts", description: "Persona compose function — single source of truth for assembly order" }
      - { layer: frontmatter-contract, location: "libs/policies/slices/public/persona.zmodel", description: "Every persona declares domain (validated against PersonaDomain enum)" }
    enforcer_count: 2
    cross_references: [P-ARCH-012, P-ARCH-014]

  - id: P-ARCH-014
    name: crisis-escalation-load-bearing-v1
    category: architecture
    severity: critical
    statement: "Crisis detection + escalation paths + output validator + CrisisEvent rows. Inherited by every persona; not a per-persona feature."
    enforcers:
      - { layer: runtime, location: "libs/personas/compose.ts", description: "Persona compose function always appends GUARDRAIL_BUNDLES[persona.riskClass] (which includes crisis bundles)" }
      - { layer: runtime, location: "libs/crisis/detector.ts", description: "Pre-LLM input filter runs before any persona LLM call" }
      - { layer: runtime, location: "libs/crisis/output-validator.ts", description: "Output validator on CRISIS_ELIGIBLE risk class — runs after every persona response" }
      - { layer: ci-check, location: "tools/audit-runner/slice-score.ts", description: "Crisis slice meets all 16 checks itself (slice contract)" }
    enforcer_count: 4
    cross_references: [P-ARCH-013, P-ARCH-015]

  - id: P-ARCH-015
    name: audit-system-is-itself-a-slice
    category: architecture
    severity: error
    statement: "Self-auditable. The audit system meets the same slice contract as everything else."
    enforcers:
      - { layer: ci-check, location: "tools/audit-runner/self-score.ts", description: "nx run audit-runner:slice-score — the audit slice itself scores ≥90%" }
      - { layer: meta-audit, location: "libs/audits/checks/audit-of-audit.ts", description: "Meta-check that every audit ran in its expected interval" }
    enforcer_count: 2
    cross_references: [P-ARCH-006, P-ARCH-002]

  # ==========================================================================
  # GROUP D — AI ARCHITECTURE (P-ARCH-016 to P-ARCH-020)
  # ==========================================================================

  - id: P-ARCH-016
    name: universal-terms-first
    category: architecture
    severity: warn
    statement: "Adopt cross-system industry-standard terms. Invent locally only when no industry-convergent term exists."
    enforcers:
      - { layer: ci-check, location: "libs/audits/checks/vale-prose.ts", description: "Vale prose linter — auto-generated from glossary; flags forbidden synonyms" }
      - { layer: eslint-rule, location: "eslint-config-csps/forbidden-identifiers.js", description: "ESLint id-denylist — auto-generated from glossary; flags forbidden identifiers" }
      - { layer: pr-bot, location: "tools/danger/check-glossary-additions.ts", description: "Glossary review at PR — new term proposals require justification of why no industry term fits" }
    enforcer_count: 3
    cross_references: [P-ARCH-019]

  - id: P-ARCH-017
    name: template-first-reuse-first
    category: architecture
    severity: critical
    statement: "Every page composes from a registered template in packages/templates/. Bespoke pages require a template-request PR before merge. No wild builders."
    enforcers:
      - { layer: ci-check, location: "tools/validators/validate-template-usage.mjs", description: "Slice contract check #12 — every page imports from @csps/templates" }
      - { layer: eslint-rule, location: "eslint.config.ts (no-restricted-imports)", description: "Blocks raw @radix-ui/*, @tremor/react, @csps/ui/* outside @csps/templates" }
      - { layer: generator, location: "tools/generators/page/index.ts", description: "platform:page generator refuses unknown templates" }
      - { layer: ci-check, location: "libs/audits/checks/storybook-coverage.ts", description: "Storybook + Chromatic — visual regression on every PR" }
    enforcer_count: 4
    cross_references: [P-OP-001]

  - id: P-ARCH-018
    name: schema-per-app
    category: architecture
    severity: critical
    statement: "Shared kernel in public; each app's domain entities in app_<slug>. Use fully-qualified table names; never search_path with transaction pooling."
    enforcers:
