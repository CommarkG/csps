        L2: .claude/core-spines/L2_DOMAIN_<SPINE>_<DOMAIN>.md
        L3: .claude/core-spines/L3_INSTANCES_<SPINE>.md
      L1_amendment_protocol: ADR + ratification (CC-equivalent; sealed text)
      L2_amendment_protocol: normal review (PCR + amendment)
