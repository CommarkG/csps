  - id: P-META-023
    name: intent-to-verified-impact
    title: Intent-to-Verified-Impact (I→VI) — Every Communication Boundary Closes the Loop
    description: >
      P-META-022 establishes WHY the intent gap exists. P-META-023 establishes HOW to close it at every communication surface. Every AI
      boundary (Types A-E: AI→AI, AI→subagent, AI→external API, AI→new chat, AI→human) requires: (1) UNDERSTANDING BLOCK before acting —
