  # ==========================================================================
  # META-PRINCIPLES (about principles themselves)
  # ==========================================================================

  - id: P-META-001
    name: defense-in-depth-enforcement
    category: meta
    severity: critical
    statement: |
      Every principle must have at least N independent mechanical enforcers, where N is sized to severity.
      The AI layer is treated as the LEAST reliable enforcer, not the only one.
      Critical principles must have at least 2 non-AI enforcers.
    industry_lineage:
      - AGENTS.md / CLAUDE.md cross-vendor convergence (2025-2026)
      - Anthropic Skills + Claude Code Hooks
      - MCP cross-vendor enforcement protocol (Linux Foundation 2025)
      - Backstage Tech Insights (Facts/Checks/Scorecards)
      - OPA/Rego + Conftest for non-AI policy
    config:
      uses: severity_enforcer_minimums      # the table at the top of this file
      non_ai_layers: [hook, pre-commit, pr-bot, ci-check, frontmatter-contract, eslint-rule, nx-tag-rule, opa-policy, zenstack-policy, audit-metric, scorecard, mcp-tool, generator]
      ai_layers: [instruction-file, skill, ai-prompt-addendum]
    enforcers:
      - { layer: meta-audit, location: "libs/audits/checks/principle-coverage.ts", description: "For every principle, asserts ≥ min_enforcers per severity AND ≥ 2 non-AI enforcers for critical; CI fails if any principle is under-enforced" }
      - { layer: meta-audit, location: "libs/audits/checks/enforcer-orphans.ts", description: "For every // @enforces: P-XXX-NNN annotation in source, asserts the principle exists; fails on dangling refs" }
      - { layer: ci-check,   location: "libs/audits/checks/codegen-fresh.ts", description: "Regenerate AGENTS.md + skills + hooks from principles.yaml; CI fails if git diff non-empty" }
    enforcer_count: 3
    cross_references: [P-META-002, P-OP-001]

  - id: P-META-002
    name: principles-travel-with-artifacts
    category: meta
    severity: error
    statement: |
      When an app graduates from CSPS as a standalone product, the principles registry + audit-runner + MCP server
      travel with it as vendored copies. The graduated app stays self-contained but provably descended from a known principle set.
    enforcers:
      - { layer: generator,  location: "tools/generators/extract-app/index.ts", description: "extract-app generator embeds principles.yaml + vendored audit-runner + vendored MCP server in extracted repo; stamps commit with principles version hash" }
      - { layer: ci-check,   location: "libs/audits/checks/principles-version-known.ts", description: "Extracted apps verify their principles.yaml has a known version hash from the platform's release history" }
      - { layer: scorecard,  location: "libs/audits/scorecards/principles-currency.ts", description: "Tracks how far behind extracted apps are from the platform's current principles version" }
    enforcer_count: 3
    cross_references: [P-META-001]

  - id: P-META-003
    name: inheritance-via-shared-runtime
    category: meta
    severity: error
    statement: |
      Platform principles propagate to hosted apps, customer-facing AI, and sub-agents through four reinforcing channels:
      AGENTS.md cascade + shared MCP server + Mastra BaseAgent + audit-runner package. NOT through copy-paste or ad-hoc memory.
    enforcers:
      - { layer: instruction-file, location: "AGENTS.md", description: "Documents the cascade; per-app/per-package AGENTS.md extends, never overrides" }
      - { layer: mcp-resource,     location: "packages/principles-mcp/", description: "Single MCP server every agent in every app connects to" }
      - { layer: generator,        location: "tools/generators/agent/index.ts", description: "Mastra agent generator scaffolds extends BaseAgent; BaseAgent pulls platform principles from MCP at construction" }
      - { layer: ci-check,         location: "libs/audits/checks/inheritance-coverage.ts", description: "Every Mastra agent extends BaseAgent; every app has AGENTS.md cascade; every app's audit-runner is the platform's vendored copy" }
    enforcer_count: 4
    cross_references: [P-META-001, P-META-002]

  - id: P-META-004
    name: stored-content-lifecycle
    aliases: [stewardship-protocol, content-lifecycle, no-orphan-saves]
    category: meta
    severity: critical
    statement: |
      Every saved artifact (handoff, vault entry, legacy archive, open question, ADR proposal,
      draft doc, intake item, third-party skill, rule, audit finding) must declare a
      lifecycle_state and have a recurring trigger that advances it. Saved-without-trigger =
      orphan-in-waiting. The default state for newly-saved-without-process is `pending-protocol`,
      which itself triggers a protocol-creation flow.
    industry_lineage:
      - Scrum / Kanban — backlog grooming as recurring stewardship of saved items
      - Linear / Jira / Shortcut — issue triage loop with state-machine + SLA per state
      - Eric Evans, Domain-Driven Design (2003) — Stewardship as ownership of bounded-context artifacts
      - Atlassian "Inbox Zero" + David Allen GTD — every captured input must have a next-action or be archived
      - Tiago Forte, Building a Second Brain — PARA method (Project / Area / Resource / Archive)
      - SharePoint Managed Metadata — quarterly review of open-tag values for promotion/retirement
      - Backstage Catalog lifecycle (experimental → production → deprecated) — recurring lifecycle reviews
    config:
      lifecycle_states: [active, pending-review, pending-protocol, promoted, resolved, deprecated]
      default_state_for_unprocessed: pending-protocol
      review_cadence_pending: per-session       # every fresh-chat reviews pending-* items
      review_cadence_active_stale_days: 90      # `active` artifacts beyond this since last review get flagged
      sla_pending_review_days: 14
      sla_pending_protocol_days: 30
      sla_legacy_archive_review_days: 90
    state_transitions:
      pending-protocol:    [active, deprecated]                        # protocol created OR item rejected
      pending-review:      [active, deprecated, promoted]              # human-reviewed; accepted, rejected, or promoted-to-canonical
      active:              [pending-review, promoted, resolved, deprecated]
      promoted:            [active, deprecated]                        # promoted-to-canonical can be re-reviewed
      resolved:            [deprecated]                                # closed items eventually retired
      deprecated:          []                                          # terminal
    enforcers:
      - { layer: instruction-file,     location: "AGENTS.md",                                                          description: "Stated as cardinal meta-principle; references /stewardship-review skill" }
      - { layer: frontmatter-contract, location: "tools/validators/validate-frontmatter.mjs",                          description: "Every artifact has `lifecycle_state` (closed enum); `next_review_at` required when state != active" }
      - { layer: ci-check,             location: "libs/audits/checks/stewardship/orphan-without-lifecycle-state.ts",   description: "PR check — every artifact has lifecycle_state declared (or inherited via variants)" }
      - { layer: ci-check,             location: "libs/audits/checks/stewardship/stale-pending-review.ts",             description: "PR + nightly — items in pending-review past SLA flagged" }
      - { layer: ci-check,             location: "libs/audits/checks/stewardship/stale-pending-protocol.ts",           description: "Nightly — items in pending-protocol past SLA flagged for protocol creation" }
      - { layer: ci-check,             location: "libs/audits/checks/stewardship/legacy-archive-review-due.ts",        description: "Weekly — _legacy/ items past their next_review_at flagged for review or retirement" }
      - { layer: skill,                location: "packages/skills/stewardship-review/SKILL.md",                        description: "Slash command surfaces all pending-* + active-stale items for current-session triage" }
      - { layer: mcp-resource,         location: "packages/principles-mcp/src/resources.ts",                           description: "Exposed as principles://stewardship-protocol with state machine + cadences" }
    enforcer_count: 8
    cross_references: [P-META-001, P-META-005, P-OP-002, P-ARCH-001]
    anti_patterns:
      - silent-save (artifact persisted without lifecycle_state — the orphan-in-waiting)
      - perpetual-pending (state stuck in pending-* indefinitely; SLA audit catches)
      - orphan-archive (_legacy items never re-reviewed)
      - knowledge-graveyard (Confluence-rot equivalent — saved-but-unread, no recurring trigger)
      - state-without-transition (lifecycle_state declared but no trigger advances it; treated as bug)
      - stewardship-theater (running the review without actually advancing or retiring items)

  - id: P-META-005
    name: learning-loop
    aliases: [closed-loop-learning, observe-orient-decide-act, OODA, no-write-only-graveyard]
    category: meta
    severity: critical
    statement: |
      Every input stream into CSPS — chat conversations, error logs, audit failures, user feedback,
      AI-extracted insights, near-misses — is routed through a single intake → triage → routing →
      permanent-fix → validation pipeline. Inputs that escape the loop trigger a self-healing audit
      that identifies the gap, applies a permanent control, and validates the gap is closed.
      Saving is not the goal; permanent system improvement is.
    industry_lineage:
      - John Boyd, OODA Loop (1976) — Observe → Orient → Decide → Act; tempo as competitive advantage
      - Google SRE Book + Workbook — blameless postmortem culture + action-item SLOs + FixIt weeks (industry close-rate ~30% without forcing functions; Google targets 80%+ within 30d)
      - Toyota Kata + Five Whys (Mike Rother, "Toyota Kata", 2009) — daily improvement cadence + Five-Whys → A3 escalation when problem cross-functional or recurring (the documented K=2 → ADR pattern)
      - Lean / Kaizen — continuous improvement as built-in process, not project
      - DORA / DevOps Research and Assessment — change failure rate, MTTR, lead time as the four meta-metrics
      - Linear Triage + Triage Intelligence (2025) — auto-routing, SLA-as-trigger, two-tier confidence gate (~90% routing accuracy)
      - OpenTelemetry GenAI semantic conventions — gen_ai.evaluation.result event for AI-extracted insight provenance
      - RLHF / Active Learning literature — three-band confidence gate (auto-accept ≥0.90, review 0.75–0.90, discard <0.75); target 1–5% in human review band
      - Knowledge management failure literature (Nick Milton 7 failure modes; Mark Burgess "Failure of KM"; Confluence-rot case studies) — the antidote: capture-in-flow + pull-based discovery + visible feedback loops + forcing-function closure
    config:
      pipeline_states: [observed, triaged, routed, fixing, validated, closed]
      sla_observed_to_triaged_hours:
        P0: 1
        P1: 4
        P2: 24
        P3: 72
      sla_triaged_to_routed_hours: 48
      sla_fixing_days:
        P1: 30
        P2: 90
        P3: 180
      ai_confidence_thresholds:
        auto_accept: 0.90       # AI-extracted insight enters `triaged` directly
        human_review_band_lo: 0.75
        human_review_band_hi: 0.90
        discard_below: 0.75
      target_human_review_rate_pct: [1, 5]    # operating point — outside this band, recalibrate
      recurrence_check_days_default: 90
      recurrence_check_days_critical: 30
      repeat_issue_auto_adr_threshold_K: 2     # K=2 within 90d → auto-ADR for permanent fix (Toyota documented + Google SRE 30/60/90 conventions)
      repeat_issue_window_days: 90
      repeat_issue_lifetime_threshold_K: 3     # K=3 over lifetime catches slow-burn recurrences
      meta_loop_trend_window_days: 90          # rolling window for resolution-cycle-time degradation detection
      meta_loop_eval_cadence: weekly
      meta_loop_degradation_pct_trigger_adr: 20   # >20% cycle-time degradation over the window → file ADR
      otel_evaluation_event: gen_ai.evaluation.result    # OTel GenAI conv — provenance event for AI-extracted insights
    pipeline_transitions:
      observed:    [triaged, closed]                              # closed = false-positive auto-discard (below confidence threshold)
      triaged:     [routed, closed]                                # closed = duplicate / dismissed with reason
      routed:      [fixing, closed]                                # closed = wont-fix with stated reason
      fixing:      [validated, closed]                             # closed = abandoned (rare; requires reason)
      validated:   [closed, fixing]                                # fixing = re-opened (validation failed)
      closed:      [observed]                                      # re-opened by recurrence-check trigger
    enforcers:
      - { layer: instruction-file,     location: "AGENTS.md",                                                              description: "Stated as cardinal meta-principle; references /learning-loop-extract skill; includes hard NO 'Never close a chat without running learning-loop:extract or marking no insights with reason'" }
      - { layer: skill,                location: "packages/skills/learning-loop-extract/SKILL.md",                          description: "Mastra skill — scans session log for insights/errors/gaps/decisions; routes to LearningLoopItem inbox with confidence-gated bands" }
      - { layer: hook,                 location: ".claude/hooks/post-stop-learning-loop.sh",                                description: "PostStop hook — auto-triggers extractor at session end" }
      - { layer: ci-check,             location: "libs/audits/checks/learning-loop/coverage.ts",                            description: "Per-session — every session produced ≥1 extracted item OR explicit no-insights with reason" }
      - { layer: ci-check,             location: "libs/audits/checks/learning-loop/repeat-issue-detection.ts",              description: "Weekly — same gap in ≥K=2 sessions within 90d auto-creates ADR; the killer enforcer" }
      - { layer: ci-check,             location: "libs/audits/checks/learning-loop/unresolved-observation-stale.ts",        description: "Nightly — items in `observed` past their priority-tier SLA escalate" }
      - { layer: ci-check,             location: "libs/audits/checks/learning-loop/fix-without-validation.ts",              description: "Nightly — items in `fixing` >SLA without `validated` flagged (prevents closure-theater)" }
      - { layer: ci-check,             location: "libs/audits/checks/learning-loop/validation-without-recurrence-check.ts", description: "Weekly — `closed` items get a 30/90-day recurrence check based on tier; reopen if recurs" }
      - { layer: ci-check,             location: "libs/audits/checks/learning-loop/meta-loop-audit.ts",                     description: "Monthly — resolution-cycle-time trend over 90-day rolling window; degradation >20% files ADR" }
      - { layer: zenstack-policy,      location: "libs/policies/slices/public/learning-loop-item.zmodel",                   description: "LearningLoopItem Foundation slice — schema for the pipeline state machine; @@deny on bypass" }
      - { layer: mcp-resource,         location: "packages/principles-mcp/src/resources.ts",                                description: "Exposed as principles://learning-loop with state machine + cadences + thresholds" }
    enforcer_count: 11
    cross_references: [P-META-001, P-META-002, P-META-004, P-META-006, P-OP-001, P-ARCH-014]
    anti_patterns:
      - knowledge-graveyard (write-only insight capture; what KM systems fail at; antidote = closure-as-forcing-function)
      - confidence-cliff (binary auto-accept threshold without review band — loses RLHF signal)
      - closure-theater (items marked closed without validation; fix-without-validation audit catches)
      - silent-escape (insight observed but no one noticed; weekly rescan + per-session coverage audit catches)
      - loop-fatigue (too many low-confidence items reach review queue — confidence gate calibration; target 1-5% review rate)
      - meta-loop-rot (resolution-cycle-time degrades silently; meta-loop-audit catches at >20% over 90d)
      - false-positive-flood (extraction precision degrades; weekly extraction-precision audit catches)
      - insight-without-owner (no one accountable; SLA escalation routes; orphans are routing failures)

  - id: P-META-006
    name: zero-findings-discipline
    aliases: [RZF, CEC, complete-extraction-cycle, real-zero-findings, evidence-based-completion]
    category: meta
    severity: critical
    statement: |
      Every artifact reaching DONE / COMPLETE / RATIFIED status must emit an evidence block
      proving (1) RZF — re-run validators returned ZERO findings across all check types
      (mechanical / semantic / propagation / user-visible-outcome-when-applicable), AND
      (2) CEC — Complete Extraction Cycle walked the platform until ZERO new application
      opportunities. Cycle count is MEASUREMENT not TARGET; re-run IS the proof; partial-extraction
      normalized as "good enough" is the universal AI failure pattern this principle catches.
    industry_lineage:
      - CSP S333 Real Zero Findings discipline (330+ sessions of evolution; treasure #5 EXT-20260502-005)
      - Toyota Kata + Five Whys → A3 escalation (cycle-as-measurement)
      - Google SRE postmortem culture (action-items-with-evidence not feeling)
      - Backstage Tech Insights (Facts/Checks/Scorecards mechanical layer)
      - User S002 turn 10 — explicit extension to Complete Extraction (positive branch addressing AI's negative-only-validation default)
    config:
      # RZF — defect verification (negative branch)
      rzf_check_types: [mechanical, semantic, propagation, user-visible-outcome]
      rzf_required_check_types: [mechanical, semantic, propagation]   # user-visible-outcome only when customer-facing change
      rzf_cycle_count_is_target: false                                # explicit: count is MEASUREMENT not TARGET
      rzf_evidence_block_required: true
      # CEC — value verification (positive branch — CSPS extension S002 turn 10)
      cec_walk_scope:
        - principles.yaml
        - pillar-0/*.md
        - pillar-1/*.md
        - pillar-2/*.md
        - pillar-3/*.md
        - pillar-4/*.md (when migrated)
        - pillar-5/*.md (when migrated)
        - pillar-6/*.md (when migrated)
        - _handoff/VAULT/*.md
        - _intake/*.md
        - behavioral-contracts.md
        - ai-behavior-spine.md
        - memory/*.md
        - AGENTS.md
      cec_walk_trail_required: true
      cec_termination_condition: "same-cycle-zero-new-opportunities"
      cec_essence_must_be_distilled_in_one_sentence: true             # forces clarity; fuzzy essence = bad walks
      # Anti-compression rule
      compressed_zero_findings_under_context_pressure: forbidden       # defer to next session, do NOT compress
      # Trigger cadence
      mandatory_at:
        - every principle ratification
        - every leaf migration
        - every batch close
