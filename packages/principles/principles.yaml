          Per-session warn: tracks chat-jump prompts across sessions; flags handshakes without iteration-to-alignment confirmation within 7
          sessions; planned week-4
      - layer: hook
        location: .claude/hooks/pre-subagent-spawn-aap-preamble.sh
        description: 'PreToolUse on Agent: injects AAP preamble + output_contract spec; planned week-4'
      - layer: hook
        location: .claude/hooks/post-subagent-return-verify.sh
        description: 'PostToolUse on Agent return: verifies returned summary matches output_contract; flags drift; planned week-4'
      - layer: memory
        location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_mutual_understanding_validation.md
        description: Cognitive layer; loaded session-start
      - layer: ai-behavior-spine
        location: docs/plan/pillar-0-governance/ai-behavior-spine.md
        description: >-
          Discipline matrix row — composes B_TWO_SIDED_HANDSHAKE + B_INTENT_TO_IMPACT (S002 turn 6-7 origin contracts; this principle is the
          universalization to all 5 boundary types)
    enforcer_count: 12
    cross_references:
      - P-META-001
      - P-META-006
      - P-META-008
      - P-META-010
      - P-META-013
      - P-OP-003
      - P-OP-004
    anti_patterns:
      - asymmetric-one-shot-communication-on-high-stakes-boundary (the meta-pattern this principle exists to cure)
      - >-
        chat-jump-prompt-without-alignment-questions (new chat receives instructions but has no mechanical way to surface ambiguity; gaps
        propagate silently)
      - >-
