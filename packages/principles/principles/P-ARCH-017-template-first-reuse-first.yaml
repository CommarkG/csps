    location: eslint.config.ts (no-restricted-imports)
    description: Blocks raw @radix-ui/*, @tremor/react, @csps/ui/* outside @csps/templates
  - layer: generator
    location: tools/generators/page/index.ts
    description: platform:page generator refuses unknown templates
  - layer: ci-check
    location: libs/audits/checks/storybook-coverage.ts
    description: Storybook + Chromatic — visual regression on every PR
enforcer_count: 4
cross_references:
