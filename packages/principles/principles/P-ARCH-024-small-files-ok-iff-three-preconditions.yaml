id: P-ARCH-024
name: small-files-ok-iff-three-preconditions
category: architecture
severity: warn
statement: >-
  Small files are OK iff (a) machine-parseable frontmatter, (b) connectivity layer (links + variant-inherited tags +
  context.md reference), (c) retrieval layer (catalog index + MCP resource exposure).
enforcers:
  - layer: ci-check
    location: tools/validators/validate-frontmatter.mjs
    description: Precondition (a) — machine-parseable frontmatter
  - layer: ci-check
    location: libs/audits/checks/orphan-file-detection.ts
    description: Weekly — flags files without links AND without bundle membership (precondition b)
  - layer: ci-check
    location: libs/audits/checks/catalog-coverage.ts
    description: Catalog scan verifies every file is indexed (precondition c)
enforcer_count: 3
