id: P-ARCH-028
name: csps-core-spines
aliases:
  - core-spine-discipline
  - 5-spine-architecture
  - outward-layering
category: architecture
severity: critical
statement: |
  CSPS architecture is organized around 5 Core Spines (GVRN/ARCH/AI/OPER/VALD) with
  precedence ordering GVRN > VALD > ARCH > AI > OPER (lower-defers-to-higher).
  Every governed artifact declares a primary spine via `core_spine:` (singular)
  frontmatter + optional cross-cutting list via `core_spines:` (plural). 3-layer
  doctrine model: L0 csps-core-manifest (root) / L1 sealed core (5 files; CC-equivalent
  amendment) / L2 domain decomposition (~16 files) / L3 instance registries (5 files;
  per-session populated). DNA stays consistent from CORE outward to specific instances
  because every layer enforces the layer beneath it.
counterweight: |
  Cross-cutting concerns may declare multiple spines via `core_spines:` plural; primary
  spine via `core_spine:` singular owns adjudication. Pillars (7 domain-organized) compose
  orthogonally to spines (5 responsibility-organized) — pillar leaves declare both.
industry_lineage:
  - CSP CC-015 + CC-048-A — 5-spine canonical set (S206; PHIL retired); precedence DO-1
  - CSP S331 Bundle 1 Scope A — 3-layer doctrine model (L1 sealed + L2 domain + L3 instances)
  - OpenAI Model Spec hierarchy — universal-at-trunk + domain-overlays-at-extension
  - User S006 turn 7 directive — "the Core is the universal fundamental undebatable things of each core spine"
config:
  canonical_spines:
    - GVRN
    - ARCH
    - AI
    - OPER
    - VALD
  precedence_ordering:
    - GVRN
    - VALD
    - ARCH
    - AI
    - OPER
  precedence_rule: lower-defers-to-higher
  layers:
    L0: docs/plan/pillar-0-governance/csps-core-manifest.md
    L1: .claude/core-spines/L1_CORE_<SPINE>.md
    L2: .claude/core-spines/L2_DOMAIN_<SPINE>_<DOMAIN>.md
    L3: .claude/core-spines/L3_INSTANCES_<SPINE>.md
  L1_amendment_protocol: ADR + ratification (CC-equivalent; sealed text)
  L2_amendment_protocol: normal review (PCR + amendment)
  L3_amendment_protocol: per-session edit (no formal amendment)
  frontmatter_singular_required: core_spine
  frontmatter_plural_optional: core_spines
  schema_anchor_required: true
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: 'Hard NO — never create governed artifact without core_spine: singular field'
  - layer: contract
    location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_CORE_SPINE_DISCIPLINE
    description: B_CORE_SPINE_DISCIPLINE canonical contract
  - layer: memory
    location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_csp_core_spine_absorptions.md
    description: Cognitive layer; loaded session-start
  - layer: frontmatter-contract
    location: docs/plan/pillar-0-governance/csps-core-manifest.md
    description: L0 root doctrine; precedence + 3-layer model + frontmatter convention
  - layer: ci-check
    location: libs/audits/checks/corespine-layer-compliance.ts
    description: Validator — declared spine ∈ canonical 5-set + L1_CORE_<X>.md exists (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/nothing-stands-alone-audit.ts
    description: Validator — RED on ORPHAN_NO_CORE_SPINE or ORPHAN_NO_SCHEMA_ANCHOR (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/L1-do-not-expand-violation.ts
    description: Validator — L1_CORE files don't violate do_not_expand list (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/spine-precedence-conflict-detector.ts
    description: Validator — multi-spine artifacts with conflicting governance flagged (registered atomic; impl week-4)
  - layer: ai-behavior-spine
    location: docs/plan/pillar-0-governance/ai-behavior-spine.md
    description: Discipline matrix row
  - layer: generator
    location: tools/scripts/instance-registry-populator.mjs
    description: Auto-populates L3_INSTANCES_<SPINE>.md from corpus core_spine declarations (planned L4 of governance-foundation)
enforcer_count: 10
cross_references:
  - P-ARCH-013
  - P-META-007
  - P-META-015
  - P-META-016
anti_patterns:
  - missing-core-spine-frontmatter (governed artifact without core_spine field — ORPHAN)
  - missing-schema-anchor (governed artifact without schema_anchor — ORPHAN)
  - L1-do-not-expand-violation (sealed L1 file gains examples or cross-references)
  - spine-precedence-violated (lower-precedence spine overrides higher without ADR)
  - cross-spine-collision (artifact citing 2+ spines with conflicting CORE rules)
enforcement_tier:
  tier1_hook: pre-tool-use-sacred-file-guard.sh (BLOCKING — L1_CORE spine files are write-protected)
  tier2_validator: tools/validators/validate-frontmatter.mjs (BLOCKING — core_spine field required on governed artifacts)
  tier3_session: 'AGENTS.md hard-NO + session-open.sh: core-spine discipline injection'
