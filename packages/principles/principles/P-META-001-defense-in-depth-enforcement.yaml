# P-META-001-defense-in-depth-enforcement.yaml
# CSPS Principle Slice — generated by tools/split.mjs
# Source of truth: packages/principles/principles.yaml
# DO NOT edit this file directly — run `pnpm --filter @csps/principles split` to regenerate
# Phase 7 token-optimization §9.8 Candidate #1 (S010)
# Load this file (P-META-001-defense-in-depth-enforcement.yaml) instead of the full principles.yaml (~85K)
# when you only need this one principle in your AI session context.
id: P-META-001
name: defense-in-depth-enforcement
category: meta
severity: critical
statement: |
  Every principle must have at least N independent mechanical enforcers, where N is sized to severity.
  The AI layer is treated as the LEAST reliable enforcer, not the only one.
  Critical principles must have at least 2 non-AI enforcers.
industry_lineage:
  - AGENTS.md / CLAUDE.md cross-vendor convergence (2025-2026)
  - Anthropic Skills + Claude Code Hooks
  - MCP cross-vendor enforcement protocol (Linux Foundation 2025)
  - Backstage Tech Insights (Facts/Checks/Scorecards)
  - OPA/Rego + Conftest for non-AI policy
config:
  uses: severity_enforcer_minimums
  non_ai_layers:
    - hook
    - pre-commit
    - pr-bot
    - ci-check
    - frontmatter-contract
    - eslint-rule
    - nx-tag-rule
    - opa-policy
    - zenstack-policy
    - audit-metric
    - scorecard
    - mcp-tool
    - generator
  ai_layers:
    - instruction-file
    - skill
    - ai-prompt-addendum
enforcers:
  - layer: meta-audit
    location: libs/audits/checks/principle-coverage.ts
    description: >-
      For every principle, asserts ≥ min_enforcers per severity AND ≥ 2 non-AI enforcers for critical; CI fails if any
      principle is under-enforced
  - layer: meta-audit
    location: libs/audits/checks/enforcer-orphans.ts
    description: 'For every // @enforces: P-XXX-NNN annotation in source, asserts the principle exists; fails on dangling refs'
  - layer: ci-check
    location: libs/audits/checks/codegen-fresh.ts
    description: Regenerate AGENTS.md + skills + hooks from principles.yaml; CI fails if git diff non-empty
  - layer: ci-check
    location: libs/audits/checks/principle-count-staleness.ts
    description: >-
      Greps for hardcoded principle-count text (e.g. 'N meta-principles', 'P-META-001 through P-META-NNN', 'N operating
      principles', 'P-OP-001 through P-OP-NNN') in active prose; compares against current `^  - id: P-META-` and `^  -
      id: P-OP-` row counts in principles.yaml; warn on drift; lists offending lines. Exempts snapshot/historical files
      via audit_exempt_paths (HANDOFF-S*.md, qc-audit-results-S*.md, validation-pass-S*.md, chat-jump-prompt-*.md,
      principles-snapshot.md). Registered S005 turn 8 per ADR-0022 K=2 auto-ADR; build deferred week-4.
enforcer_count: 4
cross_references:
  - P-META-002
  - P-OP-001
  - P-META-005
enforcement_tier:
  tier1_hook: AGENTS.md enforcement + session-open.sh guidance (behavioral level — meta-audit enforcer count check)
  tier2_validator: pnpm verify full-pass (indirect via principle-coverage meta-audit)
  tier3_session: AGENTS.md hard-NO + session-open.sh principle injection
