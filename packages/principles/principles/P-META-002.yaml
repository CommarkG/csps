# P-META-002.yaml
# CSPS Principle Slice — generated by tools/split.mjs
# Source of truth: packages/principles/principles.yaml
# DO NOT edit this file directly — run `pnpm --filter @csps/principles split` to regenerate
# Phase 7 token-optimization §9.8 Candidate #1 (S010)
# Load this file (P-META-002.yaml) instead of the full principles.yaml (~85K)
# when you only need this one principle in your AI session context.
id: P-META-002
name: principles-travel-with-artifacts
category: meta
severity: error
statement: >
  When an app graduates from CSPS as a standalone product, the principles registry + audit-runner + MCP server

  travel with it as vendored copies. The graduated app stays self-contained but provably descended from a known
  principle set.
enforcers:
  - layer: generator
    location: tools/generators/extract-app/index.ts
    description: >-
      extract-app generator embeds principles.yaml + vendored audit-runner + vendored MCP server in extracted repo;
      stamps commit with principles version hash
  - layer: ci-check
    location: libs/audits/checks/principles-version-known.ts
    description: Extracted apps verify their principles.yaml has a known version hash from the platform's release history
  - layer: scorecard
    location: libs/audits/scorecards/principles-currency.ts
    description: Tracks how far behind extracted apps are from the platform's current principles version
enforcer_count: 3
cross_references:
  - P-META-001
