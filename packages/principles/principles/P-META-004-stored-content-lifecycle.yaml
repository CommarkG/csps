# when you only need this one principle in your AI session context.
id: P-META-004
name: stored-content-lifecycle
aliases:
  - stewardship-protocol
  - content-lifecycle
  - no-orphan-saves
category: meta
severity: critical
statement: |
  Every saved artifact (handoff, vault entry, legacy archive, open question, ADR proposal,
  draft doc, intake item, third-party skill, rule, audit finding) must declare a
  lifecycle_state and have a recurring trigger that advances it. Saved-without-trigger =
  orphan-in-waiting. The default state for newly-saved-without-process is `pending-protocol`,
  which itself triggers a protocol-creation flow.
industry_lineage:
  - Scrum / Kanban — backlog grooming as recurring stewardship of saved items
  - Linear / Jira / Shortcut — issue triage loop with state-machine + SLA per state
  - Eric Evans, Domain-Driven Design (2003) — Stewardship as ownership of bounded-context artifacts
  - Atlassian "Inbox Zero" + David Allen GTD — every captured input must have a next-action or be archived
  - Tiago Forte, Building a Second Brain — PARA method (Project / Area / Resource / Archive)
  - SharePoint Managed Metadata — quarterly review of open-tag values for promotion/retirement
  - Backstage Catalog lifecycle (experimental → production → deprecated) — recurring lifecycle reviews
config:
  lifecycle_states:
    - active
    - pending-review
    - pending-protocol
    - promoted
    - resolved
    - deprecated
  default_state_for_unprocessed: pending-protocol
  review_cadence_pending: per-session
  review_cadence_active_stale_days: 90
  sla_pending_review_days: 14
  sla_pending_protocol_days: 30
  sla_legacy_archive_review_days: 90
state_transitions:
  pending-protocol:
    - active
    - deprecated
  pending-review:
    - active
    - deprecated
    - promoted
  active:
    - pending-review
    - promoted
    - resolved
    - deprecated
  promoted:
    - active
    - deprecated
  resolved:
    - deprecated
  deprecated: []
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: Stated as cardinal meta-principle; references /stewardship-review skill
  - layer: frontmatter-contract
    location: tools/validators/validate-frontmatter.mjs
    description: Every artifact has `lifecycle_state` (closed enum); `next_review_at` required when state != active
  - layer: ci-check
    location: libs/audits/checks/stewardship/orphan-without-lifecycle-state.ts
    description: PR check — every artifact has lifecycle_state declared (or inherited via variants)
  - layer: ci-check
    location: libs/audits/checks/stewardship/stale-pending-review.ts
    description: PR + nightly — items in pending-review past SLA flagged
  - layer: ci-check
    location: libs/audits/checks/stewardship/stale-pending-protocol.ts
    description: Nightly — items in pending-protocol past SLA flagged for protocol creation
  - layer: ci-check
    location: libs/audits/checks/stewardship/legacy-archive-review-due.ts
    description: Weekly — _legacy/ items past their next_review_at flagged for review or retirement
  - layer: skill
    location: packages/skills/stewardship-review/SKILL.md
    description: Slash command surfaces all pending-* + active-stale items for current-session triage
  - layer: mcp-resource
    location: packages/principles-mcp/src/resources.ts
    description: Exposed as principles://stewardship-protocol with state machine + cadences
enforcer_count: 8
cross_references:
  - P-META-001
  - P-META-005
  - P-OP-002
  - P-ARCH-001
anti_patterns:
  - silent-save (artifact persisted without lifecycle_state — the orphan-in-waiting)
  - perpetual-pending (state stuck in pending-* indefinitely; SLA audit catches)
  - orphan-archive (_legacy items never re-reviewed)
  - knowledge-graveyard (Confluence-rot equivalent — saved-but-unread, no recurring trigger)
  - state-without-transition (lifecycle_state declared but no trigger advances it; treated as bug)
  - stewardship-theater (running the review without actually advancing or retiring items)
