# when you only need this one principle in your AI session context.
id: P-META-007
name: five-surface-engraving
aliases:
  - FSE
  - five-element-pattern
  - discipline-propagation
  - catch-pipeline
category: meta
severity: critical
statement: |
  When AI detects any catch (gap / trap / anti-pattern / failure-mode / missing-execution),
  engraving must hit ALL 5 surfaces — schema + validator + hook + memory + contract — atomically
  in the same response/commit. Below 2 surfaces = single-surface-engraving anti-pattern;
  5/5 = full mechanical engraving. The mechanism IS the platform's compounding-returns moat:
  every session inherits prior engravings; re-discovery cost approaches zero.
industry_lineage:
  - CSP S333 AI_BEHAVIOR_AUTONOMY_AUDIT (treasure
  - >-
    User S002 turn 16 — formalization request + mechanical-trigger requirement + strategic-value framing (stability /
    scalability / uniqueness)
  - B_CATCH_TO_ENGRAVING (S002 turn 15) — the contract this principle operationalizes
config:
  surfaces:
    - schema
    - validator
    - hook
    - memory
    - contract
  completeness_levels:
    single-surface: 1
    minimal: 2
    partial: 3-4
    full: 5
    augmented: 5+ audit-of-audits
  atomic_application_required: true
  meta_rzf_verification_required: true
  below_2_surfaces_severity: error
  below_5_surfaces_severity: warn
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: 'Hard NO: catch-language patterns trigger immediate 5-surface engraving in same response'
  - layer: frontmatter-contract
    location: _handoff/VAULT/closing-summary-template.md
    description: §10.13b mandatory header — every catch enumerates 5-surface delta
  - layer: ci-check
    location: libs/audits/checks/zero-findings/catch-engraving-completeness.ts
    description: PR-blocking warn — flags surfaces_count < 2
  - layer: ci-check
    location: libs/audits/checks/zero-findings/single-surface-engraving-anti-pattern.ts
    description: PR-blocking error — flags new disciplines at 1/5
  - layer: ci-check
    location: libs/audits/checks/zero-findings/audit-of-audits.ts
    description: Meta-RZF on the engraving registry itself; verifies 5-surface registry health
  - layer: hook
    location: .claude/hooks/post-stop-five-surface-engraving.sh
    description: PostStop scans session log for catch-language; verifies 5-surface artifacts created
  - layer: memory
    location: ~/.claude/projects/.../memory/feedback_five_surface_engraving.md
    description: Cognitive layer; loaded at session-start
  - layer: skill
    location: packages/skills/five-surface-engraving/SKILL.md
    description: Slash command /engrave <catch> orchestrates the 7-stage cycle (planned)
  - layer: mcp-resource
    location: packages/principles-mcp/src/resources.ts
    description: Exposed as principles://five-surface-engraving with full 7-stage pipeline + evidence-block format
enforcer_count: 9
cross_references:
  - P-META-001
  - P-META-006
  - P-OP-001
anti_patterns:
  - single-surface-engraving (memory only OR contract only — fails per CSP)
  - sequential-engraving (memory now, contract later — must be atomic)
  - engraving-without-completeness-verification (no FSE evidence block emitted)
  - silent-below-2-surfaces (without explicit deferral note)
  - I'll engrave if it comes up again (N=2 already costs re-discovery)
  - catches-noted-not-engraved (B_CATCH_TO_ENGRAVING violation; this principle prevents)
