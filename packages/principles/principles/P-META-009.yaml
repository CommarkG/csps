anti_patterns:
  - >-
    tokens-as-budget-to-minimize (the meta-pattern this principle exists to cure; quality + holistic + long-run >
    savings per user S005 turn 24)
  - >-
    downgrading-opus-on-ratification (QG1 violation; produces nominal-quality decisions that compound into platform
    debt)
  - delegating-synthesis-to-subagent (QG2 violation; subagent doesn't see your full context; can't synthesize correctly)
  - >-
    assume-content-from-memory-of-last-write (QG3 violation; produces nominal-RZF; mid-session-edited files MUST be
    re-read)
  - nominal-cache-where-snapshot-drifts-from-disk (QG4 violation; AGENTS.md changed but cached snapshot serves stale)
  - >-
    all-opus-without-routing (right-tool-for-job — Haiku adequate for lookups; using Opus everywhere is over-spend
    without quality gain)
  - all-sonnet-without-escalation (mirror failure mode; ratification needs Opus depth)
  - parallel-subagents-when-serial-suffices (5x cost for marginal speed; only when wall-clock dominates)
  - cache-on-volatile-content (Layer 3 active work cached at 1h = stale-content quality regression)
  - default-l3-depth-where-l1-suffices (R1 violation; over-fetching context for simple work)
  - mid-task-model-switch (R2 violation; invalidates cache; rebuilds prompt-cache from scratch)
  - silent-auto-compact-mid-session (R3 violation; loses governance context; manual /compact preserves intent)
  - context-bleed-between-unrelated-tasks (R4 violation; stale context wastes per-turn rent)
  - tool-output-blob-no-summary (R5 violation; 5K-10K log spew accumulating as raw context vs structured summary)
