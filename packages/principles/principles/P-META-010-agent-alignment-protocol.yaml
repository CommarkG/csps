# Phase 7 token-optimization §9.8 Candidate #1 (S010)
# Load this file (P-META-010-agent-alignment-protocol.yaml) instead of the full principles.yaml (~85K)
# when you only need this one principle in your AI session context.
id: P-META-010
name: agent-alignment-protocol
aliases:
  - AAP
  - no-wildcards
  - agent-alignment
  - mechanical-agent-discipline
category: meta
severity: critical
statement: |
  Every agent (CSPS-built skill / claude-code-builtin subagent / Mastra runtime agent /
  third-party-imported skill) used in CSPS work MUST pass through the Agent Alignment Protocol
  (AAP) before invocation. NO WILDCARDS — no agent enters the system without alignment.
  AAP enforces 9 mandatory checks: identity / schema compliance / B_* contract acknowledgment /
  Quality Gate respect / capability set / trust tier / output contract / eval baseline /
  pre-flight check + alignment preamble. Class A (CSPS-built) declares via frontmatter; Class B
  (claude-code-builtin) wraps via spawn-prompt alignment preamble; Class C (Mastra) enforces
  at construction; Class D (third-party) at Quarantine→Vendored→Platform-owned promotion.
counterweight: |
  Trivial Class B built-in invocations for one-shot lookup (single grep / single file read)
  may use abbreviated preamble (universal-required B_* subset only). The discipline targets
  INVOCATIONS WITH WORK SCOPE — agents that produce output the main session reasons over.
industry_lineage:
  - Snyk ToxicSkills (13.4% malicious AI agent skills measured) — empirical default-deny justification
  - Anthropic Agent SDK + Sub-Agents docs — context isolation pattern
  - agents.md cross-vendor spec — preamble convention target
  - agentskills.io Class A frontmatter convention
  - CSP B_AUTONOMY_4_CONDITIONS + B_CHECKPOINT_8_CATEGORIES (CSP carry-forwards) — alignment preamble subset
  - User S005 turn 25 directive — "no agents created out of CSPS allowed... mechanically create alignment protocol"
config:
  agent_classes:
    A_csps_built:
      source: packages/skills/<name>/SKILL.md or libs/agents/<name>
      alignment_mode: frontmatter-declaration
      preflight: >-
        csps_aligned + aap_version + acknowledged_contracts + respects_quality_gates + output_contract + trust_tier
        fields
    B_claude_code_builtin:
      source: harness-provided (Explore / Plan / general-purpose / claude-code-guide / statusline-setup)
      alignment_mode: spawn-prompt-alignment-preamble
      preflight: AAP preamble injected as first content block before task description
    C_mastra_runtime:
      source: libs/agents/<name> per pillar-5/mastra-setup.md
      alignment_mode: BaseAgent-middleware-injection-at-construction
      preflight: agent.zmodel AAP fields + Mastra middleware enforces preamble in systemPrompt
    D_third_party_imported:
      source: nx g platform:skill-import
      alignment_mode: tier-gated (Quarantine → Vendored → Platform-owned) + per-invocation AAP
      preflight: trust_tier appropriate + AAP at every tier transition
  mandatory_check_set:
    - identity-declaration
    - schema-compliance
    - b-star-contract-acknowledgment
    - quality-gate-respect
    - capability-set
    - trust-tier
    - output-contract
    - eval-baseline
    - preflight-check-and-alignment-preamble
  universal_required_b_star_acknowledgments:
    - B_AI_PROFESSIONAL_VOICE
    - B_VALIDATE_BEFORE_ASSUME
  no_wildcards: true
  optional_field_set_phase_1:
    - principle_compliance
    - consolidation_cross_refs
  mandatory_field_set_phase_2_target_S012:
    - csps_aligned
    - aap_version
    - agent_class
    - acknowledged_contracts
    - respects_quality_gates
    - output_contract
    - trust_tier
    - principle_compliance
    - consolidation_cross_refs
  universal_required_principle_compliance:
    - P-META-010
    - P-META-002
  phase_2_promotion_gates:
    - s011_backfill_complete: all 16 existing SKILL.md retrofitted with 2 new fields
    - validator_warn_to_error: tools/validators/validate-aap-frontmatter.mjs warning logic promoted to errors[]
    - audit_slug_status: aap-9-field-coverage severity warn → error
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: >-
      Hard NO — never invoke agent (Class A/B/C/D) without AAP alignment (frontmatter for A/C/D; preamble for B) — S005
      turn 25
  - layer: contract
    location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_AGENT_ALIGNMENT_PROTOCOL
    description: Canonical contract — operationalizes 9-check protocol + per-class alignment mode
  - layer: frontmatter-contract
    location: docs/plan/pillar-0-governance/agent-alignment-protocol.md
    description: The dashboard leaf — full 9-check spec + per-class table + alignment preamble template + schema alignment
  - layer: ci-check
    location: libs/audits/checks/agent-alignment-coverage.ts
    description: >-
      PR-blocking error — every SKILL.md/agent.zmodel has csps_aligned + aap_version + acknowledged_contracts +
      respects_quality_gates + output_contract + trust_tier; missing fields fail PR; planned week-4
  - layer: ci-check
    location: libs/audits/checks/subagent-spawn-preamble-required.ts
    description: >-
      PR-blocking warn (per-session) — scans session log for Agent tool invocations; verifies spawn prompt contains AAP
      alignment preamble for Class B; flags missing; planned week-4
  - layer: hook
    location: .claude/hooks/pre-tool-use-agent-aap.sh
    description: >-
      PreToolUse on Agent tool — intercepts invocations; verifies preamble OR injects it auto for Class B; planned
      week-4
  - layer: memory
    location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_agent_alignment_protocol.md
    description: Cognitive layer — loaded session-start
  - layer: ai-behavior-spine
    location: docs/plan/pillar-0-governance/ai-behavior-spine.md
    description: >-
      Discipline matrix row — composes B_VALIDATE_BEFORE_ASSUME + B_NO_INVENTION_WITHOUT_PRECEDENT_CHECK +
      B_INTAKE_DISCIPLINE for the per-invocation alignment
  - layer: generator-prompt
    location: tools/generators/skill/files/AAP-frontmatter.template
    description: nx g platform:skill template injects AAP frontmatter scaffolding; new skills cannot ship without; week-3+
  - layer: runtime
    location: libs/agents/dispatcher-middleware.ts
    description: Mastra BaseAgent middleware enforces AAP at construction; preamble auto-injected into agent.systemPrompt; week-6+
  - layer: mcp-resource
    location: packages/principles-mcp/src/resources.ts
    description: Exposed as principles://agent-alignment-protocol with full 9-check spec + alignment-preamble template
enforcer_count: 11
cross_references:
  - P-META-001
  - P-META-002
  - P-META-006
  - P-META-009
  - P-ARCH-025
  - P-OP-001
anti_patterns:
  - agent-invocation-without-alignment (the meta-pattern this principle exists to cure)
  - >-
    class-B-builtin-spawn-without-preamble (Explore/Plan/general-purpose/etc. invoked without alignment-preamble =
    wildcard)
  - class-A-skill-without-AAP-frontmatter (csps_aligned/acknowledged_contracts/respects_quality_gates fields missing)
  - subagent-receives-synthesis-task (QG2 violation; agent doesn't see full context)
  - capability-creep-without-redeclaration (allowed_tools expanded silently between invocations)
  - trust-tier-bypass (third-party skill invoked at Quarantine tier for Vendored-tier work)
  - eval-baseline-stale (last-eval >30 days for non-trivial agent)
  - output-contract-violation (agent returns more than declared max_tokens or wrong shape)
  - preflight-check-skipped-because-trivial (every invocation needs preflight; no exceptions)
