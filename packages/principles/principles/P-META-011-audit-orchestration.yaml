id: P-META-011
name: audit-orchestration
aliases:
  - audit-hub
  - pipeline-discipline
  - orchestration
category: meta
severity: error
statement: |
  The audit-runner.md registry (slug-level audits) operates UNDER the audit-hub.md
  orchestration layer (pipelines + triggers + handling + dashboard). Every audit
  belongs to exactly one pipeline; every pipeline has explicit triggers + handling
  matrix + dependency graph. Severity routing is uniform (info=log; warn=dashboard
  + digest; error=Linear ticket + PR block; critical=Slack page + incident-on-real-time).
  Dynamic schema connections: every audit has bidirectional principle linkage
  (backed_by_principle ↔ enforcer reference); cross-ref-resolution audit verifies.
counterweight: |
  Ad-hoc one-off audit invocations (debugging a specific failure; investigating an
  incident) may bypass the pipeline structure with explicit reason. The discipline
  targets RECURRING audit execution (PR / per-session / nightly / weekly).
