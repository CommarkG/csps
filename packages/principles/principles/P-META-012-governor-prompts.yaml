# P-META-012-governor-prompts.yaml
# CSPS Principle Slice — generated by tools/split.mjs
# Source of truth: packages/principles/principles.yaml
# DO NOT edit this file directly — run `pnpm --filter @csps/principles split` to regenerate
# Phase 7 token-optimization §9.8 Candidate #1 (S010)
# Load this file (P-META-012-governor-prompts.yaml) instead of the full principles.yaml (~85K)
# when you only need this one principle in your AI session context.
id: P-META-012
name: governor-prompts
aliases:
  - GP
  - user-prompt-governance
  - prompt-vault
  - comprehensive-prompt-tracking
category: meta
severity: critical
statement: |
  Every user prompt in CSPS chat sessions MUST be governance-tracked: assigned GP-S<NNN>-<NN>
  ID; captured verbatim with chat/session/date/hour timestamp; tagged with schema-aligned
  closed-enum dimensions (domain / type / audience / cardinal flag / engraving discipline /
  audit scope / decision topic / drop reason); distributed per SCHEMA structure to relevant
  pillar leaves / behavioral contracts / principles / cognitive-context-architecture / audits /
  ADRs; re-reviewed at every session-close. Storage: docs/plan/_handoff/VAULT/governor-prompts/
  S<NNN>.md per session. Composes with user-intents.md (cardinal-only verbatim) — Governor
  Prompts is COMPREHENSIVE; user-intents is curated subset of cardinal-flagged GPs.
counterweight: |
  Single-word or trivial conversational prompts ("ok", "thanks", "yes", "go") may use
  abbreviated GP entries (just timestamp + verbatim + status: confirmation; distribution
  targets may be null). The discipline targets SUBSTANTIVE prompts — directives, decisions,
  questions, drops — where governance tracking enables future-session re-derivation.
industry_lineage:
  - Linear / Asana issue-tracker per-comment audit trails
  - GitHub PR conversation thread preservation (every comment timestamp + author)
  - Jira backlog grooming with directive-traceability
  - User S005 turn 27 directive — "all I write each time reviewed each time session closing and saved in specific place"
config:
  gp_id_format: GP-S<NNN>-<NN>
  gp_id_zero_padded: true
  mandatory_fields:
    - gp_id
    - timestamp_iso8601_utc
    - chat_session_id
    - turn_number
    - verbatim_content
    - tags
    - cardinal_flag
    - distribution_targets
    - implementation_status
  storage_path: docs/plan/_handoff/VAULT/governor-prompts/S<NNN>.md
  readme_path: docs/plan/_handoff/VAULT/governor-prompts/README.md
  cross_link_to_user_intents: true
  session_close_review_mandatory: true
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: >-
      Hard NO — never close session without reviewing every substantive user prompt + creating GP entries +
      cross-linking cardinals to user-intents.md
  - layer: contract
    location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_GOVERNOR_PROMPTS
    description: Canonical contract
  - layer: frontmatter-contract
    location: docs/plan/pillar-0-governance/governor-prompts.md
    description: The dashboard / spec leaf — full schema-aligned distribution rules + format spec
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/governor-prompts/README.md
    description: Vault README + per-session storage convention
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/closing-summary-template.md
    description: §10.0e mandatory header (NEW) — every closing summary references the session GP log + aggregate metrics
  - layer: ci-check
    location: libs/audits/checks/governor-prompt-coverage.ts
    description: 'Per-session error: every substantive prompt in session log has GP entry; planned week-4'
  - layer: ci-check
    location: libs/audits/checks/governor-prompt-distribution-complete.ts
    description: 'PR-blocking warn: every GP entry has distribution_targets populated (null only for explicit drops); planned week-4'
  - layer: hook
    location: .claude/hooks/post-stop-governor-prompts.sh
    description: 'PostStop: aggregates session GPs + verifies coverage + cross-links cardinals to user-intents.md; planned week-4'
  - layer: memory
    location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_governor_prompts.md
    description: Cognitive layer; loaded session-start
  - layer: ai-behavior-spine
    location: docs/plan/pillar-0-governance/ai-behavior-spine.md
    description: 'Discipline matrix row — composes with B_INTAKE_DISCIPLINE (different surface: chat-channel vs external-input)'
enforcer_count: 10
cross_references:
  - P-META-005
  - P-META-001
  - P-META-008
  - P-META-011
anti_patterns:
  - cardinal-prompt-without-user-intents-cross-link (cardinal flag set but verbatim not propagated)
  - prompt-without-gp-entry (substantive prompt skipped session log)
  - distribution-targets-null-without-explicit-drop (lazy entry; not real governance)
  - gp-entries-batch-at-close-only (should be continuous; close is review-not-creation)
  - verbatim-paraphrased (paraphrase loses load-bearing wording; verbatim is mandatory for cardinal)
  - tags-arbitrary-not-schema-aligned (must use closed-enum dimensions per frontmatter-standard)
enforcement_tier:
  tier1_hook: pre-tool-use-humble-step-gate.sh (BLOCKING — GP coverage evidence required before session close actions)
  tier2_validator: pnpm verify full-pass (indirect coverage via contract validators)
  tier3_session: 'AGENTS.md hard-NO + session-open.sh: governor-prompts injection'
