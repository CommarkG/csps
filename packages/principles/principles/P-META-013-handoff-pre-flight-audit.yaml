# Phase 7 token-optimization §9.8 Candidate #1 (S010)
# Load this file (P-META-013-handoff-pre-flight-audit.yaml) instead of the full principles.yaml (~85K)
# when you only need this one principle in your AI session context.
id: P-META-013
name: handoff-pre-flight-audit
aliases:
  - HPFA
  - pre-handoff-audit
  - session-completeness-gate
category: meta
severity: critical
statement: |
  Every handoff creation MUST be preceded by a Handoff Pre-Flight Audit (HPFA) — a
  whole-session walk that identifies what should have been engraved but was not, what
  should be schema-audited but is not registered, what governor-prompts are missing
  entries, and what cycles should have run but didn't. Findings either (a) addressed
  in-session before handoff, or (b) carried-forward with explicit reason. No silent
  gaps allowed. Composes with B_PROTOCOL_LITERAL_EXECUTION (closing-summary template
  mandatory headers) + B_CATCH_TO_ENGRAVING (catches engraved before close) +
  B_PRE_CLOSE_VERIFICATION (verify orchestrator before close).
counterweight: |
  For sessions explicitly designated NO-NEW-WORK (verification-only / read-only browsing /
  retro-investigation), HPFA is reduced scope — only verifies governor-prompts coverage
  + schema integrity. The full HPFA fires on substantive sessions where engraving / cycle /
  audit work happened.
industry_lineage:
  - Aviation pre-flight checklist (every flight; no exceptions; mechanical)
  - Surgical timeout / WHO surgical safety checklist (Atul Gawande)
  - Toyota TPS andon-cord (stop-the-line before defects propagate downstream)
  - >-
    User S005 turn 27 directive — "on each handoff creation enforce going over the whole session and see what should be
    enforced and was not + what should be part of schema-aligned auditing and is not — complete them all"
config:
  mandatory_check_set:
    - governor_prompts_coverage
    - engraving_completeness
    - audit_registration_completeness
    - cycle_evidence_presence
    - schema_dynamic_connections
    - distribution_targets_populated
    - carry_forward_explicit
  hpfa_runs_after: pre_close_verification
  hpfa_blocks_handoff_write: true
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: Hard NO — never write HANDOFF-S<NNN>-to-S<NNN+1>.md without HPFA pass + findings addressed or carried explicit
  - layer: contract
    location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_HANDOFF_PRE_FLIGHT_AUDIT
    description: Canonical contract
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/closing-summary-template.md
    description: §10.0f HPFA results header (NEW) — mandatory
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/protocols.md
    description: §10 chat-closing protocol §10.0f added — HPFA mandatory before handoff write
  - layer: ci-check
    location: libs/audits/checks/hpfa-pre-handoff-coverage.ts
    description: >-
      PR-blocking error: every HANDOFF-S<NNN>-to-S<NNN+1>.md has HPFA evidence block; missing or empty fails PR; planned
      week-4
  - layer: hook
    location: .claude/hooks/pre-handoff-write-hpfa.sh
    description: 'Pre-handoff hook: runs HPFA cycle; refuses handoff write if HPFA returns gaps un-addressed; planned week-4'
  - layer: memory
    location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_handoff_pre_flight_audit.md
    description: Cognitive layer
  - layer: ai-behavior-spine
    location: docs/plan/pillar-0-governance/ai-behavior-spine.md
    description: >-
      Discipline matrix row — composes with B_PRE_CLOSE_VERIFICATION + B_CATCH_TO_ENGRAVING +
      B_PROTOCOL_LITERAL_EXECUTION
enforcer_count: 8
cross_references:
  - P-META-006
  - P-META-007
  - P-META-008
  - P-META-012
anti_patterns:
  - handoff-written-without-hpfa (handoff produced; whole-session not walked)
  - hpfa-findings-silently-skipped (gaps surfaced but not addressed AND not carried-forward with reason)
  - hpfa-checks-cherry-picked (only governor-prompts coverage checked; engraving + cycle + schema skipped)
  - whole-session-walk-superficial (walk says "looks fine" without examining specific catches/engravings/audits)
