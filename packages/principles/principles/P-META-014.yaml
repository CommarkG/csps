id: P-META-014
name: mutual-understanding-validation
aliases:
  - MUV
  - intent-to-impact-loop
  - two-sided-handshake-comprehensive
  - closed-loop-communication
  - I-to-I
category: meta
severity: critical
statement: |
  Every AI communication boundary MUST close the Intent-to-Impact loop via two-sided
  handshake. Asymmetric one-shot communication is forbidden for high-stakes boundaries.
  The 5 boundary types: (1) chat-to-chat handoff — current AI generates mechanical-audited
  chat-jump prompt; new AI receives + responds; user brings response back; current AI
  improves prompt instructions mechanically + replies-with-clarifications until alignment
  confirmed; (2) AI-to-AI subagent — main spawns with AAP preamble; subagent returns;
  main verifies output matches declared output_contract; loops back on mismatch; (3) AI-to-
  human — every substantive output includes "did this land?" check; user feedback feeds
  next-turn refinement; (4) AI-to-persona (week-7+) — persona-composition output validated
  against expected persona-shape; fail-closed; (5) context batches within session — batch-
  close validates intent vs impact before next batch begins. Without MUV, intent leaks at
  every communication interface and gaps accumulate invisibly.
counterweight: |
  Trivial single-turn responses (factual lookup / one-line confirmation / "ok" reply) don't
  need the full handshake — sender's output is unambiguous + receiver's acknowledgment is
  sufficient. The discipline targets HIGH-STAKES boundaries: ratification / engraving /
  session-handoff / cross-pillar synthesis / multi-step plans. Significance is judgment-
  based but biased toward over-handshake (false-positive cost is small extra round-trip;
  missed-handshake cost is silent gap propagation across boundaries).
industry_lineage:
  - Hubspot loop closure pattern (sales/customer feedback loops require explicit ack)
  - >-
    Aviation pilot-to-tower readback (tower says X; pilot reads back X verbatim; tower confirms or corrects —
    closed-loop verbal protocol; 100% mandatory)
  - Surgical timeout / WHO surgical safety checklist (every team member acknowledges before incision)
  - TCP three-way handshake (SYN / SYN-ACK / ACK — formalized closed-loop network communication)
  - Toyota TPS jidoka (autonomation with mutual-understanding pause-the-line on anomaly)
  - >-
    User S005 turn 28 directive — "AI between chats / AI to external AI elements / AI to internal personas / AI-human
    communication must include validation that what was provided as output was received and understood"
config:
  boundary_types:
    chat_to_chat_handoff:
      mechanism: chat-jump-prompt with mechanical-audited content + explicit alignment-questions section
      handshake_protocol:
        - step_1_current_ai_generates_prompt_with_audit
        - step_2_user_pastes_to_new_chat
        - step_3_new_ai_responds_with_attestation_per_protocols_§17
        - step_4_user_brings_response_back_to_current_chat
        - step_5_current_ai_audits_response_against_intent_+_refines_prompt_template_if_gaps
        - step_6_current_ai_replies_to_new_chat_via_user_with_clarifications_or_alignment_confirmed
        - step_7_iterate_until_alignment_confirmed_explicit
    ai_to_ai_subagent:
      mechanism: AAP preamble + output_contract verification on return
      handshake_protocol:
        - step_1_spawn_with_aap_preamble
        - step_2_subagent_executes_within_scope
        - step_3_main_verifies_returned_output_matches_declared_output_contract
        - step_4_main_re-spawns_with_clarification_if_mismatch
    ai_to_human:
      mechanism: substantive output emits implicit/explicit "did this land?" check
      handshake_protocol:
        - step_1_ai_emits_output
        - step_2_user_acknowledges_or_corrects
        - step_3_ai_refines_based_on_correction_OR_proceeds
        - step_4_high_stakes_outputs_explicit_alignment_question_at_end
    ai_to_persona:
      mechanism: persona-composition output validated against persona-shape (week-7+)
      handshake_protocol:
        - step_1_persona_dispatched
        - step_2_output_validated_against_expected_shape
        - step_3_fail_closed_on_mismatch
    context_batches_within_session:
      mechanism: batch-close validates intent vs impact
      handshake_protocol:
        - step_1_batch_proposed_with_acceptance_criteria_upfront_per_p_op_004
        - step_2_user_approves_once
        - step_3_batch_executes
        - step_4_batch_close_validates_intent_to_impact_drift
        - step_5_drift_>_threshold_pauses_+_reconfirms_with_user
  chat_jump_prompt_mandatory_contents:
    - handoff_§0_paste_target_self_contained
    - post_close_addenda_references_§24_through_§32
    - governor_prompts_log_pointer_S005_md
    - hpfa_evidence_block_pointer
    - all_carry_forwards_with_explicit_reasons
    - all_cardinal_directives_verbatim
    - verify_orchestrator_state_exit_code_summary
    - explicit_alignment_questions_for_new_chat_to_answer_back
  iteration_termination: alignment_confirmed_explicit_by_user_OR_new_chat
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: >-
      Hard NO — never close session without mechanical chat-jump prompt audit + explicit alignment-questions; never
      spawn subagent without verifying return; never emit substantive AI-human output without validation hook
  - layer: contract
    location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_MUTUAL_UNDERSTANDING_VALIDATION
    description: Canonical contract — 5 boundary types + per-boundary handshake protocol
  - layer: frontmatter-contract
    location: docs/plan/pillar-0-governance/mutual-understanding-validation.md
    description: >-
      Dashboard / spec leaf — full per-boundary specification + chat-jump-prompt mechanical-audit checklist +
      alignment-question template
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/closing-summary-template.md
    description: >-
      §10.0g MUV evidence header (NEW) — chat-jump-prompt audit results + alignment-questions emitted + (post-handshake)
      alignment-confirmed status
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/protocols.md
    description: >-
      §17 amended (the §17 attestation extends with cross-chat handshake iteration steps 4-7); §11b new step for
      receiving-AI alignment confirmation
  - layer: ci-check
    location: libs/audits/checks/muv-chat-jump-prompt-completeness.ts
    description: >-
      PR-blocking error: every chat-jump-prompt-S<NNN>-to-S<NNN+1>-detailed.md has mandatory sections (handoff §0 +
      post-close addenda + governor-prompts pointer + HPFA pointer + carry-forwards + cardinals + verify state +
      alignment-questions); planned week-4
  - layer: ci-check
    location: libs/audits/checks/muv-subagent-output-contract-verification.ts
    description: >-
      PR-blocking warn (per-session): every Agent tool invocation has paired output verification (does returned summary
      match output_contract?); planned week-4
  - layer: ci-check
    location: libs/audits/checks/muv-cross-chat-handshake-completion.ts
    description: >-
      Per-session warn: tracks chat-jump prompts across sessions; flags handshakes without iteration-to-alignment
      confirmation within 7 sessions; planned week-4
  - layer: hook
    location: .claude/hooks/pre-subagent-spawn-aap-preamble.sh
    description: 'PreToolUse on Agent: injects AAP preamble + output_contract spec; planned week-4'
  - layer: hook
    location: .claude/hooks/post-subagent-return-verify.sh
    description: 'PostToolUse on Agent return: verifies returned summary matches output_contract; flags drift; planned week-4'
  - layer: memory
    location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_mutual_understanding_validation.md
    description: Cognitive layer; loaded session-start
  - layer: ai-behavior-spine
    location: docs/plan/pillar-0-governance/ai-behavior-spine.md
    description: >-
      Discipline matrix row — composes B_TWO_SIDED_HANDSHAKE + B_INTENT_TO_IMPACT (S002 turn 6-7 origin contracts; this
      principle is the universalization to all 5 boundary types)
enforcer_count: 12
cross_references:
  - P-META-001
  - P-META-006
  - P-META-008
  - P-META-010
  - P-META-013
  - P-OP-003
  - P-OP-004
anti_patterns:
  - asymmetric-one-shot-communication-on-high-stakes-boundary (the meta-pattern this principle exists to cure)
  - >-
    chat-jump-prompt-without-alignment-questions (new chat receives instructions but has no mechanical way to surface
    ambiguity; gaps propagate silently)
  - >-
    subagent-return-not-output-contract-verified (main accepts returned summary at face value; mismatch with declared
    shape goes unnoticed)
  - >-
    ai-human-output-without-validation-hook (AI emits long synthesis; no mechanism for user to flag misalignment; intent
    leaks)
  - >-
    cross-chat-handshake-not-iterated (one round-trip insufficient; alignment-confirmed-explicit needs explicit user OR
    new-chat affirmation)
  - silent-context-batch-close (batch ends without validating intent-to-impact drift)
  - >-
    intent-to-impact-completion-claimed-without-receiver-acknowledgment (sender declares done; receiver never confirmed;
    gap)
