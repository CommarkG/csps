# Phase 7 token-optimization §9.8 Candidate #1 (S010)
# Load this file (P-META-015-universal-template-first.yaml) instead of the full principles.yaml (~85K)
# when you only need this one principle in your AI session context.
id: P-META-015
name: universal-template-first
aliases:
  - template-first
  - template-discovery-gate
  - commitment-layer-template-required
category: meta
severity: critical
statement: |
  Every commitment-layer output AI produces — persisted artifacts (.md/.yaml), code,
  prose patterns, decision frames, reasoning structures, tooling discipline — passes
  through a templated discovery gate before authoring. The template registry at
  `_handoff/VAULT/template-registry.md` is the single source of truth; entries register
  validators atomically per FSE (registration mandatory; implementation may defer).
  Escape hatch: `template_status: novel-pending-pattern-evaluation` with K=2 promotion
  to stable template after 2 successful uses.
counterweight: |
  Native AI thinking (mid-conversation reasoning, exploratory analysis, debugging walks,
  creative synthesis) is NOT gated. Templates apply at COMMITMENT-LAYER (persisted,
  structurally recurring) — not at THINKING-LAYER (in-conversation native).
industry_lineage:
  - Spring Framework — bean templates + composition patterns
  - Rails generators — scaffolding-as-policy
  - CSP S331 ADR-0004 — template-only-page-creation; 22-template UI catalog
  - User S006 turn 5 directive — "have a template structure aligned to the schema"
config:
  template_registry_path: docs/plan/_handoff/VAULT/template-registry.md
  output_categories:
    - persisted-artifact
    - code
    - prose
    - reasoning-tooling
    - agent-persona
  escape_hatch_status: novel-pending-pattern-evaluation
  K_promotion_threshold: 2
  fail_closed_when_template_known: true
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: 'Hard NO — never create persisted commitment-layer artifact without template_used: field'
  - layer: contract
    location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_TEMPLATE_FIRST_CREATION
    description: B_TEMPLATE_FIRST_CREATION canonical contract
  - layer: memory
    location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_universal_template_first.md
    description: Cognitive layer; loaded session-start
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/template-registry.md
    description: Single source of truth for all templates
  - layer: ci-check
    location: libs/audits/checks/template-citation-on-creation.ts
    description: 'Validator — every commitment artifact has template_used: field (registered atomic; impl week-4)'
  - layer: ci-check
    location: libs/audits/checks/template-registry-coverage.ts
    description: Validator — registered templates have file paths (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/novel-pending-pattern-evaluation-staleness.ts
    description: Validator — entries staleness >5 sessions (registered atomic; impl week-4)
  - layer: ai-behavior-spine
    location: docs/plan/pillar-0-governance/ai-behavior-spine.md
    description: Discipline matrix row — composes with B_FIVE_SURFACE_ENGRAVING (5 surfaces themselves are templates)
  - layer: hook
    location: .claude/hooks/pre-tool-use-template-citation.sh
    description: PreToolUse — refuses Edit/Write to commitment artifact-types without template citation (planned week-4)
enforcer_count: 9
cross_references:
  - P-OP-001
  - P-META-007
  - P-META-016
  - P-META-017
  - P-ARCH-028
anti_patterns:
  - free-write-on-recurring-artifact-type (template exists but not cited)
  - silent-skip-of-discovery-gate (artifact created bypassing template registry consultation)
  - novel-pending-pattern-evaluation-staleness-ignored (entry sits novel-pending >5 sessions)
  - thinking-layer-templates-imposed (templates applied to mid-conversation native reasoning — kills creativity)
