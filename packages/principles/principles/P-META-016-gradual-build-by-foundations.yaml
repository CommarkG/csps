id: P-META-016
name: gradual-build-by-foundations
aliases:
  - gradual-build
  - foundation-first
  - depth-3-4-5-discipline
  - priority-engine-driven
category: meta
severity: critical
statement: |
  Every multi-session topic enters CSPS via a templated gradual-build-plan instance
  that identifies foundations, enumerates 3/4/5 levels (free-form N rejected), places
  levels via priority engine (5-dimension formula + 4 bands), sets per-layer ZF gates
  (foundation-stability-before-layer-N), registers backtrack triggers, and spans
  explicit session arcs. Topics that bypass this discipline produce cascading rework
  from skipped foundations + arbitrary N-part splits + tunnel-vision single-next-item
  execution.
counterweight: |
  Single-turn reversible work (typo fix, single-line edit, mechanical refactor confined
  to one file) doesn't require gradual-build-plan instance. Discipline targets work that
  (a) requires >1 session arc, OR (b) depends on >2 foundation-stable elements, OR
  (c) crosses >1 Core Spine, OR (d) is cross-actor (affects persona/agent/customer).
industry_lineage:
  - Toyota Production System — sequential dependent operations; never start downstream until upstream proves stable
  - John Boyd OODA — iterate; foundation observation before orient before decide before act
  - CSP S114 BUILD ORDER VALIDATION (Governor directive) — cross-item prerequisite check before SCOPE
  - CSP S139 PE TRAJECTORY — multi-step lookahead instead of single-next-item myopia
  - User S006 turn 5 directive — "develop a gradual build methodology engraved into the multi session plan"
config:
  depth_schema:
    - 3
    - 4
    - 5
  free_form_N_rejected: true
  depth_3_levels:
    - foundation
    - build
    - polish
  depth_4_levels:
    - foundation
    - core
    - integration
    - polish
  depth_5_levels:
    - foundation-primitives
    - foundation-composition
    - core
    - integration-and-cross-layer-audits
    - polish-and-observability
  ZF_gate_per_level: mandatory
  foundation_stability_required: true
  priority_engine_schema: tools/templates/priority-engine.schema.yaml
  topic_plans_path: docs/plan/_handoff/VAULT/topic-plans/
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: Hard NO — never start multi-session topic without templated gradual-build-plan instance
  - layer: contract
    location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_GRADUAL_BUILD_BY_FOUNDATIONS
    description: B_GRADUAL_BUILD_BY_FOUNDATIONS canonical contract
  - layer: memory
    location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_gradual_build_by_foundations.md
    description: Cognitive layer; loaded session-start
  - layer: frontmatter-contract
    location: tools/templates/gradual-build-plan.template.md
    description: Canonical template; required frontmatter fields enforced
  - layer: frontmatter-contract
    location: tools/templates/priority-engine.schema.yaml
    description: Priority engine schema — formula + bands + push-back rules
  - layer: ci-check
    location: libs/audits/checks/gradual-build-plan-coverage.ts
    description: Validator — multi-session topic in handoff/governor-prompts without plan file (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/priority-engine-depth-respected.ts
    description: Validator — depth ∉ {3,4,5} rejected (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/foundation-stability-before-layer-N.ts
    description: Validator — L+1 work without L ZF blocked (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/humble-batching-required.ts
    description: Validator — batch without composition rationale flagged (registered atomic; impl week-4)
  - layer: ai-behavior-spine
    location: docs/plan/pillar-0-governance/ai-behavior-spine.md
    description: Discipline matrix row
  - layer: hook
    location: .claude/hooks/user-prompt-submit-multi-session-detector.sh
    description: Pattern-match user prompt for multi-session indicators; emit reminder if no topic-plan (planned week-4)
enforcer_count: 11
cross_references:
  - P-OP-001
  - P-META-008
  - P-META-015
  - P-META-018
  - P-ARCH-028
anti_patterns:
  - finish-fast-urge (multi-session topic completed in one turn; foundations skipped)
  - arbitrary-N-part-split (split into 7 parts without rationale; depth not 3/4/5)
  - skip-foundation-shortcut (jump to feature-build without ZF on foundation)
  - tunnel-vision-single-next-item (no PE TRAJECTORY emitted; only next item)
