id: P-META-017
name: csps-alignment-over-inner-defaults
aliases:
  - inner-defaults-override
  - csps-alignment-discipline
  - training-defaults-overridden
category: meta
severity: critical
statement: |
  Every AI output is gated by alignment against the inner-AI-defaults registry
  at `_handoff/VAULT/inner-ai-defaults/`. Training-baked defaults (sycophantic prose,
  reflexive try/catch, narrative comments, generic naming, finish-fast urge, etc.)
  that conflict with CSPS are overridden; defaults that compose well are kept;
  partials are adjusted. Continuous-drift-log captures new defaults as discovered
  (per-session leak detector + per-week drift comparison + per-major-model-update
  full re-registration sweep). The registry IS the override map.
counterweight: |
  Training defaults that align with CSPS DNA (e.g., parallel tool calls when
  independent, BLUF responses, structured tables) are kept — disposition: keep.
  The override is selective, not blanket.
industry_lineage:
  - Airbnb Airflow — config-as-code overrides defaults; defaults visible via tooling
  - PolicyAsCode (OPA/Rego) — defaults declared explicitly; overrides traceable
  - User S006 turn 6 directive — "you must formalize now the collection and saving of your inner coding"
config:
  registry_path: docs/plan/_handoff/VAULT/inner-ai-defaults/
  categories:
    - code
    - prose
    - reasoning
    - tooling
    - output
  dispositions:
    - keep
    - override
    - adjust
  validation_cadence:
    per_session: inner-default-leak-detector
    per_week: alignment-drift-over-time
    per_quarter: inner-default-registry-coverage
    per_major_model_update: mandatory-full-re-registration
  K_promotion_threshold: 2
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: Hard NO — never emit substantial output without alignment-check against inner-defaults registry
  - layer: contract
    location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_CSPS_ALIGNMENT_OVER_INNER_DEFAULTS
    description: B_CSPS_ALIGNMENT_OVER_INNER_DEFAULTS canonical contract
  - layer: memory
    location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_csps_alignment_over_inner_defaults.md
    description: Cognitive layer; loaded session-start
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/inner-ai-defaults/README.md
    description: Per-entry schema; registry index
  - layer: ci-check
    location: libs/audits/checks/inner-default-leak-detector.ts
    description: Validator — scans chat transcript + edited files for known-default tells (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/alignment-citation-on-substantial-output.ts
    description: Validator — substantial outputs cite §10.0i alignment-checks (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/alignment-drift-over-time.ts
    description: Validator — weekly drift detection (registered atomic; impl week-4)
  - layer: ai-behavior-spine
    location: docs/plan/pillar-0-governance/ai-behavior-spine.md
    description: Discipline matrix row
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/closing-summary-template.md#§10.0h
    description: Mandatory §10.0h inner-default leak report at every session close
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/closing-summary-template.md#§10.0i
    description: Mandatory §10.0i alignment-citation summary at every session close
enforcer_count: 10
cross_references:
  - P-META-006
  - P-META-007
  - P-META-009
  - P-META-015
  - P-META-018
anti_patterns:
  - 'sycophantic-affirmation (training default: Great-question prefix)'
  - reflexive-try-catch (training default wraps every external call)
  - narrative-comments (training default explains WHAT code does instead of WHY non-obvious)
  - confirmation-seeking-tail (training default Should-I-proceed without 4-condition gate)
  - mock-by-default-in-integration-tests (CSPS aligned uses real DB only; mocks for unit tests)
