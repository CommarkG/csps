# when you only need this one principle in your AI session context.
id: P-META-019
name: structural-prevention-discipline
aliases:
  - enhancement-over-recovery
  - prevention-over-patch
  - system-enhancement-constantly
category: meta
severity: critical
statement: |
  When an enforcement is skipped, late, or partial — fix the STRUCTURE that allowed
  the skip, not the instance. Every closing-summary §10.0j header captures enhancement
  proposals from any enforcement gap discovered this session. Silent empty proposals
  forbidden — explicit zero_proposals_declaration with reason required. Philosophy:
  enhance the system constantly; never settle for low standards + manual recovery.
counterweight: |
  Trivial single-instance gaps that don't recur (typo in one file; unique config drift
  caused by external tool change) may be fixed-in-place without structural enhancement
  proposal — but MUST be logged in continuous-drift-log with K=1 status. K=2 promotes
  to mandatory structural fix.
industry_lineage:
  - Toyota Production System — andon-cord triggers root-cause analysis, not workaround
  - Sidney Dekker (safety-II) — investigate why-system-allowed not why-actor-failed
  - CSP B_STRUCTURAL_PREVENTION (engraved S006 turn 8 absorption)
  - >-
    User S006 turn 8 directive verbatim — "if an enforment was skipped system will mandatory find enhacement to prevent
    this from happening. the philosophy is to enhance the system constantly"
config:
  gap_categories:
    - skipped-enforcement
    - late-catch
    - partial-coverage
  proposal_required_fields:
    - skipped_enforcement
    - what_was_skipped
    - why_existing_mechanism_failed
    - structural_fix_proposal
    - K_promotion_status
    - priority_score
  K_promotion_threshold: 2
  silent_empty_proposals_forbidden: true
  zero_proposals_declaration_required_when_empty: true
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: Hard NO — never close session without §10.0j enhancement-proposals scan (silent skipping forbidden)
  - layer: contract
    location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_STRUCTURAL_PREVENTION_DISCIPLINE
    description: B_STRUCTURAL_PREVENTION_DISCIPLINE canonical contract
  - layer: memory
    location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_structural_prevention_discipline.md
    description: Cognitive layer; loaded session-start
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/closing-summary-template.md#§10.0j
    description: Mandatory §10.0j enhancement proposals header at every session close
  - layer: ci-check
    location: libs/audits/checks/enhancement-proposal-coverage.ts
    description: >-
      Validator — every skipped/late/partial enforcement detected this session has paired proposal (registered atomic;
      impl week-4)
  - layer: ci-check
    location: libs/audits/checks/structural-fix-vs-instance-fix-discipline.ts
    description: Validator — K=2 recurring patterns produce structural fix not instance patch (registered atomic; impl week-4)
  - layer: ai-behavior-spine
    location: docs/plan/pillar-0-governance/ai-behavior-spine.md
    description: Discipline matrix row
  - layer: frontmatter-contract
    location: docs/plan/_handoff/VAULT/element-reviews/README.md
    description: Element-review pattern is the depth-3 mechanism for structural-fix proposals
enforcer_count: 8
cross_references:
  - P-META-006
  - P-META-007
  - P-META-013
  - P-META-016
anti_patterns:
  - silent-skip-of-enhancement-scan (§10.0j header missing or zero_proposals without explicit declaration)
  - patch-the-instance-without-structural-fix (recurring pattern fixed only in current instance)
  - low-standards-acceptance (settling for "we'll fix it later" instead of system enhancement)
  - K2-recurring-pattern-not-promoted-to-engraving
