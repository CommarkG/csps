id: P-META-020
name: concept-first-governance
aliases:
  - context-is-compass
  - reference-sampling
  - concept-over-rules
  - context-driven-navigation
category: meta
severity: critical
statement: |
  Context is the primary navigation tool for AI behavior within CSPS. Rigid enforcement
  elements — behavioral contracts, validators, hooks, sealed doctrine — are reference samples
  that confirm whether behavior honors the underlying concept, not the primary definition of
  correct behavior. Every AI processing step loads the relevant conceptual frame (L1/L2 spine
  domain) before executing via the Threshold PREAMBLE (CONCEPT_LOAD). When a validator fails,
  the diagnostic path is: L3 instance failure → L2 domain drift? → L1 conceptual anchor still
  intact? The fix targets the concept at the highest drifted level, not just the L3 artifact.
  This methodology scales without bound because conceptual understanding handles infinite
  specific cases; rule enumeration cannot.
counterweight: |
  Conceptual understanding without reference samples drifts undetected. The validator set
  (L3 instances) is the measurement instrument; conceptual alignment without validators is
  unmeasured. Both are required: context navigates, validators confirm. Where a concept is
  not yet expressed in a validator, it is not yet fully specified — the absence of a validator
  is a signal to complete the concept's expression, not a license to proceed unchecked.
  P-META-020 does not make validators optional; it reframes what a failure means.
industry_lineage:
  - >-
    Robert C. Martin (Clean Architecture) — domain model at center, framework at periphery; dependency inversion ensures
    outer rings cannot pollute inner rings
  - Onion Architecture — concentric spheres with Sphere 0 undefeatable; expansion via outer layers without touching core
  - >-
    Toyota Production System (andon cord) — composes with P-META-019; stopping to fix the system = re-anchoring to the
    concept that the instance violated
  - >-
    User S014 directive (verbatim) — "context is the compass that enables AI to resolve situations consistently using
    the rigid mechanical enforcements as points of reference to validate the concept"
  - >-
    Gemini architectural research S014 — confirmed CSPS Core Spine architecture IS the Onion model; Clean Architecture =
    dependency inversion at platform level
config:
  conceptual_load_trigger: every_input_via_threshold_preamble
  spine_selection_map:
    user_directive: GVRN
    implementation: ARCH
    ai_behavior: AI
    validation: VALD
    operations: OPER
    external_content: AI
  diagnostic_path:
    - l3_instance_fail
    - l2_domain_drift_check
    - l1_anchor_intact_check
  concept_ref_field: conceptual_sample_of
  scope_boundary:
    cca_layer_1: session_wide_constitution_loaded_at_session_open
    threshold_preamble: per_input_domain_selection
  parent_frame_for:
    - P-META-017
    - P-META-018
    - P-META-019
enforcers:
  - layer: instruction-file
    location: docs/plan/pillar-0-governance/concept-first-governance.md
    description: Canonical methodology document — full model + diagnostic path + anti-patterns
  - layer: instruction-file
    location: docs/plan/pillar-0-governance/threshold-gate-v2.md#PREAMBLE
    description: CONCEPT_LOAD preamble fires on every Threshold input before classification
  - layer: instruction-file
    location: docs/plan/_handoff/VAULT/topic-plans/p-meta-020-concept-first-governance.md
    description: Depth-3 implementation plan for rolling out the methodology
  - layer: frontmatter-contract
    location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_NO_WILD_IMPLEMENTATION
    description: Plan-coverage gate = concept expression required before implementation
  - layer: hook
    location: .claude/hooks/pre-tool-use-plan-coverage-gate.sh
    description: Mechanical enforcement — blocks writes to libs/apps without covering plan (pipe-tested)
enforcer_count: 5
cross_references:
  - P-META-017
  - P-META-018
  - P-META-019
  - P-META-009
  - P-ARCH-028
  - P-META-021
anti_patterns:
  - rule-violation-patching (L3 fails → patch artifact without L2/L1 diagnostic)
  - context-depth-degradation (understanding degrades to checkbox; new situations handled by rule lookup)
  - validator-proliferation (validators as substitute for concept depth; rules growing without bound)
  - concept-load-skip (processing input before loading conceptual frame via Threshold PREAMBLE)
  - interface-pollution (outer sphere concern requiring core schema change = concept violation)
enforcement_tier:
  tier1_hook: pre-tool-use-plan-coverage-gate.sh (BLOCKING — concept-first gate; plan-coverage required before implementation)
  tier2_validator: pnpm verify full-pass (indirect coverage via contract validators)
  tier3_session: AGENTS.md hard-NO + session-open.sh principle injection
