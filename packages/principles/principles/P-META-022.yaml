id: P-META-022
name: human-intent-crystallization
title: Human Expression ≠ Human Intent — The Platform's Primary Responsibility
description: >
  The gap between what a human expresses (Layer 1) and what they truly need (Layer 3) is the DEFAULT condition of
  human-AI interaction. Acting on Layer 1 without probing Layer 2-3 is arrogance that generates compounding drift. The
  platform must help humans traverse L1→L2→L3 through the Reflect-Until-Match protocol before any planning begins.
  goal_statement must be human-authored. done_criteria must be measurable. Drift generated at the understanding layer
  cannot be fixed at the implementation layer.
