id: P-META-024
name: multi-topic-intake-decomposition
title: Multi-Topic Intake Decomposition — Decompose Before Crystallizing
description: >
  When a single human expression contains multiple distinct topics (N > 1), the platform must decompose before
  crystallizing. Each sub-topic becomes an independent intake event, routed through P-META-023 (I→VI crystallization)
  individually. A prompt that triggers more than 2 distinct CONCEPT_LOAD classifications is not "Standard chat" — it is
  N intake events, each requiring its own background, problem, directions, goal, and done-signal. Treating N topics as
  one creates shallow coverage of all N vs. deep coverage of one. Detection heuristic: > 2 distinct CONCEPT_LOAD spine
  classifications in a single prompt signals multi-topic input requiring decomposition. The decomposition step produces
  a routing table: [concern | spine | disposition: act/vault/escalate]. Composes in sequence: P-META-024 (decompose) →
  per-sub-topic → P-META-023 (crystallize). Prevents the "7 concerns = Standard chat → 95% governance debt" failure
  pattern identified in S027 retrograde analysis.
spine: GVRN
layer: L1
category: meta-governance
parent_principle: P-META-022
composes_with:
  - P-META-022
  - P-META-023
  - B_PE_ALIGNMENT_GUARDIAN
  - B_COMPLETION_OVER_SHINY
enforces:
  - B_INTAKE_DISCIPLINE
detection_heuristic: >
  Single prompt with > 2 distinct CONCEPT_LOAD spine classifications → decompose first. AI declares: "I see N concerns
  in this prompt. Routing table: [list]."
