title: Context-and-Intent Operating Principle — AI Acts from Layer 3, Not Layer 1 Rules
description: >
  Every rule in CSPS is a Layer 1 proxy for a Layer 3 intent. P-META-022 closes the L1→L3 gap for human expression.
  P-META-025 closes the same gap for AI rule-following. An AI operating from C&I understands WHY rules exist and serves
  that intent — especially in novel situations the rules never anticipated. Rules are reference points, not commands.
  When rule and intent conflict: serve the intent, document the deviation. CDAB (B_CDAB) handles context loading
  mechanics; C&I is the philosophy that USES the loaded context. The most significant impact is on new thing creation:
  C&I asks "does this intent already have a home?" before creating anything new — extending B_CONSOLIDATION_PASS to the
  intent level.
