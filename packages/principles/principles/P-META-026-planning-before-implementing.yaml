id: P-META-026
name: planning-before-implementing
aliases:
  - planning-first
  - plan-before-code
  - sandbox-first
  - PBI
title: Planning Before Implementing — No Code Without Ratified Plan
description: >
  Implementation begins only after a ratified plan exists. Initial expression of a requirement is always a draft — never
  acted on directly. The lifecycle is: express intent → crystallize (JTBD + 1-3 questions) → template match → sandbox
  spec → Governor ratification → build. "proceed" from the Governor means permission to plan, not permission to
  implement. Only explicit ratified_at on a PI item permits implementation to begin. This principle prevents the pattern
  of building the right thing in the wrong direction — which costs more to undo than it cost to build.
spine: GVRN
layer: L1
category: meta-governance
severity: critical
composes_with:
  - P-META-022
  - P-META-025
  - B_NO_WILD_IMPLEMENTATION
enforcement_tier:
  tier1_hook: pre-tool-use-plan-coverage-gate.sh (BLOCKING — new libs/ files require ratified PI)
  tier2_validator: validate-implementation-gate.mjs (BLOCKING — checks PI file for ratified status)
  tier3_session: 'session-open.sh: ratification required before implementation; ''proceed'' ≠ ratified_at'
ratified_by: Governor S040 C1
ratified_date: '2026-05-17'
session: S040
self_check_q: |
  "Does a ratified PI item exist for what I am about to build?
   Has Governor set ratified_at? Is 'approved' the same as ratification? (No.)"
