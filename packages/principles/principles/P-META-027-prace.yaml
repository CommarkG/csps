title: PRACE — Permanent Recurring AI Contextual Enforcement
description: >
  Every governance rule in CSPS must answer three questions before it is considered enforced: (1) What training default
  does it override? (2) What AI satisfaction point does it prevent? (3) What T1+T2+T3 mechanical enforcement fires on
  violation? A rule that cannot answer all three is a suggestion, not governance. T3-only rules (session injection only)
  drift within 10 turns. T1+T2 enforcement fires regardless of AI cooperation. Context fades; hooks do not. PRACE is the
  governing philosophy of ALL enforcement in CSPS — the standard every new rule must meet before being declared
  ratified.
