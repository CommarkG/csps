  - communication-is-prevention
  - crcp
title: Context-Refined Communication is the Primary Prevention Tool
description: >
  However deep an insight, if communicated rigidly or without context, the intent never delivers the exact result aimed
  for. Every instruction/number/rule/definition is wrapped in interpretable context; samples are marked as samples;
  thresholds marked tunable; definitions written to allow expansion, never silent caps. Sits above the comms-schema (the
  *why*) and IS a prevention class. Cross-referenced FROM comms-schema + prevention-class register (bidirectional). The
  cornerstone of the Facet pack (Facets A-F in PLAN-S069 ADDENDUM).
spine: GVRN
layer: L1
category: meta-governance
severity: critical
is_cornerstone: true
governing_intent: >
  Numbers stay tunable. Definitions stay expandable. Instructions carry context. A rule without its 'why' is a command
  that invites wrong execution. Rigid communication is the primary failure mode of governance drift.
bidirectional_cross_refs:
  - docs/plan/pillar-0-governance/communication-spine/communication-schema.yaml
  - tools/data/prevention-class-register.yaml
sibling_doctrines:
