id: P-META-028
name: context-refined-communication
aliases:
  - context-refined-communication-principle
  - cornerstone-communication
  - communication-is-prevention
  - crcp
title: Context-Refined Communication is the Primary Prevention Tool
description: >
  However deep an insight, if communicated rigidly or without context, the intent never delivers the exact result aimed
  for. Every instruction/number/rule/definition is wrapped in interpretable context; samples are marked as samples;
  thresholds marked tunable; definitions written to allow expansion, never silent caps. Sits above the comms-schema (the
  *why*) and IS a prevention class. Cross-referenced FROM comms-schema + prevention-class register (bidirectional). The
  cornerstone of the Facet pack (Facets A-F in PLAN-S069 ADDENDUM).
spine: GVRN
layer: L1
category: meta-governance
severity: critical
is_cornerstone: true
governing_intent: >
  Numbers stay tunable. Definitions stay expandable. Instructions carry context. A rule without its 'why' is a command
  that invites wrong execution. Rigid communication is the primary failure mode of governance drift.
bidirectional_cross_refs:
  - docs/plan/pillar-0-governance/communication-spine/communication-schema.yaml
  - tools/data/prevention-class-register.yaml
sibling_doctrines:
  - docs/plan/pillar-0-governance/RZF-LATEST.md
  - docs/plan/pillar-0-governance/LONG-RUN-BUILDER-DOCTRINE.md
composes_with:
  - P-META-006
  - P-META-019
  - P-META-027
enforcement_tier:
  tier1_hook: validate-context-wrapped-numbers.mjs (advisory scan)
  tier2_validator: validate-context-wrapped-numbers.mjs + context-wrapped-numbers-allowlist.yaml
  tier3_session: context_question field + session-open injection
  rigidness_check:
    description: 4-question Rigidness Test — operational T1/T2 check of P-META-028 for every rule written or ratified
    applies_to: every rule / principle / definition being authored or ratified
    source: ux-ui-doctrine-S072.md §Rigidness Test — R1 verdict PROTO-S073-M1-CLOSE-AND-M3 (OPUS-15 S073)
    note: NOT a new principle — wired UNDER P-META-028 per new-over-active discipline (OPUS-15 S072 ratification verdict R1)
    questions:
      - Does this rule give the REASONING or just the PRESCRIPTION?
      - Could an AI follow this rule perfectly and still produce the wrong result?
      - Is this still true in edge cases (mobile, RTL, dense data, empty state)?
      - Would removing the prescription and leaving only the reasoning produce BETTER outcomes?
    trigger: BEFORE every rule written; AFTER session audit; AT Opus ratification
    if_3_or_4_yes: Rule is rigid — rewrite to embed reasoning, not just prescription
ratified_by: Governor S071 (OPUS-14 directed)
ratified_date: '2026-05-30'
session: S071
self_check_q: |
  "Is this number marked (sample/tunable/expandable)?
   Is this definition written to allow expansion, not a silent cap?
   Does this instruction carry its reasoning, not just its command?
   If no — apply P-META-028 cornerstone before proceeding."
