  - P-META-019
  - P-OP-001
enforcement_tier:
  tier1_hook: pre-tool-use-inventory-scan-required.sh (ADVISORY S067 → BLOCKING S068)
  tier2_validator: validate-inventory-scan-coverage.mjs + validate-tab-transfer-completeness.mjs
  tier3_session: session-open.sh T1 injection — inventory-scan reminder + council-skill dispatch per M-42
ratified_by: Governor S066 (Opus-11 directed)
