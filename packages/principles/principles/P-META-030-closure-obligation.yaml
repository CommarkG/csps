id: P-META-030
name: closure-obligation
aliases:
  - closure-obligation-principle
  - artifact-closure-law
  - no-floater-without-leash
title: Closure Obligation — Every Non-Terminal Artifact Has a Tracked Path to Terminal
description: >
  Every artifact created in a non-terminal state (draft, proposed, pending-review, awaiting-*) MUST carry frontmatter:
  closure_owner (who decides) · closure_decision (the exact decision that closes it) · closure_by (a session number
  deadline OR a named trigger event). Absent that = a floater = forbidden. This is the GENERAL case of CIP (CIP closes
  changes; this closes all artifacts). Sibling of EXISTS≠ACTIVE: written≠enforced; here, created≠closed. Prevention
  class: FLOATING-ARTIFACT-NEVER-REACHES-TERMINAL. Inaugural instance: docs/SIA/UX-PATTERNS-RESEARCH.md (S059→S072
  floater, now SUPERSEDED).
spine: GVRN
layer: L1
category: meta-governance
severity: critical
governing_intent: >
  No artifact floats forever. Every non-terminal state has an owner + a decision path + a deadline. The escalation
  ladder (escalation-ladder.md) enforces this mechanically: overdue → decision queue → forced terminal. Accountability =
  conversion, not activity.
composes_with:
  - P-META-006
  - P-META-019
  - P-META-028
enforcement_tier:
  tier1_hook: >-
    pre-tool-use-closure-obligation-required.sh (BLOCKING on Write|Edit of non-terminal .md/.yaml without closure
    fields)
  tier2_validator: validate-no-floating-artifacts.mjs (DEEP advisory sweep — scan docs/plan + docs/SIA)
  tier3_session: session-open injection of overdue floaters (B4 M3) · post-stop-session-close-gate extension
ratified_by: >-
  Governor S073 (OPUS-15 PROTO-S073-B4 directed) · active S074 (T3 wired: session-open injection + close-gate floater
  check)
ratified_date: '2026-05-31'
session: S073
self_check_q: |
  "Does this artifact have closure_owner, closure_decision, AND closure_by?
   If status is non-terminal and any of these are missing — it is a floater.
   If it is past closure_by without a terminal state — escalate NOW."
note: >-
  ID confirmed as P-META-030 (S074 active). T3 enforcement fully wired: session-open-floater-inject.mjs +
  close-gate-floater-check.mjs + pre-tool-use-closure-obligation-required.sh + validate-no-floating-artifacts.mjs.
