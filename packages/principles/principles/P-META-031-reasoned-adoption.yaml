id: P-META-031
name: reasoned-adoption
aliases:
  - reasoned-adoption-principle
  - enforce-floor-reason-ceiling
  - SP-citation-for-overrides
title: Reasoned Adoption — Enforce the Floor, Reason the Ceiling
description: >
  Every override of a rule, deviation from a default, or claimed exception must cite: (1) REASONING — why the training
  default fires wrongly in this context, (2) REFRAME — FROM the prohibition TO a positive identity-value the AI adopts,
  (3) ADOPTED VALUE — the positive behavior internalized (not just the thing avoided). The floor is ENFORCED
  (tool-evidence + SP-citation mandatory, non-negotiable). The ceiling is REASONED (allowed overrides cite which SP they
  satisfy; reasoning without SP citation = D11 rigid-rule-satisfaction). Counter-instruction alone = T3-only = will
  drift by turn 10. All three layers required.
spine: AI
layer: L1
category: meta-governance
severity: critical
governing_intent: >
  Enforcement without reasoning produces D11 (format-satisfaction over intent). Reasoning without enforcement produces
  D6 (verbal cleverness, post-hoc rationalization). The principle requires BOTH: the floor is the SP-citation gate
  (mechanical, non-negotiable) and the ceiling is the reasoning that demonstrates the governing_intent is met. Together
  they prevent both rigid-rule-satisfaction and unverified-override.
composes_with:
  - P-META-025
  - P-META-006
  - P-META-030
enforcement_tier:
  tier1_hook: user-prompt-submit-ai-profiler.sh (D14 detection → correction THIS turn)
  tier2_validator: validate-default-shape.mjs (BLOCKING on new D* entries missing reasoning+reframe+adopted_value)
  tier3_session: session-open.sh injection + AGENTS.md COMMENTS-BEFORE-CODE
satisfaction_point:
  thing: reasoned-adoption-active
  verify_mechanically: node tools/validators/validate-default-shape.mjs 2>&1 | grep -q 'blocking=0'
  block_test: add new D* entry without reasoning → validator exits 1
ratified_by: OPUS-16 S075 (PROTO-S075-MASTER B1)
ratified_date: '2026-06-01'
session: S075
self_check_q: |
  "Does this D* entry have: reasoning (why wrong here), reframe (from prohibition to identity),
   adopted_value (positive behavior)? Does this override cite the SP it satisfies?
   If I cannot answer yes — enforcement alone will drift."
note: >-
  P-META-031 ID confirmed S075. Pairs with D14 (unverified-agreement) as the first fully-shaped entry demonstrating the
  principle. D7/D11/D12 retrofitted S075. D1-D6/D8-D10 advisory retrofit by significance.
