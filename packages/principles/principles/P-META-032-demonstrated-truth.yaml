id: P-META-032
name: demonstrated-truth
aliases:
  - demonstrated-truth-principle
  - evidence-first
  - show-dont-state
title: Demonstrated Truth — Truth Is Shown, Not Stated
description: >
  Confident false claims are the cheapest AI output. Therefore: no fact/state/completion/high-value claim is valid
  without its tool-output proof in the SAME response. The check precedes the sentence (evidence-FIRST ordering). Scope:
  fact/state/completion/high-value claims only — not reasoning, proposals, or conversation. "I checked, found nothing"
  is NOT evidence. A grep or read with its output IS evidence. Prevention class: ASSERT-WITHOUT-EVIDENCE.
spine: VALD
layer: L1
category: meta-governance
severity: critical
governing_intent: >
  Confident false claims cause downstream work (Opus catches in OPIA, Sonnet fixes, session cost multiplies). The
  prevention is not checking harder — it is ordering: evidence-output first, then the claim. If the check is not run,
  the claim cannot be made. This turns validation from a post-hoc sweep into a pre-condition.
parent_principle: P-META-034
parent_note: mechanism of P-META-034 (Reality-Tested Completion) — claim-scale expression
composes_with:
  - P-META-006
  - P-META-028
  - P-META-034
expressions:
  - B_VALIDATE_BEFORE_ASSUME (state claims require tool evidence — S002)
  - IZFC evidence-floor (IZFC sweeps must be literal runs, not recollections — S078)
  - pre-tool-use-rzf-evidence-gate.sh (blocks tool calls without IZFC evidence — S078)
  - B_COUNCIL_PEER verify-not-rubber-stamp (Opus re-derives high-value claims with this-turn evidence — S078)
  - G1-EVIDENCE (5-guard-questions Q1: what file:line proves the claim?)
enforcement_tier:
  tier1_hook: pre-tool-use-rzf-evidence-gate.sh (blocks DONE claims without tool evidence)
  tier2_validator: validate-nominal-rzf-detector.mjs (catches asserted zero-findings without pasted output — advisory)
  tier3_session: sonnet-report.template.md HIGH-VALUE CLAIMS evidence-paste rule (S078) + session-open injection
satisfaction_point:
  thing: demonstrated-truth-active
  verify_mechanically: grep 'EVIDENCE-PASTE DISCIPLINE' tools/templates/sonnet-report.template.md
  block_test: declare 'no stale labels' without grep output → nominal → blocked by IZFC gate
ratified_by: Opus-18 S078 (PROTO-S078-PRINCIPLES) per imp_SONNET_EVIDENCE_PASTE retrospective
ratified_date: '2026-06-03'
session: S078
self_check_q: |
  "For this factual/state/completion claim: is there a tool-output in THIS response proving it?
   If the answer is recollection ('I checked earlier') — the claim cannot be made.
   Run the grep/read/verify now and paste the output."
note: >-
