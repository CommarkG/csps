id: P-META-033
name: no-lost-threads
aliases:
  - no-lost-threads-principle
  - decision-residue-capture
  - register-before-proceeding
title: No Lost Threads — Every Decision Registers Its Non-Selected Items
description: >
  Every decision, option-set, or PCR block that produces a chosen path MUST, before proceeding, register the
  non-selected and deferred items to the platform's routing infrastructure (improvement-register / gap-register /
  floater-queue / threshold) with: (1) disposition — why it was not selected, (2) decision back-ref — which
  decision/session made this call. Prevention class: OPTION-SET-WITHOUT-RESIDUE-CAPTURE.
spine: GVRN
layer: L1
category: meta-governance
severity: critical
governing_intent: >
  Platform decisions generate two artifacts: the chosen path and the residue (everything that was not chosen). The
  chosen path gets built. The residue disappears into chat. Over 30+ sessions, accumulated residue = compounding
  technical debt and forgotten good ideas. No-Lost-Threads ensures that every decision deposits its residue into the
  register BEFORE proceeding, so the platform accumulates decisions and alternatives, not just outcomes.
composes_with:
  - P-META-019
  - P-META-030
enforcement_tier:
  tier1_hook: post-stop-decision-residue-capture.sh (S078 — advisory; checks for PCR/option-set without registered residue)
  tier2_validator: validate-pe-connectivity.mjs (active plans must have PE-registered competing items — existing)
  tier3_session: session-open injection + AGENTS.md (PCR discipline)
ratified_by: Opus-18 S078 (PROTO-S078-PRINCIPLES)
ratified_date: '2026-06-03'
session: S078
self_check_q: |
  "Did this turn contain a PCR / option-set / decision with non-selected options?
   Before proceeding: where are the non-selected items registered?
   If they are in chat only — they are lost. Register now to improvement-register or gap-register
   with disposition + this session as back-ref."
note: >-
  P-META-033. post-stop-decision-residue-capture.sh (Stop hook, zero verify-cycle cost) flags turns where a decision
  occurred but no register entry was observed. Advisory only — enforcement is the registration discipline, not a
  blocking gate.
