id: P-META-034
name: reality-tested-completion
aliases:
  - reality-tested-completion-principle
  - prove-real-before-done
  - external-verification-disposition
title: Reality-Tested Completion — AI Confidence Is Not Evidence; Reality Is
description: >
  AI pattern-recognition generates outputs that can feel complete, correct, or verified without having been tested
  against external reality. This principle names the governing DISPOSITION: no CSPS output that claims truth,
  correctness, or completion is valid until tested against external reality (tool output, independent re-derivation,
  literal verification run) — not until AI internal confidence feels high. The children (P-META-032 at claim scale, IZFC
  at completion-process scale, B_COUNCIL_PEER at ratification-review scale) are all expressions of this one root.
  Prevention class: CONFIDENCE-WITHOUT-EXTERNAL-VERIFICATION.
spine: VALD
layer: L1
category: meta-governance
severity: critical
governing_intent: >
  CSPS has named the mechanisms (evidence-paste, iterative cycles, peer verification) but not the governing disposition
  they all express. When the parent is unnamed, each child mechanism can be applied mechanically while the disposition
  is missed — producing nominal compliance. The parent names it: before any output exists as a CSPS truth-claim (at any
  scale — single assertion, completed deliverable, architectural ratification), it must pass through reality-testing
  that is independent of AI pattern-matching confidence. AI confidence is not external verification. Reality-testing is
  not a step added after the work — it is the prerequisite disposition that shapes how the work is done. Adopted from
  CSP B_PROVE_REAL_BEFORE_DONE (Governor ratification S079). Crucially, the EVIDENCE OR TEST ITSELF can be virtual: a
  self-confirming or mis-calibrated construct can pass while reality reverses it (CSP's SEED-001 — a
  synthetic-calibrated metric reported FAIL on a real photo the architect could plainly see was better). So
  reality-testing demands a VALID CONSTRUCT — professional comparison against independent real results — not merely
  'some evidence.' This is the layer above P-META-032: 032 says show tool-output; P-META-034 says the construct
  producing that output must itself contact reality. The confident or elegant feeling is the warning.
tagline: AI confidence is not evidence. Reality is. Test before claiming.
cautions:
  - >-
    This is a DISPOSITION, not a procedure. P-META-032 and IZFC are the procedures. Conflating parent with children =
    the satisfaction point this principle prevents.
  - >-
    Reality-testing at all scales does not mean running verify for every sentence — it means the DISPOSITION that shapes
    when and how claims are made.
  - >-
    The parent is silent where the children are specific — always enforce via the named child expression, not by citing
    the parent alone.
  - >-
    Not measure-everything (Goodhart/McNamara): a bad real metric is worse than honest uncertainty — construct-validity
    first; high-quality expert/qualitative contact counts as real evidence.
  - >-
    Duhem-Quine: a 'failed' test may be a bad instrument, not a false claim (SEED-001's wrong FAIL) — professional
    comparison means choosing the RIGHT test, not any test.
  - Virtual conclusions are WELCOME as hypotheses/maps — the gate governs consequential COMPLETION, never thinking.
