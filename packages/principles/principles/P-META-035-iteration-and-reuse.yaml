id: P-META-035
name: iteration-and-reuse
aliases:
  - iteration-reuse-principle
  - dont-stop-dont-start
  - process-reuse-discipline
  - build-from-what-exists
title: Iteration & Reuse — Don't Stop Early; Don't Start from Zero
description: >
  The platform's most expensive failures are not bad code — they are good code duplicating something already good, and
  stopped processes that almost reached something new. This principle names the governing process disposition: before
  creating, exhaust what exists; when iterating, fold back into existing rather than creating parallel structures;
  completion is earned by genuine examination from independent angles, not by accumulating new artifacts. Prevention
  class: PREMATURE-STOP and NEEDLESS-START (the two process-level failure modes).
spine: VALD
layer: L1
category: meta-governance
severity: critical
governing_intent: >
  Two symmetrical diseases compound scatter on any platform: stopping too early (a process that felt done but wasn't
  examined from new angles — yielding a nominal result) and starting from zero (creating a new node when an existing one
  would do — yielding scatter). Both are AI training defaults: D5 (single-pass stops at first plausible result) and
  D4+D8 (pattern-match + naming-novelty starts fresh rather than searching existing). This principle is the
  process-level sibling of P-META-034 (Reality-Tested Completion, which governs claim correctness). P-META-035 governs
  the process that produces claims: iterate until genuinely new angles yield nothing, and reuse existing structures
  until no existing path serves. Together: the platform grows by deepening what exists rather than widening into
  scatter.
tagline: Don't stop when it feels done. Don't start when something already exists.
cautions:
  - >-
    Iteration ≠ repetition. Iterating the same check from the same angle is re-verification, not a new cycle. A new
    angle is required (per IZFC).
  - >-
    Reuse ≠ copy. Reuse means cross-referencing the canonical home, not duplicating its body. A new file carrying the
    same body as an existing one is scatter, not reuse.
  - >-
    This principle governs process, not claims (P-META-034 governs claims). Conflating the two creates a category error:
    cite P-META-035 for process discipline, P-META-034 for evidence-paste.
  - Existing-but-stale is a reuse trap. Check EXISTS≠ACTIVE before treating a found artifact as valid for reuse.
lineage:
  root: false
  parent_principle: null
  sibling: P-META-034
  sibling_note: >-
    P-META-034 governs claim-level reality-testing; P-META-035 governs process-level iteration and reuse — two faces of
    the same orientation.
composes_with:
