  - >-
    tools/data/satisfaction-point-registry.yaml (the reuse half: mechanical DONE definition prevents premature stop;
    mechanism of P-META-035)
  - >-
    post-stop-exists-not-equals-active.sh / AP-001 (the reuse half: EXISTS≠ACTIVE — reuse requires an active, not just
