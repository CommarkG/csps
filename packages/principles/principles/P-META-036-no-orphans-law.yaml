id: P-META-036
name: no-orphans-law
aliases:
  - no-orphans-principle
  - spine-membership-required
  - creation-equals-declaration
  - anti-scatter-keystone
title: No-Orphans Law — Every Node Declares Its Home at Birth
description: >
  An orphan is a platform node — principle, contract, validator, hook, document, route, register — that exists without a
  spine parent, without a canonical home, and without Atlas registration. Orphans cannot be found, cannot be
  consolidated, and cannot be audited. They are the origin point of scatter. The No-Orphans Law: creation equals
  declaration. No node may be promoted to a persisted artifact without declaring (1) its primary spine
  (GVRN/ARCH/AI/OPER/VALD), (2) its canonical home path, and (3) an Atlas entry (when the Atlas exists) or a frontmatter
  `core_spine:` + `schema_anchor:` pair (the current equivalent). Prevention class: ARTIFACT-WITHOUT-SPINE-DECLARATION.
spine: GVRN
layer: L1
category: meta-governance
severity: critical
governing_intent: >
  Every platform node must belong to exactly one canonical spine at creation time. The Spine Atlas can only consolidate
  nodes that are already registered — it cannot retroactively assign spine membership to artifacts that never declared
  one. Therefore creation IS declaration: a node without a spine parent does not yet exist as a governed artifact; it is
  a draft that may become scatter. This is the structural prerequisite for the Atlas and the anti-scatter keystone that
  prevents future principle-scatter itself: if every node must declare its home at birth, the 25-partial-index disease
  cannot form, because each new index would require naming where it lives before it may be written. P-META-035 governs
  the process (check existing before creating). This law governs the structure (declare spine + home in the same action
  as creation). Together they close both scatter-formation vectors: P-META-035 prevents needless-start; P-META-036
  ensures any start is self-locating.
tagline: A node without a home is not a node — it is future scatter.
cautions:
  - >-
    This is a STRUCTURAL LAW, not a process disposition (P-META-035 is the process). P-META-036 governs what the
    artifact declares; P-META-035 governs what the AI checks before creating.
  - >-
    Declaration without accuracy is worse than no declaration. A node with `core_spine: GVRN` that belongs to ARCH is an
    actively misleading orphan. The declaration must be correct, not just present.
  - >-
    Phase-B enforcement upgrade is required for full effect. The current gate (pre-tool-use-corespine-check.sh) is
    advisory (exit 0 always). This law is structurally correct but partially enforced until Phase-B ships.
