# P-OP-002-finish-what-we-started.yaml
# CSPS Principle Slice — generated by tools/split.mjs
# Source of truth: packages/principles/principles.yaml
# DO NOT edit this file directly — run `pnpm --filter @csps/principles split` to regenerate
# Phase 7 token-optimization §9.8 Candidate #1 (S010)
# Load this file (P-OP-002-finish-what-we-started.yaml) instead of the full principles.yaml (~85K)
# when you only need this one principle in your AI session context.
id: P-OP-002
name: finish-what-we-started
aliases:
  - FWWS
category: operating
severity: critical
statement: |
  Finish What We Started. Resist drift to new work while in-flight work is incomplete.
counterweight: |
  Unless completing creates more debt than abandoning. Park threads explicitly with stated reason —
  do not leave them silently in-flight.
industry_lineage:
  - David J. Anderson, Kanban (2010) — "Stop Starting, Start Finishing"; WIP limits as enabling constraint
  - Eliyahu Goldratt, The Goal (1984) — Theory of Constraints; finish bottleneck before adding more
  - Scrum — Definition of Done as completion contract
  - Lean / Toyota — single-piece flow
  - Cal Newport, Deep Work — completion under sustained attention; "shiny object" as the enemy
config:
  max_in_flight_slices: 3
  max_in_flight_apps: 2
  stale_threshold_days: 14
  park_requires_reason: true
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: 'Stated as cardinal principle #2; references /wip-check skill'
  - layer: skill
    location: packages/skills/wip-check/SKILL.md
    description: Slash command queries in-flight ledger; reports threshold status
  - layer: hook
    location: .claude/hooks/pre-tool-use-new-slice.sh
    description: PreToolUse blocks new slice creation if WIP exceeds threshold; offers /wip-check or explicit park
  - layer: pre-commit
    location: .husky/pre-commit (lefthook)
    description: Blocks commits that add new slices/apps when WIP exceeded
  - layer: pr-bot
    location: tools/danger/check-wip-limit.ts
    description: Comments on PR if violation slipped through
  - layer: ci-check
    location: libs/audits/checks/wip-limit.ts
    description: Hard-fails build if WIP exceeded
  - layer: scorecard
    location: libs/audits/scorecards/wip-trend.ts
    description: WIP count per app, trend over time, displayed in admin dashboard
  - layer: mcp-resource
    location: packages/principles-mcp/src/resources.ts
    description: Exposed as principles://fwws; in-flight ledger as principles://wip-ledger
enforcer_count: 8
cross_references:
  - P-OP-001
  - P-OP-004
  - P-META-001
anti_patterns:
  - perpetual-pivot (start everything, finish nothing — Goldratt's bottleneck collapse)
  - silent-park (threads abandoned without explicit park + reason)
  - shiny-object-syndrome (new work always preferred to in-flight closure)
