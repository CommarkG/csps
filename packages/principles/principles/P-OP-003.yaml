enforcer_count: 12
cross_references:
  - P-OP-004
  - P-META-007
anti_patterns:
  - recommendation-without-options (no trade-space exposed; reader can't evaluate)
  - options-without-recommendation (analysis paralysis; decision punted back)
  - false-balance (pros/cons rigged to support a predetermined recommendation)
  - recommendation-before-pros-cons (BLUF violation; AGENTS.md hard NO
  - symmetric-pros-cons (lazy framing; "A fast / B slow + B correct / A wrong" signals missing axis)
  - silent-skip (judging "trivial-reversible" without stating the skip + reason; reader can't audit)
  - recommendation-without-load-bearing-factor (opaque decision; future review can't reconstruct rationale)
  - missing-what-would-flip-clause (silent-criteria-shift later is undetectable)
