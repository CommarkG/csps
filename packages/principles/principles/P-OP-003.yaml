id: P-OP-003
name: pcr
aliases:
  - PCR
  - pros-cons-recommendation
category: operating
severity: warn
statement: |
  When presenting decisions, use **P**ros, **C**ons, & **R**ecommendation format.
  Present the option set + trade-offs + recommended path as a chunked decision package.
scope_note: |
  Apply to decisions with non-trivial trade-space.
  For trivial reversible choices (two-way doors at low cost), just decide.
industry_lineage:
  - >-
    MADR (Markdown Architectural Decision Records) — Considered Options + Pros/Cons + Decision Outcome (the structural
    ancestor)
  - BLUF (Bottom Line Up Front) — US Army Regulation 25-50 (2001) — recommendation-first communication
  - John Sweller, Cognitive Load Theory (1988) — chunking for decisions; working memory ~4 chunks
  - Amazon 6-pager / PR-FAQ (Bezos 2004) — narrative trade-space document
  - McKinsey Rule of Three — structuring recommendations as exactly three MECE alternatives
format_spec: >
  A PCR has three blocks in this order:

  1. **Options** — table or bulleted list of N alternatives (typically 2–4)

  2. **Pros / Cons** — per-option trade-offs (table format preferred)

  3. **Recommendation** — chosen option + one-paragraph reasoning naming the load-bearing factor + "what would flip the
  recommendation" clause
triggers:
  fire_patterns:
    - 'phrase: should we... / should I...'
    - 'phrase: X vs Y / which option / decide between'
    - 'header containing options: / alternatives: / approaches: / paths:'
    - 2+ alternatives with non-trivial trade-space
    - architectural forks (framework / schema / protocol selection)
    - scope choices (this-session vs next / carry-forward vs in-flight / defer vs ship)
    - tool / library selection
    - migration strategies
    - phasing decisions
  skip_patterns:
    - variable naming when both names clear
    - comment phrasing
    - file location when both paths obviously valid
    - color choices in draft
    - single-option presentations (no trade-space)
  skip_requires_explicit_note: true
enforcers:
