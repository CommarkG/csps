title: Completion-Before-New — Active Plan Completes Before New Things Start
description: >
  The active plan (incomplete milestones) completes (or reaches a clean checkpoint) before a new plan starts. New intent
  arising mid-plan routes through threshold-router.mjs → vault/PI → PE-sized → future plan. Never injected into the
  active plan. Prevents false efficiency: chasing new ideas mid-flight stresses context, leaves partial implementations,
  and breaks completion metrics. Consolidates P-OP-002 FWWS + Long-Run M0.7 + SPI batch-sizing + the
  Opus-authors-hard-parts / Sonnet-runs-autonomous cadence. Source: COMPLETION-DISCIPLINE-PLAN-S073.md + Governor S073
  directive.
spine: GVRN
layer: L1
category: operating-principles
severity: critical
governing_intent: >
  Completion = conversion, not activity. An unfinished plan is a floater. New ideas earn their place in the NEXT plan,
  not the current one. The threshold is the front door; everything else is disruption.
composes_with:
  - P-OP-002
  - P-META-030
  - P-META-019
enforcement_tier:
  tier1_hook: pre-tool-use-completion-before-new.sh (advisory on new-item-into-active-plan-without-threshold)
  tier2_validator: validate-completion-before-new.mjs (STANDARD — scans for open PROTOs + injected items)
  tier3_session: session-open injection of active-plan-first reminder + CADENCE-AUDIT in milestone reports
ratified_by: Governor S073 (OPUS-15 directed) — COMPLETION-DISCIPLINE-PLAN-S073.md
