# when you only need this one principle in your AI session context.
id: P-OPER-001
name: zero-laptop-dependency
aliases:
  - git-canonical
  - multi-machine-parity
  - android-accessible
  - auto-push-at-session-close
category: operations
severity: critical
statement: |
  Every CSPS artifact lives in cloud-canonical (Git remote) before any session closes;
  no work depends on a single physical machine; multi-device + Android workflows are
  first-class supported paths. Hybrid mode (Q-1 ratified S006 turn 8): Git canonical +
  GitHub Codespaces on-demand + Android read-mostly via GitHub mobile + Chromium.
  Auto-push enforced at session-close gate (Q-2 ratified S006 turn 8 — composes with
  HPFA + pre-close verify). Multi-machine parity via devcontainer.json + bootstrap.ps1.
counterweight: |
  Pre-close auto-push gate (B option) is the discipline; commit-time auto-push (A option)
  was rejected as too aggressive. Local commits OK during session; push must clear before
  handoff write. Secrets stay in 1Password/Bitwarden — NOT in repo.
industry_lineage:
  - GitOps (Weaveworks 2017) — git as source of truth; reconciliation loop
  - GitHub Codespaces / Gitpod — cloud-dev replacing per-machine setup
  - 12-factor app methodology — config in env, code in repo
  - User S006 turn 8 directive — "0 dependency on my laptop; work from other computers + remote from android"
config:
  hybrid_mode_components:
    local_dev: laptop with bootstrap.ps1
    cloud_dev: GitHub Codespaces via .devcontainer/devcontainer.json
    android_read: GitHub mobile app + GitHub web
    android_edit: Codespaces in Chromium (small-screen-OK)
  auto_push_mode: session-close-gate (B; not commit-time A)
  multi_machine_parity_required: pnpm + node versions match across devcontainer + bootstrap.ps1
  no_local_only_secrets: true
  secret_storage: 1Password or Bitwarden (NOT in repo)
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: Hard NO — never close session without `git push` confirming all commits are on remote
  - layer: contract
    location: docs/plan/pillar-0-governance/behavioral-contracts.md#B_ZERO_LAPTOP_DEPENDENCY
    description: B_ZERO_LAPTOP_DEPENDENCY canonical contract
  - layer: memory
    location: ~/.claude/projects/c--Users-finky-Desktop-Claude-Code-Csps/memory/feedback_zero_laptop_dependency.md
    description: Cognitive layer; loaded session-start
  - layer: frontmatter-contract
    location: .devcontainer/devcontainer.json
    description: GitHub Codespaces config; multi-machine parity enforced (planned L1 of zero-laptop-dependency-setup topic-plan)
  - layer: ci-check
    location: libs/audits/checks/git-pushed-state-clean.ts
    description: Validator — `git log origin/main..HEAD` empty before session-close (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/devcontainer-config-valid.ts
    description: Validator — devcontainer.json present + valid per spec (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/no-local-only-secrets-in-repo.ts
    description: Validator — .env/credentials.json/*.pem not committed (registered atomic; impl week-4)
  - layer: ci-check
    location: libs/audits/checks/multi-machine-parity-spec.ts
    description: Validator — devcontainer + bootstrap produce same versions (registered atomic; impl week-4)
  - layer: ai-behavior-spine
    location: docs/plan/pillar-0-governance/ai-behavior-spine.md
    description: Discipline matrix row
  - layer: generator
    location: tools/bootstrap.ps1
    description: Bootstrap script; first-machine setup parity with devcontainer
enforcer_count: 10
cross_references:
  - P-META-008
  - P-META-013
  - P-META-015
  - P-ARCH-028
anti_patterns:
  - local-only-work (commits on laptop never pushed to remote)
  - per-machine-divergence (different pnpm/node versions across machines)
  - secrets-committed-to-repo (.env or credentials.json in git)
  - android-locked-out (no defined workflow for Android access)
