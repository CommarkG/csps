id: P-OPER-002
name: done-right-from-the-start
aliases:
  - build-correctly-first
  - verification-not-discovery
  - quality-before-evidence
category: operations
severity: warn
statement: |
  Verification confirms quality already achieved — it does not create quality.
  Specify HOW to build so the result is correct from the first line.
  Build correctly; verification is evidence not discovery.
  The sequence is: understand → specify → build correctly → verify evidence.
  NOT: build → verify → fix → verify → fix → ...
rationale: |
  Every session that ends in "pnpm verify exit 1" followed by rounds of patching
  reveals that the build phase didn't have clear enough quality criteria to start.
  The fix is earlier specification, not faster iteration on broken output.
governing_intent: |
  Quality is a design property, not a testing property. Verify.mjs confirms
  the platform is healthy — it doesn't make it healthy. Build correctly so
  verification is a formality, not a discovery tool.
enforcers:
  - layer: instruction-file
    location: AGENTS.md
    description: 'DONE standard P-ARCH-031: built + wired + called + output verified'
  - layer: validator
    location: tools/validators/validate-implementation-gate.mjs
    description: 'PIG: PI reference required on implementation commits (PI-003)'
  - layer: validator
    location: tools/validators/validate-pi-questions-answered.mjs
    description: 'PI questions gate: no unanswered pre-implementation questions'
