id: P-UX-002
name: zero-context-assumption
aliases:
  - ZCA
  - boundary-context-zero
  - who-what-how-now
  - cross-boundary-completeness
category: operating
severity: warn
statement: |
  Every communication crossing a boundary assumes the receiver has zero prior context.
  Provide WHO/WHAT/HOW/NOW inline before any task context.
  WHO: who is the sender, who is the receiver, what roles they play.
  WHAT: what is the project/system, what technology, what purpose.
  HOW: how the collaboration works, communication rules, the pattern.
  NOW: current state, what's active, what's next, the concrete action.
  Test: could someone with no background understand this completely?
  If no → the boundary is not crossed correctly.
  Applies to: tab transfers, SROFs, API responses, EKEP exchanges, any cross-boundary message.
rationale: |
  Every cross-boundary communication failure in CSPS traced to assumed shared context.
  S036 incident: chat-jump to new Sonnet assumed knowledge of OPUS-2, CSPS, S036, 3-party
  triangle. Governor caught it. ZCA closes the gap at ALL boundary types permanently.
governing_intent: |
  The receiver is always a stranger until proven otherwise. Eliminate assumed context at
  every boundary — the test is standalone comprehension, not sender's intent.
