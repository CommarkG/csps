## PRIVATE-BUSINESS-SILOS Guarantee

Each app using this bundle gets full row-level isolation. Personal data (family, health)
stored in separate encrypted silo per PRIVATE-BUSINESS-SILOS.md design.
Phase 2 (ZModel RLS): now active. Phase 1 (YAML) was temporary workaround.
