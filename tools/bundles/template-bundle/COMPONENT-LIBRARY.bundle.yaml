# COMPONENT-LIBRARY Foundation Bundle

> Status: SEALED | Session: S058 | Proven: 718eccf
> Every CSPS app inherits this bundle. Non-negotiable UI primitive layer.
> Design source: docs/SIA/R1-08-TEMPLATE-BUNDLE-SYSTEM.md § Foundation Bundles
> Source library: libs/ui/ | Package: @csps/ui v0.1.0

## Components

components:
  - name: CSPSPage
    source: libs/ui/src/CSPSPage.tsx
    description: "Page wrapper with pageDNA contextQuestion slot. Surfaces context question visibly for developer awareness."
    props: [title, contextQuestion?, subtitle?, children]

  - name: HealthBar
    source: libs/ui/src/HealthBar.tsx
    description: "Progress bar with CSPS color semantics. pass(≥80%)=green / warn(≥40%)=amber / block(<40%)=red."
    props: [value, label, variant?, source?]

  - name: GapCard
    source: libs/ui/src/GapCard.tsx
    description: "Gap / improvement register entry display. Shows k_count recurrence badge and status chip (open/resolved/deferred)."
    props: [id, k_count, status, observation, structural_fix?]

  - name: MetricBadge
    source: libs/ui/src/MetricBadge.tsx
    description: "MDPE/coverage percentage display. Compact: '[value][unit] [label]'."
    props: [value, label, unit?, color?]

  - name: JourneyStep
    source: libs/ui/src/JourneyStep.tsx
    description: "One stage in a developer/user journey. Renders header + options table (friction/value/status) + exit criterion footer."
    props: [step, name, status?, description, exit, options[]]

  - name: GuardQuestionForm
    source: libs/ui/src/GuardQuestionForm.tsx
    description: "ZF-style verification form. Shows main question + guard question + textarea + submit. 'use client' component."
    props: [question, guardText, placeholder?, onSubmit, submitLabel?]

  - name: CSPSDataTable
    source: libs/ui/src/CSPSDataTable.tsx
    description: "Data display with optional click-to-sort. Basic table — no heavy dependencies. 'use client' component."
    props: [columns, rows, sortable?, emptyMessage?]

## Required Environment Variables

env_vars_required: []

## Consumer Setup

consumer_setup:
  package_json: '"@csps/ui": "workspace:*"'
  tsconfig_paths: '"@csps/ui": ["../../libs/ui/src/index.ts"]'
  next_config: 'transpilePackages: [..., "@csps/ui"]'
  import_example: "import { CSPSPage, HealthBar, JourneyStep } from '@csps/ui'"

## Verification Gate

verification_gate:
  - "pnpm --filter @csps/template build exits 0 with @csps/ui imported"
  - "libs/ui/src/index.ts exports all 7 components (CSPSPage / HealthBar / GapCard / MetricBadge / JourneyStep / GuardQuestionForm / CSPSDataTable)"
  - "apps/csps-playground imports JourneyStep + HealthBar — proven 718eccf"

