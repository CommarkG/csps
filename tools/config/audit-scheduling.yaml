## Combinatorial Engine Integration (PLANNED)

> When the combinatorial engine (BATCH-J) is built, it will read this file to:
> 1. Select the optimal pipeline subset given current context
> 2. Avoid running expensive pipelines when context signals they're unnecessary
> 3. Prioritize findings using PE scores assigned to each pipeline

combinatorial_hints:
  context_signals:
    - signal: "PR contains only .md file changes"
      skip_pipelines: [pipeline_9_runtime_health, pipeline_8_complexity_hotspots]
    - signal: "session contains no new B_* / P-META-* additions"
      skip_pipelines: [pipeline_5_engraving_completeness]
    - signal: "no new agents or skill files in PR"
      skip_pipelines: [pipeline_2_agent_alignment]
    - signal: "model version unchanged"
      skip_pipelines: [pipeline_10_csps_alignment]

