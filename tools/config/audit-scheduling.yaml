# Audit Scheduling Registry

## Scheduling Type Taxonomy

All available cadence values across CSPS. Use these values in pipeline definitions below.

### Time-Based Cadences
```
real-time          — on every event (hooks, immediate)
per-turn           — every AI turn
per-session-open   — at session start
per-session-close  — at session close (mandatory gate)
daily              — once per day (nightly cron, ~2am UTC)
weekly             — once per week (Monday digest)
monthly            — first day of month
quarterly          — every quarter (Jan/Apr/Jul/Oct)
annually           — once per year
```

### Event-Based Cadences
```
on-pr-open         — when PR is created
on-pr-merge        — when PR is merged to main
on-pr-review       — when PR receives a review
on-ratification    — when an artifact reaches ratified/done state
on-lifecycle-change — when lifecycle_state changes on any artifact
on-file-change     — when specific file patterns change (configurable glob)
on-model-update    — when AI model version changes (new major version)
on-deploy          — when a new deployment is pushed to Vercel
on-schema-change   — when ZModel or Prisma schema is modified
```

### Condition-Based Cadences
```
k-equals-2         — when the same pattern fires twice (K=2 promotion)
on-session-count:N — every N sessions (configurable integer N)
on-n-uses:N        — after N uses of a specific feature
on-activation-exit — when activation_exit conditions are met
on-evaluation-pass — when an evaluation baseline passes
on-threshold-cross — when a metric crosses a defined threshold
```

### Manual Cadences
```
on-demand          — manual trigger only: pnpm audit:run --pipeline <name>
governor-explicit  — requires Governor to explicitly invoke (highest-stakes audits)
never              — registered but permanently deferred (with documented reason)
```

