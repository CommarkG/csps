## Pipeline Scheduling Defaults

> **To change a default:** edit the `default_cadence` field below.
> **Authorization:** Governor or admin.
> **Effect:** takes effect on next audit run cycle.
> **`supported_cadences`:** all valid cadences for that pipeline. Other values rejected.

pipelines:

  pipeline_1_pre_close_verification:
    name: "Pre-Close Verification"
    spine: GVRN
    principle: P-META-008
    contract: B_PRE_CLOSE_VERIFICATION
    implementation_status: LIVE
    default_cadence: per-session-close
    supported_cadences: [per-session-close, on-demand]
    override_notes: "This pipeline is MANDATORY at session close. Changing to on-demand removes the mechanical gate. Governor-explicit override required."
    orchestrator: tools/verify.mjs
    findings_persist: true
    findings_path: tools/verify-last-run.md

  pipeline_2_agent_alignment:
    name: "Agent Alignment"
    spine: AI
    principle: P-META-010
    contract: B_AGENT_ALIGNMENT_PROTOCOL
    implementation_status: PARTIAL (validate-aap-frontmatter.mjs LIVE; others stub)
    default_cadence: on-pr-open
    supported_cadences: [on-pr-open, on-pr-merge, per-session-close, on-demand]
    override_notes: "Weekly cadence is safe; per-session adds coverage but slows close."
    findings_persist: false
    findings_path: null

  pipeline_3_cognitive_context:
    name: "Cognitive Context Discipline"
    spine: AI
    principle: P-META-009
    contract: B_COGNITIVE_CONTEXT_DISCIPLINE
    implementation_status: STUB (most validators not yet built)
    default_cadence: per-session-close
    supported_cadences: [per-session-close, weekly, on-demand]
    override_notes: "Daily would be excessive; per-session sufficient for current scope."
    findings_persist: false
    findings_path: null

  pipeline_4_zero_findings:
    name: "Zero Findings Cycle"
    spine: VALD
    principle: P-META-006
    contract: B_RZF
    implementation_status: PARTIAL (rzf-coverage, nominal-rzf-detection LIVE)
