## PE Engine Integration (PLANNED)

> The PE engine will score finding severity × impact × frequency to prioritize resolution order.
> Each pipeline contributes a pe_weight to its findings.

pe_weights:
  pipeline_1_pre_close_verification: 100  # blocking — highest priority
  pipeline_4_zero_findings: 95
  pipeline_5_engraving_completeness: 90
  pipeline_6_schema_integrity: 85
  pipeline_2_agent_alignment: 80
  pipeline_3_cognitive_context: 75
  pipeline_10_csps_alignment: 70
  pipeline_7_intake_and_learning: 65
  pipeline_13_threshold_gate: 60
  pipeline_11_vocabulary_canon: 55
  pipeline_12_behavioral_alignment: 50
  pipeline_8_complexity_hotspots: 45
  pipeline_9_runtime_health: 40  # low until runtime ships
