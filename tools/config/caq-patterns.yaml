# CAQ (Core Alignment Question) Detection Patterns
# ───────────────────────────────────────────────────────────────────────────────
# When Governor uses 2+ of these CAQ types in one prompt, CAQ MODE fires.
# CAQ MODE forces Scope-3 diagnostic reasoning before any action.
# Add new patterns here — no .claude/ file edit, no permission prompt.
#
# THRESHOLD: CAQ_SCORE >= 2 triggers CAQ mode
# Each type contributes 1 point to CAQ_SCORE when matched.

caq_types:
  - id: diagnostic
    description: "Root cause framing — forces analysis before action"
    score: 1
    patterns:
      - '\b(what is (triggering|causing|happening)|why (is|does|did)|root cause|what.*trigger)\b'

  - id: historical
    description: "Accountability for prior attempts — surfaces failure patterns"
    score: 1
    patterns:
      - '\b(what did you|have you tried|so far|already|still happening|keeps happening|again)\b'

  - id: persistence
    description: "Class recognition — rejects instance-fix mindset"
    score: 1
    patterns:
      - '\b(STILL|[0-9]+ times|keep(s)? (doing|happening)|every time|recurring|never stop)\b'

  - id: expert_simulation
    description: "Perspective shift — breaks out of current mental model"
    score: 1
    patterns:
      - '\b(top expert|best practice|what would.*say|expert.*perspective|permanently solve|structural.*fix)\b'

  - id: permanence_commitment
    description: "Structural fix required — rejects all bandaids"
    score: 1
    patterns:
      - '\b(permanent(ly)?|forever|never again|make it.*right|structural|once and for all)\b'

# AI PROFILER MODES — detection patterns for all modes
# These are the existing mode patterns, externalized for thin-reader pattern.
# Update patterns here without touching .claude/hooks/user-prompt-submit-ai-profiler.sh

profiler_modes:
  - id: architectural
    description: "Design/architecture decisions requiring ZF + expert review"
    patterns:
      - '\b(design|architect|PI-[0-9]+|plan the|how should we|consolidat|pcr|pros and cons|recommend|should we|OPEN-[0-9]+|strategy|trade.?off)\b'

  - id: implementation
    description: "Build/implement actions requiring Rule 11 (build verification)"
    patterns:
      - '\b(build|implement|create the|fix the|write the|next build|deploy|vercel|pnpm|tsc|prisma|route\.ts|page\.tsx)\b'

  - id: governance
    description: "B_* contracts, principles, FSE — governance FSE checklist required"
    patterns:
      - '\b(B_[A-Z_]+|P-META|P-ARCH|P-OPER|engrave|ratif|AGENTS\.md|behavioral contract|FSE|enforcement trio)\b'

  - id: enforcement
    description: "Declaring governance artifacts complete — mechanical enforcement check"
    patterns:
      - '\b(new.*contract|new.*validator|Hard NO|add.*AGENTS|enforcement.*active|validator.*LIVE|hook.*active|T1.*T2|enforcement trio|wired.*verify|mechanical enforcement|B_CSPS_INHERITANCE|B_ZERO_NAVIGATION|behavioral contract.*new|now enforced|enforcement.*complete)\b'

  # D-DEFAULT FIRING SIGNALS (S069 — routes to ai-behavior-signals.jsonl for weekly deep-dive)
  - id: d_default_firing
    description: "Governor signals AI training default is firing — routes to behavior-signal pipeline"
    score: 2
    signal_class: d_default
    patterns:
      - '\b(you keep (failing|doing|making)|false (assumption|default)|40 times|[0-9]+ times and you|wrong layer|you always|your default|AI default)\b'
      - '\b(take a deep breath|acknowledge|none of them work|different (root cause|approach)|stop (trying|doing) this)\b'
      - '\b(why do you (always|keep)|what triggers you|your pattern|your instinct|how you (think|approach)|bias)\b'

  - id: enhancement_proposal
    description: "Platform enhancement signal — something structural could be improved"
    score: 1
    signal_class: enhancement
    patterns:
      - '\b(can you think of.*way|create.*system|platform.*could|enhance.*permanently|save.*permanently|inherit|always)\b'
      - '\b(loop|pipeline|compound|weekly|trigger.*save|route.*later|accumulate)\b'

  # P-META-032 CIE OBSERVE SIGNAL: assert-without-evidence rate
  # Routes to ai-behavior-signals.jsonl when Opus catches an assertion without pasted tool output.
  # Feeds CIE AGGREGATE stage for weekly pattern detection.
  - id: assert_without_evidence
    description: "P-META-032 signal: Opus or Governor catches a factual claim without pasted evidence"
    score: 2
    signal_class: p_meta_032_assert_without_evidence
    patterns:
      - '\b(caught (without|no) evidence|assertion without (proof|grep|tool)|claimed without showing|recollection is not)\b'
      - '\b(you said you (checked|verified) but|I found no grep|where is the output|paste the (grep|result|output))\b'
      - '\b(nominal sweep|no tool output|asserted not shown|false claim caught)\b'

  # P-META-033 CIE OBSERVE SIGNAL: uncaptured-decision-residue count
  # Routes to ai-behavior-signals.jsonl when a decision/PCR turn has no register entry.
  - id: uncaptured_decision_residue
    description: "P-META-033 signal: decision made but non-selected options not registered to platform"
    score: 1
    signal_class: p_meta_033_uncaptured_residue
    patterns:
      - '\b(where.*other options|what happened to (option|alternative)|not in (register|queue)|lost thread)\b'
      - '\b(non-selected.*not registered|deferred.*nowhere|option.*disappeared|residue.*missing)\b'
