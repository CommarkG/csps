---
id: csps.config.core-spine-registry
name: core-spine-registry
description: >
  Registry of all CSPS core spines with their 8-section mandatory schema.
  The engine (B1) reads this to auto-scaffold creation, routing, and wiring.
  Every entry must have all 8 sections; validate-core-spine-template.mjs BLOCKS if any missing.
  Source of truth for alignment_map targets → SPINE-PILLAR-MAP.md.
version: "1.0"
session: S073
owner: group:finky
core_spine: GVRN
schema_anchor: vault_files
closure_owner: group:finky
closure_decision: "Living registry — terminal when all spines are non-stub and wiring_map fully resolves"
closure_by: "ongoing — add entry per new core spine, update status to active after content built"

# 8 mandatory sections per spine entry (enforced by validate-core-spine-template.mjs):
#   trunk · branches · alignment_map · wiring_map · tier_permission · cie_pe · escalation · realtime_save

sections_required:
  - trunk
  - branches
  - alignment_map
  - wiring_map
  - tier_permission
  - cie_pe
  - escalation
  - realtime_save

architecture_map_nodes_valid:
  - "pillar-0-governance"
  - "pillar-1-architecture-and-stack"
  - "pillar-2-data-and-schema"
  - "pillar-3-platform-services"
  - "pillar-4-developer-experience"
  - "pillar-5-ai-systems"
  - "pillar-6-operations-and-delivery"
  - "pillar-7-product"

classification_dimensions_valid:
  - GVRN
  - VALD
  - ARCH
  - AI
  - OPER

spines:

  - id: accountability
    spine: GVRN
    status: active
    authored_session: S073
    authored_by: OPUS-15
    ratified_session: S074
    ratified_by: "Governor S074 (Hub Plan approved — PROTO-S074-FINISH-ACCOUNTABILITY)"
    ratified_date: "2026-05-31"
    # ── 1. trunk ─────────────────────────────────────────────────────────────
    # The 7 universal invariants (GVRN-primary, always-on, undebatable).
    # Source: ACCOUNTABILITY-HUB-PLAN-S072.md §PLATFORM-ATTITUDE STRUCTURE (default)
    trunk:
      description: "Accountability = a tracked path from threshold-intake to terminal, with a NAMED accountable party at every handoff, for every class of intent."
      elements:
        - id: T1
          name: single-owner
          statement: "Every obligation has exactly one named Accountable party at every point in its lifecycle. No orphan intent."
          failure_mode: "Intent created with no owner → floats until a session explicitly claims it (the primary floater pattern)"
        - id: T2
          name: path-to-terminal
          statement: "Every obligation has a documented path to a terminal state: RATIFIED+IMPLEMENTED | REJECTED | VAULTED-with-trigger | SUPERSEDED."
          failure_mode: "No terminal path = the obligation can exist indefinitely without resolution"
        - id: T3
          name: evidence-at-closure
          statement: "Closing a DONE claim requires THIS-SESSION verify evidence, not description. Re-run IS the proof."
          failure_mode: "Nominal DONE — session N+1 rediscovers and re-fails the same thing"
        - id: T4
          name: trigger-plus-aging
          statement: "Every obligation has a trigger event AND an aging mechanism. Obligations past closure_by escalate automatically to a decision queue."
          failure_mode: "closure_by without enforcement = advisory deadline that gets ignored"
        - id: T5
          name: handoff-receipt
          statement: "At every boundary crossing (Opus→Sonnet, session→session, AI→human), the receiver explicitly confirms intake via council-address + §17 attestation."
          failure_mode: "Boundary crossed without receipt → obligation dropped at handoff, never picked up"
        - id: T6
          name: conversion-not-activity
          statement: "Accountability is measured by converted obligations (intents → terminal states), NOT by activity count (commits, turns, hooks added)."
          failure_mode: "High activity, low conversion → platform grows in complexity but not in resolved obligations"
        - id: T7
          name: escalation
          statement: "Unresolved obligations escalate to a higher authority until terminal. No obligation can stay open forever — it either resolves or escalates to a forced decision."
          failure_mode: "No escalation path = obligation floats forever without forced resolution"
    # ── 2. branches ──────────────────────────────────────────────────────────
    # Platform-attitude VARIETY: actor-class branches on top of the default trunk.
    # Source: ACCOUNTABILITY-HUB-PLAN-S072.md §VARIETY (actor-class branches)
    branches:
      - id: B1
        name: inner-platform
        audience: "Sonnet ↔ Opus (AI council, both directions)"
        unique: "PROTO→build→OPIA→ADVANCE/COURSE-CORRECT loop; receipt-before-PROTO; council-address; OPIA acceptance IS the accountability gate (Sonnet cannot self-accept; Opus cannot skip review)"
        metric: "directives issued → terminal verdicts (no PROTO without an OPIA close)"
        status: active
      - id: B2
        name: developer
        audience: "Yariv + future contributors"
        unique: "plan-item ownership (unified-plan.yaml), DoD per milestone (RZF evidence), register-before-wire, FWWS (no half-built milestone), engraving completeness (5-surface)"
        metric: "committed work → verified+wired+closed"
        status: active
      - id: B3
        name: external-user
        audience: "account-owner-admin / team-leader / end-user (recurses to 6-tier)"
        unique: "consent+entitlement scope, audit-event trail, data-scope boundaries, reversible actions + confirmation, SLA on support/response. NEEDS PART 3 (product schema)"
        metric: "user action → traceable + reversible + tier-appropriate"
        status: planned
        note: "B3 build needs PART 3 product schema — flag for S074"
    # ── 3. alignment_map ─────────────────────────────────────────────────────
    alignment_map:
      schema_anchor: vault_files
      architecture_map_node: "pillar-0-governance"
      classification_dimension: GVRN
      root: .claude/core-spines/L1_CORE_GVRN.md
    # ── 4. wiring_map ────────────────────────────────────────────────────────
    # ACTIVE entries must resolve to real files. PLANNED = declared future, governed by target_batch.
    wiring_map:
      - file: tools/scripts/threshold-router.mjs
        role: "Routes every intake through classification → input_class + pipeline (T2 path-to-terminal gate)"
        status: ACTIVE
      - file: tools/verify.mjs
        role: "RZF evidence-at-closure gate — terminal claims require THIS-SESSION verify exit_code=0 (T3)"
        status: ACTIVE
      - file: tools/council/opia-checklist.md
        role: "OPIA acceptance protocol — Sonnet cannot self-accept; Opus reviews and closes (B1 accountability gate)"
        status: ACTIVE
      - file: tools/templates/boundary-prompt.template.md
        role: "§17 handoff-attestation template — boundary crossing receipt (T5 handoff-receipt)"
        status: ACTIVE
      - file: tools/data/gap-recurrence-register.yaml
        role: "K≥2 debt tracker — structural fix triggered when gap recurs (T6 conversion metric)"
        status: ACTIVE
      - file: tools/data/improvement-register.yaml
        role: "Propagation tracker — improvements approved but not yet enacted (T4 aging)"
        status: ACTIVE
      - file: tools/data/floating-artifacts-register.yaml
        role: "ANTI-FLOAT register — closure obligation discipline, all floaters tracked (T4+T7)"
        status: ACTIVE
        promoted: S073-B4
      - file: apps/csps-playground/src/app/platform/accountability/page.tsx
        role: "/platform/accountability — renders this spine from the registry (default+variety)"
        status: ACTIVE
        promoted: S073-B3
      - file: docs/plan/pillar-0-governance/escalation-ladder.md
        role: "Escalation ladder — unresolved obligations path to higher authority (T7)"
        status: ACTIVE
        promoted: S073-B4
    # ── 5. tier_permission ───────────────────────────────────────────────────
    # Per-actor tier permissions — NOT one-size-fits-all.
    tier_permission:
      inner_platform:
        actors: [governor, opus, sonnet]
        can_create_obligation: true
        can_close_obligation: false  # Sonnet cannot self-accept
        close_requires: "OPIA acceptance by Opus OR Governor ratification"
      developer:
        actors: [governor]
        can_create_obligation: true
        can_close_obligation: true
        close_requires: "RZF evidence + verify exit_code=0"
      external_user:
        actors: [account-owner-admin, team-leader, end-user]
        can_create_obligation: false  # not yet (PART 3 dependency)
        can_close_obligation: false
        note: "External-user accountability governed by product schema PART 3 (pending)"
      ratification_required: true
      min_tier_to_ratify: governor
    # ── 6. cie_pe ─────────────────────────────────────────────────────────────
    cie_pe:
      pe_score: 8.5  # sample: urgency=high(3) × impact=platform-wide(3) / spi=1.0 ≈ 9, derated for dependency on PART 3
      urgency: high
      impact: platform-wide
      pe_rationale: "Accountability is the meta-discipline — every other spine depends on it for closure. PE = high × platform-wide / 1.0 = 9 (sample, tunable)"
      cie_capture_enabled: true
      note: "Haiku-audit-tier proposal routed through threshold S073 B2.5 — classified CIP:staging/CRITICAL"
    # ── 7. escalation ─────────────────────────────────────────────────────────
    escalation:
      owner: group:finky
      escalation_path: "Sonnet flags → Opus reviews → Governor ratifies → if stale past closure_by: BLOCKED"
      ladder:
        L1: "Sonnet reports in milestone report (ZF evidence)"
        L2: "Opus reviews at OPIA boundary (blocking if not OPIA-accepted)"
        L3: "Governor ratifies at session close (handoff-attestation)"
        L4: "Escalated to session-open block if closure_by past (ANTI-FLOAT gate — B4)"
      closure_owner: group:finky
      closure_decision: "B3 content ratified + all ACTIVE wiring resolves + /platform/accountability renders from registry"
      closure_by: "B3 sprint (S073)"
    # ── 8. realtime_save ──────────────────────────────────────────────────────
    realtime_save:
      enabled: true
      save_path: tools/data/process-state/core-spine-creator__governor__active.json
      lib: libs/process-state/index.mjs
      note: "B2 realtime-save wired — creator auto-persists per stage, resumes on re-entry"

  - id: simulation
    spine: VALD
    status: sandbox
    authored_session: S076
    authored_by: Sonnet S076
    ratified_session: null  # awaiting Opus OPIA
    ratified_by: null
    ratified_date: null
    # ── CONSOLIDATION INVENTORY (Preservation/Consolidation/Ripple) ──────────
    # 5 scattered simulation senses → 1 canonical spine entry (no content fork):
    #  1 scenario-sim  → B_SANDBOX_BEFORE_IMPLEMENTATION.md (PRESERVE + cross-ref here)
    #  2 scale-sim     → SANDBOX-multi-tenant-scale-readiness-spec-S076.md (PRESERVE + cross-ref)
    #  3 persona-sim   → NAIVE-PERSONAS-DOCTRINE.md (PRESERVE + cross-ref here)
    #  4 deletion-sim  → validate-agent-deletion-test.mjs --simulate (PRESERVE + cross-ref here)
    #  5 comparison    → B_SIMULATION_COMPARISON.md (DISAMBIGUATE: BEFORE/AFTER/DELTA, NOT a sim mode)
    # RIPPLE: each surface gets a cross-ref to this entry; nothing is forked.
    # ── 1. trunk ─────────────────────────────────────────────────────────────
    # The 7 universal invariants of simulation discipline.
    # Canonical definition: "generate evidence about behaviour BEFORE committing to reality."
    trunk:
      description: "Simulation = generating evidence about behaviour BEFORE committing to reality. The discipline governs WHEN to simulate, WHICH mode to choose, and HOW to cite the evidence so downstream decisions rest on real proof not description."
      elements:
        - id: T1
          name: evidence-before-commitment
          statement: "No implementation begins without simulation evidence proving the spec works. Simulation is EXECUTION, not reading."
          failure_mode: "Spec described but not executed → implementation built on untested assumptions; defects discovered in production"
        - id: T2
          name: scenario-coverage
          statement: "Every simulation covers ≥3 distinct scenarios. Single-scenario simulation proves one path; it does not prove the boundary conditions."
          failure_mode: "Happy-path-only simulation misses edge cases; nominal pass hides real failures"
        - id: T3
          name: result-citation
          statement: "Simulation outcomes are cited as THIS-SESSION evidence (tool output, concrete numbers, specific failures). Description of a past simulation ≠ evidence."
          failure_mode: "Memory of simulation ≠ proof. Next session re-discovers the same failure."
        - id: T4
          name: mode-appropriate
          statement: "The correct simulation mode (scenario / scale / persona / deletion-decoupling) is matched to the risk class. Using the wrong mode generates evidence about the wrong failure."
          failure_mode: "Scale-sim used for a design question → no evidence about usability. Scenario-sim used for a load question → no evidence about bottlenecks."
        - id: T5
          name: lifecycle-gate
          statement: "Simulation follows DRAFT→SANDBOX→SIMULATED→RATIFIED→IMPLEMENTING lifecycle. No stage may be skipped. simulation_status: pass required before RATIFIED."
          failure_mode: "lifecycle_state jumps from sandbox to implementing without SIMULATED → ratification is nominal"
        - id: T6
          name: opia-before-build
          statement: "No implementation proceeds without Opus OPIA ratification of the simulation results. Sonnet cannot self-ratify simulation evidence."
          failure_mode: "Builder ratifies own simulation → D14 (unverified-agreement) + HARDWIRE-008 false-pass risk"
        - id: T7
          name: evidence-not-reality
          statement: "Simulation artifacts are never committed to production without explicit Governor promotion. Simulated state is a staging construct, not a production commitment."
          failure_mode: "Simulation data enters production DB or live config → real users affected by test artifacts"
    # ── 2. branches ──────────────────────────────────────────────────────────
    # 4 REAL simulation modes (taxonomy). B_SIMULATION_COMPARISON EXCLUDED (BEFORE/AFTER/DELTA, not simulation).
    branches:
      - id: B1
        name: scenario
        description: "Sandbox specification simulation — execute spec against 3+ real scenarios to prove design works before any code."
        when_to_use: "Any new feature, policy, or architectural decision expressed as a sandbox spec. Required by B_SANDBOX_BEFORE_IMPLEMENTATION."
        enforcement: "validate-simulation-before-implementation.mjs (T6 gate — advisory→blocking) + simulation_status: pass frontmatter"
        canonical_home: "docs/plan/pillar-0-governance/behavioral-contracts/B_SANDBOX_BEFORE_IMPLEMENTATION.md"
        status: active
      - id: B2
        name: scale
        description: "N×M load simulation — simulate N apps × M tenants (or N requests × M users) at target scale to find bottlenecks before they hit production."
        when_to_use: "Any infrastructure or architecture decision that affects shared resources (DB connections, rate limits, RLS policies). Required before apps #2..#30."
        enforcement: "dim-4 sandbox spec Surface 4 (k6 harness design) + bottleneck-expert skill 30→300 lens"
        canonical_home: "docs/plan/_handoff/VAULT/sandbox-specs/SANDBOX-multi-tenant-scale-readiness-spec-S076.md §DESIGN SURFACE 4"
        status: sandbox
      - id: B3
        name: persona
        description: "Naive persona simulation — simulate naive user perspectives (non-expert, non-developer) to catch design failures before real deployment."
        when_to_use: "Any user-facing feature or UX decision. Required by NAIVE-PERSONAS-DOCTRINE before finalizing UX flows."
        enforcement: "NAIVE-PERSONAS-DOCTRINE.md + UX-expert skill persona review gate"
        canonical_home: "docs/plan/pillar-0-governance/NAIVE-PERSONAS-DOCTRINE.md"
        status: active
      - id: B4
        name: deletion-decoupling
        description: "Scaffold deletion simulation — simulate removing a layer, module, or arrangement to prove the durable system remains functional without it."
        when_to_use: "Agent-decoupling, layer-split decisions, any claim that 'the system works without X'. Required before declaring decoupling complete."
        enforcement: "validate-agent-deletion-test.mjs --simulate (6-step, restores all artifacts)"
        canonical_home: "tools/validators/validate-agent-deletion-test.mjs"
        status: active
    # ── DISAMBIGUATION ──────────────────────────────────────────────────────
    # B_SIMULATION_COMPARISON is NOT a simulation mode.
    # It is an evidence comparison pattern: BEFORE/AFTER/DELTA (compare two states, don't generate new behavior).
    # Cross-ref: tools/vault/ai-conception/B_SIMULATION_COMPARISON.md → reclassified as evidence-comparison
    disambiguation:
      excluded: "B_SIMULATION_COMPARISON"
      reason: "BEFORE/AFTER/DELTA comparison is not simulation (not generating behavioural evidence before committing). It's an evidence-presentation pattern. Governed under VALD as a comparison/evidence tool, not a simulation mode."
      reclassified_to: "evidence-comparison pattern (VALD spine, evidence-presentation class)"
    # ── 3. alignment_map ─────────────────────────────────────────────────────
    alignment_map:
      schema_anchor: vault_files
      architecture_map_node: "simulation-discipline"
      classification_dimension: VALD
      root: .claude/core-spines/L1_CORE_VALD.md
    # ── 4. wiring_map ────────────────────────────────────────────────────────
    wiring_map:
      - file: docs/plan/pillar-0-governance/behavioral-contracts/B_SANDBOX_BEFORE_IMPLEMENTATION.md
        role: "Canonical policy for scenario-sim (B1) — lifecycle DRAFT→SANDBOX→SIMULATED→RATIFIED + simulation_status: pass gate"
        status: ACTIVE
      - file: tools/validators/validate-simulation-before-implementation.mjs
        role: "T6 gate enforcement — blocks implementing without SIMULATED state + Opus ratification"
        status: ACTIVE
      - file: docs/plan/pillar-0-governance/NAIVE-PERSONAS-DOCTRINE.md
        role: "Canonical policy for persona-sim (B3) — naive perspective requirement before UX finalization"
        status: ACTIVE
      - file: tools/validators/validate-agent-deletion-test.mjs
        role: "Canonical tool for deletion-decoupling-sim (B4) — 6-step scaffold deletion simulation"
        status: ACTIVE
      - file: docs/plan/_handoff/VAULT/sandbox-specs/SANDBOX-multi-tenant-scale-readiness-spec-S076.md
        role: "Canonical scale-sim spec (B2) — dim-4 Surface 4, N×M k6 harness design, 30→300 lens"
        status: ACTIVE
      - file: tools/templates/simulation-template.md
        role: "Template for scenario-sim (B1) — standard simulation documentation format"
        status: ACTIVE
      - file: tools/vault/ai-conception/B_SIMULATION_COMPARISON.md
        role: "DISAMBIGUATED (not a sim mode) — BEFORE/AFTER/DELTA evidence-comparison pattern; cross-ref only"
        status: ACTIVE
        note: "Reclassified S076: NOT simulation, IS evidence-comparison. See disambiguation block above."
    # ── 5. tier_permission ───────────────────────────────────────────────────
    tier_permission:
      inner_platform:
        actors: [governor, opus, sonnet]
        can_simulate: true
        can_ratify_simulation: false  # Sonnet cannot self-ratify (T6)
        ratification_requires: "Opus OPIA or Governor ratification of simulation results"
      developer:
        actors: [governor]
        can_simulate: true
        can_ratify_simulation: true
        ratification_requires: "THIS-SESSION simulation output cited + verify exit_code=0"
      external_user:
        actors: [account-owner-admin, team-leader, end-user]
        can_simulate: false  # external users do not run platform simulations
      ratification_required: true
      min_tier_to_ratify: governor
    # ── 6. cie_pe ─────────────────────────────────────────────────────────────
    cie_pe:
      pe_score: 7.0  # urgency=high(3) × impact=all-builds(2.5) / spi=1.0 = 7.5, derated for sandbox state
      urgency: high
      impact: all-builds  # every feature must be simulated before implementation
      pe_rationale: "Simulation discipline gates ALL implementation work (T6). Without it, every build is a gamble. PE = high × all-builds / 1.0 = 7.5 (sample, tunable). Derated while in sandbox state."
      cie_connection: requires_promotion
      pe_connection: input
      cie_capture_enabled: false  # promote when adapter OBSERVE pipeline ships (Phase 2)
      note: "S076 Phase 1 wiring declared; Phase 2 (cie-pe-adapter OBSERVE) promotes cie_connection to always_active"
    # ── 7. escalation ─────────────────────────────────────────────────────────
    escalation:
      owner: group:finky
      escalation_path: "Sonnet flags missing simulation → Opus HOLDS at OPIA (T6) → Governor blocks session close if T5 lifecycle violated"
      ladder:
        L1: "Sonnet cites simulation_status: pass in milestone report"
        L2: "Opus refuses ACCEPT at OPIA if simulation evidence missing (HARDWIRE-008)"
        L3: "Governor reviews carry-forwards at session close (handoff-attestation)"
        L4: "validate-simulation-before-implementation.mjs BLOCKS any implementing-state plan without SIMULATED"
      closure_owner: group:finky
      closure_decision: "All 4 modes have ACTIVE enforcement + validate-core-spine-template passes + Opus OPIA ratifies this entry"
      closure_by: "S077 (after Opus OPIA on this spec)"
    # ── 8. realtime_save ──────────────────────────────────────────────────────
    realtime_save:
      enabled: false  # not yet wired (B2 realtime-save not applied to simulation spine)
      save_path: tools/data/process-state/core-spine-simulation__governor__active.json
      lib: libs/process-state/index.mjs
      note: "Wire after Opus OPIA ratification + Phase 2 cie-pe-adapter OBSERVE pipeline"

  - id: communication
    spine: AI
    status: active
    authored_session: S084
    authored_by: "Opus-21 (core seed) + Sonnet S084 (implementation)"
    ratified_session: S084
    ratified_by: "Governor S084 (PROTO-S084-COMM-CORE ratified)"
    ratified_date: "2026-06-14"
    # Spine fork rationale: Option A — registry entry under AI dimension.
    # Communication is a METHOD, not a domain. Simulation precedent (VALD entry S076).
    # A 6th L1 would pay boundary-002 crossing tax for a taxonomy win only.
    # AI L1 covers AI behavior at boundary crossings — communication IS that behavior.
    # ── 1. trunk ─────────────────────────────────────────────────────────────
    # 3-element trunk: WHO (identity) / WARRANT (provenance) / ACTION (single next step).
    # WARRANT is the missing element — the 82-vs-78 mislabel shipped inside
    # a correctly-formatted message because WHO passed but WARRANT was absent.
    trunk:
      description: "Communication = crossing a boundary without losing intent or importing a false assumption. Three mandatory per-message elements: WHO (identity), WARRANT (provenance of claims), ACTION (single next step). All three must be present; absence of any is act-time detectable."
      elements:
        - id: T1
          name: who
          statement: "Every cross-boundary message declares its sender and receiver in canonical form. Identity ambiguity → wrong role acts on directive."
          failure_mode: "Message without sender → D2 (authority-pleasing) fires; receiver doesn't know they can push back"
          enforcement: "pre-tool-use-council-address-required.sh (T1 BLOCKING) — council files enforced S072"
        - id: T2
          name: warrant
          statement: "Every factual/state/completion/numeric claim in a cross-boundary message carries exactly one provenance label: [MEASURED:<tool>] / [PREDICTED] / [ASSUMED]. 'verified'/'confirmed' reserved for [MEASURED] only."
          failure_mode: "PREDICTED-AS-MEASURED — a predicted number labeled 'verified' ships in a council message; Opus ratifies a false assumption. S083 instance: principles_count=82 [ASSUMED] labeled as verified when live was 78 [MEASURED]."
          enforcement: "pre-tool-use-council-address-required.sh extension (S084 ADVISORY) + pre-tool-use-false-assumption-gate.sh (S084 ADVISORY) + validate-communication-protocol.mjs --extended (EXTENDED)"
        - id: T3
          name: action
          statement: "Every cross-boundary message specifies exactly one action the receiver must do next. A list of possible next steps = no clear next step."
          failure_mode: "D5 (single-pass) fires: receiver selects one action from five arbitrarily; intent imported incompletely"
          enforcement: "communication-protocol-shared.md Rule 0 THREE-QUESTION TEST (T3) + B_OPTIMAL_NEXT_STEP per-turn (T3) + post-tool-use-sonnet-relay-inline.sh one-click relay (S7)"
        - id: T4
          name: boundary-zero
          statement: "Receiver starts from zero context at every boundary. No assumptions about what the receiver knows from prior turns, sessions, or context."
          failure_mode: "D20 (context-pressure) fires: sender compresses context under time/token pressure; receiver misses critical assumptions"
          enforcement: "B_ZCA (foundational, all situations) + B_BOUNDARY_ALIGNMENT_PROTOCOL (ai-to-ai + human-to-ai)"
        - id: T5
          name: orphan-prevention
          statement: "Communication produces artifacts that are permanently reachable. No intent dropped at chat/session/tab boundary."
          failure_mode: "HANDOFF misses a thread; Opus writes directive to opus-turn.md before reading sonnet-turn.md (Rule 14)"
          enforcement: "pre-tool-use-rule14-read-before-write.sh (T1 BLOCKING — wired S084 S4)"
    # ── 2. branches ──────────────────────────────────────────────────────────
    branches:
      - id: B1
        name: ai-to-ai-council
        description: "Opus↔Sonnet (PROTO directive + milestone report). First application — highest value because failures multiply to Opus correction cycles."
        activation_state: "L4 (hardwired) for WHO — L2 (triggered) for WARRANT (S084 extension)"
        canonical_home: "tools/council/communication-protocol-shared.md + ai-collaboration-charter.md §2.5"
        status: active
      - id: B2
        name: ai-to-human
        description: "AI to Governor/developer/admin/user. 6-tier audience hierarchy governs tone/jargon per tier."
        activation_state: "L3 (context-correct) for WHO — WARRANT wiring pending"
        canonical_home: "docs/plan/pillar-0-governance/communication-spine/communication-schema.yaml §audience_hierarchy"
        status: active
      - id: B3
        name: human-to-ai-directive
        description: "Governor→AI directive intake. Threshold classifies before AI acts; CAQ detects class-of-problem."
        activation_state: "L3 (context-correct) for ACTION (intent crystallization) — WARRANT not applicable (human speaker)"
        canonical_home: "docs/plan/pillar-0-governance/threshold-gate-v2.md + communication-protocol-shared.md Rule 15"
        status: active
      - id: B4
        name: ai-to-subagent
        description: "AI→subagent (Agent() calls). UNDERSTANDING BLOCK before + ALIGNMENT CONFIRMATION after."
        activation_state: "L4 (hardwired) for WHO (B_BOUNDARY_ALIGNMENT_PROTOCOL Type B BLOCKING) — WARRANT pending"
        canonical_home: "docs/plan/pillar-0-governance/behavioral-contracts/B_BOUNDARY_ALIGNMENT_PROTOCOL.md"
        status: active
      - id: B5
        name: ai-to-external
