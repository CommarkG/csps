  - id: journeys
    spine: GVRN
    status: sealed
    authored_session: S084
    authored_by: "OPUS-22 (seed) + Sonnet S084 (build)"
    ratified_session: S088
    ratified_by: "PROTO-S088-JOURNEY-CORE-SPINE (Opus #25 Governor-ratified directive)"
    ratified_date: "2026-06-22"
    # ── 1. trunk — THE SEALED CORE: invariants C1-C5 + phases P1-P5 ──────────
    # Verbatim from JOURNEY-SEEDS-S084.md SEED-1 (OPUS-22 authored).
    # SEALED — changing any C-invariant or P-phase requires boundary-crossing protocol.
    trunk:
      description: "A journey = a tracked path from a classified intent to verified completion, run through 5 phases, each closed by a Phase Exit Gate (PEG), with risk-classed gate modes, full event logging, and version-bound instances. The trunk is SEALED — changing it is a boundary-crossing event."
      invariants:
        - id: C1
          name: no-silent-skip
          statement: "A phase, gate, or evidence requirement may be compressed, overridden, or marked N/A — but NEVER unrecorded. Every skip writes an event (actor, reason, scope) to the log (SEED-8)."
          failure_mode: "Silent skip → the audit log lies; 'done' is not reproducible from events."
        - id: C2
          name: humble-first
          statement: "Every phase begins by consulting what already exists (precedent / prior instances / canonical sources) before generating new. Existing-Before-New is a phase pre-step, not advice."
          failure_mode: "Parallel-creation disease — new node when an existing one should have evolved."
        - id: C3
          name: evidence-at-gate
          statement: "No PEG advances without THIS-SESSION evidence bound to the gate (SEED-5). Memory of a prior run is not evidence. Re-run (or hash-verify for cheap scopes) IS the proof."
          failure_mode: "Nominal DONE — the next instance rediscovers and re-fails the same thing."
        - id: C4
          name: decide-with-pe-and-cie
          statement: "Every DECIDE (PEG-3) selects among options with a PE score; every PEG emits a CIE signal on exit. Neither the decision nor the emission may be silent."
          failure_mode: "Path chosen by recency/authority, not priority; phases close leaving no learning signal."
        - id: C5
          name: verify-against-acceptance-criteria
          statement: "Completion = verified against DECLARED acceptance criteria + a confidence level + a monitoring/rollback plan. 'Verify-completely' is false confidence and is BANNED as a claim. SCOPE INVARIANT: a journey DEFINITION is DefinitionScope: platform_def | tenant_def ONLY; tenant_def LOCKED OUT in MVP (no tenant-authored variants). Expansion requires §SEED-1 EXPANSION."
          failure_mode: "Unbounded 'fully verified' claim; OR ad-hoc tenant variants with no inheritance rule."
      phases:
        - id: P1
          name: intent
          intent: "Crystallize + classify the goal; selector runs (SEED-6); risk_class ratified (R8)."
        - id: P2
          name: audit
          intent: "Consult what exists (C2); gather evidence; map the dependency surface."
        - id: P3
          name: decide
          intent: "Choose the path with a PE score (C4); register non-selected options (no-lost-threads)."
        - id: P4
          name: validate
          intent: "Run the build/change; ZF evidence at the gate (C3); ripple pass (SEED-4)."
        - id: P5
          name: activate-verify-learn
          intent: "Activate; verify against acceptance criteria (C5); emit CIE; propagate essence (PARK-024)."
    # ── 2. branches — 4 variants (SEED-6 VariantType) + 5 axes (BranchAxis) ───
    branches:
      - id: B1
        name: fast
        variant: fast
        risk_class_map: "low -> fast"
        description: "Lightweight journey variant for low-risk intents. ZF/PE advisory at P2/P3."
        status: sealed
      - id: B2
        name: standard
        variant: standard
        risk_class_map: "standard -> standard"
        description: "Default journey variant. Blocking gates at PEG-3 (PE) and PEG-4/5 (ZF). Inner council."
        status: sealed
      - id: B3
        name: governed
        variant: governed
        risk_class_map: "elevated|critical -> governed"
        description: "Full PEG enforcement. Expert council at P3; cross-actor ratify-ZF at P4. External council on critical."
        status: sealed
      - id: B4
        name: exploratory
        variant: exploratory
        activation: "Explicit opt-in only (F1). Permission floor: core_dev+. Non-empty justification required. Override + justification logged (SEED-8). Rejected override falls back to risk_class variant."
        description: "Research/experimental variant. Gates relaxed where matrix allows; never below trunk floors."
        status: sealed
    # ── 3. alignment_map ─────────────────────────────────────────────────────
    alignment_map:
      schema_anchor: vault_files
      architecture_map_node: "pillar-0-governance"
      classification_dimension: GVRN
      root: .claude/core-spines/L1_CORE_GVRN.md
      note: "Journeys = primary build method for all CSPS deliverables. GVRN classification: the 5-phase method governs every build."
    # ── 4. wiring_map — SEED-3 phase→moat/council/loop real-file bindings ────
    wiring_map:
      - file: tools/scripts/threshold-router.mjs
        role: "P1: threshold-router classifies every intent (M-16/M-42); blocking gate at P1 entry for all risk classes"
        status: ACTIVE
