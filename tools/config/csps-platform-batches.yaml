# CSPS Platform Batches — 8 Named Groups

> **Rationale:** CSPS has 65+ principles, 63+ contracts, 137+ validators, 80+ open items.
> Zero top-level organization above the item level made priority invisible and composition
> impossible. 8 named batches give every item a home. BATCH-H is the frontier.

