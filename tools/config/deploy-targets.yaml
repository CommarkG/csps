# tools/config/deploy-targets.yaml
# Registry of CSPS Vercel deploy targets — source of truth for validate-app-deploy-readiness.mjs CHECK 5.
# See: docs/plan/pillar-0-governance/external-integrations/vercel.md for full deployment protocol.
#
# root_dir = the "Root Directory" value set in the Vercel UI (Project Settings → Build and Deployment).
# Pattern for all CSPS apps: apps/[app]
#
# PREVENTION CLASS: budget-planner failure class (FLAWLESS-DEPLOY P1)
# Root cause: Vercel Root Directory not set → Vercel builds from repo root → 404 on all routes.
# Fix: register root_dir here; CHECK 5 in validate-app-deploy-readiness.mjs BLOCKS if dir missing.
#
# How to add a new app:
#   node tools/scripts/generate-deploy-config.mjs --app [appname]
#   → Creates apps/[appname]/vercel.json + apps/[appname]/.csps/deploy-checklist.md + entry here
#
schema_version: "1.0"
session: S073
owner: group:finky
closure_owner: group:finky
closure_decision: "Living registry — terminal state is DEPLOYED for all active apps"
closure_by: "ongoing — add entry per new app, mark status:deployed after first production deploy"

targets:
  - app: template
    root_dir: apps/template
    framework: nextjs
    vercel_project: csps-template
    status: active
    deploy_url: null
    note: "Canonical starting point — all new CSPS apps fork from this."
    closure_owner: group:finky
    closure_decision: "First production deploy verified — set status:deployed + deploy_url"
    closure_by: "before App#2 (The Connector) goes to production"

  - app: csps-playground
    root_dir: apps/csps-playground
    framework: nextjs
    vercel_project: csps-playground
    status: deployed
    deploy_url: "https://csps-playground.vercel.app"
    note: "Platform governance + AI profiling dashboard. IS a git submodule (apps/csps-playground → CommarkG/csps-playground). Root Directory in Vercel UI = apps/csps-playground with Include Outside Root enabled. S075: confirmed READY via REST API."
    closure_owner: group:finky
    closure_decision: "Active and deployed — mark as deployed"
    closure_by: "ongoing — update deploy_url on major feature changes"
    ratified_session: S075
    verified_at: "2026-06-01"

  # ── VAULTED (disconnected from Vercel — do NOT recreate) ──────────────────
  # These apps are in apps/_trials-vaulted/ and their Vercel projects were removed.
  # Recreating them will cause build failures (root dir won't exist in main branch).
  # To re-deploy a vaulted app: move it back to apps/ + run generate-deploy-config.mjs.

  - app: budget-planner
    root_dir: apps/_trials-vaulted/budget-planner
    framework: nextjs
    vercel_project: csps-budget-planner
    status: deprecated
    deploy_url: null
    note: "VAULTED S075. Vercel project removed (it was triggering build failures on every push because root_dir apps/budget-planner didn't exist). App in apps/_trials-vaulted/."
    closure_owner: group:finky
    closure_decision: "Vercel project REMOVED. Do not recreate without moving app back to apps/"
    closure_by: "never — deprecated"
    deprecated_session: S075
    deprecated_reason: "Vercel project pointed to apps/budget-planner which was moved to _trials-vaulted — caused build failure on every push to main"

# --- Status enum ---
# active:     directory exists, not yet deployed to Vercel production
# deployed:   successfully deployed, deploy_url confirmed working
# deprecated: superseded, no longer deployed
