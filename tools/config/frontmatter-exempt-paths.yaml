# tools/config/frontmatter-exempt-paths.yaml
# B2 S086: Single SSoT for frontmatter / universal-alignment exemptions.
# CONSUMED BY: validate-frontmatter.mjs + validate-universal-alignment.mjs
# Rationale: each pattern has a documented reason; divergent exempt lists = a maintenance class defect.
# Append-only; never remove without checking both validators still reference this file.
#
# Format: each entry has pattern (string, converted to regex in code) + reason.
# Patterns are applied as regex against the full relative file path.

schema_version: "1.0"
created_session: S086
consumed_by:
  - tools/validators/validate-frontmatter.mjs
  - tools/validators/validate-universal-alignment.mjs

exemptions:
  # Auto-generated log files — append-only per-day / per-session records
  - pattern: "_handoff/VAULT/governor-prompts/"
    reason: "Governor prompt log files are auto-generated by user-prompt-submit-governor-prompts.sh. They use a custom log frontmatter (id/name/type:log). Exempt from universal alignment which would require core_spine/schema_anchor/links."
    added_session: S086
  - pattern: "_handoff/VAULT/governor-comments/"
    reason: "Governor comment log files are auto-generated by user-prompt-submit-raw-comments.sh (one per day). Same custom log frontmatter as governor-prompts. Exempt from universal alignment."
    added_session: S086

  # Historical / handoff artifacts
  - pattern: "_handoff/VAULT/(archive/)?chat-jump-prompt-"
    reason: "Handoff vault chat-jump prompts are historical chat artifacts, not governed docs."
    added_session: S025
  - pattern: "_handoff/VAULT/(archive/)?chat-jump-S"
    reason: "Handoff vault chat-jump session stubs — historical."
    added_session: S025
  - pattern: "_handoff/VAULT/(archive/)?chat-transfer-S"
    reason: "Handoff vault chat-transfer stubs — historical."
    added_session: S025
  - pattern: "_handoff/VAULT/(archive/)?qc-audit-results-"
    reason: "QC audit results — historical session artifacts."
    added_session: S025
  - pattern: "_handoff/VAULT/(archive/)?validation-pass-"
    reason: "Validation pass records — historical session artifacts."
    added_session: S025
  - pattern: "_handoff/VAULT/(archive/)?gaps-and-duplications-"
    reason: "Gap analysis artifacts — historical."
    added_session: S025
  - pattern: "_handoff/VAULT/archive/(comprehensive-handoff|s013-new-chat|opus2-chat)"
    reason: "Legacy handoff format before canonical structure."
    added_session: S025
  - pattern: "_legacy/"
    reason: "Legacy directory — pre-governance artifacts."
    added_session: S025

  # ADR exemption
  - pattern: "docs/adr/\\d{4}-"
    reason: "ADRs use MADR frontmatter (id/title/status/date/deciders/tags) — distinct from universal CSPS frontmatter. Pending ADR-0023 resolution."
    added_session: S006

  # Convention files (use their own schema)
  - pattern: "(^|/)AGENTS\\.md$"
    reason: "AGENTS.md uses cross-vendor agents.md spec convention — no CSPS frontmatter expected."
    added_session: S010
  - pattern: "packages/skills/[^/]+/SKILL\\.md$"
    reason: "SKILL.md uses agentskills.io spec — pending per-file-type schema unification ADR."
    added_session: S010

  # Auto-generated transient files
  - pattern: "tools/verify-last-run\\.md$"
    reason: "verify.mjs emits this as a transient run report each time — not a governed artifact."
    added_session: S025
  - pattern: "tools/bootstrap-readiness\\.md$"
    reason: "bootstrap.ps1 emits this as a transient run report."
    added_session: S025
  - pattern: "_intake/processed/[^/]+/(provenance|raw|scan-passed)\\.md$"
    reason: "Auto-generated intake markers. Frontmatter applies to the parent extraction-note, not these provenance files."
    added_session: S023
  - pattern: "_intake/contexts/.*EXT-[^/]+\\.md$"
    reason: "Routed-context files inherit via reference; canonical frontmatter on the processed/ folder."
    added_session: S023

  # Generated slice directories
  - pattern: "pillar-0-governance/behavioral-contracts/"
    reason: "Slices auto-generated from behavioral-contracts.md monolith. Canonical SSoT = monolith."
    added_session: S010
  - pattern: "pillar-0-governance/audit-runner/"
    reason: "Slices auto-generated from audit-runner.md monolith. Canonical SSoT = monolith."
    added_session: S010
  - pattern: "pillar-0-governance/ai-behavior-spine/"
    reason: "Slices auto-generated from ai-behavior-spine.md."
    added_session: S010
  - pattern: "external-review-download/"
    reason: "Repo-root download folder: dated, Csps-named, frontmatter-stripped copies of the external-AI review package (Csps-YYYY-MM-DD-NN-*.md). Non-governed download artifacts so GitHub serves them with the correct filename; canonical originals remain fully validated. Outside SCAN_PATHS for validate-frontmatter; this entry exempts validate-universal-alignment --scan-new."
    added_session: S088
