# Mechanical Enforcement (current vs. planned):
enforcement:
  active:
    - "ZenStack @@allow policies — enforce tenant isolation at L0 (ORM layer)"
    - "validate-foundation-schema-drift.mjs — catches L1/L0 schema divergence"
    - "Clerk middleware — enforces auth at L2 boundary"

  planned:
    - name: "validate-layer-boundary.mjs"
      description: "Scans all imports across layers; flags L0→L1 or L0→L2 imports as BLOCKING"
      vlt: "VLT-S019-LAYER-BOUNDARY"
      priority: P9

    - name: "validate-import-quarantine.mjs extension"
      description: "Detect Stripe/billing imports in L2 outside libs/ (ADVISORY→BLOCKING)"
      vlt: "VLT-S019-BILLING-PLACEMENT"
      priority: P8

    - name: "validate-persona-8-compliance.mjs"
      description: "Scan L1/L2 code for ZenStack bypass patterns (raw PrismaClient in business routes)"
      vlt: "VLT-S019-PERSONA8"
      priority: P10
