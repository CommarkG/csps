## The Quotes Dimension

> "You don't have to create from scratch. You have to create with the wisdom of what came before."

Every S3 question should be accompanied by the relevant platform quote or famous insight
that makes the PRINCIPLE memorable. The core-quotes library (Task #7 in session-working-doc)
feeds into this: each scope question maps to a guiding quote.

Example:
- S3 Q1 (training default): *"We cannot solve our problems with the same thinking we used when we created them." — Einstein*
- S3 Q2 (satisfaction point): *"The most dangerous phrase in the language is 'we've always done it this way.'" — Grace Hopper*
- S3 Q3 (T1 hook): *"Automation is the next necessary step after consistency." — Adapted from Drucker*

