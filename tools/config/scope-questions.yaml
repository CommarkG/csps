## Gap Classification Matrix

When a gap is found, classify it BEFORE routing:

```yaml
gap_classification:
  CRITICAL:
    definition: "Platform is currently broken or producing false outputs"
    examples: ["exit_code lies about validity", "blocking validator not actually blocking", "security header missing in production"]
    routing: "Fix S1 NOW this turn. S2 this session. S3 this session or next."
    delay_tolerated: none

  SIGNIFICANT:
    definition: "Something is built on a false assumption; future work will compound the error"
    examples: ["week-4 audit never shipped but others depend on it", "plan item marked done but key file missing"]
    routing: "Vault immediately. S1 at next natural gate. S2 this session or next. S3 within 2 sessions."
    delay_tolerated: "1-2 sessions maximum"

  ADVISORY:
    definition: "Deviation from plan that doesn't affect current correctness"
    examples: ["count says 5 but should say 6", "slug in audit-runner but no validator file yet"]
    routing: "Vault. Add to daily audit queue. S1 at next session. S2 weekly. S3 when K=2 fires."
    delay_tolerated: "3-7 sessions"

  COSMETIC:
    definition: "Label drift, count mismatch, naming inconsistency"
    examples: ["'5 operating principles' in old doc", "BATCH-G instead of BATCH-H in a tag"]
    routing: "Fix inline if 2 lines or less. Otherwise vault. No S2/S3 needed unless K=2 fires."
    delay_tolerated: "No urgency"
```

---

## Prevention Routing Engine

When a gap is found, this is the decision sequence:

```
FOUND GAP
    ↓
1. Classify: CRITICAL / SIGNIFICANT / ADVISORY / COSMETIC
    ↓
2. S1 now? → CRITICAL: yes immediately | SIGNIFICANT: next gate | ADVISORY: vault | COSMETIC: inline if tiny
    ↓
3. S2 when? → CRITICAL: this session | SIGNIFICANT: this/next session | ADVISORY: weekly | COSMETIC: if K=2
    ↓
4. S3 when? → CRITICAL: this session | SIGNIFICANT: next session | ADVISORY: 2-3 sessions | COSMETIC: skip
    ↓
5. K-check: Is this K=1 or K≥2?
   K=1: proceed as classified
   K≥2: PROMOTE to SIGNIFICANT minimum, register anti-pattern, trigger S3 immediately
    ↓
6. Route output:
   - CRITICAL fix: commit + push + update this session
   - Vault: tools/data/gap-vault.yaml + note in session-working-doc
   - Daily queue: audit-scheduling.yaml pipeline_13 (threshold-gate) or custom daily slot
   - Weekly queue: audit-scheduling.yaml pipeline_6/7/8
   - S3 artifact: anti-patterns.md entry + T1/T2/T3 enforcement map
```

