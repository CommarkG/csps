# Scope Questions — Canonical 3-Scope Framework

## What these are

When a gap is identified (something declared but not done, something wired but not firing,
something counted but not verified), these questions provide the structured analysis.

The 3 scopes are defined in `docs/plan/pillar-0-governance/core-scopes.md`:
- **S1 (Local)**: Fix THIS instance
- **S2 (Ripple)**: Find everything else affected by this class
- **S3 (Prevention)**: Make this class structurally impossible to recur

---

## Scope 1 Questions — "What exactly is broken right now?"

*These 5 questions must be answered BEFORE any fix is applied.*
*Purpose: prevent fixing the wrong thing, prevent fixing based on assumptions.*

```yaml
scope_1_questions:
  Q1_precise_gap: "What EXACTLY is missing or wrong? (one sentence, no paraphrase)"
  Q2_what_was_declared: "What did the platform say was done? (cite: commit SHA / doc line / plan item)"
  Q3_what_actually_exists: "What actually exists right now? (verified by running it this session, not memory)"
  Q4_minimal_fix: "What is the minimal change that closes THIS instance without touching anything else?"
  Q5_immediate_risk: "If I fix this now, does anything currently DEPENDING on it break?"
```

*Example for 'week-4 audits never implemented':*
```
Q1: validate-activation-coverage.mjs was advisory (exit 0) even for unactivated contracts
Q2: audit-runner.md line 405 said 'Build ACTIVE (validate-activation-coverage.mjs in pnpm verify)'
Q3: validator existed but always exited 0 — effectively a no-op for unactivated contracts
Q4: Change exit code to 1 for non-exempt unactivated contracts + create exempt list
Q5: Yes — 24 contracts had 0 activation → would break build. Added exempt list (see PROTO-S051-3).
```

---

## Scope 2 Questions — "What else is affected by this class of gap?"

*These 5 questions must be answered WITHIN THE SAME SESSION as the S1 fix.*
*Purpose: prevent closing the visible instance while leaving hidden instances open.*

```yaml
scope_2_questions:
  Q1_what_depends_on_this: "What else in the platform ASSUMES this was working correctly?"
  Q2_who_else_hits_this: "Which roles / sessions / apps / tools could encounter this same gap?"
  Q3_instance_or_class: "Is this K=1 (one-off) or K≥2 (recurring pattern requiring structural fix)?"
  Q4_co_declared_items: "What else was declared in the same timeframe / same session / same commit?"
  Q5_downstream_artifacts: "What was built ON TOP OF the false assumption? What inherits the gap?"
```

*Example for 'week-4 audits never implemented':*
```
Q1: Any session that relied on 'validation passes' was relying on advisory (not blocking) checks
Q2: All sessions since S007 that added week-4 validators — all auditors, all builders
Q3: K≥2 pattern — 'week-4' appears 50+ times in audit-runner.md (structural)
Q4: All items tagged 'week-4' in the same period — many never promoted
Q5: Session close gates that counted 'validators=140' as proof of health — proxy for false completeness
```

---

## Scope 3 Questions — "What makes this structurally impossible to happen again?"

*These 5 questions produce the PERMANENT prevention artifacts.*
*Purpose: not 'personal vigilance' — mechanical impossibility.*

```yaml
scope_3_questions:
  Q1_training_default: "What AI/human default ENABLED this to happen? (name it explicitly)"
  Q2_satisfaction_point: "What incorrect 'done feeling' was hit prematurely? (the moment it felt complete but wasn't)"
  Q3_t1_hook: "What T1 hook would catch this BEFORE it enters git? (exits 1 on violation)"
  Q4_t2_validator: "What T2 validator would BLOCK this from passing pnpm verify?"
  Q5_t3_injection: "What T3 session-open injection would remind the AI to verify this class?"
  Q6_anti_pattern: "Does this match an existing AP-* or needs a new one? Name it and the class."
```

*Example for 'week-4 audits never implemented':*
```
Q1: AI default: 'writing week-4 in a doc = scheduling it.' No tracking that week-4 passed.
Q2: 'I registered the slug. It says Build ACTIVE. That's the audit done.' (documentation = implementation)
Q3: pre-commit-week4-staleness.sh — blocks commits that reference week-4 items older than 5 sessions
Q4: validate-week4-staleness.mjs — checks audit-runner.md 'week-4' items against session count
Q5: 'Any validator marked week-4 that is still marked week-4 after 3 sessions = STUB. Treat as stub.'
Q6: AP-001 (EXISTS≠ACTIVE) covers this class. Subsection: 'declared-implementation date passing without shipment'
```

