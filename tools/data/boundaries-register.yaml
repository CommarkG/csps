# Boundaries Register

> Every entry = a ratified boundary. Crossing one = governed 5-step event.
> k_count = sessions in which this boundary has been crossed.
> k_count >= 2 for SAME boundary → mandatory re-derivation of the boundary, not another exception.
> Status: ratified | pending-derivation | re-deriving
>
> CROSSING SCHEMA: each crossing records:
>   { session, from_value, to_value, governor_approval, assessment_ref, scheduled_resolution }

entries:

  - id: boundary-001
    name: "verify-cycle-cap"
    governing_intent: >
      Prevent pnpm verify from accumulating so many validators it becomes slow enough to impede
      the fast-feedback loop. The cap is a forcing function for architecture (tiering, EXTENDED
      tier, DEEP tier) — not a maximum quality ceiling. When the cap feels too tight, the right
      fix is architectural (EXTENDED tier, weekly cron) not a higher number.
      Current state (S076): EXTENDED tier implemented — 5 structural invariants moved to weekly
      cron, freeing headroom for active validators. Cap HELD at 200.
      S084 PREV-4 DOCTRINE LINE: target = operative-limit(140) − committed-future-load(6) = 134.
      Current active = 139 > 134 → any new STANDARD validator overflows the buffer zone.
      Consequence: PHASEB validators 002/003/004 must be born run_tier:'EXTENDED' (mechanical,
      not style preference). The 6-cycle committed-future-load = PHASEB 002+003+004 (est. +1+1+4).
      Reserve of 60 cycles (200 hard_limit − 140 soft_limit) is the EXTENDED tier's safety margin.
    current_value: 200
    unit: "active validator cycles in verify.mjs (CRITICAL+STANDARD; excludes DEEP+EXTENDED+skip)"
    canonical_source: "tools/validators/validate-platform-capacity.mjs (pnpm-verify-cycles)"
    cie_connection: requires_promotion
    pe_connection: input
    k_count: 0
    crossings: []
    status: ratified
    status_note: >
      Hard limit = 200 (5-step crossing protocol required). Soft limit = 140 (architectural
      target — forces tiering). Active cycles at S084 = 139 (confirmed [MEASURED:validate-platform-capacity]).
      Phase 2+S5 promoted from DEFERRED to EXTENDED. Any future change to 200 requires 5-step crossing protocol.
      PHASEB 002/003/004 must be born EXTENDED — current 139 > target 134 (=140 - 6 committed-future-load).

  - id: boundary-002
    name: "l1-core-spine-count"
    governing_intent: >
      The L1 core spines (GVRN/VALD/ARCH/AI/OPER) are sealed. They represent the 5 fundamental
      domains of the platform — governance, validation, architecture, AI behavior, operations.
      A new L1 spine = a claim that a fundamentally new domain exists, requiring full Governor +
      Opus council ratification + balance-expert review. The discipline: spines are methods (like
      simulation → VALD entry), not separate domains. Protect the 5-spine model from inflation.
    current_value: 5
    unit: "sealed L1 core spines in GVRN/VALD/ARCH/AI/OPER"
    canonical_source: "tools/config/core-spine-registry.yaml (root_spines list)"
    cie_connection: requires_promotion
    pe_connection: input
    k_count: 0
    crossings: []
    status: ratified
    status_note: >
      S076: simulation registered as a VALD ENTRY (not a new L1 spine) per Governor Option A.
      L1 count holds at 5. Any 6th L1 spine requires 5-step crossing protocol.

  - id: boundary-003
    name: "supabase-free-tier-connection-limit"
    governing_intent: >
      Supabase Free plan has a hard limit of 60 max Postgres connections. With 30 apps each using
      connection_limit=1 via pgbouncer, the platform uses 30/60 = 50% of Free headroom at steady
      state. Under burst (2 concurrent invocations/app), usage hits 60/60 = 100% — the hard limit.
      Exceeding Free tier = ALL tenants on ALL apps are degraded simultaneously (noisy-neighbor
      failure). The discipline: when approaching 80% headroom, schedule Supabase tier upgrade via
      boundary-crossing protocol. Do NOT silently exceed; surface and approve.
    current_value: 60
    unit: "max Postgres connections on Supabase Free plan"
    canonical_source: "libs/platform-quota/src/supabase-free.ts (FREE_MAX_DB_CONNECTIONS)"
    cie_connection: requires_promotion
    pe_connection: input
    k_count: 0
    crossings: []
    status: ratified
    status_note: >
      S077 Q1=FREE: established at session open per Opus directive. Conservative numbers in
      libs/platform-quota (60 max, 1 per app, 30 app target = 50% headroom at steady state).
      Trigger: when isFreeHeadroomApproached(appCount) returns true → schedule Supabase Pro
      upgrade via boundary-crossing protocol. validate-tenant-quota-policy.mjs enforces.
    scheduled_upgrade:
      must_address_by_date: null
      upgrade_target: "Supabase Pro (200 max_connections)"
      trigger_condition: "PLATFORM_APP_COUNT_TARGET × FREE_DB_CONNECTIONS_PER_APP ≥ 48 (80% of 60)"
      current_app_count: 1
      trigger_app_count: 48
