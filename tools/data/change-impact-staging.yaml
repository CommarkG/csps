    directions_checked: []
    net_impact:
      helps: []
      harms: []
    verdict: null
    terminal_state: VAULTED-with-trigger
    staged_at: "2026-05-30"
    staged_by: "OPUS-15 S072"
    notes: "PAUSED — resume after journeys + PART 3 ships. M2 trigger: Governor ratifies PART 3 completion OR explicit OPUS-N resume directive. PROTO-S072-CIP M2/M3."

  - id: cip-M3-threshold-15th-class
