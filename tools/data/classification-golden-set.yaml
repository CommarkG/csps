# tools/data/classification-golden-set.yaml
# CSPS Threshold Classifier — Golden Set for accuracy measurement + few-shot LLM training.
# PARK-040 Learning Orchestrator — classification arm. Built S086.
#
# Schema:
#   id: gs-NNN
#   prompt_excerpt: first ~120 chars of the governor input (or synthetic representative)
#   input_context: { type, spine, urgency }  ← what the hook pre-classifies (inputs to routeInput)
#   correct: { scope, intent, mandate_relation, route }  ← ground-truth output
#   source: synthetic | governor-corrected | session-derived
#   session: S0NN
#   review_status: ready | TBD (Governor needs to verify/correct)
#   notes: optional explanation of what makes this a good test case
#
# axis values:
#   scope:             constitutional | architectural | operational | tactical
#   intent:            directive | proposal | question | maintenance | conversational | ai_behavior | validation
#   mandate_relation:  in-mandate | adjacent | orthogonal | new-request
#   route:             PROCESS-NOW | VAULT | ESCALATE | INVOKE:consolidation-expert |
#                      INVOKE:cruel-critic | INVOKE:vocabulary-canon | VAULT:defer | CIP:staging |
#                      FOREIGN-ELEMENT:quarantine | PLACE-NOT-FOUND:pending-node
#
# Governor: fill in `correct:` for any entry with review_status: TBD.
# If the classifier got it wrong, put the CORRECT value and leave a note.

schema_version: "1.0"
created_session: S086
last_accuracy_session: null
overall_accuracy_pct: null  # updated by validate-classification-accuracy.mjs

