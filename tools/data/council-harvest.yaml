id: csps.data.council-harvest
name: council-harvest
description: >
  Harvest register for council + research + external-AI-review OUTPUT (the VALUE, not just the invocation log).
  Every council deliberation, research effort, persona-consult, and external-review response MUST land a harvest
  entry here. Each entry's disposition routes into a LIVE loop so the insight compounds permanently, not once:
  recurring → findings-actuator (act-forcing → prevention); ratify-candidate → ratified-standards.yaml
  (Pipeline A → platform standard + audit). Spec: docs/plan/_handoff/COUNCIL-WISDOM-HARVEST-DESIGN.md (PARK-S088-001).
  ENFORCEMENT: validate-council-harvest.mjs BLOCKS a council-invocation-log entry with no matching harvest entry,
  AND a harvest entry whose disposition is un-routed (status=closed + disposition=null).
version: "1.1"
owner: group:finky
lifecycle: production
lifecycle_state: active
core_spine: GVRN
schema_anchor: tools_templates_meta

# Each entry — tags are CLOSED-ENUM from the tagging core (tag-status-contract.md), never free-text (§9 design).
# disposition ∈ { SWIFT-absorb | park | ratify-candidate | discard-with-reason }
# Route on close: recurring→findings-actuator | ratify-candidate→ratified-standards (Pipeline A)
entries:
