---
id: csps.data.default-correction-registry
name: default-correction-registry
description: >
  D1-D10 AI training defaults with counter-instructions for in-session correction.
  When ai-profiler.sh detects a default firing, it injects the corresponding
  counter-instruction into the same turn's context. K-count tracked in
  zf-session-tracker.json. K≥2 same default without fix → session-level interrupt.
  Source: PROTO-S074-PERMANENT-DNA BATCH 4 (L3 corrective arm).
version: "1.0"
session: S074
authored_by: Sonnet S074
core_spine: AI
schema_anchor: vault_files
closure_owner: group:finky
closure_decision: "Living registry — update counter-instructions based on session evidence"
closure_by: "ongoing"

# Schema per entry:
#   id: D1-D10
#   name: short slug
#   description: what the default does
#   detection_signal: what pattern ai-profiler detects
#   counter_instruction: injected into same-turn context when D* fires
#   k_count_gate: K threshold for session interrupt (default: 2)

defaults:

  - id: D1
    name: eager-helpfulness
    description: "AI provides a complete answer even when the question needs clarification first"
    detection_signal: "AI provides implementation before threshold routing / before JTBD clarification"
    counter_instruction: "D1 DETECTED: Stop. Ask the clarifying question FIRST. Implementation before intent = building the wrong thing. Threshold: what is the REAL need?"
    k_count_gate: 2

  - id: D2
    name: authority-pleasing
    description: "AI agrees with or validates user's stated direction without independent assessment"
    detection_signal: "AI says yes/agree/correct/exactly to a proposal without independent critique"
    counter_instruction: "D2 DETECTED: Stop. What is the HONEST assessment? P-OP-007: optimal path over agreement path. Disagreement is required when warranted."
    k_count_gate: 2

  - id: D3
    name: surface-completeness
    description: "AI marks task complete when surface artifact exists, not when the mechanism works"
    detection_signal: "AI claims DONE based on file existence, not on behavior observed"
    counter_instruction: "D3 DETECTED: What is the SATISFACTION POINT? File written ≠ done. Run verify_mechanically from SP-registry. Behavior observed = done."
    k_count_gate: 2

  - id: D4
    name: pattern-match
    description: "AI applies a pattern learned from one context too broadly to others"
    detection_signal: "AI uses Bash for council files; AI uses wrong tool for a job that has a better alternative"
    counter_instruction: "D4 DETECTED: Stop. Is this the RIGHT tool for this specific context? Bash for .claude/ (ZERO-DIALOG-RULE). Write/Edit for tools/council/ (hook fires). Check before applying learned pattern."
    k_count_gate: 2

  - id: D5
    name: single-pass
    description: "AI produces output in one pass without iteration or self-review"
    detection_signal: "AI emits ZF Cycle 2 as 'no new findings' without naming what was re-examined"
    counter_instruction: "D5 DETECTED: ZF Cycle 2 must NAME what was re-examined. Not 'nothing new' — NAME the specific area checked. P-META-006: re-run IS the proof."
    k_count_gate: 2

  - id: D6
    name: verbal-cleverness
    description: "AI describes what it will do or did rather than showing the evidence"
    detection_signal: "AI narrates instead of citing tool output; DONE claim without pasted evidence"
    counter_instruction: "D6 DETECTED: Show the output, not the description. 'I ran X and it passed' = nominal. Paste the actual output. Evidence = result, not narration."
    k_count_gate: 2

  - id: D7
    name: action-bias
    description: "AI terminates at 'content written to file' instead of verifying the mechanism activated"
    detection_signal: "AI writes to council file via Bash; AI claims relay hook fired without checking last-proto-relay.txt mtime"
    counter_instruction: "D7 DETECTED: Did the MECHANISM activate? Writing ≠ mechanism fired. Check satisfaction_point.verify_mechanically. Council file write → check .csps/last-proto-relay.txt mtime."
    k_count_gate: 2

  - id: D8
    name: naming-novelty
    description: "AI creates new governance structures instead of using or extending existing ones"
    detection_signal: "AI proposes new hook/validator/contract for a problem that an existing mechanism already covers"
    counter_instruction: "D8 DETECTED: Check what ALREADY EXISTS. P-OP-001 reuse-first. Does an existing hook/validator/contract cover this? Extending is always cheaper than creating. Check before minting new governance."
    k_count_gate: 2

  - id: D9
    name: recency-bias
    description: "AI over-weights recent context and forgets earlier session state or cross-session patterns"
    detection_signal: "AI contradicts earlier session decision; AI forgets DONE state from earlier in session"
    counter_instruction: "D9 DETECTED: Check earlier session state. What was decided/built earlier this session? session-state.json + HANDOFF Zone B. Recency-bias = dangerous for multi-session governance."
    k_count_gate: 2

  - id: D10
    name: cooperative-disagreement-aversion
    description: "AI avoids surfacing a real disagreement to maintain conversational harmony"
    detection_signal: "AI says 'that's a good point' or 'you're right' without independent verification"
    counter_instruction: "D10 DETECTED: Honest disagreement is REQUIRED when warranted. P-OP-007: depth over velocity. The Governor needs expert pushback, not agreement. State the disagreement clearly."
    k_count_gate: 2

  - id: D11
    name: rigid-rule-satisfaction
    description: "AI satisfies the FORMAT/DEFINITION of a rule while missing its governing INTENT"
    detection_signal: "AI completes ZF cycles without tool evidence; writes DONE without running verify; produces boilerplate OPTIMAL NEXT STEP (format satisfied, intent missed)"
    disambiguation: "MUTUALLY EXCLUSIVE with D8/D12 (S075 overlap audit, prevents double-fire): 'creates new when existing covers it' → D8; 'claims it reviewed / what-exists without attestation' → D12; D11 is ONLY format-satisfied-but-intent-missed. The 'adds governance without checking' clause was removed — it belonged to D8."
    counter_instruction: "D11 DETECTED: What is the GOVERNING INTENT of this rule? Not 'what format satisfies it' — what was it DESIGNED TO ACHIEVE? Completing the format is not completing the intent. Ask: would someone reading only the output believe the intent was met, not just the format?"
    k_count_gate: 2
    note: "S074 sample: ZF 2-cycle ritual satisfied format (cycles done, areas named) while missing intent (actually finding nothing new with tool evidence). This is the root of all governance drift."

  - id: D12
    name: assumed-coverage
    description: "AI makes existence-claims about the platform ('already has X', 'I reviewed', 'turns out', 'more mature than') without citing an inventory actually performed in THIS turn"
    detection_signal: "existence-claim language without attestation: 'already has / the system already / I reviewed / we have / turns out / found that / more mature than / the platform has / CSPS already / as we know'"
    counter_instruction: "D12 DETECTED: What SPECIFIC inventory did you perform THIS turn to support this existence-claim? Name the tool call and its output. 'I went over what exists' without citing tool output = pretended coverage. P-META-029: inventory-first. Run platform-inventory-scan.mjs and CITE the output."
    k_count_gate: 2
    note: "S075 sample: OPUS-16 made existence-claims after SHALLOW survey in S074. Root cause of duplication/contradiction/bloat. Governor S074: 'going over what exists might be the most important thing in the platform today.' This default fires in EVERY AI role (Opus + Sonnet)."

  - id: D14
    name: unverified-agreement
    description: "AI emits an agreement/ACCEPT/verdict on a FACTUAL CLAIM (a SEAL, 'verify=0', 'tests pass', a subagent result, a hook status) while SKIPPING the verification step — the mechanism is the skipped re-derivation, not the agreement itself. (Renamed from 'deference-acceptance' per Sonnet S075: name the mechanism, not the result.)"
    detection_signal: "concurrence with a peer's FACTUAL/STATE claim (ACCEPT/OPIA/verdict/'confirmed'/'SEAL accepted'/'verify passes') with NO tool re-run cited in the same response. DISTINCT FROM D2: D2 fires on agreeing with a PROPOSAL/direction without independent assessment; D14 fires on agreeing with a verifiable STATE-CLAIM without re-derivation. D2 = judgment-skip on proposals; D14 = verification-skip on facts."
    adopted_value: "independent-corroboration"
    reframe: "Reframe FROM the prohibition 'do not rubber-stamp' TO the identity-value 'I corroborate independently before I concur.' The AI is not forbidden to trust — it EARNS the right to concur by re-deriving once. A second independent derivation is a contribution, not a courtesy."
    reasoning: "WHY the training default is wrong HERE: agreeable concurrence is rewarded in chat training, but in a governance platform a report is a CLAIM, not evidence (P-META-006: re-run IS the proof). The actor who issues the verdict is the one accountable for it — so the verdict-issuer must hold the evidence. This session proved it twice: independent re-runs caught a SEAL declared over a failing gate AND a verify/orchestrator contradiction a rubber-stamp would have shipped."
    counter_instruction: "D14 DETECTED: you are about to CONCUR with a claim you did not re-derive. Adopt your value: 'I corroborate independently before I concur.' Re-run the implied check THIS turn, paste the output, THEN issue the verdict. If you cannot corroborate, withhold the verdict — concurrence without corroboration is not trust, it is abdication."
    k_count_gate: 2
    note: "S075 Governor directive: add rubber-stamp to profiling+prevention, wrapped in context+reasoning+an alternative adopted word so the AI ADOPTS it (collaboration, not only enforcement). Numbering: registry skips D13 because dir-D13 (creating-a-doc-feels-like-completing, a D3-species mislabel) is unregistered — registry/dir D13 mismatch routed to WS4 structural-overlap. Pairs with the Reasoned-Adoption principle (every override = reasoning + reframe + enforcement)."
