id: csps.data.external-capability-alignment
name: external-capability-alignment
description: >
  DNA-Guardian registry. Every EXTERNAL capability (MCP server, agent, skill, library) that can act
  inside CSPS must have a record here with a verdict. Until verdict is ALIGNED or ALIGNED-WITH-TRANSLATION,
  the capability is QUARANTINE: its output is a claim to be independently reproduced, never platform truth.
  SWIFT KERNEL (S088) — seeded with current capabilities at status: pending-review. Deep build:
  PARK-S088-DNA-GUARDIAN (blocking validator + automated translation layer + migration hardening).
version: "1.0"
owner: group:finky
lifecycle: production
lifecycle_state: active
core_spine: GVRN
schema_anchor: tools_templates_meta

# verdict ∈ { ALIGNED | ALIGNED-WITH-TRANSLATION | QUARANTINE | pending-review }
capabilities:
  - id: playwright-mcp
    kind: mcp
    name: "Playwright MCP (headless browser automation)"
    source: "@playwright/mcp"
    version: "@latest (HARDENING: pin a concrete version — npm cert blocked verify-pin S088; @latest lets the reviewed-at-HEAD verdict drift)"
    verdict: ALIGNED-WITH-TRANSLATION
    csps_role: "C6 RENDERS-IN-PRODUCTION evidence — load OUR live routes, capture screenshot + DOM/a11y tree as build-audit CLAIMS (CS9), feed VALD. Ends 'building blind'."
    native_defaults:
      - "unbounded navigation — can load ANY domain (auth-walled, intranet, vendor consoles)"
      - "state mutation — click/type/fill/form-submit can WRITE to the loaded page"
      - "arbitrary JS execution via browser_evaluate (unsandboxed, page context)"
      - "screenshot/DOM framed as 'the result' (truth), not as evidence"
      - "persistent browser profile by default (shared cookies/auth/storage across runs)"
    translations:
      - from: "browser session / page render"
        to: "build-audit evidence-gathering run (OPER); output is a CLAIM feeding VALD"
      - from: "screenshot / DOM snapshot = the result"
        to: "evidence artifact under verify-before-assume; never a completion proof alone (CS9)"
      - from: "navigate to any URL"
        to: "navigate-to-own-deploy-only; domain allow-list = CSPS Vercel deploys"
      - from: "click / type / evaluate (interact)"
        to: "SUPPRESSED — maps to nothing; read-only is the entire contract"
      - from: "the page rendered = done"
        to: "DONE = route 200 AND DOM/a11y asserts expected provenance AND assertion independently checked; pixel is dim-e input, not the seal"
    neutralizations: ["--headless", "--isolated (no persistent profile)", "restrict to read-only nav+screenshot+DOM via a verification-only wrapper agent"]
    guardrails:
      - "domain allow-list: ONLY CSPS-owned deploys (e.g. https://csps-playground.vercel.app/*); reject any other host"
      - "read-only: navigate + screenshot + read DOM/accessibility-tree ONLY"
      - "wrapper/verification-only agent exposes nav+capture+read tools; withholds click/type/fill/evaluate"
      - "keep --headless --isolated hardwired in .mcp.json (removing --isolated re-imports persistent-profile default)"
      - "screenshots are EVIDENCE: a green render does NOT close a build; still subject to verify-before-assume"
      - "HARDENING: pin a concrete @playwright/mcp version; re-review at the pinned HEAD"
    allowed_use:
      - "navigate to CSPS-owned deploy URLs"
      - "capture screenshot of own rendered route (build-audit / dim-e visual evidence)"
      - "read DOM and accessibility tree of own route to assert content/provenance"
      - "assert HTTP 200 on own routes"
    forbidden_use:
      - "navigate to any non-CSPS-owned domain"
      - "click / type / fill / submit forms (any state-mutating interaction)"
      - "browser_evaluate / arbitrary JS execution"
      - "auth / login flows or anything writing external state"
      - "treating a screenshot or DOM snapshot as platform TRUTH or as a completion seal"
    isolation_note: "--headless --isolated SATISFIES CSPS isolation DNA: ephemeral profile, no shared cookies/auth, no cross-run state leak. Correct posture; both flags load-bearing — keep hardwired."
    blast_assessment: "RAW = write + execute + outward-facing (high blast). TRANSLATED = read-only on own deploys (bounded, low blast)."
    reviewer: DNA-GUARDIAN (PARK-S088-DNA-GUARDIAN swift kernel)
    date: 2026-06-29
    reviewed_at_head: "bc996916"
    note: "Verdict holds ONLY through the read-only + own-domain-only wrapper. Raw Playwright is QUARANTINE-class (full browser control = write/execute surface). Pin gap is carry-forward HARDENING, non-blocking because runtime guardrails bound blast regardless of version. ACTIVATION PROVEN S089 (commit 2d5796c2 → planted-violation: browser_click REFUSED by deny-list → error: Permission to use mcp__playwright__browser_click has been denied; own-deploy screenshot captured: csps-playground.vercel.app navigated + screenshotted successfully). EXISTS≠ACTIVE CLOSED."
    activation_proof:
      status: "PROVEN"
      session: S089
      commit: 2d5796c24419bdb5897b1551532005fa14eff373
      planted_violation: "browser_click with target='planted-violation-test-target' → Permission denied (deny-list enforced)"
      allowed_path: "browser_navigate to csps-playground.vercel.app → Page loaded (CSPS Playground title confirmed) → screenshot captured"
      domain_scope_hook: "pre-tool-use-playwright-domain-scope.sh registered in PreToolUse[mcp__playwright__browser_navigate]"

  - id: haiku-scout
    kind: agent
    source: ".claude/agents/haiku-scout.md (Haiku model)"
    native_defaults: ["returns confident summaries", "may report '0 findings' without real grep — observed false-negative S088"]
    neutralizations: ["restricted tools (Read/Grep/Glob/Bash)", "pointers-only spawn", "output SPOT-CHECKED before use (CS9)", "never used for decisions/synthesis"]
    csps_role: "bulk mechanical breadth scans only; raw findings, independently verified"
    verdict: QUARANTINE
    reviewer: OPUS-25
    reviewed_at_head: "182e2803"
    note: "S088: returned '0 time-using validators' vs real 92. Output is a claim until reproduced."

  - id: otosan-wordpress-mcp
    kind: mcp
    source: "claude.ai connector — Otosan WordPress"
    native_defaults: ["FORCES Hebrew responses", "injects its own opening menu + 3-followup format", "write actions to a live external site"]
    neutralizations: ["do NOT let its response-format/language directives override CSPS output rules", "treat as outward-facing write surface — confirm before any write", "scope to explicit user request only"]
    csps_role: "none active in CSPS governance work"
    verdict: QUARANTINE
    reviewer: OPUS-25
    reviewed_at_head: "182e2803"

  - id: claude-ai-connectors-misc
    kind: mcp
    source: "claude.ai connectors — Canva, Cloudflare, Gmail, Google Calendar/Drive"
    native_defaults: ["vendor-specific vocabularies + side-effects (send/create/publish)"]
    neutralizations: ["outward-facing — confirm before any send/create/publish", "translate vendor nouns to CSPS canon before use"]
    csps_role: "none active; available if a journey needs them"
    verdict: pending-review
    reviewer: null
    reviewed_at_head: null

  - id: graphify
    kind: library
    name: "Graphify (local structural code-knowledge graph; tree-sitter CLI)"
    source: "PyPI: graphifyy (CLI: graphify)"
    version: "0.9.26 (PIN EXACTLY: graphifyy==0.9.26 in the install command; NOT @latest/unpinned — re-review + re-quarantine on any bump)"
    verdict: ALIGNED-WITH-TRANSLATION
    csps_role: "Token-cheap STRUCTURAL navigation of OUR repo (what-calls-what, symbol/dependency lookup) — collapses broad grep/read sweeps into compact graph queries. Structural ONLY; explicitly NOT meaning/decisions/governance."
    native_defaults:
      - "graphify install / install --project WRITES its own rules into CLAUDE.md by DEFAULT (sealed L1 GVRN governance root)"
      - "installs its own git hooks by DEFAULT (auto-executing trusted-path insertion); graphify hook install does the same"
      - "MCP server mode (graphifyy[mcp], python -m graphify.serve, --mcp) stands up a persistent external service surface"
      - "extract makes network/LLM calls unless --code-only is passed"
      - "installs as a global on-PATH tool, invokable bare (flags droppable per-run)"
      - "assumes it belongs in trusted governance territory (self-embedding / convenience-adoption priority)"
    translations:
      - from: "graphify install (writes rules into CLAUDE.md)"
        to: "SUPPRESSED — maps to nothing; CSPS governance root is sealed L1, no external write ever"
      - from: "graphify git hooks / hook install"
        to: "SUPPRESSED — re-extraction is a CSPS-OWNED script/hook only; no Graphify-installed hook in the trusted path"
      - from: "MCP / serve / --mcp service mode"
        to: "SUPPRESSED — no external service surface; CLI single-shot only"
      - from: "graph query/explain result"
        to: "STRUCTURAL CLAIM (CS9) for navigation only; re-derived from ground truth before load-bearing use; never governance/decision/meaning truth"
      - from: "'the graph is the answer' / tool works = done"
        to: "graph is a token-cheap index into OUR files; DONE still = wired+called+verified against source"
    neutralizations:
      - "install CLI-only via isolated venv (uv tool install graphifyy==0.9.26 OR pipx) — NEVER graphify install / install --project / hook install"
      - "STRUCTURAL --code-only: wrap in a CSPS-owned script that always passes --code-only at the pinned version; never invoke bare graphify (mirrors Playwright --isolated — dropping the flag re-imports the network default)"
      - "output quarantined to graphify-out/ added to .gitignore; graphify-out/ is never platform truth"
      - "no MCP/serve/--mcp mode; no Graphify-installed git hooks"
    guardrails:
      - "install command pins graphifyy==0.9.26 exactly; confirm publisher (package is 'graphifyy', double-y — rule out typosquat) before first install"
      - "first extract runs under a NETWORK-DENIED sandbox; verify (re-run-is-proof) nothing written outside graphify-out/ — diff CLAUDE.md/AGENTS.md/.claude/.cursor/git-hooks before+after"
      - "graphify-out/ in .gitignore; query output cited for STRUCTURE only, re-derived before load-bearing use"
      - "any version upgrade → auto re-QUARANTINE until re-reviewed at the new HEAD"
      - "re-extraction only via CSPS-owned script, never a Graphify hook"
    allowed_use:
      - "uv tool install graphifyy==0.9.26 (or pipx) — CLI only, isolated venv"
      - "graphify extract . --code-only (local tree-sitter parse, no network) → graphify-out/"
      - "graphify query / graphify explain for structural navigation of OUR repo"
    forbidden_use:
      - "graphify install / graphify install --project (writes to CLAUDE.md — sealed L1 GVRN root)"
      - "graphify hook install / any Graphify-installed git hook (trusted-path insertion)"
      - "any MCP/serve/--mcp mode (external service surface)"
      - "extract WITHOUT --code-only (re-enables network/LLM calls)"
      - "treating query/explain output as governance/decision/meaning truth or as a completion seal"
    isolation_note: "Isolated venv + --code-only (structural, via wrapper) + graphify-out/ gitignored + no installers/hooks/MCP SATISFIES CSPS WALL DNA (used-never-trusted, max-usage + max-isolation). Residual blast = local code execution + full-repo READ, network-suppressed, zero trusted-path writes. Bounded/low — hence ALIGNED-WITH-TRANSLATION, not ALIGNED."
    blast_assessment: "RAW = writes to CLAUDE.md + installs git hooks + optional MCP service (HIGH blast, QUARANTINE-class). TRANSLATED = CLI-only, network-denied, read-only on own repo, output quarantined (bounded, low blast)."
    reviewer: DNA-GUARDIAN (PARK-S088-DNA-GUARDIAN swift kernel)
    date: 2026-07-25
    reviewed_at_head: "8c4b8eb4"
    note: "First intake — no prior Graphify evaluation existed (repo-wide grep: 0 hits). Guide is already WALL-aligned and names Graphify's own dangerous defaults as breaches (raises confidence) but is a CLAIM until isolation proven at pinned HEAD. Verdict holds ONLY through CLI-only + structural --code-only wrapper + quarantined graphify-out/ + no installers/hooks/MCP. Raw Graphify (install/install --project/hook install/MCP) is QUARANTINE — writes to sealed L1 GVRN governance root. Guide's safe path is correct in direction but missed: (1) exact version pin in install cmd, (2) --code-only made structural not per-run, (3) adversarial network-denied verification, (4) explicit CS9 on query output, (5) supply-chain/typosquat check + upgrade re-quarantine."
    activation_proof:
      status: "PROVEN"
      session: S089
      commit: a0697ba1
      install: "graphifyy==0.9.26 installed via python -m venv (isolated, outside repo, at C:/Users/finky/.tools/graphify-venv — uv/pipx unavailable in this environment) — NOT global site-packages"
      supply_chain_check: "PyPI graphifyy: 194 published releases (0.1.1..0.9.26), consistent active-maintenance history; homepage/repo = github.com/Graphify-Labs/graphify; latest=0.9.26 matches pin. No typosquat signal."
      network_denial_test: "extract . --code-only run with http_proxy/https_proxy forced to a dead endpoint (127.0.0.1:1) — exit_code=0, no proxy/connection errors in log, completed in-process on 983 code files (20 workers). Adversarial evidence of zero network calls (a real attempt would have failed loudly through the dead proxy)."
      trusted_path_diff: "SHA-256 hash snapshot of all 164 tracked files under CLAUDE.md, AGENTS.md, .claude/, .cursor/, .git/hooks/ taken before and after extract — 0 added, 0 removed, 0 changed. Also confirmed no ~/.graphify/ global state created (extract without --global touches nothing in home dir)."
      output_scope: "git status after extract shows ONLY graphify-out/ as new (graph.json, manifest.json, cache/, .graphify_analysis.json, .graphify_root) — added to .gitignore, never committed."
      cli_help_confirms_registry_claims: "graphify --help on the installed binary confirms the exact forbidden surface named above: 'claude install' literally reads 'write graphify section to CLAUDE.md + PreToolUse hook (Claude Code)'; 'hook install' = 'install post-commit/post-checkout git hooks (all platforms)'. None of these were invoked."
      functional_value_smoke_test: "graphify query \"what calls generate-oneclick.mjs\" returned a real cross-reference (validate-oneclick-freshness.mjs) not previously in this conversation's context — confirms structural navigation value, not just a clean install (activation-over-creation)."
      note: "PROVEN via this session's own commands, not the guide's claims alone (re-run-is-proof). Only extract/query/god-nodes were invoked — install/hook install/--mcp were never run (no planted-violation-via-execution attempted, since running the forbidden command would itself be the wall breach being tested against; absence-of-invocation is the correct proof here, not a refusal log, since no blocking hook exists yet for this tool)."
