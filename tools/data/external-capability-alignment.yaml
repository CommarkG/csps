id: csps.data.external-capability-alignment
name: external-capability-alignment
description: >
  DNA-Guardian registry. Every EXTERNAL capability (MCP server, agent, skill, library) that can act
  inside CSPS must have a record here with a verdict. Until verdict is ALIGNED or ALIGNED-WITH-TRANSLATION,
  the capability is QUARANTINE: its output is a claim to be independently reproduced, never platform truth.
  SWIFT KERNEL (S088) — seeded with current capabilities at status: pending-review. Deep build:
  PARK-S088-DNA-GUARDIAN (blocking validator + automated translation layer + migration hardening).
version: "1.0"
owner: group:finky
lifecycle: production
lifecycle_state: active
core_spine: GVRN
schema_anchor: tools_templates_meta

# verdict ∈ { ALIGNED | ALIGNED-WITH-TRANSLATION | QUARANTINE | pending-review }
capabilities:
  - id: playwright-mcp
    kind: mcp
    name: "Playwright MCP (headless browser automation)"
    source: "@playwright/mcp"
    version: "@latest (HARDENING: pin a concrete version — npm cert blocked verify-pin S088; @latest lets the reviewed-at-HEAD verdict drift)"
    verdict: ALIGNED-WITH-TRANSLATION
    csps_role: "C6 RENDERS-IN-PRODUCTION evidence — load OUR live routes, capture screenshot + DOM/a11y tree as build-audit CLAIMS (CS9), feed VALD. Ends 'building blind'."
    native_defaults:
      - "unbounded navigation — can load ANY domain (auth-walled, intranet, vendor consoles)"
      - "state mutation — click/type/fill/form-submit can WRITE to the loaded page"
      - "arbitrary JS execution via browser_evaluate (unsandboxed, page context)"
      - "screenshot/DOM framed as 'the result' (truth), not as evidence"
      - "persistent browser profile by default (shared cookies/auth/storage across runs)"
    translations:
      - from: "browser session / page render"
        to: "build-audit evidence-gathering run (OPER); output is a CLAIM feeding VALD"
      - from: "screenshot / DOM snapshot = the result"
        to: "evidence artifact under verify-before-assume; never a completion proof alone (CS9)"
      - from: "navigate to any URL"
        to: "navigate-to-own-deploy-only; domain allow-list = CSPS Vercel deploys"
      - from: "click / type / evaluate (interact)"
        to: "SUPPRESSED — maps to nothing; read-only is the entire contract"
      - from: "the page rendered = done"
        to: "DONE = route 200 AND DOM/a11y asserts expected provenance AND assertion independently checked; pixel is dim-e input, not the seal"
    neutralizations: ["--headless", "--isolated (no persistent profile)", "restrict to read-only nav+screenshot+DOM via a verification-only wrapper agent"]
    guardrails:
      - "domain allow-list: ONLY CSPS-owned deploys (e.g. https://csps-playground.vercel.app/*); reject any other host"
      - "read-only: navigate + screenshot + read DOM/accessibility-tree ONLY"
      - "wrapper/verification-only agent exposes nav+capture+read tools; withholds click/type/fill/evaluate"
      - "keep --headless --isolated hardwired in .mcp.json (removing --isolated re-imports persistent-profile default)"
      - "screenshots are EVIDENCE: a green render does NOT close a build; still subject to verify-before-assume"
      - "HARDENING: pin a concrete @playwright/mcp version; re-review at the pinned HEAD"
    allowed_use:
      - "navigate to CSPS-owned deploy URLs"
      - "capture screenshot of own rendered route (build-audit / dim-e visual evidence)"
      - "read DOM and accessibility tree of own route to assert content/provenance"
      - "assert HTTP 200 on own routes"
    forbidden_use:
      - "navigate to any non-CSPS-owned domain"
      - "click / type / fill / submit forms (any state-mutating interaction)"
      - "browser_evaluate / arbitrary JS execution"
      - "auth / login flows or anything writing external state"
      - "treating a screenshot or DOM snapshot as platform TRUTH or as a completion seal"
    isolation_note: "--headless --isolated SATISFIES CSPS isolation DNA: ephemeral profile, no shared cookies/auth, no cross-run state leak. Correct posture; both flags load-bearing — keep hardwired."
    blast_assessment: "RAW = write + execute + outward-facing (high blast). TRANSLATED = read-only on own deploys (bounded, low blast)."
    reviewer: DNA-GUARDIAN (PARK-S088-DNA-GUARDIAN swift kernel)
    date: 2026-06-29
    reviewed_at_head: "bc996916"
    note: "Verdict holds ONLY through the read-only + own-domain-only wrapper. Raw Playwright is QUARANTINE-class (full browser control = write/execute surface). Pin gap is carry-forward HARDENING, non-blocking because runtime guardrails bound blast regardless of version. ACTIVATION PROVEN S089 (commit a91fad97 → planted-violation: browser_click REFUSED by deny-list → error: Permission to use mcp__playwright__browser_click has been denied; own-deploy screenshot captured: csps-playground.vercel.app navigated + screenshotted successfully). EXISTS≠ACTIVE CLOSED."
    activation_proof:
      status: "PROVEN"
      session: S089
      commit: a91fad974419bdb5897b1551532005fa14eff373
      planted_violation: "browser_click with target='planted-violation-test-target' → Permission denied (deny-list enforced)"
      allowed_path: "browser_navigate to csps-playground.vercel.app → Page loaded (CSPS Playground title confirmed) → screenshot captured"
      domain_scope_hook: "pre-tool-use-playwright-domain-scope.sh registered in PreToolUse[mcp__playwright__browser_navigate]"

  - id: haiku-scout
    kind: agent
    source: ".claude/agents/haiku-scout.md (Haiku model)"
    native_defaults: ["returns confident summaries", "may report '0 findings' without real grep — observed false-negative S088"]
    neutralizations: ["restricted tools (Read/Grep/Glob/Bash)", "pointers-only spawn", "output SPOT-CHECKED before use (CS9)", "never used for decisions/synthesis"]
    csps_role: "bulk mechanical breadth scans only; raw findings, independently verified"
    verdict: QUARANTINE
    reviewer: OPUS-25
    reviewed_at_head: "182e2803"
    note: "S088: returned '0 time-using validators' vs real 92. Output is a claim until reproduced."

  - id: otosan-wordpress-mcp
    kind: mcp
    source: "claude.ai connector — Otosan WordPress"
    native_defaults: ["FORCES Hebrew responses", "injects its own opening menu + 3-followup format", "write actions to a live external site"]
    neutralizations: ["do NOT let its response-format/language directives override CSPS output rules", "treat as outward-facing write surface — confirm before any write", "scope to explicit user request only"]
    csps_role: "none active in CSPS governance work"
    verdict: QUARANTINE
    reviewer: OPUS-25
    reviewed_at_head: "182e2803"

  - id: claude-ai-connectors-misc
    kind: mcp
    source: "claude.ai connectors — Canva, Cloudflare, Gmail, Google Calendar/Drive"
    native_defaults: ["vendor-specific vocabularies + side-effects (send/create/publish)"]
    neutralizations: ["outward-facing — confirm before any send/create/publish", "translate vendor nouns to CSPS canon before use"]
    csps_role: "none active; available if a journey needs them"
    verdict: pending-review
    reviewer: null
    reviewed_at_head: null
