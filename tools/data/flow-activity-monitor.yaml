# Flow Activity Monitor

> Three-layer activity check:
>   Layer 1: REGISTERED (exists in audit-runner / settings.json / register file)
>   Layer 2: EXECUTED (last_ran_at within expected cadence per verify-last-run.md)
>   Layer 3: PRODUCED OUTPUT (the element generated non-trivial output — finding, entry, file, capture)
>
> Most platforms check Layer 1 + Layer 2. Layer 3 is the moat — catches dead elements that
> "ran" but produced nothing meaningful. Surfaces the EXISTS≠ACTIVE failure mode at scale.

## Dormancy thresholds by cadence

```yaml
dormancy_thresholds:
  per_session: 3       # dormant if no output for 3 consecutive sessions
  per_commit:  10      # dormant if no output across last 10 commits
  weekly:      4       # dormant if no output for 4 weeks
  monthly:     3       # dormant if no output for 3 months
  on_demand:   null    # never dormant — only fires when invoked
```

## Flow element schema

```yaml
flow_element:
  id: <slug>                          # matches audit-runner.md slug OR new hook/skill name
  element_type: validator | hook | skill | register | pipeline | capture_mechanism
  expected_output:                    # WHAT it should produce
    output_type: file_entry | log_line | register_row | finding | capture | metric
    output_location: <path>           # where to look for evidence
    output_signature: <regex>         # pattern that confirms output existed
  expected_cadence: per_session | per_commit | weekly | monthly | on_demand
  last_active_at: <ISO-8601 | null>   # set by validator
  last_output_count: <int>            # how many outputs in last cadence-window
  status: active | dormant | dead | not-yet-built | exempt
  exempt_reason: <string | null>      # required if status=exempt
  source: <session-id where registered>
```

