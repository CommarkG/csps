    note: "K=4 in S062 alone (single session). Pattern is structural: both Sonnet AND Opus underweight 'validator must run before claim' because the commit message FEELS like proof. Only mechanical pre-commit gate breaks the loop. P-META-019 mandates structural fix at K=2; this is K=4 — overdue. The fix is small (~30 lines bash) but its absence costs ~3 turns per session to detect-and-course-correct."

