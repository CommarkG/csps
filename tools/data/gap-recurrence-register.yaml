# Gap Recurrence Register

> Append-only. Every gap observed in any Opus "what's missing" analysis gets an entry.
> k_count tracks how many sessions have independently re-discovered the same gap.
> k_count >= 2: STRUCTURAL FIX REQUIRED (not another description).
> k_count >= 3: P-META-019 fires. Block session close without a committed fix.
>
> Status progression: open → structural_fix_proposed → fix_committed → behavioral_test_passing → resolved
> A gap is RESOLVED only when a behavioral test case exists that PROVES the fix catches violations.
> A gap with k_count >= 2 that is only "documented" is NOT improving — it is accumulating.

