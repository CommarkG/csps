      escape-hatch wrappers. A properly wrapped instruction is simultaneously anti-rigid AND
      anti-rogue. Existing partial mitigations: P-META-025 C&I (governing_intent per rule) ·
      validate-context-wrapped-numbers.mjs (numbers wrapped) · B_CONTEXT_SENSITIVE_GOVERNANCE ·
