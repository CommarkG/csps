    proposed_fix: |
      Pre-commit hook .claude/hooks/pre-commit-claim-validator-gate.sh:
        IF commit message contains /\b(COMPLETE|SEALED|DONE|CLOSED|RATIFIED)\b/i AND
           latest THIS-HEAD run of the relevant close-validator (one of:
           validate-handoff-completeness, validate-permanence-coverage,
           validate-zf-cycle-format, validate-frontmatter) is exit=0
        THEN allow commit.
        ELSE BLOCK with: "Cannot claim <KEYWORD> without THIS-HEAD validator
                          passing. Run pnpm verify first; if PASS commit; if FAIL fix."
      Behavioral test: tools/tests/behavioral/done-claim-validator-gate-test.sh
        INPUT A (nominal — claim message without validator pass) → exit=1 ✓
        INPUT B (claim message with passing validator) → exit=0 ✓
