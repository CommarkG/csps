# tools/data/haiku-scan-log.yaml
# Haiku Scan Log — SSoT for all Haiku scout scan results
#
# PURPOSE: Track every Haiku spawn (date, task, scope, findings, accuracy).
#   Feeds the weekly analysis step in cron-weekly-tag-status-deep-audit.sh.
#   Used to refine spawn prompts + haiku-pattern-library.yaml over time.
#
# SCHEMA:
#   date: ISO date (YYYY-MM-DD)
#   session: S0NN
#   task: one-line scan description
#   scope: files/dirs scanned (glob or list)
#   model: haiku (always)
#   spawns: number of parallel Haiku agents
#   tokens_per_spawn: approximate tokens per spawn (estimate)
#   findings_count: total findings returned
#   accuracy_spot_check: "N/M verified correct" — spot-check by Sonnet
#   understanding_block_present: bool — was the Type-B boundary block included?
#   notes: any accuracy issues, missed findings, or improvements needed
#
# WEEKLY ANALYSIS: cron-weekly-tag-status-deep-audit.sh reads this file weekly.
#   Measures: accuracy rate over time, missed findings, prompt quality trends.
#   Output: improved spawn prompts (compounding quality), refines haiku-pattern-library.yaml.
#
# Reference: tools/templates/haiku-spawn-template.md §0 WHEN-trigger + LOGGING STEP
# Closes: PARK-S084-039 s089_unify_governance (Haiku scan log creation)
#
# Governor S089 — ratified per Opus §15 + §18
# "Fixed going forward" = nominal. Engrave = permanent. This is the engrave.

