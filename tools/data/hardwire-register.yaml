      chosen: "Structural enforcement (T1 = fork-app.mjs always runs extraction, no human opt-in) + BLOCKING validator (T2 = validate-app-deploy-readiness.mjs CHECK 4b) that only fires on a regression (deleted/broken graph), not on unproven manual habit."
