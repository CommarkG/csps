      chosen: "EXTEND existing infrastructure rather than fork: gap-recurrence-register.yaml + improvement-register.yaml ARE the findings queue (already 20+26 real historical entries — seed condition already satisfied); findings-actuator.mjs IS the queue-reader; the EXISTING .github/workflows/session-progress.yml (real, weekly, Monday 07:23, already commits autonomously with contents:write) IS the permanent Layer-5 trigger. Built NEW: propagation_required/propagation_verified fields + validate-propagation-verified-gate.mjs (Layer 4, the genuinely missing blocking gate) + weekly-evolution-batch.mjs (Layer 3 rate-limited selector, max 3/run) + wired both into the GitHub Actions workflow as new steps."
      rejected_1: "Use CronCreate for the permanent auto-trigger — REJECTED on evidence, not preference: CronCreate's own tool spec states jobs are session-only (deleted when this Claude session ends) and recurring jobs auto-expire after 7 days regardless. Building Layer 5 on it and calling it 'permanent, forever' would be exactly the nominal-completion/declaration-drift failure the pasted playbook itself names as the #1 platform weakness. Named this to the Governor before building around it."
      rejected_2: "Build a new parallel findings-queue.yaml schema — REJECTED: gap-recurrence-register.yaml + improvement-register.yaml already have k_count/status/propagated_to and 46 real historical entries; forking would repeat the exact orphan-registry mistake fixed in hardwire-011 the same session."
      rejected_3: "Claim Layer 5 is fully autonomous end-to-end (root-cause -> fix -> propagate with zero human/AI-session involvement) — REJECTED as honest scope: a GitHub Actions bash step cannot do semantic reasoning. What's genuinely unattended-forever: queue refresh + rate-limited batch selection + propagation-verified gating. What still needs an AI session: the actual root-cause/solution/propagation work for each selected item. Full autonomy requires an ANTHROPIC_API_KEY GitHub secret the user must provision (security-sensitive credential grant — not mine to add unilaterally). Parked: PARK-S089-EVOLUTION-ENGINE-AUTONOMOUS-REASONING."
      reasoning: "Honesty about what a mechanical script can and cannot do IS the load-bearing lesson of the pasted playbook (architecture racing ahead of enforcement). Better to ship a smaller, real, permanently-running mechanical core than a bigger claim resting on a session-scoped tool that silently isn't permanent."
    surfaces:
      t1_hook: "None new — reuses .github/workflows/session-progress.yml's existing schedule trigger (cron: '23 7 * * 1', permanent, GitHub-infrastructure-hosted, independent of any Claude Code session)"
      t2_validator: "tools/validators/validate-propagation-verified-gate.mjs (BLOCKING, registered in tools/verify.mjs as propagation_verified_gate) + tools/scripts/weekly-evolution-batch.mjs (rate-limited selector, not a validator but wired into the same workflow step)"
