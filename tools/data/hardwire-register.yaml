      rejected_2: "Advisory-only (mirroring validate-app-deploy-readiness.mjs's own stated convention of starting new checks advisory then promoting) — rejected: Governor's directive was explicit ('mechanically enforced', not 'advisory'); structural-enforcement design (fork always extracts) resolves the K=0 concern differently, so advisory-first wasn't necessary to be safe."
      reasoning: "Because enforcement is BUILT INTO the one code path that creates apps (fork-app.mjs), nobody's legitimate manual workflow is ever blocked — the validator only trips if the structural step itself regressed or its output was deleted after the fact. That makes BLOCKING safe and honest even at K=0, unlike a bolt-on gate against human discipline would be."
