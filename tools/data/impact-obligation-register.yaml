# tools/data/impact-obligation-register.yaml
# CSPS Impact Obligation Register — SSoT for deferred impact-validation obligations
#
# PURPOSE: Tracks obligations emitted by Stage 6 Part B (INTENT-CONFORMANCE) when
#          real-world impact is not yet observable at plan-exit.
#          Closed by Stage 6 Part C (IMPACT-VALIDATION) at the real-world boundary.
#
# CONSOLIDATION: Cross-refs gap_DIM4_LIVE_LOAD_PROOF (gap-recurrence-register.yaml)
#                and the test-drive obligation (session state Phase B).
#                DO NOT duplicate gap entries — cross-ref only.
#
# Schema:
#   id:                  unique identifier (iob_ prefix)
#   cross_ref:           if entry duplicates a gap, point to canonical; do NOT copy body
#   source_plan:         which plan/dimension emitted this obligation
#   intent:              what the work was supposed to ACHIEVE (outcome, not activity)
#   impact_signal:       the measurable real-world signal that proves impact
#   revisit_condition:   when/where the signal becomes observable
#   status:              pending | met | diverged
#   emitted_session:     session when Part B emitted this row
#   closed_session:      session when Part C closed this row (null = open)
#   closed_sha:          git SHA of the closing evidence commit (null = open)
#
# Status values:
#   pending  — impact_signal not yet observed; revisit_condition not yet met
#   met      — impact_signal observed GREEN; obligation closed
#   diverged — execution result did not match intent; loop-back to CLASSIFY required
#
# Canonical gate: docs/plan/pillar-0-governance/planning-spine/stages/06-COMPLETION-TEST.md

