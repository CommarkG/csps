      - DRAFT-S066-CORE-SEED-MANDATORY: recurrence_freq=2 (every PROTO authored),
        per_session_saving_min=20 (prevents drift correction), 100 sessions, build_effort=3h
        pe_internal = (2 × 20 × 100) / 3 = 1333 → CRITICAL PRIORITY
      - DRAFT-S066-SESSION-STATE-DUAL-MANDATE-FIX: recurrence_freq=1 (every session-open),
        per_session_saving_min=5 (catches schema bugs), 100 sessions, build_effort=2h
        pe_internal = (1 × 5 × 100) / 2 = 250 → HIGH PRIORITY
      - DRAFT-S066-PE-COMPOUNDING (this entry): recurrence_freq=1 (every session re-runs the
        PE assessment), per_session_saving_min=15 (auto-surface saves manual PE work), build_effort=4h
        pe_internal = (1 × 15 × 100) / 4 = 375 → HIGH PRIORITY

    Compare against typical PROTO PE (urgency 7 × impact 8 / SPI 1.5 = 37).
    Even at conservative scoring, ALL FOUR internal enhancements score 7-67× higher
    than typical PROTOs. This is the missing-compounding-weight Governor named.

  what_would_flip: "if the 100-session projection horizon proves wrong (e.g., platform refactor at S080 invalidates current architecture), shorten horizon to 50 sessions. The relative ranking holds."
