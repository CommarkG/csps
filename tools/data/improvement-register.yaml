- id: IMPROVEMENT-S062-RELAY-OPTIMIZATION
  title: "Review threshold should scale with reversibility cost, not novelty"
  description: >
    S062 had ~17 RELAY cycles where Opus gated per-STEP on work that was reversible single-file
    edits. Burned ~12-15 turns and 3× Governor relay overhead. Three-tier model surfaced by
    Governor meta-critique in S062 final turn.
  first_found: S062
  k_count: 1
  sessions: [S062]
  status: open
  three_tier_model:
    auto_execute: "single-file mechanical + matches existing pattern + clear DONE criteria → Sonnet acts, reports when done"
    check_in_gate: "borderline classification OR mass commit >10 files OR novel pattern → Sonnet pauses for Opus glance (NOT full ADVANCE)"
    full_advance_gate: "ratification moments OR K≥2 structural fixes OR milestone declarations → Sonnet stops, Opus full review"
  source: "Governor S062 meta-critique on relay overhead"
  apply_in: "S063 default execution mode (encoded in RELAY 20 to Sonnet)"
  expected_impact: "~70% reduction in relay overhead. Same outcomes, 3× less Governor-bridge cost."
  not_yet_propagated:
    - B_REVERSIBILITY_GATED_REVIEW: engraved S063 PHASE B.5 (docs/plan/pillar-0-governance/behavioral-contracts/B_REVERSIBILITY_GATED_REVIEW.md)
    - PROTO sequencing template should declare gate-tier per STEP
  note: "Per Opus-10 + Governor S062 final turn. Operationalized in RELAY 20."
  status: cec_run

- id: FINDING-S063-AI-OUTPUT-CAPTURE-ASYMMETRY
  title: "No automatic capture mechanism for AI-output exceptional moments — asymmetric to user-input intake"
  description: >
    Platform has rich automatic capture for USER input (user-prompt-submit-intake.sh fires
    trigger detection + routes to chat-intake-capture.jsonl + Threshold processes). AI output
    has only post-stop-learning-loop.sh which logs an EVENT POINTER (transcript path) to
    learning-loop-capture.jsonl with status "captured-pending-extraction" — actual content
    extraction is deferred until LearningLoopItem DB ships (weeks 2-6). No active extraction
    of exceptional quotes, moat candidates, structural insights, or "line worth keeping"
    patterns from AI output. Currently relies on human attention chain (AI writes in chat →
    Sonnet notices → captures to HANDOFF). If both AI tabs miss it, it evaporates.
  first_found: S063
  k_count: 1
  sessions: [S063]
  status: open
  source: "Governor S063 close-question: 'Do we have an automatic saving? In moats? In ai behavior? Elsewhere? If something is exceptional how does the platform identify it and run it through the threshold?'"
  evidence:
    - "user-prompt-submit-intake.sh:1-15 — automatic trigger detection on user input"
    - ".claude/hooks/post-stop-learning-loop.sh — logs event pointer only, no content scan"
    - "The S063 'line worth keeping' (first session where platform's hooks blocked own commits) survived only because Opus wrote it in chat AND Sonnet noticed AND captured to HANDOFF — pure behavioral, zero mechanical fallback"
  proposed_fix: |
    Either (a) extend post-stop-learning-loop.sh to scan transcript for exceptional-pattern
    markers (phrases like "first session where", "the line worth keeping", "moat moment",
    "structural insight", "platform's mirror") and auto-file matches to a new register;
    OR (b) build post-stop-ai-output-intake.sh that mirrors user-prompt-submit-intake.sh
    trigger detection but on AI output; OR (c) create /capture-exceptional skill that
    Sonnet/Opus invoke when they notice (lightweight manual but with skill discoverability).
    Recommend (a) — least new infrastructure, fixes the asymmetry at the existing hook.
  not_yet_propagated:
    - PROTO-S064-AI-OUTPUT-CAPTURE candidate (S064 priority)
    - tools/data/exceptional-moments-register.yaml schema (new register if approach (a))
    - post-stop-learning-loop.sh extension (regex set + auto-file)
    - integration with Threshold intake processing
  note: "Surfaced by Governor S063 close-question. The asymmetric durability gap is real and structurally significant — user-side has Threshold, AI-side has deferred extraction. This is the meta-gap behind R4 trap recurrences."

- id: FINDING-S063-CONSOLIDATION-DRIFT-NO-VALIDATOR
  title: "No mechanical validator catches new-file consolidation drift — B_CONSOLIDATION_PASS is contract-only"
  description: >
    Platform has B_CONSOLIDATION_PASS contract + consolidation-expert skill, but ZERO
    mechanical gate that checks new files against existing-similar before commit. Result:
    inputs-from-S062.yaml + inputs-from-S063.yaml created in 2 consecutive sessions —
    BOTH duplicate the carry-forward function already covered by improvement-register
    and gap-recurrence-register. Without intervention, this becomes K=38 by S100
    (one per session). Closing-summaries/ dir is also dead infrastructure (empty, HANDOFFs
    replaced the function) — same drift class, undetected.
  first_found: S063
  k_count: 1
  sessions: [S063]
  status: open
  source: "Governor S063 directive 'check for consolidation ops... avoid overlapping and duplications... prevention is the key word'"
  evidence:
    - "tools/data/inputs-from-S062.yaml + tools/data/inputs-from-S063.yaml — 2 files, schema lighter than improvement-register, K=2 in 2 sessions"
    - "docs/plan/_handoff/VAULT/closing-summaries/ — empty dir, referenced in protocols, replaced by HANDOFF-*.md"
    - "B_CONSOLIDATION_PASS exists as contract; consolidation-expert skill exists; no validator enforces it per-session on new file creation"
  proposed_fix: |
    Build validate-consolidation-pass.mjs OR pre-commit-consolidation-check.sh:
    - For every untracked file in git status, scan for fuzzy-name matches against existing
      files in same directory tree (Levenshtein distance + extension match)
    - ADVISORY when name-similarity > 60% OR file-pattern repeats (e.g., inputs-from-S*.yaml)
    - BLOCKING when same-pattern detected K=2+ (e.g., 2nd inputs-from-S*.yaml would block)
    - Configurable allowlist for legitimate per-session files (HANDOFF-S*-to-S*.md is OK)
  not_yet_propagated:
    - PROTO-S064-CONSOLIDATION-PASS-VALIDATOR candidate (S064 priority)
    - Decision on inputs-from-S*.yaml: merge into improvement-register OR keep separate
    - Decision on closing-summaries/ dir: delete OR revive
