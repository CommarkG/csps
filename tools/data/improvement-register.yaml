  proposed_fix: |
    Three-part structural fix (each independent, can ship phased):

    PART A — Auto-PE-scoring for findings (build pe-agent skill extension)
      Every entry in improvement-register.yaml + gap-recurrence-register.yaml gets
      auto-computed pe_score field on session-open. Formula:
        pe_internal = (recurrence_freq × per_session_saving_min × 100) / one_time_build_effort_hours
      Where recurrence_freq = how many sessions this finding's situation appears (1.0 default)
            per_session_saving_min = estimated minutes saved per session once fixed
            100 = projected future sessions (conservative target)
      Findings with pe_internal > 50 get HIGH-PRIORITY tag.

