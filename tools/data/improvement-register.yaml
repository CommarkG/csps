  - id: imp_WET_TRIAL_AP005_WEBPACK_DEDUPE
    finding: "resolve.dedupe is a Vite-only API — invalid in webpack 5. Was used in all CSPS next.config.js files, breaking every app build."
    first_found: S060
    k_count: 1
    sessions: [S060]
    status: propagated
    commit: e07504d
    propagated_to:
      - apps/template/next.config.js
      - apps/debt-collection/next.config.js
      - apps/budget-planner/next.config.js
      - apps/habit-tracker/next.config.js
      - apps/voice-sorting/next.config.js
    not_yet_propagated: []

  - id: imp_WET_TRIAL_AP006_INNGEST_ESM
    finding: "inngest is 'type: module' (ESM-first). webpack picks ESM entry when transpiling @csps/integrations via transpilePackages, causing 'Inngest is not a constructor'. Fix: resolve.alias to CJS path + NormalModuleReplacementPlugin for inngest/next subpath."
    first_found: S060
    k_count: 1
    sessions: [S060]
    status: propagated
    commit: e07504d
    propagated_to:
      - apps/template/next.config.js (AP-006 comment + CJS alias pattern)
      - apps/debt-collection/next.config.js
    not_yet_propagated:
      - apps/budget-planner/next.config.js (needs AP-006 pattern if inngest added)
      - apps/habit-tracker/next.config.js (same)

  - id: imp_WET_TRIAL_SG001_CONFIG_PACKAGE
    finding: "libs/config had no package.json — @csps/config was imported everywhere but not a proper workspace package. Silently broken until first real fork attempt."
    first_found: S060
    k_count: 1
    sessions: [S060]
    status: propagated
    commit: e07504d
    propagated_to:
      - libs/config/package.json (created)
      - libs/integrations/package.json (added @csps/config dependency)
      - apps/template/package.json
      - apps/debt-collection/package.json
    not_yet_propagated: []

  - id: imp_WET_TRIAL_SG002_RELATIVE_IMPORT
    finding: "libs/integrations/clerk/webhook-handler.ts used relative ../../config/subscription.config which breaks when the lib is symlinked via node_modules. Cross-package imports must use @csps/config, not relative paths."
    first_found: S060
    k_count: 1
    sessions: [S060]
    status: propagated
    commit: e07504d
    propagated_to:
      - libs/integrations/clerk/webhook-handler.ts (import fixed)
    not_yet_propagated:
