- id: DRAFT-S066-PE-COMPOUNDING-FOR-INTERNAL-ENHANCEMENTS
  title: "PE doesn't score internal recurring enhancements with compounding factor — findings float indefinitely"
  description: "Three structural gaps Governor surfaced S066: (a) permanent-fix-proposals in improvement-register are text-only — no schedule, no deadline, no auto-trigger; (b) only K-recurrence forces escalation, K=1 entries can sit 10+ sessions; (c) PE formula (urgency × impact / SPI) doesn't weight COMPOUNDING SAVINGS — a fix that saves 30 min × 100 future sessions scores the same as a fix that saves nothing. Result: discipline-engraving fixes (prevent recurring failure) get under-prioritized vs PROTOs that solve novel problems."
  inherits_from: "FINDING-S063-AI-OUTPUT-CAPTURE-ASYMMETRY (parallel: internal-findings durability gap mirrors AI-output capture gap) + PE Agent skill + B_REVERSIBILITY_GATED_REVIEW"
  first_found: S066
  k_count: 1
  sessions: [S066]
  status: open
  source: "Governor S066: 'when are these scheduled? what makes sure process is not floating? how can PE place internal recurring enhancements at high priority?'"
  three_questions_mapped:
    q1_scheduling: "Today: NOT scheduled. Text in YAML field. Need: auto-derived must_address_by_session + validator that catches overdue."
    q2_non_floating: "Today: NOTHING. K=1 entries sit indefinitely. Need: age-escalation (K=1 → K=2 if 3 sessions pass without progress) + session-close gate (top-3 PE findings must be addressed OR explicit-defer-with-Governor-cite)."
    q3_pe_compounding: "Today: PE = urgency × impact / SPI. Doesn't weight compounding savings. Need: PE_internal = (recurrence_freq × per_session_saving × remaining_sessions) / one_time_build_effort."
  proposed_fix: |
    Three-part structural fix (each independent, can ship phased):

    PART A — Auto-PE-scoring for findings (build pe-agent skill extension)
      Every entry in improvement-register.yaml + gap-recurrence-register.yaml gets
      auto-computed pe_score field on session-open. Formula:
        pe_internal = (recurrence_freq × per_session_saving_min × 100) / one_time_build_effort_hours
      Where recurrence_freq = how many sessions this finding's situation appears (1.0 default)
            per_session_saving_min = estimated minutes saved per session once fixed
            100 = projected future sessions (conservative target)
      Findings with pe_internal > 50 get HIGH-PRIORITY tag.

    PART B — Auto-scheduling deadlines (build validate-finding-scheduling.mjs)
      Every open finding MUST have must_address_by_session field (default: filing_session + 5).
      Validator surfaces findings past their must_address_by_session as ADVISORY (K=1) or BLOCKING (K=2).
      Age-escalation: K=1 entry filed in S<N>, still open at S<N+3>, auto-promotes to K=2.
      Session-close gate: top-3 highest-PE open findings must have either committed-fix OR
      explicit-defer-with-reason in closing-summary §X.

    PART C — Session-open surface (extend session-open.sh + intake hook)
      Top-5 PE findings (compounding-weighted) surfaced at session-open as MUST-CONSIDER alongside
      mandate. Cannot be silently ignored — session-close validator checks each surfaced item
      was either addressed OR deferred-with-reason.

  immediate_application_this_session: |
    Apply PART A formula manually to the S066 findings filed today:
      - DRAFT-S066-PRE-ONSET-SHAPE-CHECK-MECHANICAL: recurrence_freq=5 (every Opus turn benefits),
        per_session_saving_min=10 (avoids one re-do), 100 sessions, build_effort=2h
