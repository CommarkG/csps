        P2 IMPLEMENTATION: local audits confirming things ACTUALLY WORK before next step;
        P3 QC: audits/sanity/verification/validation double-checking everything + final SIMULATIONS for confirmation
      — across all 3 BUILD-CASES:
        C1 platform creating things for ITSELF; C2 platform used by DEVELOPERS to create;
        C3 platform thinking/planning/implementing/verifying APPS + SAAS solutions.
      MUST include AI-BEHAVIOR: profiling internal + external AI triggers, reaction-patterns, and vocabulary;
      instructions written WITH CONTEXT where rigid NUMBERS are ONLY reference samples, and EVERY word
      interpretable-as-rigid is explicitly flagged as a sample (rigid-definition-drift guard). MUST make
