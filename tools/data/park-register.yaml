    retrieve_when: "After PARK-043 journey orchestrator build + PARK-048 presentation-mode decision. ALSO: immediately relevant to any new feature where the user interaction design is being planned. The 'template-first' UX pattern should be considered for any user-facing journey. Research prompt in content = bring in before design starts."
