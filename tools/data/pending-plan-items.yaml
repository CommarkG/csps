# Pending Nodes Register

> **S069 STEP 5 generalization of pending-plan-items.yaml.**
> Single register with `pending_type` discriminator covering 3 node classes.
> Generator: tools/generate-plan-item-draft.mjs (existing; generates plan-item type)
> GHG STOP-gate: FLAGGED_TO_THRESHOLD type entries are written by threshold-router
>   when input has no clean classification → halts until Opus classifies.
> Weekly cron: escalate entries older than 2 sessions.

## Schema — pending_type discriminator

Each entry MUST declare `pending_type`:
- `plan-item` — K>=2 improvement finding without a matching plan item (formerly the only type in v1.0)
- `pending-node` — artifact that doesn't yet meet NODEFILE-CONTRACT requirements (missing fields)
- `flagged-to-threshold` — GHG STOP-gate: input arrived but has no place in the classification tree

## Entries

nodes:
  []

## Migration log

Prior entries (v1.0 pending-plan-items.yaml): `drafts: []` (empty — no entries to migrate)
pending-nodes.yaml: DID NOT EXIST (no entries to migrate)
Migration: clean — zero entries lost.

## Escalation rules

- `plan-item` entries: Opus reviews weekly; promotes to unified-plan.yaml when mature
- `pending-node` entries: Sonnet backfills NODEFILE-CONTRACT fields; session target set
- `flagged-to-threshold` entries: Opus classifies; either routes to plan or drops with reason

## GHG STOP-gate protocol (P-ARCH-032)

When threshold-router encounters FLAGGED_TO_THRESHOLD route:
1. Write entry here with `pending_type: flagged-to-threshold`
2. Surface to Opus via sonnet-turn.md relay
3. HALT current input processing — do not attempt classification
4. Resume only after Opus sets `classification:` + `routing_decision:` fields
