---
id: csps.data.ratified-standards
name: ratified-standards
description: >
  Registry of all ratified platform standards. Each entry links to BOTH:
  (a) creation_standard — the file/surface that enforces conformance AT CREATION TIME
  (b) audit_entry — the validator + audit-runner cadence that enforces conformance AT VERIFY TIME
  Together these make ratifications "stick": ratify → engrave → creation-path → audit → conform.
  validate-ratification-propagation.mjs (BLOCKING) enforces this registry.
schema_version: "1.0"
updated_session: S088
standing_rule: "ratified ⇒ platform standard + audit (Governor ratified S087)"
---

standards:

  - id: journey-core-spine
    name: Journey Core Spine (L0 definition)
    ratified_session: S088
    ratified_by: "PROTO-S088-JOURNEY-CORE-SPINE (Opus #25 Governor-ratified directive)"
    ratified_at: "2026-06-22"
    description: >
      Journey = governed goal→verified-completion. Sealed L0 definition with mandatory parts
      (Threshold intake → 4-axis classify → PE-significance → phase sequence → completion gate),
      mandatory connections (Threshold→PE→CIE⟲→Tiers→completion-verify), fork points, and
      developer/external-user branches. Trunk C1-C5 + P1-P5 sealed.
    propagation_status: complete
    creation_standard:
      type: sealed-spine-doc
      path: docs/plan/pillar-0-governance/JOURNEY-CORE-SPINE.md
      requirement: >
        Any new journey artifact must have JOURNEY-CORE-SPINE.md in its links section
        (or explicitly document which L0 parts it implements). validate-journey-conformance.mjs
        backstop enforces structural spine completeness.
    audit_entry:
      validator: validate-journey-conformance.mjs
      cadence: per-session
      audit_runner_key: journey-conformance

  - id: deterministic-gate
    name: B_DETERMINISTIC_GATE
    ratified_session: S086
    ratified_by: "Governor S086"
    ratified_at: "2026-06-20"
    description: >
      Gating is a pure function of the tree at HEAD. No clock/cadence/mtime/runtime value may
      flip a blocking exit. Green = sha-bound receipt (tree_hash from git ls-files --stage,
      filtered by SSoT exclusion list, normalized to sha+path, SHA-256 16-char hex).
    propagation_status: complete
    creation_standard:
      type: ssot-exclusion-file
      path: tools/config/treehash-exclude.txt
      requirement: >
        Any runtime-output file that changes on every verify/commit cycle MUST be in
        tools/config/treehash-exclude.txt to maintain tree_hash stability.
        verify.mjs and validate-green-receipt.mjs both read this SSoT file.
    audit_entry:
      validator: validate-green-receipt.mjs
      cadence: pre-handoff + always_rerun
      audit_runner_key: green_receipt

  - id: two-party-seal
    name: B_TWO_PARTY_SEAL
    ratified_session: S086
    ratified_by: "Governor S086"
    ratified_at: "2026-06-20"
    description: >
      SEAL = builder green-receipt + DIRECTOR counter-signed receipt at same HEAD.
      Builder may only set BUILD-COMPLETE. Director runs independent verify and counter-signs.
      Ends director-as-manual-safety-net pattern.
    propagation_status: complete
    mechanized_session: S088
    mechanized_by: "PROTO-S088-PHASE-0.3-HARDEN Gate B — see two-party-seal-mechanized entry"
    creation_standard:
      type: json-schema-extension
      path: tools/data/green-receipt.json
      requirement: >
        green-receipt.json MAY contain director_seal:{by,head,tree_hash,ts}.
        When present, director_seal.head MUST == receipt.HEAD and
        director_seal.tree_hash MUST == receipt.tree_hash.
        Opus director adds the field after independent verify.
        validate-two-party-seal.mjs BLOCKING on mismatch.
    audit_entry:
      validator: validate-two-party-seal.mjs
      cadence: per-session + pre-seal
      audit_runner_key: two_party_seal

  - id: insist-on-completion
    name: B_INSIST_ON_COMPLETION
    ratified_session: S086
    ratified_by: "Governor S086"
    ratified_at: "2026-06-20"
    description: >
      Every open obligation gets a disposition (answered/decided/parked+owner+trigger) before
      session close. No drift via assume/guess/avoid-confrontation. Delay OK; drift not.
      Applies to Opus+Sonnet+Haiku.
    propagation_status: complete
    creation_standard:
      type: enforcement-validator
      path: tools/validators/validate-completion-gate.mjs
      requirement: >
        Any new obligation (PARK entry, PROTO item, open question) created this session
        must receive a disposition before session-close. validate-completion-gate.mjs
        BLOCKS session close if current-session items lack disposition.
    audit_entry:
      validator: validate-completion-gate.mjs
      cadence: session-close + --extended
      audit_runner_key: completion_gate

  - id: context-checkpoint-gate
    name: B_CONTEXT_CHECKPOINT_GATE
    ratified_session: S087
    ratified_by: "PROTO-S087-CONTEXT-CHECKPOINT-GATE (5-surface engraving)"
    ratified_at: "2026-06-22"
    description: >
      Window choice = checkpoint-ability, not size. 200K+compact if unit reaches
      green+committed in-window; else 1M. BORDERLINE → ASK Governor for real remaining context.
      Harvest-before-compact (never compact uncommitted build state). Both Opus+Sonnet assess.
    propagation_status: complete
    creation_standard:
      type: engraving-checklist
      path: docs/plan/pillar-0-governance/context-checkpoint-gate.md
      requirement: >
        Any new AI entry point (Opus/Sonnet/Haiku context doc, spawn template) must
        include B_CONTEXT_CHECKPOINT_GATE assessment rule. validate-agent-inheritance-parity.mjs
        backstop enforces cross-agent parity.
    audit_entry:
      validator: validate-agent-inheritance-parity.mjs
      cadence: per-session + --extended
      audit_runner_key: agent_inheritance_parity

  - id: page-complete
    name: B_PAGE_COMPLETE
    ratified_session: S087
    ratified_by: "PROTO-S087-PAGE-COMPLETE"
    ratified_at: "2026-06-22"
    description: >
      Pages complete-by-construction: nav-registered (no orphans) + fetch has loading/error/empty
      + elements wired + renders 200 + manifest-verified. Gate at creation. Live HTTP smoke = CI residual.
    propagation_status: complete
    creation_standard:
      type: registration-gate
      path: apps/csps-playground/src/config/route-manifest.ts
      requirement: >
        Any new page.tsx in csps-playground MUST be registered in route-manifest.ts before commit.
        validate-route-manifest.mjs BLOCKS if any page.tsx lacks a manifest entry (orphan prevention).
    audit_entry:
      validator: validate-route-manifest.mjs
      cadence: page-creation + per-session
      audit_runner_key: route_manifest

  - id: uniform-dna
    name: Uniform Platform DNA
    ratified_session: S086
    ratified_by: "Governor S086"
    ratified_at: "2026-06-20"
    description: >
      DNA (modularity/depth/spine-fit) is ONE platform law all spines CONFORM to (not per-node
      AI-default). Plans open with DNA-pillars preamble. Capabilities decomposed at intake into
      core+layers+cross-domain branches. Candidate P-ARCH.
    propagation_status: complete
    creation_standard:
      type: dna-manifesto
      path: docs/plan/pillar-0-governance/CSPS-DNA-MANIFESTO.md
      requirement: >
        Any new platform artifact must include @csps-dna annotation block in frontmatter or
        header comment (core_spine + governing_principle fields required).
        validate-frontmatter.mjs backstop enforces field presence.
    audit_entry:
      validator: validate-frontmatter.mjs
      cadence: per-session
      audit_runner_key: frontmatter-completeness

  - id: submodule-deliverable-gate
    name: Submodule Deliverable Gate (PROTO-S088-HARDEN-A)
    ratified_session: S088
    ratified_by: "PROTO-S088-PHASE-0.3-HARDEN Gate A (Opus #25 directive)"
    ratified_at: "2026-06-22"
    description: >
      Green must be impossible to reach while a shippable deliverable is uncommitted inside
      a tracked git submodule. BLOCKS when any submodule has: (a) untracked source files
      under src/**, app/**, components/**, scripts/**, or (b) parent pointer behind submodule HEAD.
      Block-test: plants untracked file in src/ → confirms validator exits 1 → removes file.
    propagation_status: complete
    creation_standard:
      type: gitignore-policy
      path: apps/csps-playground/.gitignore
      requirement: >
        Any build-output directory (.next/, tsconfig.tsbuildinfo) in any submodule MUST be
        in that submodule's .gitignore. validate-submodule-deliverable.mjs enforces that
        source files are committed; .gitignore prevents build artifacts masking real dirty signal.
    audit_entry:
      validator: validate-submodule-deliverable.mjs
      cadence: per-session
      audit_runner_key: submodule_deliverable

  - id: two-party-seal-mechanized
    name: B_TWO_PARTY_SEAL — mechanized (PROTO-S088-HARDEN-B)
    ratified_session: S088
    ratified_by: "PROTO-S088-PHASE-0.3-HARDEN Gate B (Opus #25 directive; extends B_TWO_PARTY_SEAL S086)"
    ratified_at: "2026-06-22"
    description: >
      Mechanizes the B_TWO_PARTY_SEAL ratified S086. SEAL = builder green-receipt at HEAD
      + DIRECTOR counter-sign at SAME HEAD and SAME tree_hash. Schema: green-receipt.json
      extended with director_seal:{by,head,tree_hash,ts}. Validator ADVISORY when no seal
      (BUILD-COMPLETE only), BLOCKING when seal present but head/tree_hash MISMATCHES.
      Block-test: injects mismatched director_seal.tree_hash → confirms exit 1 → restores.
    propagation_status: complete
    creation_standard:
      type: json-schema-extension
      path: tools/data/green-receipt.json
      requirement: >
        green-receipt.json MAY contain director_seal:{by,head,tree_hash,ts}. When present,
        director_seal.head MUST == receipt.HEAD and director_seal.tree_hash MUST == receipt.tree_hash.
        Opus director adds the field after independent verify. validate-two-party-seal.mjs enforces.
    audit_entry:
      validator: validate-two-party-seal.mjs
      cadence: per-session + pre-seal
      audit_runner_key: two_party_seal

  - id: threshold-intake-chain
    name: Enforced Universal Threshold Intake Chain (Phase-0.2)
    ratified_session: S088
    ratified_by: "PROTO-S088-PHASE-0.2 (Opus #25 Governor-ratified directive)"
    ratified_at: "2026-06-22"
    description: >
      Enforced universal intake chain: every input traverses classify (4-axis) → modular-decompose
      (core+layers+cross-domain branches, per uniform-DNA) → PE-significance (5-dim formula) →
      route (SWIFT-now / park-with-context) → CIE-write (insight per pass). No input bypasses.
      Enforcement: user-prompt-submit-intake.sh hook calls threshold-chain.mjs for every Governor
      message. Consolidates PARK-054 + PARK-055e + threshold-consume + CIE pipeline.
    propagation_status: complete
    creation_standard:
      type: chain-script
      path: tools/scripts/threshold-chain.mjs
      requirement: >
        New intake types must be added to threshold-decompose.mjs ACTION_MAP and layer activation
        logic. New chain steps must appear in the runChain() function. Hook wiring must use
        CHAIN_CONTENT + CHAIN_SESSION env vars (not CLI args) to avoid quoting issues.
    audit_entry:
      validator: validate-threshold-chain.mjs
      cadence: per-session
      audit_runner_key: threshold-chain

  - id: boundary-contract-context-bundle
    name: Boundary Contract — Context Bundle Schema (pre-spawn)
    ratified_session: S088
    ratified_by: "PROTO-S088-BOUNDARY-CONTRACT (5-source unanimous external council + Governor S088)"
    ratified_at: "2026-06-23"
    description: >
      Every AI-to-AI spawn carries a context-bundle.schema.json-compliant bundle. All 12 required
      fields must be present and valid. FORBIDDEN: navigation refs ("see §", "../"), relative path
      traversals, missing tenant_id, missing budget. The bundle is the ONLY communication channel —
      inline_critical_content holds verbatim file content, not references. T2: validate-context-bundle.mjs
      BLOCKS pre-spawn. Block-tests 4/4 PASS.
    propagation_status: active
    creation_standard:
      type: json-schema
      path: schemas/context-bundle.schema.json
      requirement: >
        Every Agent tool call and subagent spawn must supply a context bundle JSON that passes
        validate-context-bundle.mjs. tenant_id, budget (all 4 fields), DoD-evidence mapping,
        and no navigation refs are the four most common failure modes.
    audit_entry:
      validator: validate-context-bundle.mjs
      cadence: pre-spawn
      audit_runner_key: context_bundle

  - id: boundary-contract-seal-packet
    name: Boundary Contract — C5 Director Seal Packet (transcript-blind)
    ratified_session: S088
    ratified_by: "PROTO-S088-BOUNDARY-CONTRACT (5-source unanimous external council + Governor S088)"
    ratified_at: "2026-06-23"
    description: >
      Director seal is transcript-BLIND: seal packet contains ONLY {tree_hash, green-receipt snapshot,
      DoD, block-tests}. FORBIDDEN: loop_artifacts, chat_transcript, session_context, builder_session_state.
      C5-sealed = transcript-blind (absent forbidden fields). C4.5-reproduced = in-tab (director remembers build).
      builder!=sealer: git authorship check. Block-tests 4/4 PASS.
    propagation_status: active
    creation_standard:
      type: json-schema
      path: schemas/seal-packet.schema.json
      requirement: >
        Director receives ONLY the seal-packet. No session context passed alongside. Director
        independently re-runs block-tests from test_file paths in the packet. If builder_git_authors
        present, verifies current signer != any author in the set.
    audit_entry:
      validator: validate-director-seal-packet.mjs
      cadence: pre-seal
      audit_runner_key: director_seal_packet

  - id: cs9-haiku-not-found-verification
    name: CS9 — Haiku Scout NOT-FOUND Spot-Check (SWIFT fix)
    ratified_session: S088
    ratified_by: "PROTO-S088-BOUNDARY-CONTRACT SWIFT item (external council Grok seat + Governor S088)"
    ratified_at: "2026-06-23"
    description: >
      Haiku spot-check must verify the NOT-FOUND claim, not just sampled FOUND items.
      Fixes the 0-vs-92 failure class where Haiku returns "0 found" due to wrong pattern
      but the NOT-FOUND list appears complete. Mandatory: sample 2-3 items that SHOULD match
      from the NOT-FOUND list and confirm absence. CONFIDENCE=LOW triggers mandatory NOT-FOUND check.
      If either FOUND or NOT-FOUND spot-check fails → discard entire Haiku output.
      Wired in: AI-COUNCIL-COMMUNICATION-SPINE.md §3.3 (CS9 SWIFT amendment).
    propagation_status: active
    creation_standard:
      type: protocol
      path: docs/plan/pillar-0-governance/AI-COUNCIL-COMMUNICATION-SPINE.md
      requirement: >
        §3.3 Spot-check requirement now includes two-sided verification. FOUND spot-check + NOT-FOUND
        spot-check both mandatory. Haiku RETURN format includes CONFIDENCE field. CONFIDENCE=LOW
        triggers mandatory NOT-FOUND check.
    audit_entry:
      validator: validate-communication-protocol.mjs
      cadence: per-session
      audit_runner_key: communication-protocol
