id: csps.data.satisfaction-point-registry
name: satisfaction-point-registry
description: >
  Registry of mechanical satisfaction points for governed things in CSPS. Kills D7 (action-bias): "content written" ≠
  done. "verify_mechanically command exits 0" = done. Every DONE claim for a registered thing requires its
  verify_mechanically command to pass. Source: PROTO-S074-HARDWIRE (OPUS-16) · HARDWIRE protocol · Governor S074
  emergency directive.
version: '1.0'
session: S074
authored_by: Sonnet S074
core_spine: GVRN
schema_anchor: vault_files
closure_owner: group:finky
closure_decision: Living registry — add entries when new permanent things are established
closure_by: ongoing
entries:
  - thing: council-file-written
    satisfaction_point: hook systemMessage visible in same turn's output; last-proto-relay.txt or last-sonnet-relay.txt updated this turn
    verify_mechanically: >-
      node -e "const fs=require('fs'); const f='.csps/last-proto-relay.txt'; const s=fs.statSync(f);
      if(Date.now()-s.mtimeMs>30000) process.exit(1);"
    channel: Write or Edit tool on tools/council/*.md — never Bash
    notes: 'HARDWIRE instance #1. Bash bypass = D4+D7 defaults. Fixed BATCH 3.'
    weekly_audit_skip: session-contextual — mtime checks only valid during active session
  - thing: t1-hook-active
    satisfaction_point: attempted violation exits non-zero from the hook (BLOCKED)
    verify_mechanically: node tools/tests/behavioral/ (run behavioral test for the hook; non-zero = not active)
    channel: pre-tool-use hook registered in settings.json with correct matcher
    notes: 'EXISTS≠ACTIVE: hook file present ≠ hook blocking. Test must exit non-zero on violation.'
    weekly_audit_skip: behavioral-test — requires specific test runner path
  - thing: bstar-contract-engraved
    satisfaction_point: '5/5 surfaces present: schema+validator+hook+memory+contract'
    verify_mechanically: node tools/validators/validate-bstar-trio-coverage-strict.mjs
    channel: engraving-discipline skill; 5 tool writes (one per surface)
    notes: P-META-007. validator exits 0 = no partial-engraved contracts found.
  - thing: proto-relayed
    satisfaction_point: post-tool-use-proto-inline.sh emitted systemMessage this turn AND .csps/last-proto-relay.txt updated within 30s
    verify_mechanically: >-
      node -e "const fs=require('fs'); const f='.csps/last-proto-relay.txt'; const s=fs.statSync(f);
      if(Date.now()-s.mtimeMs>30000) process.exit(1);"
    channel: Edit/Write tool on tools/council/opus-turn.md — never Bash
    notes: Core of FORMAL-PROTO-CHANNEL discipline. Broken on win32 via env var approach; fixed BATCH 3.
    weekly_audit_skip: session-contextual — mtime checks only valid during active session
  - thing: graphify-extracted-per-app
    satisfaction_point: apps/<slug>/graphify-out/graph.json exists for every app with graphify_required:true in app.config.yaml
    verify_mechanically: node tools/validators/validate-app-deploy-readiness.mjs | grep -q 'blocking=0'
    channel: tools/scripts/fork-app.mjs (structural, Step 6 of app-pipeline.md) via tools/scripts/graphify-wrapper.mjs — never bare graphify
    notes: 'HARDWIRE-010 (S089). Enforcement is structural (fork always extracts) + BLOCKING validator (regression/deletion), not a bolt-on gate against human discipline — safe to block at K=0 real apps built.'
  - thing: wiring-sweep-recorded-per-implementation
    satisfaction_point: every session with an implementation-shaped commit (tools/validators, tools/scripts, .claude/skills, tools/data/*-register.yaml, docs/plan/pillar-*/behavioral-contracts, docs/adr) has >=1 matching entry in tools/data/wiring-sweep-log.yaml
    verify_mechanically: node tools/validators/validate-wiring-sweep-coverage.mjs | grep -q 'blocking=0'
    channel: manual — AI/Governor writes the entry (angles_swept + elements_updated + elements_deferred); no script can judge sweep quality, only presence
    notes: 'HARDWIRE-011 (S089), B_IMPLEMENTATION_WIRING_CYCLE. Presence-of-attempt check only (same shape as challenge-on-merit/decision-ledger) — does not verify the sweep was thorough, only that one was recorded. PreCompact hook (T1) + session-open (T3) both surface the same check advisory-first; the BLOCKING gate is at commit time via pnpm verify.'
  - thing: propagation-verified-per-terminal-finding
    satisfaction_point: every gap-recurrence/improvement-register entry with propagation_required:true has propagation_verified:true before its status is terminal (resolved/closed/propagated/fix_committed/etc.)
    verify_mechanically: node tools/validators/validate-propagation-verified-gate.mjs | grep -q 'blocking=0'
    channel: manual — AI/human sets propagation_verified:true only after re-confirming the fix was actually applied everywhere relevant (re-run is proof, not memory)
    notes: 'HARDWIRE-012 (S089), Weekly Evolution Engine Layer 4 (GOVERNANCE-SELF-IMPROVEMENT-PLAYBOOK-from-CDS). Grandfathered: entries without propagation_required at all (the entire pre-existing 46-entry corpus) are exempt — new gate, never retroactive. Only entries that explicitly opt in are checked.'
  - thing: weekly-evolution-batch-selected
    satisfaction_point: tools/data/weekly-evolution-batch.yaml exists and its generated_session matches a real GitHub Actions run (not hand-run only)
    verify_mechanically: node tools/scripts/weekly-evolution-batch.mjs --batch-size 3 && test -f tools/data/weekly-evolution-batch.yaml
    channel: .github/workflows/session-progress.yml "Weekly Evolution Engine" step, permanent GitHub Actions cron (23 7 * * 1), independent of any Claude Code session
    notes: 'HARDWIRE-012 (S089). Rate-limited to 3 items/run — playbook Part 2 Layer 3 "done calmly." Activation PENDING: no gh CLI available to trigger/observe a live run this session; next real fire is the scheduled Monday cron or manual workflow_dispatch.'
  - thing: advisory-validator-not-theater
    satisfaction_point: validator has promotion_trigger OR death_date declared
    verify_mechanically: node tools/validators/validate-advisory-has-promotion-path.mjs | grep -q 'blocking=0'
    channel: validator source file frontmatter + audit-runner.md registration
    notes: 141 advisory validators without path = measuring theater. Fixed BATCH 5.
  - thing: principle-ratified
    satisfaction_point: principle appears in MCP list_principles output AND enforcer_layer field set
    verify_mechanically: >-
      node -e "const {execSync}=require('child_process'); execSync('node tools/scripts/list-principles.mjs --id
      P-XXX',{stdio:'pipe'});"
    channel: principles.yaml edit + pnpm principles:split
    notes: Replace XXX with actual ID. Generic template; instantiate per principle.
  - thing: hardwire-item-complete
    satisfaction_point: 7 surfaces all present + block_test_output recorded in hardwire-register.yaml
    verify_mechanically: node tools/validators/validate-hardwire-completeness.mjs | grep -q 'blocking=0'
    channel: hardwire-register.yaml row + 7-surface build
    notes: The meta-satisfaction-point. HARDWIRE-DONE claim without this = nominal.
  - thing: schema-field-closed-enum
    satisfaction_point: enum field registered in frontmatter-closed-enums.md AND validate-frontmatter exits 0
    verify_mechanically: node tools/validators/validate-frontmatter.mjs | grep -q 'errors=0'
    channel: frontmatter-closed-enums.md update + validate-frontmatter
    notes: S049 STATUS-CONSOLIDATION. Unregistered enum = invisible constraint.
  - thing: handoff-written
    satisfaction_point: 4 zones present + SONNET STARTUP BLOCK section + handoff validator exits 0
    verify_mechanically: node tools/validators/validate-handoff-completeness.mjs | grep -q 'blocking=0'
    channel: Write tool on HANDOFF-S*.md (triggers post-tool-use-handoff-relay-inline.sh)
    notes: B_INHERITANCE_POLICY. Missing SONNET STARTUP BLOCK = relay breaks.
  - thing: plan-step-done
    satisfaction_point: implied validators re-run THIS session + step-accept verdict ACCEPTED
    verify_mechanically: node tools/verify.mjs --skip-install > /dev/null && echo passed
    channel: node tools/verify.mjs --skip-install AND step-accept skill
    notes: Memory of earlier runs ≠ evidence. Re-run IS the proof. P-META-006 RZF.
    weekly_audit_skip: session-expensive — runs verify.mjs; check manually at session close
  - thing: permission-bypass-active
    satisfaction_point: validate-bypass-settings.mjs exits 0 — both settings files have correct bypass state
    verify_mechanically: node tools/validators/validate-bypass-settings.mjs | grep -q 'blocking=0'
    channel: session-open.sh writes correct state at every tab start. Never mid-session.
    notes: >-
      HARDWIRE-003. Root cause: settings.local.json with permissions object but no defaultMode → shadow. Fix in
      session-open.sh. Validator CRITICAL tier in verify.mjs.
  - thing: vercel-deployment-healthy
    satisfaction_point: vercel-health-check.mjs exits 0 — all CSPS projects in READY state, no orphaned projects
    verify_mechanically: node tools/scripts/vercel-health-check.mjs 2>/dev/null && echo passed
    channel: tools/scripts/vercel-health-check.mjs (REST API)
    notes: HARDWIRE-006. Run proactively instead of waiting for email. weekly_audit_skip=false (checks live Vercel API).
  - thing: sonnet-relay-presented
    satisfaction_point: >-
      post-tool-use-sonnet-relay-inline.sh fired (last-sonnet-relay.txt mtime < 60s) AND relay block presented inline in
      chat with fenced format
    verify_mechanically: >-
      node -e "const
      s=require("fs").statSync(".csps/last-sonnet-relay.txt");if(Date.now()-s.mtimeMs>60000)process.exit(1);"
    channel: Write or Edit tool on tools/council/sonnet-turn.md (not Bash)
    notes: >-
      HARDWIRE-009. governing_intent: Governor copies with one click. Fenced block + Paste-ready header = format.
      weekly_audit_skip=session-contextual
    weekly_audit_skip: session-contextual — mtime check only valid during active session
