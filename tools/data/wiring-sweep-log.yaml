id: csps.data.wiring-sweep-log
name: wiring-sweep-log
description: >
  Registry of post-implementation wiring-update sweeps. B_IMPLEMENTATION_WIRING_CYCLE (S089 CONSTITUTIONAL):
  "New implementation without a wiring-update cycle is a crippled one — wiring related elements is as
  essential as the implementation itself." Every substantive implementation records the angles swept,
  elements updated, and elements identified-but-deferred (with reasoning). "0 elements need updating" is
  valid only when the swept angles are named — an empty entry with no angles named is theater.
  validate-wiring-sweep-coverage.mjs checks presence (not quality) of an entry per session with
  implementation-shaped commits.
